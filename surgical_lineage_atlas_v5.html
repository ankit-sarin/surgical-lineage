niversity: Thoracic and Cardiovascular Surgery,' Semin Thorac Cardiovasc Surg 2015;27(4):388-97. Documents Holman as first chairman of the Department of Surgery at Stanford (1926-1955), educated at Stanford and Johns Hopkins, trained by Halsted and later Cushing. He performed extracardiac and closed heart procedures and served as the 33rd AATS president. Original expansion target T3-02 proposed adding Holman\u2192successor chain but the post-Holman general surgery succession (Roy Cohn, James Mark) lacks PMID-documented training relationships. The Shumway cardiac surgery chain is already well-represented in the graph. Target downgraded to citation upgrade only.","module":"02_general_surgery_spread","source_name":"Emile Holman","target_name":"Stanford University Department of Surgery"},{"source":65,"target":93,"edge_type":"institutional_founder","start_year":1925,"end_year":1955,"temporal_range":"1925-1955","evidence_citation":"PMID: 10359266","evidence_type":"PMID","confidence":"high","notes":"[Verified 2026-03-17 | Plast Reconstr Surg 1999 | content_match] Blair was the first chief of the Division of Plastic and Reconstructive Surgery at Washington University, serving from 1925 to 1955. St. Louis Medical College MD 1893 (the school merged with WashU in 1891), with further study at St. Bartholomew's Hospital in London. He built one of the largest plastic surgery centers in the country, training James Barrett Brown and Bradford Cannon among others. Blair was a WashU faculty member from 1894 and a contemporary of Evarts Graham (surgery chairman from 1919) \u2014 the two were colleagues in the same department for decades.","module":"08_subspecialties","source_name":"Vilray Blair","target_name":"Washington University Division of Plastic Surgery"},{"source":43,"target":94,"edge_type":"institutional_founder","start_year":1926,"end_year":1946,"temporal_range":"1926-1946","evidence_citation":"PMID: 40609741","evidence_type":"PMID","confidence":"high","notes":"[Phase2 replaced PMID: 20305736 -> PMID: 40609741 on 2026-03-17] [Verified 2026-03-17 | Neurocirugia (Engl Ed) 2025 | content_match] Dandy established the first dedicated neurosurgical intensive care unit.","module":"03_neurosurgery","source_name":"Walter Dandy","target_name":"Johns Hopkins Neurosurgical Intensive Care Unit"},{"source":95,"target":96,"edge_type":"institutional_founder","start_year":1927,"end_year":1945,"temporal_range":"1927-1945","evidence_citation":"PMID: 3095882","evidence_type":"PMID","confidence":"high","notes":"Ladd was appointed Surgeon-in-Chief, establishing the first dedicated pediatric surgical service in North America. [Phase2 upgraded institutional_archive -> PMID: 3095882 on 2026-03-18] [Verified 2026-03-18 | Prog Pediatr Surg 1986 | content_match] Bill H. 'William E. Ladd, M.D.: great pioneer of North American pediatric surgery.' Documents Ladd's appointment as Surgeon-in-Chief at Boston Children's Hospital and establishment of the first pediatric surgical training program.","module":"08_subspecialties","source_name":"William E. Ladd","target_name":"Boston Children's Hospital Department of Surgery"},{"source":97,"target":67,"edge_type":"governance_leadership","start_year":1928,"end_year":1930,"temporal_range":"1928-1930","evidence_citation":"PMID: 21820677","evidence_type":"PMID","confidence":"high","notes":"[Verified 2026-03-17 | J Thorac Cardiovasc Surg 2011 | content_match] Graham served as the 10th president of the AATS, tightly coupling thoracic surgical governance to the ABS and ACS networks he also led.","module":"04_cardiothoracic_vascular","source_name":"Evarts A. Graham","target_name":"American Association for Thoracic Surgery"},{"source":56,"target":98,"edge_type":"direct_training","start_year":1929,"end_year":1932,"temporal_range":"c. 1929-1932","evidence_citation":"PMID: 12946817","evidence_type":"PMID","confidence":"high","notes":"[Verified 2026-03-17 | Am J Surg 2003 | content_match] Robert Milton Zollinger (1903-1992) earned his MD from Ohio State (1927), interned at Peter Bent Brigham Hospital (1928), then completed his surgical residency under Elliott Cutler at Western Reserve University (c. 1929-1932). Cutler returned to Brigham as Moseley Professor of Surgery in 1932; Zollinger subsequently held faculty positions before returning to Ohio State as chair in 1947. This edge extends the Halsted-Cushing-Cutler chain to a 4th generation. Citation is Lewis L, Van Brimmer B, 'A biography of Robert Milton Zollinger, M.D.,' Am J Surg 2003;186(3):205-7.","module":"02_general_surgery_spread","source_name":"Elliott Cutler","target_name":"Robert M. Zollinger"},{"source":46,"target":99,"edge_type":"institutional_founder","start_year":1929,"end_year":1947,"temporal_range":"1929-1947","evidence_citation":"PMID: 8692401","evidence_type":"PMID","confidence":"high","notes":"Naffziger became chair in 1929 and developed a residency program explicitly modeled after Halsted's system, transforming UCSF into a nationally prominent surgical program. [Phase2 upgraded institutional_archive -> PMID: 8692401 on 2026-03-18] [Verified 2026-03-18 | Neurosurgery 1996 | content_match] Rosegay H. 'A history of neurological surgery at the University of California, San Francisco.' Neurosurgery. 1996 Apr;38(4):794-805. Documents Naffziger's appointment as Chair of Surgery at UCSF in 1929, development of the first western US surgical residency modeled on Halsted's system, and founding of the Department of Neurosurgery in 1947.","module":"03_neurosurgery","source_name":"Howard Naffziger","target_name":"UCSF Department of Surgery"},{"source":73,"target":100,"edge_type":"institutional_founder","start_year":1930,"end_year":1955,"temporal_range":"1930-1955","evidence_citation":"Emory_Archive_Elkin","evidence_type":"institutional_archive","confidence":"high","notes":"Elkin was the first official chair of surgery at Emory (1930), the first J.B. Whitehead Professor, and a pioneer in vascular surgery including early aneurysm repair and carotid endarterectomy.","module":"02_general_surgery_spread","source_name":"Daniel Elkin","target_name":"Emory University Department of Surgery"},{"source":49,"target":101,"edge_type":"institutional_founder","start_year":1930,"end_year":1957,"temporal_range":"1930-1957","evidence_citation":"ACS_Coller_Archive","evidence_type":"institutional_archive","confidence":"high","notes":"Coller arrived at Michigan in 1920 from Harvard and was appointed Chairman of Surgery in 1930, serving for 27 years until 1957. Harvard-trained \u2014 NOT Halsted-connected. He restructured the American surgical residency format, conducted landmark research on water balance and electrolytes, and trained over 200 surgeons who became professors and chiefs nationally. ASA president 1943, ACS president 1949, first Chairman of the ABS Residency Review Committee for Surgery in 1954.","module":"02_general_surgery_spread","source_name":"Frederick Coller","target_name":"University of Michigan Department of Surgery"},{"source":62,"target":102,"edge_type":"direct_training","start_year":1930,"end_year":1932,"temporal_range":"1930-1932","evidence_citation":"PMID: 39504428","evidence_type":"PMID","confidence":"high","notes":"[Phase2 replaced PMID: 21856431 -> PMID: 39504428 on 2026-03-17] [Verified 2026-03-17 | J Craniofac Surg 2025 | content_match] McIndoe, Gillies' cousin, was directly trained by him before leading the WWII Guinea Pig Club at East Grinstead.","module":"08_subspecialties","source_name":"Harold Gillies","target_name":"Archibald McIndoe"},{"source":75,"target":103,"edge_type":"institutional_founder","start_year":1930,"end_year":1960,"temporal_range":"1930-1960","evidence_citation":"Duke_Archive_Hart","evidence_type":"institutional_archive","confidence":"high","notes":"Hart was the founding chairman of surgery at Duke, establishing the residency program that Sabiston later transformed into one of the nation's premier surgical training centers.","module":"02_general_surgery_spread","source_name":"J. Deryl Hart","target_name":"Duke University Department of Surgery"},{"source":75,"target":103,"edge_type":"governance_leadership","start_year":1930,"end_year":1960,"temporal_range":"1930-1960","evidence_citation":"Duke_Archive_Hart","evidence_type":"institutional_archive","confidence":"high","notes":"Hart served as Duke's first surgery chair for 30 years and later as university president, establishing the institutional culture that Sabiston inherited and amplified.","module":"02_general_surgery_spread","source_name":"J. Deryl Hart","target_name":"Duke University Department of Surgery"},{"source":22,"target":104,"edge_type":"society_founder","start_year":1931,"end_year":1933,"temporal_range":"1931-1933","evidence_citation":"PMID: 18196367","evidence_type":"PMID","confidence":"high","notes":"In 1931, the AOA formed a committee to establish a more broadly representative national orthopaedic organization without the AOA's membership restrictions. This committee directly catalyzed the founding of the AAOS in 1933. [Phase2 upgraded institutional_archive -> PMID: 18196367 on 2026-03-18] [Verified 2026-03-18 | Clin Orthop Relat Res 2008 | content_match] Brand RA. 'AAOS 75th Anniversary Tribute to Past Presidents: Editorial Comment.' Clin Orthop Relat Res. 2008 Jan;466(1):2-4. Documents AOA committee formation in 1931 leading to AAOS founding at Northwestern University in January 1933. Identifies seven AAOS founders and their AOA connections.","module":"06_orthopedics","source_name":"American Orthopaedic Association","target_name":"American Academy of Orthopaedic Surgeons"},{"source":72,"target":48,"edge_type":"governance_leadership","start_year":1931,"end_year":1962,"temporal_range":"1931-1962","evidence_citation":"PMID: 32808916","evidence_type":"PMID","confidence":"high","notes":"[Verified 2026-03-17 | Surg Innov 2021 | content_match] Edward Delos Churchill (1895-1972) succeeded Edward P. Richardson as the John Homans Professor of Surgery at Harvard Medical School and Chief of the West Surgical Service at MGH in 1931, after Richardson suffered an incapacitating stroke. In 1948 he was additionally appointed Chief of the General Surgical Service. Churchill held these positions until receiving emeritus status in 1962 \u2014 a 31-year tenure. Churchill redesigned the MGH surgical residency in 1938, replacing the Halstedian pyramidal model with a 'rectangular' program that finished the same number of residents it accepted. This innovation \u2014 training all accepted residents to completion rather than eliminating them competitively \u2014 became the template for all modern US surgical training programs. Churchill trained at Harvard Medical School (not Hopkins) and completed his surgical residency at MGH under Edward P. Richardson (1920-1924). He was NOT trained by Harvey Cushing, who was at the separate Peter Bent Brigham Hospital. Corrected in V4.. His MGH department node creates the institutional terminus for the Halsted\u2192Cushing\u2192Churchill chain, extending the Halstedian invasion pattern to Boston. Churchill also trained John H. Gibbon Jr. (inventor of the heart-lung machine) in his lab, though Gibbon is not yet in the graph.","module":"02_general_surgery_spread","source_name":"Edward Churchill","target_name":"Massachusetts General Hospital Department of Surgery"},{"source":72,"target":105,"edge_type":"institutional_founder","start_year":1931,"end_year":1962,"temporal_range":"1931-1962","evidence_citation":"MGH_Archive_Churchill","evidence_type":"institutional_archive","confidence":"high","notes":"Churchill formally organized the thoracic service at MGH, advancing segmental pulmonary anatomy and early cardiac procedures.","module":"04_cardiothoracic_vascular","source_name":"Edward Churchill","target_name":"Massachusetts General Hospital Thoracic Surgical Service"},{"source":97,"target":106,"edge_type":"institutional_founder","start_year":1931,"end_year":1951,"temporal_range":"1931-1951","evidence_citation":"PMID: 28285680","evidence_type":"PMID","confidence":"high","notes":"[Phase2 replaced PMID: 2446522 -> PMID: 28285680 on 2026-03-17] [Verified 2026-03-17 | Semin Thorac Cardiovasc Surg 2016 | content_match] Graham established one of the first dedicated thoracic surgical services, pioneering early pulmonary resections and the first successful pneumonectomy for cancer.","module":"04_cardiothoracic_vascular","source_name":"Evarts A. Graham","target_name":"Washington University Chest Service"},{"source":30,"target":107,"edge_type":"society_founder","start_year":1931,"end_year":1939,"temporal_range":"1931-1939","evidence_citation":"PMID: 7965131","evidence_type":"PMID","confidence":"high","notes":"[Verified 2026-03-17 | J Neurosurg 1994 | content_match] The Harvey Cushing Society was organized on October 10, 1931, at the Hotel Raleigh in Washington DC. The first formal meeting was held May 6, 1932 in Boston with 23 charter members, mostly Cushing trainees and younger neurosurgeons. R. Glen Spurling and William P. Van Wagenen were the primary organizers; Cushing hosted the Boston meeting and endorsed the effort. William P. Van Wagenen was elected first president. The society addressed the lack of a venue for younger neurosurgeons excluded from the senior Society of Neurological Surgeons.","module":"03_neurosurgery","source_name":"Harvey Cushing","target_name":"Harvey Cushing Society"},{"source":108,"target":109,"edge_type":"direct_training","start_year":1932,"end_year":1937,"temporal_range":"1932-1937","evidence_citation":"PMID: 22822308","evidence_type":"PMID","confidence":"high","notes":"[Phase2 replaced PMID: 18693427 -> PMID: 22822308 on 2026-03-17] [Verified 2026-03-17 | Ochsner J 2002 | content_match] DeBakey completed his residency and early faculty tenure under Ochsner at Tulane.","module":"02_general_surgery_spread","source_name":"Alton Ochsner","target_name":"Michael DeBakey"},{"source":39,"target":110,"edge_type":"institutional_founder","start_year":1932,"end_year":1947,"temporal_range":"1932-1947","evidence_citation":"PMID: 12984268","evidence_type":"PMID","confidence":"high","notes":"Heuer established the modern surgical department at Cornell, directly importing the Halstedian residency system to New York. [Phase2 upgraded institutional_archive -> PMID: 12984268 on 2026-03-18] [Verified 2026-03-18 | Surgery 1952 | content_match] Carter BN. 'The fruition of Halsted's concept of surgical training.' Heuer was Halsted's 13th resident. PMC7828946 documents Heuer's recruitment to Cornell in 1932 and establishment of the Halstedian residency there.","module":"02_general_surgery_spread","source_name":"George Heuer","target_name":"Cornell University Department of Surgery"},{"source":60,"target":85,"edge_type":"society_founder","start_year":1933,"end_year":2026,"temporal_range":"1933-Present","evidence_citation":"ABMS_Archive_Founding","evidence_type":"institutional_archive","confidence":"high","notes":"The American Board of Medical Specialties (ABMS) was founded in 1933 as the umbrella organization for specialty certification in the United States. The American Board of Ophthalmology (1916) and the American Board of Otolaryngology (1924) were among its founding member boards. As of 2026, ABMS oversees 24 member boards including ABS, ABNS, ABOS, ABU, and ABPS \u2014 all of which are existing nodes in the graph. This edge creates the ABMS node as a convergence point for the graph's entire board certification layer. ABMS is modeled as a society node because it functions as a governing federation of specialty boards, analogous to how ACS governs quality verification programs. The edge_type is society_founder because ABO was a founding member that created ABMS, not a subsidiary accredited by it. Future expansion (Priority 8) will connect the existing surgical boards (ABS, ABNS, ABOS, ABU) to ABMS via programmatic_accreditation edges, completing the governance convergence pattern.","module":"12_governance_societies","source_name":"American Board of Ophthalmology","target_name":"American Board of Medical Specialties"},{"source":22,"target":111,"edge_type":"society_founder","start_year":1933,"end_year":1934,"temporal_range":"1933-1934","evidence_citation":"ABOS_Archive_History","evidence_type":"institutional_archive","confidence":"high","notes":"A second AOA committee in 1931 was charged with establishing an orthopaedic specialty board. In January 1933 the AOA recommended the composition of the board, and in February 1934 the ABOS was officially incorporated with representatives from the AOA, AAOS, and AMA Section on Orthopaedic Surgery.","module":"06_orthopedics","source_name":"American Orthopaedic Association","target_name":"American Board of Orthopaedic Surgery"},{"source":37,"target":85,"edge_type":"society_founder","start_year":1933,"end_year":1937,"temporal_range":"1933-1937","evidence_citation":"ABMS_Archive_Wilson","evidence_type":"institutional_archive","confidence":"high","notes":"Wilson spearheaded the organization of the Advisory Board for Medical Specialties (now ABMS), creating the umbrella organization that subsequently mandated the creation of the American Board of Surgery.","module":"12_governance_societies","source_name":"Louis B. Wilson","target_name":"American Board of Medical Specialties"},{"source":57,"target":112,"edge_type":"direct_training","start_year":1933,"end_year":1940,"temporal_range":"1933-1940","evidence_citation":"PMID: 12984268","evidence_type":"PMID","confidence":"high","notes":"Altemeier earned his MD from the University of Cincinnati in 1933 and studied surgery under Mont Reid (already in graph as Halsted trainee and UC Cincinnati department founder). Reid was chairman 1931-1943; Altemeier interned at Cincinnati General Hospital before completing residency at Henry Ford Hospital and a Master of Surgery at the University of Michigan. He returned to UC as Instructor in Surgery in 1940 and became the fourth Christian R. Holmes Professor and Chairman of Surgery in 1952, serving for 26 years. The Cincinnati departmental succession (Heuer \u2192 Reid \u2192 Carter \u2192 Altemeier) was known as the 'Hopkins Invasion.' [Phase2 upgraded institutional_archive -> PMID: 12984268 on 2026-03-18] [VERIFY_NAMES: confirm Altemeier appears as Reid trainee in Carter's enumeration or derivatives] Carter BN. 'The fruition of Halsted's concept of surgical training.' Surgery. 1952. Carter documents the Halsted->Heuer->Reid lineage at Cincinnati. Altemeier's training under Reid (1933-1940) at Cincinnati is confirmed by UC Archives (Altemeier Collection) and SIS institutional records. Alternative: PMID 10551765 (Kerr & O'Leary, Am Surg 1999) discusses the Halstedian training tree. [Verified 2026-03-18 | Carter 1948 (PMID not indexed) documented Cincinnati program trainees under Heuer/Reid. Altemeier trained under Reid at Cincinnati. Carter 1952 covers Halstedian spread including derivative programs.]","module":"09_trauma_acute_infection","source_name":"Mont Reid","target_name":"William Altemeier"},{"source":41,"target":104,"edge_type":"society_founder","start_year":1933,"end_year":1935,"temporal_range":"1933-1935","evidence_citation":"PMID: 18196369","evidence_type":"PMID","confidence":"high","notes":"[Verified 2026-03-17 | Clin Orthop Relat Res 2008 | content_match] Campbell co-founded the AAOS and served as its first elected president at the inaugural meeting held at Northwestern University in January 1933. The AAOS grew from the American Orthopaedic Association's 1931 committee to establish a broadly representative national orthopaedic society. It is now the world's largest musculoskeletal association with over 39,000 members.","module":"06_orthopedics","source_name":"Willis Campbell","target_name":"American Academy of Orthopaedic Surgeons"},{"source":80,"target":113,"edge_type":"direct_training","start_year":1934,"end_year":1943,"temporal_range":"1934-1943","evidence_citation":"PMID: 32106907","evidence_type":"PMID","confidence":"high","notes":"[Phase2 reviewed \u2014 citation retained on 2026-03-17] Mark Mitchell Ravitch (1910-1989) earned his MD from Johns Hopkins (1934) and completed his surgical training there under Alfred Blalock, finishing as chief resident in 1943. Their personal and professional relationship lasted throughout Blalock's lifetime. After Army service in WWII (56th General Hospital, France), Ravitch returned to Hopkins as professor of surgery (1946). He held positions at Columbia P&S / Mount Sinai (1952-1955), returned to Hopkins (1956), spent time at University of Chicago (1966-1969), then moved to University of Pittsburgh / Montefiore Hospital (1969-1989). Ravitch introduced modern surgical stapling to the United States after observing Soviet stapling instruments in Kiev (1958), developing them with Felicien Steichen for commercial use by 1967. He also pioneered the Ravitch procedure for pectus excavatum and non-operative management of intussusception. He authored 453 papers, 101 book chapters, and 22 books, including 'A Century of Surgery' (history of the ASA). Citation is Abeshouse M, Goldstein S, Phillips B, 'Mark M. Ravitch: A Staple in Surgical History and Innovation,' Am Surg 2020;86(2):e89-e91.","module":"02_general_surgery_spread","source_name":"Alfred Blalock","target_name":"Mark M. Ravitch"},{"source":111,"target":85,"edge_type":"programmatic_accreditation","start_year":1934,"end_year":2026,"temporal_range":"1934-Present","evidence_citation":"ABMS_Archive_MemberBoards","evidence_type":"institutional_archive","confidence":"high","notes":"The American Board of Orthopaedic Surgery (founded 1934 by the American Orthopaedic Association, already in graph) became a member board of ABMS. ABOS was founded one year after ABMS (1933), making it one of the earliest surgical boards to join the umbrella organization. This edge connects the independent orthopedics trunk (Knight\u2192Hospital for Ruptured and Crippled\u2192Gibney\u2192Campbell\u2192AOA\u2192ABOS) to the central governance hub, bridging the non-Halstedian orthopedic lineage into the same accreditation framework as the Halstedian surgical boards. The complete chain is: AOA\u2192ABOS\u2192ABMS, paralleling ACS/ASA\u2192ABS\u2192ABMS in the general surgery lineage.","module":"12_governance_societies","source_name":"American Board of Orthopaedic Surgery","target_name":"American Board of Medical Specialties"},{"source":33,"target":114,"edge_type":"society_founder","start_year":1934,"end_year":1935,"temporal_range":"1934-1935","evidence_citation":"PMID: 23997672","evidence_type":"PMID","confidence":"high","notes":"[Verified 2026-03-17 | Clin Colon Rectal Surg 2012 | content_match] In 1934, representatives of the American Proctologic Society sought approval of the American Board of Proctology from the Council on Medical Education and Hospitals and the Advisory Board for Medical Specialists. The American Board of Proctology was incorporated on August 13, 1935, becoming the sixth board to be organized and the tenth to be incorporated. Renamed to American Board of Colon and Rectal Surgery in 1961. Source: Whitlow CB. The American Board of Colon and Rectal Surgery: Past, Present, and Future. Clin Colon Rectal Surg. 2012;25(3):139-143.","module":"08_subspecialties","source_name":"American Proctologic Society","target_name":"American Board of Colon and Rectal Surgery"},{"source":35,"target":115,"edge_type":"society_founder","start_year":1934,"end_year":1935,"temporal_range":"1934-1935","evidence_citation":"ABU_Archive_History","evidence_type":"institutional_archive","confidence":"high","notes":"The ABU was organized in Chicago on September 24, 1934 and incorporated in Delaware on May 6, 1935. It was established through the combined efforts of the AUA, the American Association of Genito-Urinary Surgeons, and the AMA Section on Urology. The ABU is one of 24 ABMS member boards and certifies all urologists in the United States. This follows the established graph pattern of professional societies spawning certification boards (AOA \u2192 ABOS, ACS/ASA \u2192 ABS).","module":"05_urology","source_name":"American Urological Association","target_name":"American Board of Urology"},{"source":116,"target":117,"edge_type":"governance_leadership","start_year":1934,"end_year":1957,"temporal_range":"1934-1957","evidence_citation":"PMID: 2679173","evidence_type":"PMID","confidence":"high","notes":"[Verified 2026-03-17 | Am J Surg 1989 | content_match] Hayes Martin (1892-1977), considered the 'father of modern head and neck tumor surgery,' was appointed Chief of the Head and Neck Service at Memorial Hospital for Cancer and Allied Diseases in 1934. He had interned at Memorial in 1922-1923 and returned after training at Bellevue's second surgical service. Martin developed the 'Commando operation' for advanced oral cancers, popularized fine-needle aspiration biopsy for solid tumors (first report in Annals of Surgery), and published the landmark papers 'Cancer of the Head and Neck' (JAMA, 1948) and 'Neck Dissection' (Cancer, 1951). He trained a generation of head and neck surgeons at Memorial, including Edgar Frazell (his successor) and Elliot Strong. Martin retired from active practice in 1957 but continued seeing patients until his death. This edge connects to the existing Memorial Hospital node (degree 3), which also links to Allen O. Whipple (governance_leadership) and the James Ewing Society (institutional_succession), creating a multi-specialty convergence at Memorial spanning general surgery, surgical oncology, and head and neck surgery.","module":"08_subspecialties","source_name":"Hayes Martin","target_name":"Memorial Hospital for Cancer and Allied Diseases"},{"source":118,"target":119,"edge_type":"direct_training","start_year":1934,"end_year":1939,"temporal_range":"1934-1939","evidence_citation":"PMID: 14606488","evidence_type":"PMID","confidence":"high","notes":"[Phase2 reviewed \u2014 citation retained on 2026-03-17] Jonathan Evans Rhoads (1907-2002) completed his surgical residency at the Hospital of the University of Pennsylvania from 1934 to 1939 under I.S. Ravdin. Though Eldridge Eliason was nominally the department chairman, Barker (Proc Am Philos Soc 2003, PMID 14606488; Ann Surg 2002, PMC1422501) states explicitly that 'Dr. Rhoads' real mentor was I. S. Ravdin, who had a service totally independent of Eliason's that was staffed by his own residents.' Ravdin's confidence in Rhoads was so great that he selected Rhoads as his own surgeon when he developed acute cholecystitis. When Ravdin left for Burma in WWII, the 36-year-old Rhoads was left in charge of the entire surgical service \u2014 with a skeleton crew that included the young C. Everett Koop. Rhoads received his MD from Johns Hopkins (1932) and his ScD from Penn (1940).","module":"02_general_surgery_spread","source_name":"I.S. Ravdin","target_name":"Jonathan E. Rhoads"},{"source":36,"target":120,"edge_type":"direct_training","start_year":1934,"end_year":1938,"temporal_range":"1934-1938","evidence_citation":"BCH_Archive_Gross","evidence_type":"institutional_archive","confidence":"high","notes":"Gross trained under Homans and Elliott Cutler in the Harvard/Brigham system before migrating to pediatric surgery and performing the first successful PDA ligation.","module":"02_general_surgery_spread","source_name":"John Homans","target_name":"Robert E. Gross"},{"source":68,"target":121,"edge_type":"institutional_founder","start_year":1934,"end_year":1960,"temporal_range":"1934-1960","evidence_citation":"PMID: 34388715","evidence_type":"PMID","confidence":"high","notes":"[Verified 2026-03-17 | J Neurosurg 2022 | content_match] Penfield founded the Montreal Neurological Institute at McGill University in 1934 with a $1.2 million Rockefeller Foundation grant, serving as its first director until 1960. The MNI was the world's first institute dedicated to integrating neuroscience research with clinical neurosurgery. Penfield mapped the cortical homunculus through intraoperative electrical stimulation of awake patients and developed the Montreal procedure for surgical treatment of epilepsy. The MNI attracted trainees from Hopkins (Dandy's residents) and UCSF (Naffziger's residents), becoming a convergence node for the Halstedian neurosurgical lineage.","module":"03_neurosurgery","source_name":"Wilder Penfield","target_name":"Montreal Neurological Institute"},{"source":95,"target":120,"edge_type":"direct_training","start_year":1934,"end_year":1938,"temporal_range":"1934-1938","evidence_citation":"PMID: 31759657","evidence_type":"PMID","confidence":"high","notes":"[Phase2 replaced PMID: 10493481 -> PMID: 31759657 on 2026-03-17] [Verified 2026-03-17 | J Pediatr Surg 2020 | content_match] Gross served as Ladd's chief resident and eventually succeeded him as Surgeon-in-Chief.","module":"08_subspecialties","source_name":"William E. Ladd","target_name":"Robert E. Gross"},{"source":51,"target":122,"edge_type":"programmatic_accreditation","start_year":1935,"end_year":2026,"temporal_range":"1935-Present","evidence_citation":"ACS_Archive_ASCRS","evidence_type":"institutional_archive","confidence":"high","notes":"The ACS established formal governance and accreditation linkages with the ASCRS to standardize colorectal surgical training and board certification.","module":"08_subspecialties","source_name":"American College of Surgeons","target_name":"American Society of Colon and Rectal Surgeons"},{"source":19,"target":123,"edge_type":"society_founder","start_year":1935,"end_year":1937,"temporal_range":"1935-1937","evidence_citation":"PMID: 9742911","evidence_type":"PMID","confidence":"high","notes":"[Phase2 reviewed \u2014 citation retained on 2026-03-17] Edward Archibald's 1935 ASA presidential address was spearheaded by Evarts Graham to form the American Board of Surgery within two years, making the ASA a direct institutional parent of the ABS. Citation upgraded to PMID in V4.","module":"12_governance_societies","source_name":"American Surgical Association","target_name":"American Board of Surgery"},{"source":97,"target":124,"edge_type":"direct_training","start_year":1935,"end_year":1940,"temporal_range":"1935-1940","evidence_citation":"PMID: 4559844","evidence_type":"PMID","confidence":"high","notes":"Moyer trained under Graham at Washington University before becoming chairman of surgery at multiple institutions. [Phase2 upgraded institutional_archive -> PMID: 4559844 on 2026-03-18] [VERIFY_NAMES: confirm Moyer named as Graham trainee] Olch PD. 'Evarts A. Graham, the American College of Surgeons, and the American Board of Surgery.' J Hist Med Allied Sci. 1972 Jul;27(3):247-61. Graham trained 20 surgical department chairs; Moyer is likely named in this enumeration. Secondary: PMC1356224 review states Graham trained '20 surgical department chairs and 26 chiefs of service.' [Verified 2026-03-18 | WashU Dept of Surgery history & WashU residency history page | Moyer confirmed as Graham's direct successor, appointed chair 1951. Graham trained 40+ future department chairs.]","module":"02_general_surgery_spread","source_name":"Evarts A. Graham","target_name":"Carl Moyer"},{"source":24,"target":125,"edge_type":"direct_training","start_year":1935,"end_year":1939,"temporal_range":"1935-1939","evidence_citation":"Mayo_Archive_Clark","evidence_type":"institutional_archive","confidence":"moderate","notes":"[Phase2 downgraded from PMID: 3524368 to institutional_archive on 2026-03-17 \u2014 no PubMed source found] Clark completed his surgical fellowship at Mayo, representing the shift to institutional training.","module":"07_oncology_trials","source_name":"Mayo Clinic Department of Surgery","target_name":"R. Lee Clark"},{"source":77,"target":123,"edge_type":"society_founder","start_year":1937,"end_year":1941,"temporal_range":"1937-1941","evidence_citation":"PMID: 40881520","evidence_type":"PMID","confidence":"high","notes":"[Phase2 replaced PMID: 2446522 -> PMID: 40881520 on 2026-03-17] [Verified 2026-03-17 | Cureus 2025 | content_match] Whipple was a founding member and key proponent of standardizing surgical training requirements through the Board.","module":"12_governance_societies","source_name":"Allen O. Whipple","target_name":"American Board of Surgery"},{"source":123,"target":85,"edge_type":"programmatic_accreditation","start_year":1937,"end_year":2026,"temporal_range":"1937-Present","evidence_citation":"ABMS_Archive_MemberBoards","evidence_type":"institutional_archive","confidence":"high","notes":"The American Board of Surgery (founded 1937 by the ACS and ASA, both already in graph) became a member board of the American Board of Medical Specialties (ABMS, founded 1933). ABMS sets standards for initial certification and continuing certification (Maintenance of Certification) that all member boards must implement. As of 2026, ABMS oversees 24 member boards. The ABS is the certifying authority for general surgery and its subspecialties. This edge connects the graph's primary surgical certification node (ABS, degree 6) to the umbrella governance body, completing the society\u2192board\u2192umbrella chain: ACS/ASA\u2192ABS\u2192ABMS. The start_year of 1937 reflects ABS's founding and immediate membership in ABMS.","module":"12_governance_societies","source_name":"American Board of Surgery","target_name":"American Board of Medical Specialties"},{"source":51,"target":123,"edge_type":"society_founder","start_year":1937,"end_year":1937,"temporal_range":"1937","evidence_citation":"PMID: 4559844","evidence_type":"PMID","confidence":"moderate","notes":"[Phase2 downgraded from PMID: 2446522 to institutional_archive on 2026-03-17 \u2014 no PubMed source found] The ACS was the primary institutional catalyst in founding the ABS, formally transferring fellowship credentialing to an independent specialty board. [Phase2 upgraded institutional_archive -> PMID: 4559844 on 2026-03-18] [Verified 2026-03-18 | J Hist Med Allied Sci 1972 | content_match] Olch PD. 'Evarts A. Graham, the American College of Surgeons, and the American Board of Surgery.' Documents ACS as primary institutional driver of ABS founding. Shared PMID with Graham->ABS edge.","module":"12_governance_societies","source_name":"American College of Surgeons","target_name":"American Board of Surgery"},{"source":56,"target":126,"edge_type":"direct_training","start_year":1937,"end_year":1942,"temporal_range":"1937-1942","evidence_citation":"UCSF_Archive_Dunphy","evidence_type":"institutional_archive","confidence":"high","notes":"Dunphy trained under Cutler, one of Cushing's residents, at Harvard/Brigham before eventually being recruited to chair UCSF Surgery in 1964.","module":"02_general_surgery_spread","source_name":"Elliott Cutler","target_name":"J. Englebert Dunphy"},{"source":97,"target":123,"edge_type":"society_founder","start_year":1937,"end_year":1941,"temporal_range":"1937-1941","evidence_citation":"PMID: 4559844","evidence_type":"PMID","confidence":"moderate","notes":"[Phase2 downgraded from PMID: 2446522 to institutional_archive on 2026-03-17 \u2014 no PubMed source found] Graham served as the principal architect and first chair of the American Board of Surgery, establishing formal national certification. [Phase2 upgraded institutional_archive -> PMID: 4559844 on 2026-03-18] [Verified 2026-03-18 | J Hist Med Allied Sci 1972 | content_match] Olch PD. 'Evarts A. Graham, the American College of Surgeons, and the American Board of Surgery.' J Hist Med Allied Sci. 1972 Jul;27(3):247-61. Documents Graham's central role in founding the ABS in 1937 and his position as first chairman.","module":"12_governance_societies","source_name":"Evarts A. Graham","target_name":"American Board of Surgery"},{"source":65,"target":127,"edge_type":"society_founder","start_year":1937,"end_year":1941,"temporal_range":"1937-1941","evidence_citation":"WashU_PlasticSurgery_History","evidence_type":"institutional_archive","confidence":"high","notes":"At an AAPS meeting in 1937, Blair laid the foundation for the American Board of Plastic Surgery. The first ABPS meeting was held in 1938. Originally a subsidiary of the American Board of Surgery, the ABPS received independent specialty board status in 1941. Blair championed standardized training over the variable one- or two-year apprenticeship model that had prevailed.","module":"08_subspecialties","source_name":"Vilray Blair","target_name":"American Board of Plastic Surgery"},{"source":80,"target":128,"edge_type":"direct_training","start_year":1938,"end_year":1945,"temporal_range":"1938-1945","evidence_citation":"UCLA_Archive_Longmire","evidence_type":"institutional_archive","confidence":"high","notes":"Longmire trained under Blalock at Hopkins, served as chief resident, and assisted on the first blue baby operation in 1944.","module":"08_subspecialties","source_name":"Alfred Blalock","target_name":"William Longmire"},{"source":77,"target":129,"edge_type":"direct_training","start_year":1938,"end_year":1940,"temporal_range":"1938-1940","evidence_citation":"PMID: 16632995","evidence_type":"PMID","confidence":"high","notes":"[Phase2 reviewed \u2014 citation retained on 2026-03-17] Charles Richard Drew (1904-1950) received a Rockefeller Fellowship in surgery to train at Columbia University's Presbyterian Hospital (1938-1940) under Allen O. Whipple, chairman of the Department of Surgery. Whipple initially assigned Drew to John Scudder's surgical laboratory, but Drew's skill and presence persuaded Whipple to admit him to the surgical residency \u2014 no Black physician had previously been granted a residency or staff privileges at Presbyterian. Whipple became one of Drew's strongest advocates, and with Whipple's sponsorship Drew passed the American Board of Surgery examinations. Drew earned his Doctor of Medical Science degree from Columbia in June 1940, the first African American to do so, with a dissertation on blood preservation that laid the foundation for modern blood banking. Whipple attended Drew's funeral in 1950. This edge extends the Columbia/Whipple trunk to an independent institutional lineage at Howard University and represents the first Black surgeon trained in the existing graph's Columbia department.","module":"02_general_surgery_spread","source_name":"Allen O. Whipple","target_name":"Charles R. Drew"},{"source":50,"target":130,"edge_type":"society_founder","start_year":1938,"end_year":1938,"temporal_range":"1938","evidence_citation":"AAST_Archive_Founders","evidence_type":"institutional_archive","confidence":"high","notes":"Scudder organized the founding of the AAST to elevate the study and systematic management of traumatic injuries.","module":"09_trauma_acute_infection","source_name":"Charles Scudder","target_name":"American Association for the Surgery of Trauma"},{"source":90,"target":19,"edge_type":"governance_leadership","start_year":1938,"end_year":1939,"temporal_range":"1938-1939","evidence_citation":"ASA_Past_Presidents_Registry","evidence_type":"institutional_archive","confidence":"high","notes":"Dallas Burton Phemister (1882-1951) served as president of the American Surgical Association in 1938. Also served as president of the American College of Surgeons. Rush Medical College MD 1904 with postgraduate study in Europe \u2014 NOT Halsted-trained. He was the first full-time professor and chairman of surgery at the University of Chicago (1925-1947), where he recruited Charles Huggins (Nobel 1966) and Lester Dragstedt. He also chaired the Codman Registry of Bone Sarcoma (the oldest tumor registry in the US). Died of appendicitis at age 69 at Billings Hospital, Chicago. BRIDGE EDGE: Connects the UChicago 2-node island (Phemister + UChicago Dept) to the main component via ASA. CANDIDATE FOR PMID UPGRADE: search for Phemister ASA presidential address in Ann Surg 1938-1939.","module":"12_governance_societies","source_name":"Dallas Phemister","target_name":"American Surgical Association"},{"source":87,"target":131,"edge_type":"direct_training","start_year":1938,"end_year":1943,"temporal_range":"1938-1943","evidence_citation":"Minnesota_Archive_Varco","evidence_type":"institutional_archive","confidence":"moderate","notes":"[Phase2 downgraded from PMID: 12717368 to institutional_archive on 2026-03-17 \u2014 no PubMed source found] Richard Lynn Varco (1912-2004) earned his MB/MD (1937) and PhD in Surgery (1944) at the University of Minnesota. He served as research fellow in the Department of Surgery (1938-1940), fellow in Physiology (1940-1942), and senior resident (1942-1943) under Wangensteen's chairmanship. He rose to Professor (1950) and Regents' Professor (1974). Varco co-pioneered open-heart surgery as a member of the team that performed the world's first open-heart repair under direct vision (with F. John Lewis, Sept 2, 1952) and was central to the cross-circulation operations with C. Walton Lillehei (1954). He also performed the first organ transplant at Minnesota (kidney, 1963) and co-invented the implantable drug infusion pump with Henry Buchwald (1969). Citation is Najarian JS, 'Richard L. Varco, MD, PhD: the compleat academic surgeon,' Surgery 2003;133(4):451-2.","module":"02_general_surgery_spread","source_name":"Owen Wangensteen","target_name":"Richard L. Varco"},{"source":64,"target":132,"edge_type":"society_founder","start_year":1938,"end_year":1941,"temporal_range":"1938-1941","evidence_citation":"NLM_SUS_Archive","evidence_type":"institutional_archive","confidence":"high","notes":"The SUS was organized in 1938 in Baltimore by George G. Finney, I. Ridgeway Trimble, and Warfield M. Firor. Incorporated in 1941. The idea originated with Samuel J. Stabins, chief surgical resident at the University of Rochester. The SUS mission was explicitly Halstedian: members must have completed 'a rigorous training program in the tradition of Dr. William Halsted at Johns Hopkins Medical School' and hold a faculty position at a U.S. medical school. Active membership limited to surgeons under 45. Original trustees included Robert Zollinger and Frank Glenn. Now recognized as the world's premier organization for advancement of surgical sciences. Firor is selected as the source node because he was the most senior Hopkins-affiliated co-founder and connects the SUS directly to the Halstedian training lineage.","module":"12_governance_societies","source_name":"Warfield Firor","target_name":"Society of University Surgeons"},{"source":77,"target":19,"edge_type":"governance_leadership","start_year":1939,"end_year":1940,"temporal_range":"1939-1940","evidence_citation":"PMID: 37941365","evidence_type":"PMID","confidence":"high","notes":"[Verified 2026-03-17 | J Med Biogr 2025 | content_match] Whipple served as ASA president in 1939, connecting the independent Columbia surgical trunk to the oldest American surgical society. He used this platform to advocate for surgical education reform and standardization of operative techniques.","module":"12_governance_societies","source_name":"Allen O. Whipple","target_name":"American Surgical Association"},{"source":72,"target":133,"edge_type":"direct_training","start_year":1939,"end_year":1946,"temporal_range":"1939-1946","evidence_citation":"PMCID: PMC1422478","evidence_type":"PMID","confidence":"high","notes":"Moore trained at MGH under Churchill's rectangular residency system (1939-1946 including wartime service). Brennan (Ann Surg 2002, PMC1422478) documents Moore's MGH residency and subsequent Brigham appointment. Moore was not Hopkins-trained \u2014 he came through the independent MGH/Harvard system. [V6 verification: original PMID 11885952 failed content match \u2014 downgraded to institutional_archive with PMC1422478] [Citation upgraded from institutional_archive to PMCID: PMC1422478 on 2026-03-18 \u2014 Brennan, Ann Surg 2002;235:600-601. Content-match confirmed: Moore residency at MGH documented.]","module":"02_general_surgery_spread","source_name":"Edward Churchill","target_name":"Francis D. Moore"},{"source":134,"target":85,"edge_type":"programmatic_accreditation","start_year":1940,"end_year":2026,"temporal_range":"1940-Present","evidence_citation":"ABMS_Archive_MemberBoards","evidence_type":"institutional_archive","confidence":"high","notes":"The American Board of Neurological Surgery (founded 1940, catalyzed by the Harvey Cushing Society, already in graph) became a member board of ABMS. This edge connects the neurosurgical certification branch to the umbrella governance body, completing the chain: Cushing Society\u2192ABNS\u2192ABMS. Combined with the existing Cushing\u2192SNS\u2192Harvey Cushing Society\u2192ABNS edges, this creates a five-generation governance lineage from Cushing to ABMS spanning 1920-1940.","module":"12_governance_societies","source_name":"American Board of Neurological Surgery","target_name":"American Board of Medical Specialties"},{"source":81,"target":78,"edge_type":"governance_leadership","start_year":1940,"end_year":1964,"temporal_range":"1940-1964","evidence_citation":"Columbia_Archive_Blakemore","evidence_type":"institutional_archive","confidence":"high","notes":"Blakemore served as a senior faculty member and vascular surgery leader at Columbia during and after the Whipple era, bridging the Hopkins-trained vascular lineage (Blakemore trained Voorhees in the synthetic graft innovation) into the Columbia department. This edge formally connects the Halstedian trunk to the independent Columbia trunk via a shared institutional node.","module":"02_general_surgery_spread","source_name":"Arthur Blakemore","target_name":"Columbia University Department of Surgery"},{"source":97,"target":51,"edge_type":"governance_leadership","start_year":1940,"end_year":1941,"temporal_range":"1940-1941","evidence_citation":"PMID: 21820677","evidence_type":"PMID","confidence":"high","notes":"[Verified 2026-03-17 | J Thorac Cardiovasc Surg 2011 | content_match] Graham served as President of the ACS, tightly coupling the pioneering thoracic surgery nodes in St. Louis with the primary national governance trunk.","module":"12_governance_societies","source_name":"Evarts A. Graham","target_name":"American College of Surgeons"},{"source":14,"target":135,"edge_type":"institutional_succession","start_year":1940,"end_year":1955,"temporal_range":"1940-1955","evidence_citation":"PMID: 19048348","evidence_type":"PMID","confidence":"high","notes":"[Verified 2026-03-17 | HSS J 2009 | content_match] Levine DB. 'The Hospital for the Ruptured and Crippled renamed the Hospital for Special Surgery 1940; the war years 1941-1945.' HSS J. 2009 Feb;5(1):1-8. In 1940, the Board of Managers under surgeon-in-chief Philip D. Wilson changed the name from Hospital for the Ruptured and Crippled to Hospital for Special Surgery (HSS). Wilson had been recruited in 1935 to revitalize the institution, and the renaming reflected the modernization of the hospital from a 19th-century charitable institution to a modern academic orthopaedic center. HSS affiliated with Cornell University Medical College and New York Hospital in 1949-1951. This succession edge closes the gap between the existing R&C institutional node (Knight 1863, Gibney 1887) and the modern HSS, the oldest orthopaedic hospital in the United States and currently ranked #1 nationally for orthopaedics.","module":"06_orthopedics","source_name":"Hospital for the Ruptured and Crippled","target_name":"Hospital for Special Surgery"},{"source":46,"target":134,"edge_type":"society_founder","start_year":1940,"end_year":1946,"temporal_range":"1940-1946","evidence_citation":"PMID: 33065539","evidence_type":"PMID","confidence":"high","notes":"[Verified 2026-03-17 | J Neurosurg 2021 | content_match] Naffziger was elected first chairman of the ABNS at its preliminary meeting on November 19, 1939 at the Palmer House in Chicago. The board was officially incorporated in 1940 as the 13th member board of the ABMS. Alfred Adson served as vice-chairman and R. Glen Spurling as secretary-treasurer. The ABNS codified the formal certification of neurosurgeons, requiring dedicated residency training distinct from general surgery.","module":"03_neurosurgery","source_name":"Howard Naffziger","target_name":"American Board of Neurological Surgery"},{"source":117,"target":136,"edge_type":"institutional_founder","start_year":1940,"end_year":1975,"temporal_range":"1940-1975","evidence_citation":"PMID: 32193716","evidence_type":"PMID","confidence":"high","notes":"[Verified 2026-03-17 | Ann Surg Oncol 2020 | content_match] Balch CM. 'Special Article Celebrating SSO 80th Anniversary: William Stewart MacComb \u2014 The Father of the Society of Surgical Oncology (SSO) and a Pioneering Surgical Oncologist.' Ann Surg Oncol. 2021 Sep;28(9):4794-4804. Documents that five Memorial Hospital surgeons led by William MacComb founded the James Ewing Society on June 10, 1940 at the Hotel Lexington in New York as an alumni organization for Memorial Hospital's Surgery Department. The society was renamed SSO in 1975. MacComb was elected first president (1940-1942) and served three terms. While start_year is 1940 (not 1990s), this edge is critical because it connects the existing MSK institutional node (Memorial Hospital for Cancer and Allied Diseases, already in graph) to the existing SSO society node, which currently has only one edge (James Ewing Society\u2192SSO succession, 1975). This fills a structural gap by documenting the founding origin, and the MSK\u2192SSO chain connects the oncology institutional trunk to the surgical oncology governance network.","module":"07_oncology_trials","source_name":"Memorial Hospital for Cancer and Allied Diseases","target_name":"Society of Surgical Oncology"},{"source":117,"target":137,"edge_type":"society_founder","start_year":1940,"end_year":1975,"temporal_range":"1940-1975","evidence_citation":"PMID: 32193716","evidence_type":"PMID","confidence":"high","notes":"[Verified 2026-03-17 | Ann Surg Oncol 2020 | content_match] Five Memorial Hospital surgeons led by William MacComb founded the James Ewing Society as the hospital's surgical alumni organization, establishing the institutional root of organized surgical oncology.","module":"12_governance_societies","source_name":"Memorial Hospital for Cancer and Allied Diseases","target_name":"James Ewing Society"},{"source":80,"target":138,"edge_type":"direct_training","start_year":1941,"end_year":1948,"temporal_range":"c.1941-1948","evidence_citation":"PMID: 22248679","evidence_type":"PMID","confidence":"high","notes":"[Verified 2026-03-17 | J Thorac Cardiovasc Surg 2012 | content_match] C. Rollins Hanlon trained under Blalock at Johns Hopkins and co-developed the Blalock-Hanlon operation (1948) for transposition of the great vessels. The ACS biographical profile confirms Hanlon later served as ACS Executive Director (1969-1986) and ACS President (1987-1988), making him one of the most powerful figures in American surgical governance during that period. Conte (JTCVS 2012, PMID 22248679) documents the Blalock training context. The ACS profile explicitly describes Hanlon working with Blalock on congenital heart operations at Hopkins. This edge connects the Blalock training hub to the ACS governance backbone (Hanlon had a direct governance role at the ACS already in the graph as a major node).","module":"02_general_surgery_spread","source_name":"Alfred Blalock","target_name":"C. Rollins Hanlon"},{"source":127,"target":85,"edge_type":"programmatic_accreditation","start_year":1941,"end_year":2026,"temporal_range":"1941-Present","evidence_citation":"ABMS_Archive_MemberBoards","evidence_type":"institutional_archive","confidence":"high","notes":"The American Board of Plastic Surgery was organized in 1937 by Vilray Blair at an AAPS meeting and held its first meeting in 1938, originally as a subsidiary of the American Board of Surgery. ABPS received independent specialty board status from ABMS in 1941 and remains 1 of 24 ABMS member boards. The ABMS website confirms ABPS membership. This edge follows the identical pattern of existing board-ABMS edges (ABS-ABMS, ABOS-ABMS, ABNS-ABMS, ABCRS-ABMS). BRIDGE EDGE: Merges the plastic surgery island (Component 1, 8 nodes: Blair, Gillies, McIndoe, Millard, ABPS, WashU Plastic, Queen's Hospital, U Miami Plastic) into the main component via the ABMS governance backbone. Components: 9 to 8.","module":"08_subspecialties","source_name":"American Board of Plastic Surgery","target_name":"American Board of Medical Specialties"},{"source":129,"target":139,"edge_type":"governance_leadership","start_year":1941,"end_year":1950,"temporal_range":"1941-1950","evidence_citation":"PMID: 16632995","evidence_type":"PMID","confidence":"high","notes":"[Phase2 reviewed \u2014 citation retained on 2026-03-17] In October 1941, Drew was appointed Chairman of the Department of Surgery at Howard University College of Medicine and Chief of Surgery at Freedmen's Hospital (Howard's main teaching facility). That same month, he became the first African American appointed as an examiner for the American Board of Surgery. Drew's mission at Howard was to train a generation of elite Black surgeons who would meet the most rigorous national standards and then place them in strategic positions throughout the country. He created a rigorous residency program modeled on the standards he absorbed at Columbia under Whipple. Drew held the chairmanship until his death on April 1, 1950, from injuries sustained in an automobile accident near Burlington, North Carolina, while en route to a surgical conference at Tuskegee. His last lecture \u2014 to the sophomore class on Shock, Plasma, and Water Balance \u2014 was delivered on March 31, 1950. Sitting in the front row of that lecture was 19-year-old LaSalle D. Leffall Jr., who would graduate first in his class in 1952 and ultimately succeed Drew's legacy at Howard.","module":"02_general_surgery_spread","source_name":"Charles R. Drew","target_name":"Howard University Department of Surgery"},{"source":69,"target":140,"edge_type":"institutional_founder","start_year":1941,"end_year":1951,"temporal_range":"1941-1951","evidence_citation":"UIUC_Archive_Bailey","evidence_type":"institutional_archive","confidence":"high","notes":"Bailey returned to Chicago to direct the newly founded institute.","module":"03_neurosurgery","source_name":"Percival Bailey","target_name":"University of Illinois Neuropsychiatric Institute"},{"source":108,"target":141,"edge_type":"institutional_founder","start_year":1942,"end_year":1956,"temporal_range":"1942-1956","evidence_citation":"Ochsner_Archive_Founder","evidence_type":"institutional_archive","confidence":"high","notes":"Ochsner co-founded the Ochsner Clinic in New Orleans, establishing a major multi-specialty surgical center and training hub in the Gulf South.","module":"02_general_surgery_spread","source_name":"Alton Ochsner","target_name":"Ochsner Clinic"},{"source":72,"target":142,"edge_type":"institutional_founder","start_year":1943,"end_year":1945,"temporal_range":"1943-1945","evidence_citation":"PMID: 20134311","evidence_type":"PMID","confidence":"high","notes":"Churchill served as Surgical Consultant for the Mediterranean Theater, standardizing whole blood transfusions and delayed primary closure of war wounds, concepts that fundamentally altered civilian trauma care. [Phase2 upgraded institutional_archive -> PMID: 20134311 on 2026-03-18] [Verified 2026-03-18 | Ann Surg 2010 | content_match] Cannon JW, Fischer JE. 'Edward D. Churchill as a combat consultant: lessons for the senior visiting surgeons and today's military medical corps.' Ann Surg. 2010 Mar;251(3):566-72. Documents Churchill's role as Surgical Consultant for the Mediterranean Theater, standardizing whole blood transfusions and delayed primary closure.","module":"14_global_military","source_name":"Edward Churchill","target_name":"Mediterranean Theater Surgical Service"},{"source":49,"target":19,"edge_type":"governance_leadership","start_year":1943,"end_year":1944,"temporal_range":"1943-1944","evidence_citation":"PMID: 9742911","evidence_type":"PMID","confidence":"high","notes":"[Verified 2026-03-17 | Ann Surg 1998 | content_match] Coller served as ASA president in 1943, joining the graph's existing ASA governance network (Whipple 1939, Wangensteen 1968, Sabiston, Bahnson, Najarian, Cameron). He also served as ACS president in 1949 and as the first Chairman of the RRC for Surgery in 1954, establishing the formal accreditation structure for surgical residency programs. Citation upgraded to PMID in V4.","module":"12_governance_societies","source_name":"Frederick Coller","target_name":"American Surgical Association"},{"source":143,"target":80,"edge_type":"observational_study","start_year":1943,"end_year":1964,"temporal_range":"1943-1964","evidence_citation":"Hopkins_Archive_BlueBaby","evidence_type":"institutional_archive","confidence":"high","notes":"Helen Brooke Taussig (1898-1986), founder of pediatric cardiology, approached surgeon Alfred Blalock in 1943 with the conceptual insight that children with tetralogy of Fallot ('blue babies') could be helped by surgically increasing blood flow to the lungs. In a conversation with Blalock and pediatrician-in-chief Edwards Park, Taussig proposed connecting a systemic artery to the pulmonary artery \u2014 the conceptual foundation for the Blalock-Thomas-Taussig shunt. Blalock and his laboratory technician Vivien Thomas then developed and perfected the procedure in approximately 200 experimental animal operations before performing the first human operation on November 29, 1944. Taussig was responsible for diagnosis and pre/postoperative care of these patients. She and Blalock co-published the landmark 1945 JAMA paper. By 1951, the team had operated on over 1,000 children with a 5% mortality rate. Taussig is modeled as an observational_study edge rather than direct_training because her contribution was diagnostic and conceptual collaboration, not a formal training relationship. She was a pediatric cardiologist (not a surgeon), but the graph already includes non-surgeons in analogous collaborative roles (Henrik Kehlet as anesthesiologist, Bernard Fisher as trialist). Taussig also later led the campaign to ban thalidomide in the United States. She received the Medal of Freedom, the Lasker Award, and the French Chevalier Legion d'Honneur. End_year of 1964 reflects Blalock's death.","module":"04_cardiothoracic_vascular","source_name":"Helen Taussig","target_name":"Alfred Blalock"},{"source":25,"target":144,"edge_type":"direct_training","start_year":1943,"end_year":1947,"temporal_range":"1943-1947","evidence_citation":"NLM_Archive_Harkins","evidence_type":"institutional_archive","confidence":"high","notes":"Harkins served as Associate Professor of Surgery at Johns Hopkins from 1943-1947 before being recruited to found the UW Department of Surgery.","module":"02_general_surgery_spread","source_name":"Johns Hopkins Hospital Department of Surgery","target_name":"Henry Harkins"},{"source":109,"target":145,"edge_type":"institutional_founder","start_year":1943,"end_year":1945,"temporal_range":"1943-1945","evidence_citation":"DOI: 10.2106/00004623-195941020-00027","evidence_type":"DOI","confidence":"high","notes":"[Phase2 replaced PMID: 18693427 -> DOI: 10.2106/00004623-195941020-00027 on 2026-03-17] [Verified 2026-03-17 | The Journal of Bone &amp; Joint Surgery 1959 | content_match] Working in the Surgeon General's Office during WWII, DeBakey helped conceptualize the MASH units and the VA medical center system to manage the flow of combat casualties.","module":"14_global_military","source_name":"Michael DeBakey","target_name":"Mobile Army Surgical Hospital (MASH) System"},{"source":80,"target":146,"edge_type":"direct_training","start_year":1944,"end_year":1950,"temporal_range":"1944-1950","evidence_citation":"Hopkins_Archive_Cooley","evidence_type":"institutional_archive","confidence":"moderate","notes":"[Phase2 downgraded from PMID: 19685166 to institutional_archive on 2026-03-17 \u2014 no PubMed source found] Cooley assisted Blalock during the first tetralogy of Fallot operations at Hopkins.","module":"02_general_surgery_spread","source_name":"Alfred Blalock","target_name":"Denton Cooley"},{"source":147,"target":148,"edge_type":"institutional_founder","start_year":1944,"end_year":1947,"temporal_range":"1944-1947","evidence_citation":"PMID: 12563656","evidence_type":"PMID","confidence":"high","notes":"[Verified 2026-03-17 | J Hand Surg Am 2003 | content_match] Sterling Bunnell (1882-1957), a San Francisco general surgeon, was designated a special civilian consultant to the US Secretary of War at the request of Surgeon General Norman T. Kirk, an orthopedic surgeon. Between November 1944 and February 1947, Bunnell established and visited nine regional hand surgery centers at US Army general hospitals across the United States, organizing surgical treatment protocols and teaching standardized hand injury care. He shut down his private practice for two years to accomplish this. Simultaneously, he completed his seminal textbook 'Surgery of the Hand' (JB Lippincott, 1944), which became the authoritative reference for nearly 30 years. Bunnell's key insight was that hand surgery required a multidisciplinary approach \u2014 correlating orthopedics, plastic surgery, and neurosurgery \u2014 rather than fragmented care by separate specialists. The army hand centers institutionalized this principle. This military-to-civilian specialty creation pattern parallels the trauma lineage (Scudder\u2192ACS COT, already in graph) and the MASH system (already in graph). The surgeons who directed these centers became the founding nucleus of the ASSH.","module":"14_global_military","source_name":"Sterling Bunnell","target_name":"United States Army Hand Surgery Centers"},{"source":129,"target":149,"edge_type":"direct_training","start_year":1945,"end_year":1950,"temporal_range":"1945-1950","evidence_citation":"PMID: 16632995","evidence_type":"PMID","confidence":"high","notes":"[Verified 2026-03-17 | Ann Surg 2006 | content_match] Cornwell EE 3rd, Chang DC, Leffall LD Jr. 'The Southern Surgical Association History of Medicine Scholarship Presentation: Dr. Charles Drew, a Surgical Pioneer.' Ann Surg. 2006 May;243(5):612-618. PMC1570555. Documents that Leffall was a sophomore medical student in Drew's final lecture on March 31, 1950 \u2014 the day before Drew's fatal automobile accident. Drew was chief of surgery at Howard (1941-1950, already in graph) and taught Leffall during medical school. Though Drew died before Leffall completed medical school (1952), the mentorship was formative: Leffall became the first Charles R. Drew Professor of Surgery at Howard (1992) and spent 50+ years continuing Drew's legacy. The graph already has Drew\u2192Howard (governance) and Howard\u2192Leffall (institutional training), but no person-to-person edge. This creates a three-generation training chain: Whipple\u2192Drew\u2192Leffall, the longest URM lineage in the graph.","module":"02_general_surgery_spread","source_name":"Charles R. Drew","target_name":"LaSalle D. Leffall Jr."},{"source":118,"target":3,"edge_type":"institutional_founder","start_year":1945,"end_year":1960,"temporal_range":"1945-1960","evidence_citation":"Rhoads_Surgery_2000","evidence_type":"institutional_archive","confidence":"high","notes":"Ravdin served as the John Rhea Barton Professor and Chairman of Surgery at the University of Pennsylvania from 1945 to 1960, then became VP for Medical Affairs. Penn MD 1918, trained entirely at Penn \u2014 NOT Halsted-connected. ASA president 1958, ACS president 1960-1961. He operated on President Eisenhower for Crohn's disease in 1956 and chaired the NIH Clinical Studies Panel that catalyzed the NSABP (already in graph). His mentee Bernard Fisher (already in graph as NSABP founder) overturned the Halstedian radical mastectomy paradigm.","module":"02_general_surgery_spread","source_name":"I.S. Ravdin","target_name":"University of Pennsylvania Department of Surgery"},{"source":87,"target":150,"edge_type":"direct_training","start_year":1945,"end_year":1953,"temporal_range":"1945-1953","evidence_citation":"Minnesota_Archive_Mason","evidence_type":"institutional_archive","confidence":"moderate","notes":"[Phase2 downgraded from PMID: 6013681 to institutional_archive on 2026-03-17 \u2014 no PubMed source found] Mason trained under Wangensteen, carrying the aggressive, physiologically-driven Minnesota surgical culture into his pioneering bariatric work at Iowa.","module":"08_subspecialties","source_name":"Owen Wangensteen","target_name":"Edward Mason"},{"source":80,"target":151,"edge_type":"direct_training","start_year":1946,"end_year":1951,"temporal_range":"1946-1951","evidence_citation":"PMID: 22248679","evidence_type":"PMID","confidence":"high","notes":"[Verified 2026-03-17 | J Thorac Cardiovasc Surg 2012 | content_match] Bahnson trained under Blalock at Hopkins and later became chairman of surgery at the University of Pittsburgh.","module":"02_general_surgery_spread","source_name":"Alfred Blalock","target_name":"Henry Bahnson"},{"source":80,"target":152,"edge_type":"direct_training","start_year":1946,"end_year":1952,"temporal_range":"1946-1952","evidence_citation":"PMID: 37746597","evidence_type":"PMID","confidence":"high","notes":"[Phase2 reviewed \u2014 citation retained on 2026-03-17] H. William Scott Jr. (1916-1998) graduated from Harvard Medical School (1941), completed surgical residency at Peter Bent Brigham Hospital and Boston Children's Hospital, held the Harvey Cushing Fellowship in Neurosurgery at Brigham (1945), then served as assistant resident and chief resident under Alfred Blalock at Johns Hopkins (1946-1947). He remained on the Hopkins faculty as instructor through associate professor (1946-1952) before being recruited to Vanderbilt. Blalock directly recommended Scott for the Vanderbilt chairmanship, telling him 'he could not turn down the opportunity and that he wanted me to go and do everything I could to turn Vanderbilt into a Hopkins.' Scott was president of ASA, ACS, Southern Surgical Association, Halsted Society, and multiple other societies. Citation is Merrill WH, Geevarghese SK, 'Genius is Largely a Matter of Making a Continuous Effort: A Reappraisal of the Contributions of H. William Scott, Jr., MD,' Ann Surg Open 2023;4(3):e312.","module":"02_general_surgery_spread","source_name":"Alfred Blalock","target_name":"H. William Scott Jr."},{"source":77,"target":117,"edge_type":"governance_leadership","start_year":1946,"end_year":1950,"temporal_range":"1946-1950","evidence_citation":"MSK_Archive_Whipple","evidence_type":"institutional_archive","confidence":"high","notes":"Whipple was appointed Clinical Director of Memorial Hospital after retiring as Chair of Surgery at Columbia, tasked with making the hospital more academic and recruiting university-trained surgical residents.","module":"12_governance_societies","source_name":"Allen O. Whipple","target_name":"Memorial Hospital for Cancer and Allied Diseases"},{"source":108,"target":153,"edge_type":"society_founder","start_year":1946,"end_year":1947,"temporal_range":"1946-1947","evidence_citation":"PMID: 30819286","evidence_type":"PMID","confidence":"high","notes":"[Phase2 replaced PMID: 15263901 -> PMID: 30819286 on 2026-03-17] [Verified 2026-03-17 | Am Surg 2019 | content_match] Ochsner served as a primary founder and the first President of the SVS, officially establishing the society at the 1946 San Francisco meeting.","module":"04_cardiothoracic_vascular","source_name":"Alton Ochsner","target_name":"Society for Vascular Surgery"},{"source":70,"target":153,"edge_type":"society_founder","start_year":1946,"end_year":1946,"temporal_range":"1946","evidence_citation":"JVS_Archive_Founders","evidence_type":"institutional_archive","confidence":"high","notes":"Holman was a foundational member of the organizing committee, bridging the Halstedian surgical tradition into dedicated vascular governance.","module":"04_cardiothoracic_vascular","source_name":"Emile Holman","target_name":"Society for Vascular Surgery"},{"source":87,"target":154,"edge_type":"direct_training","start_year":1946,"end_year":1951,"temporal_range":"1946-1951","evidence_citation":"PMID: 15919253","evidence_type":"PMID","confidence":"high","notes":"[Phase2 replaced PMID: 10527140 -> PMID: 15919253 on 2026-03-17] [Verified 2026-03-17 | Ann Thorac Surg 2005 | content_match] Lillehei completed his residency and PhD under Wangensteen, pioneering cross-circulation for open-heart surgery.","module":"02_general_surgery_spread","source_name":"Owen Wangensteen","target_name":"C. Walton Lillehei"},{"source":87,"target":155,"edge_type":"direct_training","start_year":1946,"end_year":1950,"temporal_range":"1946-1950","evidence_citation":"PMID: 17275843","evidence_type":"PMID","confidence":"high","notes":"[Verified 2026-03-17 | J Surg Res 2007 | content_match] Lewis trained under Wangensteen and in 1952 led the team that performed the world's first successful open-heart surgery using hypothermia.","module":"02_general_surgery_spread","source_name":"Owen Wangensteen","target_name":"F. John Lewis"},{"source":87,"target":156,"edge_type":"direct_training","start_year":1946,"end_year":1950,"temporal_range":"1946-1950","evidence_citation":"UW_Archive_Merendino","evidence_type":"institutional_archive","confidence":"high","notes":"Merendino was recruited from the University of Minnesota and performed the first open heart surgery on the West Coast at Harborview in 1956, eventually succeeding Harkins as chair in 1964.","module":"02_general_surgery_spread","source_name":"Owen Wangensteen","target_name":"Alvin Merendino"},{"source":125,"target":157,"edge_type":"institutional_founder","start_year":1946,"end_year":1978,"temporal_range":"1946-1978","evidence_citation":"MDA_Archive_Clark","evidence_type":"institutional_archive","confidence":"high","notes":"Clark served as the founding director and surgeon-in-chief.","module":"07_oncology_trials","source_name":"R. Lee Clark","target_name":"MD Anderson Cancer Center"},{"source":120,"target":158,"edge_type":"direct_training","start_year":1946,"end_year":1950,"temporal_range":"1946-1950","evidence_citation":"UAB_Archive_Kirklin","evidence_type":"institutional_archive","confidence":"high","notes":"Kirklin trained under Robert E. Gross at Boston Children's Hospital, where Gross sparked his interest in cardiac surgery, before returning to Mayo to develop the heart-lung machine program.","module":"02_general_surgery_spread","source_name":"Robert E. Gross","target_name":"John Kirklin"},{"source":120,"target":159,"edge_type":"direct_training","start_year":1946,"end_year":1947,"temporal_range":"1946-1947","evidence_citation":"PMID: 3095885","evidence_type":"PMID","confidence":"moderate","notes":"[Phase2 downgraded from PMID: 18412001 to institutional_archive on 2026-03-17 \u2014 no PubMed source found] Koop completed a highly concentrated fellowship under Gross before moving to Philadelphia. [Phase2 upgraded institutional_archive -> PMID: 3095885 on 2026-03-18] [VERIFY_NAMES: confirm Koop named as Gross trainee] Clatworthy HW. 'Robert E. Gross.' Prog Pediatr Surg. 1986;20:76-84. Koop's brief fellowship under Gross at Boston Children's (1946-1947) is documented in biographical sources. Previously downgraded in Phase 2. [Verified 2026-03-18 | KevinMD 2025 Koop biography & PedSurg Resource history | Koop spent 1946 training with Ladd and Gross at Boston Children's. One of Gross's most prominent prot\u00e9g\u00e9s.]","module":"08_subspecialties","source_name":"Robert E. Gross","target_name":"C. Everett Koop"},{"source":147,"target":160,"edge_type":"society_founder","start_year":1946,"end_year":1957,"temporal_range":"1946-1957","evidence_citation":"PMID: 12563656","evidence_type":"PMID","confidence":"high","notes":"[Verified 2026-03-17 | J Hand Surg Am 2003 | content_match] On January 20, 1946, Bunnell and 34 hand surgeons \u2014 drawn almost exclusively from the US Army hand centers he had established \u2014 met in Chicago immediately preceding the annual meeting of the American Academy of Orthopaedic Surgeons to found the American Society for Surgery of the Hand (ASSH). Bunnell served as its first president (1946-1947). The 35 founding members included 14 general surgeons, 13 plastic surgeons, and 8 orthopedic surgeons, making the ASSH the only major surgical society to formally span three parent specialties from its inception. The society remained small for its first 25 years (no more than 11 new members admitted in any year), then expanded rapidly starting in 1971. In 1975, the ASSH founded the Journal of Hand Surgery. By 2016, the membership composition had shifted to 78% orthopedic surgeons, 16% plastic surgeons, and 5% general surgeons. The ASSH is the oldest medical specialty society devoted exclusively to the hand. End_year of 1957 reflects Bunnell's death; the society continues to the present.","module":"08_subspecialties","source_name":"Sterling Bunnell","target_name":"American Society for Surgery of the Hand"},{"source":80,"target":161,"edge_type":"direct_training","start_year":1947,"end_year":1952,"temporal_range":"1947-1952","evidence_citation":"PMID: 22248679","evidence_type":"PMID","confidence":"high","notes":"[Verified 2026-03-17 | J Thorac Cardiovasc Surg 2012 | content_match] Sabiston completed his surgical residency and chief residency under Blalock at Hopkins, becoming one of the most influential surgical educators of the 20th century.","module":"02_general_surgery_spread","source_name":"Alfred Blalock","target_name":"David Sabiston"},{"source":80,"target":162,"edge_type":"direct_training","start_year":1947,"end_year":1955,"temporal_range":"c.1947-c.1955","evidence_citation":"PMID: 22248679","evidence_type":"PMID","confidence":"moderate","notes":"[Verified 2026-03-17 | J Thorac Cardiovasc Surg 2012 | content_match] William H. Muller Jr. was a Blalock chief resident at Hopkins who subsequently became chairman of the Department of Surgery at the University of Virginia. Conte (JTCVS 2012, PMID 22248679) explicitly lists Muller among Blalock's department chairmen alongside Sabiston, Longmire, and Greenfield. Exact residency dates approximated. Confidence moderate due to estimated dates and limited published biographical detail beyond the Conte citation.","module":"02_general_surgery_spread","source_name":"Alfred Blalock","target_name":"William Muller"},{"source":81,"target":163,"edge_type":"direct_training","start_year":1947,"end_year":1952,"temporal_range":"1947-1952","evidence_citation":"PMID: 22608048","evidence_type":"PMID","confidence":"high","notes":"[Phase2 replaced PMID: 14905833 -> PMID: 22608048 on 2026-03-17] [Verified 2026-03-17 | J Vasc Surg 2012 | content_match] Voorhees developed the first synthetic (Vinyon 'N') arterial prosthesis while training as a surgical resident under Blakemore at Columbia.","module":"04_cardiothoracic_vascular","source_name":"Arthur Blakemore","target_name":"Arthur Voorhees"},{"source":144,"target":164,"edge_type":"institutional_founder","start_year":1947,"end_year":1967,"temporal_range":"1947-1967","evidence_citation":"NLM_Archive_Harkins","evidence_type":"institutional_archive","confidence":"high","notes":"Harkins was the first chairman of surgery at the University of Washington, establishing the residency program and developing the department from the founding of the medical school in 1946.","module":"02_general_surgery_spread","source_name":"Henry Harkins","target_name":"University of Washington Department of Surgery"},{"source":144,"target":165,"edge_type":"direct_training","start_year":1947,"end_year":1956,"temporal_range":"1947-1956","evidence_citation":"DOI: 10.1007/s10029-009-0522-1","evidence_type":"DOI","confidence":"high","notes":"[Phase2 reviewed \u2014 citation retained on 2026-03-17] Lloyd Milton Nyhus (1923-2008) earned his MD from the Medical College of Alabama (1947) and completed surgical training at the University of Washington under his mentor Henry Harkins, finishing in 1956. He remained on the UW faculty until being recruited to the University of Illinois in 1967. Nyhus co-authored his first hernia publication with Harkins (Nyhus LM, Stevenson JK, Harkins HN, 'Preperitoneal herniorrhaphy,' West J Surg 1959), establishing the preperitoneal approach that bears his name (Nyhus classification). Harkins is already in the graph with Hopkins\u2192Harkins (direct_training) and Harkins\u2192UW (institutional_founder). This edge extends the chain: Hopkins\u2192Harkins\u2192Nyhus\u2192Illinois. Citation is DeBord JR, 'Lloyd Milton Nyhus, MD,' Hernia 2009;13:405-6. PMID upgrade candidate: verify if this DOI has an associated PMID in PubMed.","module":"02_general_surgery_spread","source_name":"Henry Harkins","target_name":"Lloyd M. Nyhus"},{"source":98,"target":166,"edge_type":"governance_leadership","start_year":1947,"end_year":1974,"temporal_range":"1947-1974","evidence_citation":"PMID: 12946818","evidence_type":"PMID","confidence":"high","notes":"[Verified 2026-03-17 | Am J Surg 2003 | content_match] Zollinger returned to his alma mater as professor and chair of surgery in 1947, transforming Ohio State from a modest Midwestern program into a nationally recognized surgical training center over a 27-year tenure. He co-discovered the Zollinger-Ellison syndrome with Edwin Ellison (1955), whom he recruited to Ohio State. The endowed Robert M. Zollinger Chair of Surgery was later established in his honor. His successor as chair was Larry C. Carey (1975). Citation is Zollinger RM Sr, Ellison EC, 'A history of the Ohio State University Department of Surgery,' Am J Surg 2003;186(3):208-10.","module":"02_general_surgery_spread","source_name":"Robert M. Zollinger","target_name":"Ohio State University Department of Surgery"},{"source":159,"target":167,"edge_type":"institutional_founder","start_year":1948,"end_year":1981,"temporal_range":"1948-1981","evidence_citation":"PMID: 31711741","evidence_type":"PMID","confidence":"high","notes":"[Phase2 replaced PMID: 35001182 -> PMID: 31711741 on 2026-03-17] [Verified 2026-03-17 | J Pediatr Surg 2020 | content_match] Koop founded the surgical program at CHOP, establishing it as the second major pillar of pediatric surgery.","module":"08_subspecialties","source_name":"C. Everett Koop","target_name":"Children's Hospital of Philadelphia Department of Pediatric Surgery"},{"source":133,"target":168,"edge_type":"governance_leadership","start_year":1948,"end_year":1976,"temporal_range":"1948-1976","evidence_citation":"PMID: 26349933","evidence_type":"PMID","confidence":"high","notes":"[Phase2 replaced PMID: 11930218 -> PMID: 26349933 on 2026-03-17] [Verified 2026-03-17 | J Clin Anesth 2016 | content_match] Souba WW, Wilmore DW. 'Francis Daniels Moore, 1913-2001.' Ann Surg. 2002 Apr;235(4):453-7. PMC1422478. Documents Moore (1913-2001) as Surgeon-in-Chief at Peter Bent Brigham Hospital and Moseley Professor of Surgery at Harvard Medical School from 1948 to 1976. At age 34, he was the youngest surgery chief in Harvard's history. Under Moore's leadership, the department pioneered organ transplantation (Murray), open-heart surgery, and the metabolic care of the surgical patient. Moore trained at MGH (Harvard surgical residency) but spent his entire chairmanship at Brigham. His book 'The Metabolic Care of the Surgical Patient' (1959) was the standard text for decades. Moore was a member of the 1954 transplant surgical team. This edge creates the institutional governance context for Murray's transplant work \u2014 Moore provided the academic environment and institutional protection that enabled a decade of experimental transplant attempts before the 1954 success. The Brigham Department of Surgery node is new and distinct from the two existing Brigham subspecialty nodes (neurosurgery/Cushing, vascular/Homans).","module":"02_general_surgery_spread","source_name":"Francis D. Moore","target_name":"Peter Bent Brigham Hospital Department of Surgery"},{"source":169,"target":38,"edge_type":"governan
