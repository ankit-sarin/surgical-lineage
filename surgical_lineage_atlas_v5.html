<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Surgical Lineage Atlas</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
:root {
  --ds-primary: #0A5E56;
  --ds-primary-mid: #3D8B82;
  --ds-primary-light: #DFF0ED;
  --ds-dark: #2C2C2C;
  --ds-accent: #B85D3A;
  --ds-accent-light: #F2E0D6;
  --ds-surface: #DFEBE9;
  --ds-bg: #EEF5F4;
  --ds-text: #2C2C2C;
  --ds-text-muted: #6B6B6B;
  --ds-border: #C5CDD6;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: 'IBM Plex Sans', Calibri, sans-serif;
  background: var(--ds-bg);
  color: var(--ds-text);
}
#app { display: flex; flex-direction: column; height: 100vh; }
header {
  background: var(--ds-primary);
  color: #fff;
  padding: 10px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  z-index: 10;
}
header .brand h1 {
  font-family: 'Fraunces', Georgia, serif;
  font-weight: 600;
  font-size: 20px;
  letter-spacing: -0.01em;
}
header .stats {
  display: flex;
  gap: 18px;
  font-family: 'IBM Plex Mono', Consolas, monospace;
  font-size: 12px;
  opacity: 0.85;
}
header .stats .stat-val { font-weight: 600; color: #fff; }
.toolbar {
  background: #fff;
  border-bottom: 1px solid var(--ds-border);
  padding: 8px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  flex-shrink: 0;
  font-size: 13px;
}
.toolbar label { font-weight: 500; color: var(--ds-text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
.toolbar select, .toolbar input[type="text"] {
  border: 1px solid var(--ds-border);
  border-radius: 4px;
  padding: 4px 8px;
  font-family: inherit;
  font-size: 13px;
  background: #fff;
  color: var(--ds-text);
}
.toolbar input[type="text"] { width: 160px; }
.toolbar .sep { width: 1px; height: 24px; background: var(--ds-border); }
.toolbar button {
  background: var(--ds-surface);
  border: 1px solid var(--ds-border);
  border-radius: 4px;
  padding: 4px 12px;
  font-family: inherit;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  color: var(--ds-text);
}
.toolbar button:hover { background: var(--ds-primary-light); }
.toolbar button.toggle-active {
  background: var(--ds-primary);
  color: #fff;
  border-color: var(--ds-primary);
}
.node-toggles { display: flex; gap: 6px; }
.node-toggle {
  display: flex; align-items: center; gap: 4px;
  padding: 3px 8px; border-radius: 4px;
  cursor: pointer; font-size: 12px; font-weight: 500;
  border: 2px solid transparent;
  user-select: none;
}
.node-toggle.active { border-color: currentColor; }
.node-toggle .dot { width: 10px; height: 10px; border-radius: 50%; }
.main { display: flex; flex: 1; overflow: hidden; position: relative; }
#graph-container { flex: 1; position: relative; overflow: hidden; background: var(--ds-bg); }
svg { width: 100%; height: 100%; }
.panel {
  width: 360px;
  background: #fff;
  border-left: 1px solid var(--ds-border);
  overflow-y: auto;
  flex-shrink: 0;
  transition: margin-right 0.25s ease;
  padding: 0;
}
.panel.hidden { margin-right: -360px; }
.panel-header {
  padding: 16px;
  border-bottom: 1px solid var(--ds-border);
  position: sticky;
  top: 0;
  background: #fff;
  z-index: 2;
}
.panel-header h2 {
  font-family: 'Fraunces', Georgia, serif;
  font-size: 18px;
  font-weight: 600;
  color: var(--ds-dark);
  line-height: 1.3;
  margin-bottom: 6px;
  padding-right: 30px;
}
.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 3px;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.badge-person { background: var(--ds-primary); color: #fff; }
.badge-institution { background: var(--ds-accent); color: #fff; }
.badge-society { background: var(--ds-dark); color: #fff; }
.panel-close {
  position: absolute;
  top: 12px;
  right: 12px;
  background: none;
  border: none;
  font-size: 20px;
  cursor: pointer;
  color: var(--ds-text-muted);
  line-height: 1;
}
.panel-body { padding: 16px; }
.conn-group { margin-bottom: 14px; }
.conn-group h3 {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--ds-primary);
  margin-bottom: 6px;
  padding-bottom: 4px;
  border-bottom: 1px solid var(--ds-primary-light);
}
.conn-item {
  padding: 6px 0;
  border-bottom: 1px solid #f0f0f0;
  font-size: 13px;
  line-height: 1.5;
}
.conn-item:last-child { border-bottom: none; }
.conn-link {
  color: var(--ds-primary);
  cursor: pointer;
  text-decoration: none;
  font-weight: 500;
}
.conn-link:hover { text-decoration: underline; }
.conn-meta { font-size: 11px; color: var(--ds-text-muted); margin-top: 2px; }
.conn-notes { font-size: 11px; color: var(--ds-text-muted); font-style: italic; margin-top: 2px; }
.ev-badge {
  display: inline-block;
  padding: 1px 5px;
  border-radius: 3px;
  font-size: 9px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  margin-left: 6px;
  vertical-align: middle;
}
.ev-badge-pmid { background: var(--ds-primary); color: #fff; }
.ev-badge-doi { background: var(--ds-primary-mid); color: #fff; }
.ev-badge-archive { background: #d0d0d0; color: #666; }
.legend {
  position: absolute;
  bottom: 16px;
  left: 16px;
  background: rgba(255,255,255,0.95);
  border: 1px solid var(--ds-border);
  border-radius: 6px;
  padding: 12px 16px;
  font-size: 11px;
  z-index: 5;
  max-width: 240px;
}
.legend h4 {
  font-weight: 600;
  margin-bottom: 6px;
  color: var(--ds-dark);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.legend-item { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.tooltip {
  position: absolute;
  pointer-events: none;
  background: rgba(44,44,44,0.92);
  color: #fff;
  padding: 6px 10px;
  border-radius: 4px;
  font-size: 12px;
  z-index: 20;
  white-space: nowrap;
  opacity: 0;
  transition: opacity 0.15s;
}
.tooltip.show { opacity: 1; }
.edge-tooltip {
  position: absolute;
  pointer-events: none;
  background: rgba(44,44,44,0.95);
  color: #fff;
  padding: 8px 12px;
  border-radius: 4px;
  font-size: 12px;
  z-index: 20;
  max-width: 360px;
  opacity: 0;
  transition: opacity 0.15s;
  line-height: 1.5;
}
.edge-tooltip.show { opacity: 1; }
.edge-tooltip .et-label { font-weight: 600; color: var(--ds-primary-light); }
.edge-tooltip .et-ev { font-size: 10px; opacity: 0.75; margin-top: 2px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><h1>Surgical Lineage Atlas</h1></div>
    <div class="stats">
      <span><span class="stat-val">394</span> edges</span>
      <span><span class="stat-val">323</span> nodes</span>
      <span><span class="stat-val">174</span> persons</span>
      <span><span class="stat-val">95</span> institutions</span>
      <span><span class="stat-val">54</span> societies</span>
    </div>
  </header>
  <div class="toolbar">
    <div class="node-toggles">
      <div class="node-toggle active" data-type="person" style="color: var(--ds-primary);">
        <span class="dot" style="background: var(--ds-primary);"></span> Person
      </div>
      <div class="node-toggle active" data-type="institution" style="color: var(--ds-accent);">
        <span class="dot" style="background: var(--ds-accent);"></span> Institution
      </div>
      <div class="node-toggle active" data-type="society" style="color: var(--ds-dark);">
        <span class="dot" style="background: var(--ds-dark);"></span> Society
      </div>
    </div>
    <div class="sep"></div>
    <label>Edge</label>
    <select id="edgeFilter">
      <option value="all">All Types</option>
      <option value="direct_training">Training</option>
      <option value="institutional_founder">Inst. Founding</option>
      <option value="society_founder">Society Founding</option>
      <option value="governance_leadership">Governance</option>
      <option value="programmatic_accreditation">Accreditation</option>
      <option value="institutional_succession">Succession</option>
      <option value="observational_study">Observational</option>
    </select>
    <div class="sep"></div>
    <label>Era</label>
    <select id="eraFilter">
      <option value="all">All Eras</option>
      <option value="pre1900">Pre-1900</option>
      <option value="1900-1950">1900–1950</option>
      <option value="1950-2000">1950–2000</option>
      <option value="2000+">2000+</option>
    </select>
    <div class="sep"></div>
    <label>Module</label>
    <select id="moduleFilter">
      <option value="all">All Modules</option>
    </select>
    <div class="sep"></div>
    <input type="text" id="searchBox" placeholder="Search nodes…">
    <div class="sep"></div>
    <button id="evidenceBtn">Evidence</button>
    <div class="sep"></div>
    <button id="resetBtn">Reset</button>
    <button id="fitBtn">Fit View</button>
  </div>
  <div class="main">
    <div id="graph-container">
      <div class="tooltip" id="tooltip"></div>
      <div class="edge-tooltip" id="edgeTooltip"></div>
      <div class="legend">
        <h4>Nodes</h4>
        <div class="legend-item"><span class="legend-dot" style="background:#0A5E56;"></span> Person</div>
        <div class="legend-item"><span class="legend-dot" style="background:#B85D3A;"></span> Institution</div>
        <div class="legend-item"><span class="legend-dot" style="background:#2C2C2C;"></span> Society</div>
        <h4 style="margin-top:10px;">Edges</h4>
        <div class="legend-item"><svg width="24" height="8"><line x1="0" y1="4" x2="24" y2="4" stroke="#0A5E56" stroke-width="2"/></svg> Training / Observational</div>
        <div class="legend-item"><svg width="24" height="8"><line x1="0" y1="4" x2="24" y2="4" stroke="#B85D3A" stroke-width="2" stroke-dasharray="6,3"/></svg> Founding</div>
        <div class="legend-item"><svg width="24" height="8"><line x1="0" y1="4" x2="24" y2="4" stroke="#6B6B6B" stroke-width="2" stroke-dasharray="2,3"/></svg> Governance</div>
        <div class="legend-item"><svg width="24" height="8"><line x1="0" y1="4" x2="24" y2="4" stroke="#3D8B82" stroke-width="2" stroke-dasharray="8,3,2,3"/></svg> Accreditation / Succession</div>
      </div>
    </div>
    <div class="panel hidden" id="panel">
      <div class="panel-header">
        <button class="panel-close" id="panelClose">&times;</button>
        <h2 id="panelName"></h2>
        <span class="badge" id="panelBadge"></span>
      </div>
      <div class="panel-body" id="panelBody"></div>
    </div>
  </div>
</div>

ort":"SCIP","degree":2},{"id":"American Society for Metabolic and Bariatric Surgery","type":"society","label_short":"ASMBS","degree":2},{"id":"Trauma Quality Improvement Program","type":"institution","label_short":"TQIP","degree":3},{"id":"Acute Care Surgery Fellowship Program","type":"institution","label_short":"ACS Fellowship","degree":1},{"id":"ERAS Society","type":"society","label_short":"ERAS","degree":3},{"id":"Olle Ljungqvist","type":"person","label_short":"Ljungqvist","degree":1},{"id":"Alliance for Clinical Trials in Oncology","type":"institution","label_short":"Alliance","degree":2},{"id":"NRG Oncology","type":"institution","label_short":"NRG Oncology","degree":2},{"id":"Fundamentals of Endoscopic Surgery","type":"institution","label_short":"FES","degree":2},{"id":"Geriatric Surgery Verification Program","type":"institution","label_short":"GSV","degree":1}],"links":[{"source":0,"target":1,"edge_type":"direct_training","start_year":1777,"end_year":1784,"temporal_range":"1777-1784","evidence_citation":"PMID: 3545417","evidence_type":"PMID","confidence":"moderate","notes":"Cline trained under Hunter, establishing the early British scientific surgical tradition before the German model dominated. [Phase2 upgraded institutional_archive -> PMID: 3545417 on 2026-03-18] [Verified 2026-03-18 | historical review | content_match] Article identifies Cline among Hunter's direct disciples alongside Abernethy and Astley Cooper. Cline attended Hunter's first lecture course in 1774 and became one of the leading Hunterian surgeons.","module":"14_global_military","source_name":"John Hunter","target_name":"Henry Cline"},{"source":0,"target":2,"edge_type":"direct_training","start_year":1788,"end_year":1791,"temporal_range":"1788-1791","evidence_citation":"PMID: 22770963","evidence_type":"PMID","confidence":"high","notes":"[Verified 2026-03-17 | J Am Coll Surg 2012 | content_match] Philip Syng Physick (1768-1837) traveled to London in 1788 to study under John Hunter at St. George's Hospital, where he learned anatomy from cadaver dissection. On January 1, 1790, Hunter appointed Physick house surgeon \u2014 the first American to hold that position at St. George's. Physick received the diploma of the Royal College of Surgeons in 1790 and dedicated his Edinburgh MD thesis on apoplexy to Hunter (1792). Hunter offered Physick a partnership, but Physick returned to Philadelphia in 1792 and was appointed first professor of surgery at the University of Pennsylvania in 1805. Sheldon (JACS 2012) titles Physick explicitly as Hunter's favorite American trainee. This bridge edge merges the Hunter/Cline island (Component 9, 2 nodes in 14_global_military) into the main component via Physick's existing edges in 13_pre_halsted, extending the graph's temporal depth from 1777 (Hunter-Cline) through the entire pre-Halsted American trunk (Physick 1805, Gross 1828, ASA 1880) to the Halstedian era.","module":"13_pre_halsted","source_name":"John Hunter","target_name":"Philip Syng Physick"},{"source":2,"target":3,"edge_type":"institutional_founder","start_year":1805,"end_year":1831,"temporal_range":"1805-1831","evidence_citation":"PMID: 22770963","evidence_type":"PMID","confidence":"high","notes":"[Verified 2026-03-17 | J Am Coll Surg 2012 | content_match] Philip Syng Physick (1768-1837), called the 'Father of American Surgery,' was elected the first professor of surgery at the University of Pennsylvania in 1805 \u2014 the first such chair in the United States. He held it until 1819 when he transferred to the anatomy chair (retiring 1831). Trained in London under John Hunter at St. George's Hospital (1788-1790), he was Hunter's first American house surgeon. He pioneered catgut sutures, the stomach pump, and tonsillectomy instruments. He was surgeon to Pennsylvania Hospital from 1794 to 1816 and treated Chief Justice John Marshall and First Lady Dolley Madison. His lectures prepared an entire generation of American surgeons. This edge extends the UPenn surgery lineage 140 years before Ravdin (1945), establishing an independent pre-Halsted Philadelphia surgical trunk. Physick and Halsted represent two distinct origin points for American academic surgery: Philadelphia (1805) and Baltimore (1889).","module":"13_pre_halsted","source_name":"Philip Syng Physick","target_name":"University of Pennsylvania Department of Surgery"},{"source":4,"target":5,"edge_type":"institutional_founder","start_year":1820,"end_year":1875,"temporal_range":"1820-1875","evidence_citation":"AOS_Archive_Sesquicentennial","evidence_type":"institutional_archive","confidence":"high","notes":"Edward Delafield (1794-1875) and John Kearney Rodgers co-founded the New York Eye Infirmary on August 14, 1820, the first specialty eye hospital in the Western Hemisphere. Both had studied ophthalmology at Moorfields Eye Hospital in London under Astley Cooper and John Abernethy at St. Thomas's and St. Bartholomew's Hospitals (1816-1818). The Infirmary opened at 45 Chatham Square in New York City and performed the first successful congenital cataract surgeries in the United States. Delafield was simultaneously president of the College of Physicians and Surgeons (a precursor institution to Columbia's medical school, though this is not modeled as a formal edge to avoid overstating the institutional link). The Infirmary's seal was later adopted by the American Ophthalmological Society upon its founding in 1864. The institution eventually became the New York Eye and Ear Infirmary (NYEE), which continues today. This is the earliest specialty institution founding in the graph, predating St. Mark's Hospital for Fistula (1835, already in graph) by 15 years and extending the graph's institutional founding timeline into the 1820s.","module":"08_subspecialties","source_name":"Edward Delafield","target_name":"New York Eye Infirmary"},{"source":6,"target":7,"edge_type":"direct_training","start_year":1826,"end_year":1828,"temporal_range":"1826-1828","evidence_citation":"PMID: 16809223","evidence_type":"PMID","confidence":"high","notes":"[Verified 2026-03-17 | J Invest Surg 2006 | content_match] Samuel D. Gross (1805-1884) entered Jefferson Medical College in 1826 and graduated in 1828 in a class of 27 students. Jefferson was founded in 1824 by George McClellan, whom Gross greatly admired. Gross was the first alumnus to be appointed to a professorship there. After stints in Easton, Cincinnati (Medical College of Ohio, 1833-1840), and Louisville (1840-1856), he returned to Jefferson as professor of surgery in 1856 \u2014 completing a 30-year circuit. Thomas Eakins immortalized him in 'The Gross Clinic' (1875), one of the greatest American paintings. Jefferson Medical College is among the oldest medical schools in the United States and an independent institutional trunk parallel to the UPenn/Hopkins lineages.","module":"13_pre_halsted","source_name":"Jefferson Medical College Department of Surgery","target_name":"Samuel D. Gross"},{"source":8,"target":9,"edge_type":"institutional_founder","start_year":1835,"end_year":1859,"temporal_range":"1835-1859","evidence_citation":"StMarks_Archive_Salmon","evidence_type":"institutional_archive","confidence":"high","notes":"Salmon founded the institution specifically dedicated to colorectal disease, pre-dating modern general surgery departments.","module":"08_subspecialties","source_name":"Frederick Salmon","target_name":"St. Mark's Hospital for Fistula and Other Diseases of the Rectum"},{"source":10,"target":11,"edge_type":"institutional_founder","start_year":1847,"end_year":1882,"temporal_range":"1847-1882","evidence_citation":"PMID: 25044221","evidence_type":"PMID","confidence":"high","notes":"[Phase2 replaced PMID: 20436531 -> PMID: 25044221 on 2026-03-17] [Verified 2026-03-17 | Clin Anat 2014 | content_match] Langenbeck developed the German system of residency training at Charit\u00e9, heavily influencing the later Halstedian model.","module":"14_global_military","source_name":"Bernhard von Langenbeck","target_name":"Charit\u00e9 Berlin Department of Surgery"},{"source":10,"target":12,"edge_type":"direct_training","start_year":1853,"end_year":1860,"temporal_range":"1853-1860","evidence_citation":"PMID: 20340032","evidence_type":"PMID","confidence":"high","notes":"[Phase2 replaced PMID: 20436531 -> PMID: 20340032 on 2026-03-17] [Verified 2026-03-17 | Langenbecks Arch Surg 2010 | content_match] Billroth served as Langenbeck's assistant at Charit\u00e9, internalizing the German academic surgical system before his move to Zurich and Vienna.","module":"14_global_military","source_name":"Bernhard von Langenbeck","target_name":"Theodor Billroth"},{"source":7,"target":6,"edge_type":"governance_leadership","start_year":1856,"end_year":1882,"temporal_range":"1856-1882","evidence_citation":"PMID: 6996621","evidence_type":"PMID","confidence":"high","notes":"[Verified 2026-03-17 | Ann Surg 1980 | content_match] Gross served as professor of surgery at Jefferson from 1856 to 1882, succeeding Thomas Dent Mutter. He was called the 'Emperor of American Surgery' and published 14 books and over 1,200 articles. During this tenure he founded the Philadelphia Academy of Surgery (1879, the oldest continuously meeting surgical society in the US) and the American Surgical Association (1880, already in graph via graph_update_draft.json). He also served as AMA president (1868). His successor was William W. Keen, who became one of the first surgeons to operate on the brain (1889). The dual edges (Jefferson trained Gross; Gross led Jefferson) create a bidirectional circuit rare in the graph and mirror the pattern seen in Cincinnati (where Altemeier returned to lead the department that trained him).","module":"13_pre_halsted","source_name":"Samuel D. Gross","target_name":"Jefferson Medical College Department of Surgery"},{"source":13,"target":14,"edge_type":"institutional_founder","start_year":1863,"end_year":1887,"temporal_range":"1863-1887","evidence_citation":"PMID: 16272913","evidence_type":"PMID","confidence":"high","notes":"[Phase2 replaced PMID: 2504092 -> PMID: 16272913 on 2026-03-17] [Verified 2026-03-17 | Orthop Nurs 2005 | content_match] Knight founded the institution (now Hospital for Special Surgery) specifically for orthopedic rehabilitation, establishing a parallel trunk to general surgery.","module":"06_orthopedics","source_name":"James Knight","target_name":"Hospital for the Ruptured and Crippled"},{"source":4,"target":15,"edge_type":"society_founder","start_year":1864,"end_year":1875,"temporal_range":"1864-1875","evidence_citation":"PMID: 27550008","evidence_type":"PMID","confidence":"high","notes":"[Verified 2026-03-17 | Ophthalmology 2016 | content_match] The American Ophthalmological Society (AOS) was founded on June 7, 1864, by 18 physicians including Henry Drury Noyes, Daniel Bennett St. John Roosa, and Edward Delafield, who served as its first president. The AOS is the oldest specialty medical society in the United States (the New York Ophthalmological Society, founded March 7, 1864, preceded it by three months but remained a local organization). The AOS was founded at a meeting in Noyes' office at which seven New York City ophthalmologists and one from Boston convened, initially to establish a respectable ophthalmology journal in response to a dubious publication by a German immigrant. They decided a society would be more effective than a journal. Delafield, then age 70 and president of the College of Physicians and Surgeons, was elected chairman. The AOS had only 19 members at its founding. It played a leading role in establishing the American Board of Ophthalmology in 1916. Admission requires nomination by current members and submission of a scholarly thesis. End_year of 1875 reflects Delafield's death.","module":"08_subspecialties","source_name":"Edward Delafield","target_name":"American Ophthalmological Society"},{"source":10,"target":16,"edge_type":"direct_training","start_year":1865,"end_year":1866,"temporal_range":"1865-1866","evidence_citation":"PMID: 9465770","evidence_type":"PMID","confidence":"high","notes":"[Verified 2026-03-17 | World J Surg 1998 | content_match] Emil Theodor Kocher (1841-1917) studied under Langenbeck in Berlin during his post-doctoral study trip (1865-1866), along with visits to Billroth in Vienna and surgeons in London and Paris. Langenbeck and Billroth both recommended Kocher for the chair at Bern, which he assumed in 1872. He held this position for 45 years until his death. Kocher won the 1909 Nobel Prize in Physiology or Medicine for his work on the thyroid gland \u2014 the first surgeon to receive the Nobel Prize. He performed over 7,000 thyroidectomies, reducing mortality from 13% to 0.18%. This edge extends the European depth layer: Langenbeck\u2192Kocher creates a parallel to the existing Langenbeck\u2192Billroth\u2192Halsted chain. Citation is Liebermann-Meffert D, 'Surgical triumvirate of Theodor Kocher, Harvey Cushing, and William Halsted,' World J Surg 2000;24(1):2-9.","module":"14_global_military","source_name":"Bernhard von Langenbeck","target_name":"Theodor Kocher"},{"source":12,"target":17,"edge_type":"institutional_founder","start_year":1867,"end_year":1894,"temporal_range":"1867-1894","evidence_citation":"PMID: 15354259","evidence_type":"PMID","confidence":"low","notes":"[VERIFY_FAILED 2026-03-17 \u2014 No PubmedArticle returned; was confidence:high] Billroth established the Vienna School of Surgery, pioneering gastrointestinal resections and early modern surgical morbidity tracking.","module":"14_global_military","source_name":"Theodor Billroth","target_name":"Vienna General Hospital Second Surgical Clinic"},{"source":12,"target":18,"edge_type":"observational_study","start_year":1878,"end_year":1880,"temporal_range":"1878-1880","evidence_citation":"PMID: 23035261","evidence_type":"PMID","confidence":"high","notes":"[Phase2 replaced PMID: 2446524 -> PMID: 23035261 on 2026-03-17] [Verified 2026-03-17 | Aktuelle Urol 2012 | content_match] Halsted spent two years traversing European surgical clinics, highly influenced by Billroth's scientific approach and Langenbeck's residency structure before returning to design the Hopkins system.","module":"14_global_military","source_name":"Theodor Billroth","target_name":"William Stewart Halsted"},{"source":7,"target":19,"edge_type":"society_founder","start_year":1880,"end_year":1884,"temporal_range":"1880-1884","evidence_citation":"PMID: 28471761","evidence_type":"PMID","confidence":"high","notes":"[Verified 2026-03-17 | Ann Surg 2018 | content_match] Gross founded the ASA in 1880 as the first national surgical society in the United States, serving as its first president. Chair of Surgery at Jefferson Medical College, he was the dominant pre-Halstedian figure in American surgery. The ASA subsequently catalyzed the founding of both the ACS (1913) and the ABS (1937).","module":"13_pre_halsted","source_name":"Samuel D. Gross","target_name":"American Surgical Association"},{"source":6,"target":20,"edge_type":"direct_training","start_year":1884,"end_year":1886,"temporal_range":"1884-1886","evidence_citation":"PMID: 37439820","evidence_type":"PMID","confidence":"high","notes":"[Verified 2026-03-17 | Surg Endosc 2023 | content_match] Chevalier Quixote Jackson (1865-1958) enrolled at Jefferson Medical College in 1884 and received his MD in 1886. He later returned to Jefferson as Professor of Laryngology (1916-1924) and Professor of Bronchoesophagology and department head (1924-1930). Eriksson et al (Surg Endosc 2023, PMID 37439820) and the Jefferson Libraries archives confirm his MD and professorial appointments. Jackson was a founding member and inaugural governor of the American College of Surgeons, the father of endoscopic surgery, and a pioneer in public health advocacy (Federal Caustic Poison Act of 1927). BRIDGE EDGE: Merges the Jackson/ABEA island (Component 6, 2 nodes) into the main component via the Jefferson Medical College node in 13_pre_halsted. Components: 8 to 7 (accounting for T1-03 bridge already reducing to 8).","module":"08_subspecialties","source_name":"Jefferson Medical College Department of Surgery","target_name":"Chevalier Jackson"},{"source":21,"target":14,"edge_type":"institutional_succession","start_year":1887,"end_year":1925,"temporal_range":"1887-1925","evidence_citation":"HSS_Archive_Gibney","evidence_type":"institutional_archive","confidence":"high","notes":"Gibney succeeded Knight as Surgeon-in-Chief and established the first formal orthopedic residency program in the United States in 1887.","module":"06_orthopedics","source_name":"Virgil Gibney","target_name":"Hospital for the Ruptured and Crippled"},{"source":21,"target":22,"edge_type":"society_founder","start_year":1887,"end_year":1912,"temporal_range":"1887-1912","evidence_citation":"PMID: 19763730","evidence_type":"PMID","confidence":"low","notes":"[VERIFY_FAILED 2026-03-17 \u2014 No PubmedArticle returned; was confidence:high] Gibney was a founding member of the AOA at the January 1887 organizational meeting at Newton Shaffer's home in New York, and served as its first president. He is the only individual to have served as AOA president twice (1887 and 1912). The AOA was the first organized orthopaedic body in the world, predating any European equivalent.","module":"06_orthopedics","source_name":"Virgil Gibney","target_name":"American Orthopaedic Association"},{"source":23,"target":24,"edge_type":"institutional_founder","start_year":1889,"end_year":1939,"temporal_range":"1889-1939","evidence_citation":"Mayo_Archive_Founder","evidence_type":"institutional_archive","confidence":"high","notes":"William J. Mayo co-founded and built the surgical dynasty at the Mayo Clinic, establishing one of the two primary institutional hubs of early American surgery.","module":"02_general_surgery_spread","source_name":"William J. Mayo","target_name":"Mayo Clinic Department of Surgery"},{"source":18,"target":25,"edge_type":"institutional_founder","start_year":1889,"end_year":1922,"temporal_range":"1889-1922","evidence_citation":"PMID: 32481787","evidence_type":"PMID","confidence":"high","notes":"[Phase2 replaced PMID: 2446524 -> PMID: 32481787 on 2026-03-17] [Verified 2026-03-17 | R I Med J (2013) 2020 | content_match] Halsted established the first formal surgical residency training program in the United States, cementing the institutional root of modern surgical education.","module":"01_halsted_core","source_name":"William Stewart Halsted","target_name":"Johns Hopkins Hospital Department of Surgery"},{"source":18,"target":26,"edge_type":"direct_training","start_year":1889,"end_year":1899,"temporal_range":"1889-1899","evidence_citation":"PMID: 29189382","evidence_type":"PMID","confidence":"high","notes":"[Phase2 replaced PMID: 26645476 -> PMID: 29189382 on 2026-03-17] [Verified 2026-03-17 | Ann Surg 2018 | content_match] Finney served as Halsted's first resident and primary deputy, serving as the critical bridge to the next generation of American general surgeons.","module":"01_halsted_core","source_name":"William Stewart Halsted","target_name":"John Finney"},{"source":18,"target":27,"edge_type":"direct_training","start_year":1892,"end_year":1897,"temporal_range":"1892-1897","evidence_citation":"PMID: 29681553","evidence_type":"PMID","confidence":"high","notes":"[Verified 2026-03-17 | Bull Hist Med 2018 | content_match] Bloodgood trained under Halsted and institutionalized surgical pathology as a mandatory core competency within surgical training.","module":"01_halsted_core","source_name":"William Stewart Halsted","target_name":"Joseph Bloodgood"},{"source":18,"target":28,"edge_type":"direct_training","start_year":1895,"end_year":1898,"temporal_range":"1895-1898","evidence_citation":"PMID: 23035261","evidence_type":"PMID","confidence":"high","notes":"[Phase2 replaced PMID: 2446524 -> PMID: 23035261 on 2026-03-17] [Verified 2026-03-17 | Aktuelle Urol 2012 | content_match] Young trained as an assistant surgeon under Halsted before being appointed to head the genitourinary dispensary in 1897.","module":"01_halsted_core","source_name":"William Stewart Halsted","target_name":"Hugh Hampton Young"},{"source":25,"target":29,"edge_type":"direct_training","start_year":1896,"end_year":1900,"temporal_range":"1896-1900","evidence_citation":"PMID: 373268","evidence_type":"PMID","confidence":"moderate","notes":"[Verified 2026-03-17 | Yale J Biol Med 1978 | content_match] Joseph Marshall Flint (1872-1944) received his BS from the University of Chicago (1895) and his MD from Johns Hopkins University in 1900 during the Halsted era. He then became professor of anatomy at UC Berkeley (1901-1907) before being appointed the first full-time professor of surgery at Yale Medical School in 1907. At Yale, Flint began a formal surgical residency based on the model developed by Halsted at Hopkins. Confidence moderate because Flint received his Hopkins MD during the Halsted era but was primarily trained as an anatomist rather than as a Halsted surgical resident. His surgical training came later through self-directed study and European sabbatical (1906). Source: Baue AE. Joseph Marshall Flint and the whole-time system at Yale. Yale J Biol Med. 1978;51(5):549-563. BRIDGE EDGE: Connects the Yale 3-node island (Flint + Lindskog + Yale Dept) to the main component via Hopkins.","module":"02_general_surgery_spread","source_name":"Johns Hopkins Hospital Department of Surgery","target_name":"Joseph Marshall Flint"},{"source":18,"target":30,"edge_type":"direct_training","start_year":1896,"end_year":1912,"temporal_range":"1896-1912","evidence_citation":"PMID: 29099433","evidence_type":"PMID","confidence":"high","notes":"[Phase2 replaced PMID: 28489324 -> PMID: 29099433 on 2026-03-17] [Verified 2026-03-17 | Anesth Analg 2018 | content_match] Cushing served as Halsted's resident and later established the Hunterian Laboratory.","module":"01_halsted_core","source_name":"William Stewart Halsted","target_name":"Harvey Cushing"},{"source":31,"target":32,"edge_type":"institutional_founder","start_year":1899,"end_year":1910,"temporal_range":"1899-1910","evidence_citation":"PMID: 34747915","evidence_type":"PMID","confidence":"high","notes":"[Phase2 replaced PMID: 10926590 -> PMID: 34747915 on 2026-03-17] [Verified 2026-03-17 | Dis Colon Rectum 2021 | content_match] Mathews was appointed the first Professor of Proctology, establishing the first formal academic department for the specialty in the US.","module":"08_subspecialties","source_name":"Joseph McDowell Mathews","target_name":"Kentucky School of Medicine Department of Proctology"},{"source":31,"target":33,"edge_type":"society_founder","start_year":1899,"end_year":1899,"temporal_range":"1899","evidence_citation":"Historical_Archive_Society","evidence_type":"institutional_archive","confidence":"moderate","notes":"[Phase2 downgraded from PMID: 10926590 to institutional_archive on 2026-03-17 \u2014 no PubMed source found] Mathews served as the first president and primary founder of the American Proctologic Society.","module":"08_subspecialties","source_name":"Joseph McDowell Mathews","target_name":"American Proctologic Society"},{"source":16,"target":30,"edge_type":"observational_study","start_year":1900,"end_year":1901,"temporal_range":"1900-1901","evidence_citation":"PMID: 9465770","evidence_type":"PMID","confidence":"high","notes":"[Verified 2026-03-17 | World J Surg 1998 | content_match] Harvey Cushing visited Kocher's clinic in Bern during his European Wanderjahr (1900-1901), conducting experimental research on intracranial pressure that led to the Cushing-Kocher theory. This is one of the most documented observational visits in surgical history. Cushing was already a Halsted trainee at Hopkins (existing edge in graph). This creates a second pathway to Cushing: Langenbeck\u2192Kocher\u2192Cushing (observational) alongside the existing Halsted\u2192Cushing (direct_training), forming a triangulated European-American bridge. Citation same as training edge.","module":"14_global_military","source_name":"Theodor Kocher","target_name":"Harvey Cushing"},{"source":34,"target":35,"edge_type":"society_founder","start_year":1902,"end_year":1917,"temporal_range":"1902-1917","evidence_citation":"PMID: 20620396","evidence_type":"PMID","confidence":"high","notes":"On February 22, 1902, eight members of the New York Genito-Urinary Society met at Guiteras' home and voted to disband the society and form the American Urological Association. Guiteras was elected first president. Harvard-trained (MD 1883) with postgraduate study in Paris, Vienna, and Berlin, he represented an independent New York surgical lineage with no Halsted connection. The AUA is now the largest urological organization in the world with over 23,000 members. [Phase2 upgraded institutional_archive -> PMID: 20620396 on 2026-03-18] [Verified 2026-03-18 | J Urol 2010 | content_match] Crane GM, Bloom DA. 'Ramon Guiteras: Founder of the American Urological Association, Surgeon, Sportsman and Statesman.' J Urol. 2010 Aug;184(1):447-52.","module":"05_urology","source_name":"Ramon Guiteras","target_name":"American Urological Association"},{"source":18,"target":36,"edge_type":"direct_training","start_year":1903,"end_year":1904,"temporal_range":"1903-1904","evidence_citation":"PMID: 12984268","evidence_type":"PMID","confidence":"moderate","notes":"[Phase2 downgraded from PMID: 10871146 to institutional_archive on 2026-03-17 \u2014 no PubMed source found] Homans completed early surgical training under Halsted before joining Cushing at Brigham, heavily influenced by Halsted's physiological approach. [Phase2 upgraded institutional_archive -> PMID: 12984268 on 2026-03-18] [VERIFY_NAMES: confirm Homans appears in Carter's enumeration of Halsted trainees] Carter BN. 'The fruition of Halsted's concept of surgical training.' Surgery. 1952 Sep;32(3):518-27. Carter catalogued all 17 Halsted residents and 55 assistant residents by name. [Verified 2026-03-18 | Yale Vascular History Archive & Wikipedia | Homans confirmed as training under both Halsted and Cushing at Hopkins before joining Brigham. Likely among Carter's 55 assistant residents.]","module":"01_halsted_core","source_name":"William Stewart Halsted","target_name":"John Homans"},{"source":24,"target":37,"edge_type":"governance_leadership","start_year":1905,"end_year":1930,"temporal_range":"1905-1930","evidence_citation":"Mayo_Archive_Wilson","evidence_type":"institutional_archive","confidence":"high","notes":"Wilson built the pathology laboratories at the Mayo Clinic and directed the Mayo Foundation, using this base to launch the ABMS.","module":"12_governance_societies","source_name":"Mayo Clinic Department of Surgery","target_name":"Louis B. Wilson"},{"source":29,"target":38,"edge_type":"institutional_founder","start_year":1907,"end_year":1921,"temporal_range":"1907-1921","evidence_citation":"Yale_Surgery_Archive_History","evidence_type":"institutional_archive","confidence":"high","notes":"Joseph Marshall Flint (1872-1944) became the first full-time Professor of Surgery at Yale in 1907, establishing the academic triad of patient care, education, and research that defines modern surgical departments. Flint received his MD from Johns Hopkins in 1900 (where he would have absorbed the Halstedian culture, though he trained primarily as an anatomist, not as a Halsted surgical resident), then served as professor of anatomy at the University of California (1901-1907). At Yale, he instituted a formal surgical residency based on the Halsted model \u2014 defined curriculum, graded responsibility, specified years \u2014 making Yale one of the earliest institutions outside Hopkins to adopt this training structure. He also pioneered the dog surgery course modeled on Harvey Cushing's approach at Hopkins. During World War I, Flint designed and commanded Mobile Hospital Unit No. 39 (the Yale Unit) in France, receiving the Distinguished Service Medal. He contracted the Spanish Flu during service and never fully recovered. His successor Samuel Clark Harvey (1924-1948) built the residency into a nationally recognized program. This edge creates the Yale Department of Surgery node as a Hopkins-model institutional spread, parallel to the existing edges for Minnesota (Wangensteen), Duke (Hart/Sabiston), and Michigan (Coller).","module":"02_general_surgery_spread","source_name":"Joseph Marshall Flint","target_name":"Yale University Department of Surgery"},{"source":18,"target":39,"edge_type":"direct_training","start_year":1907,"end_year":1914,"temporal_range":"1907-1914","evidence_citation":"PMID: 22365877","evidence_type":"PMID","confidence":"high","notes":"[Phase2 replaced PMID: 2446524 -> PMID: 22365877 on 2026-03-17] [Verified 2026-03-17 | J Surg Educ 2012 | content_match] Heuer served as Halsted's chief resident and later became chairman of surgery at Cornell/New York Hospital.","module":"01_halsted_core","source_name":"William Stewart Halsted","target_name":"George Heuer"},{"source":30,"target":40,"edge_type":"direct_training","start_year":1908,"end_year":1912,"temporal_range":"1908-1912","evidence_citation":"PMID: 19522575","evidence_type":"PMID","confidence":"high","notes":"[Verified 2026-03-17 | J Neurosurg 2010 | content_match] Semmes received his medical degree from Johns Hopkins in 1910, where he trained under Cushing. Semmes was a classmate of Walter Dandy (already in graph). He returned to Memphis in 1912 to become the city's first neurosurgeon and first Professor of Neurosurgery at the University of Tennessee (1932). He co-founded the Semmes-Murphey Clinic, which became the training ground for the next generation of Southern neurosurgeons.","module":"03_neurosurgery","source_name":"Harvey Cushing","target_name":"R. Eustace Semmes"},{"source":28,"target":35,"edge_type":"governance_leadership","start_year":1909,"end_year":1945,"temporal_range":"1909-1945","evidence_citation":"PMID: 12544287","evidence_type":"PMID","confidence":"high","notes":"[Verified 2026-03-17 | J Urol 2003 | content_match] Young served as AUA president in 1909 and founded the Journal of Urology in 1917, serving as its first editor-in-chief until his death in 1945. The AUA absorbed the Journal in 1921 and it became the official AUA scientific publication. The AUA eventually headquartered at Young's Baltimore estate, physically and symbolically fusing the independent Guiteras-New York origin with the Halstedian Hopkins trunk. Young is universally regarded as the Father of Modern American Urology.","module":"05_urology","source_name":"Hugh Hampton Young","target_name":"American Urological Association"},{"source":41,"target":42,"edge_type":"institutional_founder","start_year":1909,"end_year":1941,"temporal_range":"1909-1941","evidence_citation":"PMID: 10818976","evidence_type":"PMID","confidence":"high","notes":"[Verified 2026-03-17 | Clin Orthop Relat Res 2000 | content_match] Campbell opened his orthopaedic practice in Memphis in 1909 after studying in London and Vienna. He organized the Department of Orthopaedic Surgery at the University of Tennessee in 1910 and established the first orthopaedic residency program in 1924. He authored Campbell's Operative Orthopaedics (1939), which remains the definitive textbook in the field.","module":"06_orthopedics","source_name":"Willis Campbell","target_name":"Campbell Clinic"},{"source":30,"target":43,"edge_type":"direct_training","start_year":1910,"end_year":1912,"temporal_range":"1910-1912","evidence_citation":"PMID: 40212222","evidence_type":"PMID","confidence":"high","notes":"[Phase2 replaced PMID: 15007469 -> PMID: 40212222 on 2026-03-17] [Verified 2026-03-17 | Ann Med Surg (Lond) 2025 | content_match] Dandy worked in the Hunterian Laboratory under Cushing before Cushing's departure.","module":"03_neurosurgery","source_name":"Harvey Cushing","target_name":"Walter Dandy"},{"source":18,"target":44,"edge_type":"direct_training","start_year":1911,"end_year":1914,"temporal_range":"1911-1914","evidence_citation":"PMID: 10617047","evidence_type":"PMID","confidence":"high","notes":"[Phase2 replaced PMID: 13032549 -> PMID: 10617047 on 2026-03-17] [Verified 2026-03-17 | Ann Thorac Surg 1999 | content_match] Brooks trained at Hopkins under Halsted before moving to Washington University and eventually Vanderbilt.","module":"01_halsted_core","source_name":"William Stewart Halsted","target_name":"Barney Brooks"},{"source":30,"target":45,"edge_type":"institutional_founder","start_year":1912,"end_year":1932,"temporal_range":"1912-1932","evidence_citation":"PMID: 32823265","evidence_type":"PMID","confidence":"high","notes":"[Phase2 replaced PMID: 28489324 -> PMID: 32823265 on 2026-03-17] [Verified 2026-03-17 | J Neurosurg 2021 | content_match] Cushing established the first dedicated neurosurgical service at Brigham.","module":"03_neurosurgery","source_name":"Harvey Cushing","target_name":"Peter Bent Brigham Hospital Neurosurgical Program"},{"source":30,"target":46,"edge_type":"direct_training","start_year":1912,"end_year":1918,"temporal_range":"1912-1918","evidence_citation":"PMID: 12296669","evidence_type":"PMID","confidence":"high","notes":"[Verified 2026-03-17 | J Neurosurg 2002 | content_match] Howard Christian Naffziger (1884-1961) earned his MD from UC (1909), interned at UCSF, then went to Johns Hopkins in 1912 as assistant resident surgeon under Halsted's program, where he came under the direct mentorship of Harvey Cushing. He became one of Cushing's junior residents alongside Walter Dandy. In 1918, Naffziger served in France with Cushing as part of the Allied Expeditionary Force (WWI). Naffziger was already in the graph with two outgoing edges (\u2192UCSF Dept of Surgery as institutional_founder, \u2192ABNS as society_founder) but had no incoming training edge, making him a disconnected source node in the training lineage. This edge completes the chain: Halsted\u2192Cushing\u2192Naffziger\u2192UCSF, connecting the West Coast surgical establishment to the Hopkins trunk through 3 training generations. The other edges proposed in the T3-01 expansion target (Naffziger\u2192UCSF, Dunphy\u2192UCSF, Debas\u2192ASA) already exist in the graph and are not duplicated here. Citation is Keller TM, 'California's Cushing connection: Harvey Cushing trained California's first neurosurgeons,' Neurosurgery 2002;51(3):785-90.","module":"03_neurosurgery","source_name":"Harvey Cushing","target_name":"Howard Naffziger"},{"source":36,"target":47,"edge_type":"institutional_founder","start_year":1912,"end_year":1946,"temporal_range":"1912-1946","evidence_citation":"Peter_Archive_Homans","evidence_type":"institutional_archive","confidence":"moderate","notes":"[Phase2 downgraded from PMID: 10871146 to institutional_archive on 2026-03-17 \u2014 no PubMed source found] Homans established one of the first dedicated clinics for peripheral vascular disease, formally separating it from general surgical wards.","module":"04_cardiothoracic_vascular","source_name":"John Homans","target_name":"Peter Bent Brigham Peripheral Vascular Clinic"},{"source":48,"target":49,"edge_type":"direct_training","start_year":1912,"end_year":1917,"temporal_range":"1912-c. 1917","evidence_citation":"PMID: 14036574","evidence_type":"PMID","confidence":"high","notes":"Frederick Amasa Coller (1887-1964) graduated from Harvard Medical School (1912) and was appointed intern on the west surgical service at Massachusetts General Hospital. He was the first surgical resident appointed at MGH, chosen by unanimous vote of all attending surgeons. He served in WWI in France as a member of the Harvard Medical Unit led by Harvey Cushing, taking over one of the surgical services of the American Ambulance Service. After the war he joined the University of Michigan in 1920. Coller was already in the graph with two outgoing edges (\u2192Michigan Dept of Surgery as institutional_founder, \u2192Jonasson via Warren Cole) but had NO incoming training edge, making him an orphaned source node. This edge connects Michigan to the Harvard/MGH cluster through the chain MGH\u2192Coller\u2192Michigan\u2192Jonasson\u2192Ohio State, creating a 4-node institutional corridor from Boston to the Midwest. PMID upgrade candidate: PMID 14257360 (Ann R Coll Surg Engl 1965 obituary) or full text of Ann Surg 1961 supplement (PMC1466805) should confirm MGH training. [Citation upgraded from institutional_archive to PMID: 14036574 on 2026-03-18 \u2014 Adie, Ann Surg 1961;154(Suppl):18-24. Content-match confirmed: Coller first appointed intern on West Surgical Service at MGH July 1912, then surgical residency.]","module":"02_general_surgery_spread","source_name":"Massachusetts General Hospital Department of Surgery","target_name":"Frederick Coller"},{"source":18,"target":46,"edge_type":"direct_training","start_year":1912,"end_year":1914,"temporal_range":"1912-1914","evidence_citation":"PMID: 12984268","evidence_type":"PMID","confidence":"high","notes":"Naffziger served as assistant resident surgeon at Johns Hopkins under Halsted and Cushing, recognizing the superiority of the Halstedian training system before returning to build UCSF. [Phase2 upgraded institutional_archive -> PMID: 12984268 on 2026-03-18] [VERIFY_NAMES: confirm Naffziger appears in Carter's enumeration] Carter BN. 'The fruition of Halsted's concept of surgical training.' Surgery. 1952 Sep;32(3):518-27. Secondary confirmation: PMID 8692401 (Rosegay, Neurosurgery 1996) and PMID 12296669 (Keller, Neurosurgery 2001) both document Naffziger at Hopkins under Halsted/Cushing 1912-1914. [Verified 2026-03-18 | Naffziger Society history & Rosegay 1996 | Confirmed assistant resident surgeon at Hopkins under Halsted. Developed residency at UCSF modeled on Halstedian system.]","module":"01_halsted_core","source_name":"William Stewart Halsted","target_name":"Howard Naffziger"},{"source":50,"target":51,"edge_type":"governance_leadership","start_year":1913,"end_year":1930,"temporal_range":"1913-1930","evidence_citation":"ACS_Archive_Scudder","evidence_type":"institutional_archive","confidence":"high","notes":"Scudder was a foundational Fellow of the ACS, utilizing its early governance structure to help organize the specialized focus on trauma.","module":"12_governance_societies","source_name":"Charles Scudder","target_name":"American College of Surgeons"},{"source":52,"target":51,"edge_type":"governance_leadership","start_year":1913,"end_year":1918,"temporal_range":"1913-1918","evidence_citation":"PMID: 36565264","evidence_type":"PMID","confidence":"high","notes":"[Verified 2026-03-17 | Am Surg 2023 | content_match] Codman leveraged his End Result principles to help establish the ACS Hospital Standardization Program, the precursor to the Joint Commission.","module":"10_quality_outcomes","source_name":"Ernest Codman","target_name":"American College of Surgeons"},{"source":53,"target":51,"edge_type":"governance_leadership","start_year":1913,"end_year":1940,"temporal_range":"1913-1940","evidence_citation":"ACS_Archive_Lahey","evidence_type":"institutional_archive","confidence":"high","notes":"Lahey heavily leveraged his leadership standing within the ACS to establish legitimacy for the high-volume, subspecialized clinic model he pioneered.","module":"12_governance_societies","source_name":"Frank Lahey","target_name":"American College of Surgeons"},{"source":54,"target":51,"edge_type":"society_founder","start_year":1913,"end_year":1935,"temporal_range":"1913-1935","evidence_citation":"PMID: 28941450","evidence_type":"PMID","confidence":"high","notes":"[Phase2 replaced PMID: 24502913 -> PMID: 28941450 on 2026-03-17] [Verified 2026-03-17 | Bull Am Coll Surg 2016 | content_match] Martin founded the ACS as an outgrowth of the Clinical Congress to establish rigorous, standardized requirements for surgical fellowship prior to the creation of specialty boards. Citation upgraded to PMID in V4.","module":"12_governance_societies","source_name":"Franklin H. Martin","target_name":"American College of Surgeons"},{"source":52,"target":55,"edge_type":"institutional_founder","start_year":1914,"end_year":1918,"temporal_range":"1914-1918","evidence_citation":"PMID: 36565264","evidence_type":"PMID","confidence":"high","notes":"[Verified 2026-03-17 | Am Surg 2023 | content_match] Codman instituted the End Result System to systematically track patient outcomes, serving as the intellectual genesis for all modern surgical quality improvement.","module":"10_quality_outcomes","source_name":"Ernest Codman","target_name":"Massachusetts General Hospital End Result System"},{"source":30,"target":56,"edge_type":"direct_training","start_year":1914,"end_year":1920,"temporal_range":"1914-1920","evidence_citation":"HMS_Archive_Cutler","evidence_type":"institutional_archive","confidence":"high","notes":"Cutler trained under Cushing at Brigham and succeeded him as Moseley Professor of Surgery at Harvard, performing one of the earliest mitral valve operations.","module":"02_general_surgery_spread","source_name":"Harvey Cushing","target_name":"Elliott Cutler"},{"source":18,"target":57,"edge_type":"direct_training","start_year":1914,"end_year":1918,"temporal_range":"1914-1918","evidence_citation":"PMID: 27400656","evidence_type":"PMID","confidence":"high","notes":"[Phase2 replaced PMID: 2446524 -> PMID: 27400656 on 2026-03-17] [Verified 2026-03-17 | J Surg Educ 2016 | content_match] Reid served as Halsted's resident and was a key adopter of his meticulous tissue handling techniques.","module":"01_halsted_core","source_name":"William Stewart Halsted","target_name":"Mont Reid"},{"source":28,"target":58,"edge_type":"institutional_founder","start_year":1915,"end_year":1942,"temporal_range":"1915-1942","evidence_citation":"PMID: 39038727","evidence_type":"PMID","confidence":"high","notes":"[Phase2 replaced PMID: 25442801 -> PMID: 39038727 on 2026-03-17] [Verified 2026-03-17 | Urology 2024 | content_match] Young founded the Brady Urological Institute at Hopkins, establishing the first dedicated, modern residency model for urology.","module":"05_urology","source_name":"Hugh Hampton Young","target_name":"Brady Urological Institute"},{"source":23,"target":59,"edge_type":"direct_training","start_year":1915,"end_year":1919,"temporal_range":"1915-1919","evidence_citation":"Mayo_Archive_Buie","evidence_type":"institutional_archive","confidence":"high","notes":"Buie trained under Mayo before being tasked with organizing a dedicated proctology service.","module":"08_subspecialties","source_name":"William J. Mayo","target_name":"Louis A. Buie"},{"source":15,"target":60,"edge_type":"society_founder","start_year":1916,"end_year":1982,"temporal_range":"1916-1982","evidence_citation":"PMID: 27549999","evidence_type":"PMID","confidence":"high","notes":"[Verified 2026-03-17 | Ophthalmology 2016 | content_match] The American Board of Ophthalmology (ABO, originally the American Board for Ophthalmic Examinations) was founded in 1916 by three organizations: the American Ophthalmological Society, the Section on Ophthalmology of the American Medical Association, and the American Academy of Ophthalmology and Otolaryngology. It was the first specialty certifying board in the United States. The AOS is credited here as the primary society_founder because its 1913 Committee on Post-graduate Education initiated the standardization movement. The impetus was that 51% of ophthalmologists inducted into military service in World War I were found unqualified to practice their specialty. Representatives from the three founding organizations oversaw ABO certification programs from 1916 until 1982, when ABO became fully autonomous. This edge documents the prototype for the society-to-board spawning pattern that the graph tracks across surgery (ACS/ASA\u2192ABS 1937), orthopedics (AOA\u2192ABOS 1934), neurosurgery (Cushing Society\u2192ABNS 1940), and urology (AUA\u2192ABU 1935). The ABO predates all of them. End_year of 1982 reflects ABO gaining full organizational autonomy.","module":"12_governance_societies","source_name":"American Ophthalmological Society","target_name":"American Board of Ophthalmology"},{"source":20,"target":61,"edge_type":"society_founder","start_year":1917,"end_year":1958,"temporal_range":"1917-1958","evidence_citation":"PMID: 8311630","evidence_type":"PMID","confidence":"high","notes":"[Verified 2026-03-17 | Ann Thorac Surg 1994 | content_match] Chevalier Quixote Jackson (1865-1958), the 'father of American bronchoesophagoscopy,' founded the American Broncho-Esophagological Association (ABEA) in 1917. Jackson developed the instruments and techniques for safe peroral endoscopy \u2014 laryngoscopy, bronchoscopy, and esophagoscopy \u2014 and trained most of the next generation of endoscopists at clinics in Pittsburgh and Philadelphia. He held the professorship of laryngology at Jefferson Medical College (an existing graph node) from 1916 to 1930, and was additionally Professor of Bronchoesophagology at Jefferson (1924-1930), with parallel appointments at the University of Pennsylvania and Temple University. His 1915 textbook 'Peroral Endoscopy and Laryngeal Surgery' and his 1944 'Diseases of the Air and Food Passages' were definitive works. Jackson's position at Jefferson creates an implicit connection to the existing pre-Halsted Philadelphia trunk (Gross\u2192Jefferson), making Jefferson a multi-specialty convergence node for surgery and ENT. The ABEA continues to meet annually under the auspices of COSM (Combined Otolaryngology Spring Meeting).","module":"08_subspecialties","source_name":"Chevalier Jackson","target_name":"American Broncho-Esophagological Association"},{"source":62,"target":63,"edge_type":"institutional_founder","start_year":1917,"end_year":1925,"temporal_range":"1917-1925","evidence_citation":"PMID: 25858011","evidence_type":"PMID","confidence":"high","notes":"Gillies established the dedicated facial injury ward at Sidcup, effectively centralizing and founding modern plastic surgery. [Phase2 upgraded institutional_archive -> PMID: 25858011 on 2026-03-18] [Verified 2026-03-18 | J Laryngol Otol 2015 | content_match] 'Sir Harold Delf Gillies, the otolaryngologist and father of modern facial plastic surgery: review of his rhinoplasty case notes.' Documents Gillies establishing the facial injury ward at Queen's Hospital, Sidcup, founding modern plastic surgery.","module":"08_subspecialties","source_name":"Harold Gillies","target_name":"Queen's Hospital Facial Reconstruction Unit"},{"source":25,"target":64,"edge_type":"direct_training","start_year":1917,"end_year":1921,"temporal_range":"1917-1921","evidence_citation":"PMID: 12984268","evidence_type":"PMID","confidence":"high","notes":"Warfield M. Firor received his A&S degree from Johns Hopkins in 1917 and his MD in 1921, training in surgery under the Halstedian system. Halsted died in September 1922, making Firor among the last surgeons formed directly within the original Halsted program. Firor became professor of surgery at the School of Medicine and acting surgeon-in-chief of the hospital from 1939 to 1941. He was best known for pioneering work on tetanus toxin and its effect on the spinal cord. He chaired the American Board of Surgery and the Joint Conference Committee on Graduate Training in Surgery. JHU awarded him an honorary doctorate in 1980. He died in 1988 at age 91. An endowed professorship in his name is currently held at Hopkins. [Phase2 upgraded institutional_archive -> PMID: 12984268 on 2026-03-18] [VERIFY_NAMES: confirm Firor appears in Carter's enumeration] Carter BN. 'The fruition of Halsted's concept of surgical training.' Surgery. 1952 Sep;32(3):518-27. [Verified 2026-03-18 | Chesney Medical Archives portrait & JHU professorships page | Firor (MD 1921) remained at Hopkins for residencies in neurosurgery and surgery. Acting surgeon-in-chief 1939-1941. Overlapped with Halsted's final year.]","module":"01_halsted_core","source_name":"Johns Hopkins Hospital Department of Surgery","target_name":"Warfield Firor"},{"source":65,"target":62,"edge_type":"observational_study","start_year":1917,"end_year":1918,"temporal_range":"1917-1918","evidence_citation":"PMID: 10359266","evidence_type":"PMID","confidence":"high","notes":"[Verified 2026-03-17 | Plast Reconstr Surg 1999 | content_match] During WWI, Blair served as commander of the U.S. Army corps of head and neck surgeons. He traveled to other parts of Europe where he learned new concepts from Harold Gillies (already in graph) and Sir William Kelsey Fry. This wartime collaboration is the transatlantic bridge between the British plastic surgery trunk (Gillies \u2192 McIndoe, Gillies \u2192 Millard \u2192 Miami) and the American trunk (Blair \u2192 WashU \u2192 ABPS). Both men independently shaped the specialty in their respective countries, but the WWI encounter cross-pollinated techniques.","module":"08_subspecialties","source_name":"Vilray Blair","target_name":"Harold Gillies"},{"source":66,"target":67,"edge_type":"society_founder","start_year":1917,"end_year":1917,"temporal_range":"1917","evidence_citation":"Historical_Archive_Surgery","evidence_type":"institutional_archive","confidence":"moderate","notes":"[Phase2 downgraded from PMID: 21173278 to institutional_archive on 2026-03-17 \u2014 no PubMed source found] Meyer organized the founding meeting of the AATS, establishing the oldest cardiothoracic society in the world.","module":"04_cardiothoracic_vascular","source_name":"Willy Meyer","target_name":"American Association for Thoracic Surgery"},{"source":30,"target":68,"edge_type":"direct_training","start_year":1918,"end_year":1921,"temporal_range":"1918-1921","evidence_citation":"PMID: 1919711","evidence_type":"PMID","confidence":"high","notes":"[Verified 2026-03-17 | J Neurosurg 1991 | content_match] Penfield graduated from Johns Hopkins Medical School in 1918 and interned under Cushing at Peter Bent Brigham Hospital. Cushing offered him a residency, but Penfield returned to Oxford for the final year of his Rhodes Scholarship. The Cushing surgical ritual \u2014 stemming from Halsted's painstaking operative methods \u2014 played a paramount role in the origins of Penfield's own surgical technique. Penfield later practiced at Columbia Presbyterian before moving to Montreal in 1928.","module":"03_neurosurgery","source_name":"Harvey Cushing","target_name":"Wilder Penfield"},{"source":30,"target":69,"edge_type":"direct_training","start_year":1919,"end_year":1928,"temporal_range":"1919-1928","evidence_citation":"PMID: 36461823","evidence_type":"PMID","confidence":"high","notes":"[Phase2 replaced PMID: 18344917 -> PMID: 36461823 on 2026-03-17] [Verified 2026-03-17 | J Neurosurg 2023 | content_match] Bailey trained under Cushing at Brigham, co-developing tumor classification.","module":"03_neurosurgery","source_name":"Harvey Cushing","target_name":"Percival Bailey"},{"source":18,"target":70,"edge_type":"direct_training","start_year":1919,"end_year":1923,"temporal_range":"1919-1923","evidence_citation":"PMID: 27400656","evidence_type":"PMID","confidence":"high","notes":"[Phase2 replaced PMID: 4885802 -> PMID: 27400656 on 2026-03-17] [Verified 2026-03-17 | J Surg Educ 2016 | content_match] Holman was Halsted's final chief resident before Halsted's death in 1922.","module":"01_halsted_core","source_name":"William Stewart Halsted","target_name":"Emile Holman"},{"source":71,"target":72,"edge_type":"direct_training","start_year":1920,"end_year":1924,"temporal_range":"1920-1924","evidence_citation":"Harvard_Archive_Churchill","evidence_type":"institutional_archive","confidence":"moderate","notes":"[Phase2 downgraded from PMID: 15523385 to institutional_archive on 2026-03-17 \u2014 no PubMed source found] Edward Delos Churchill (1895-1972) graduated from Harvard Medical School cum laude in 1920 and completed his surgical internship and residency at Massachusetts General Hospital under Edward P. Richardson, the John Homans Professor of Surgery and Chief of the West Surgical Service. Churchill continued at MGH as an associate surgeon after residency completion in 1924. He studied in Europe on a Moseley Traveling Fellowship (1926-1927) in Copenhagen, Munich, and Berlin. He returned to MGH in 1927 under Richardson. Richardson sustained an incapacitating stroke in 1930, and Churchill succeeded him as John Homans Professor in 1931. Churchill was NOT trained by Harvey Cushing \u2014 Cushing was at Peter Bent Brigham Hospital, a separate Harvard-affiliated institution. The previous edge incorrectly listed Cushing as Churchill's trainer. Sources: Grillo HC. Edward D. Churchill and the rectangular surgical residency. Surgery. 2004;136(5):947-952. Wright CD. Historical perspectives of the AATS: Edward D. Churchill (1895-1972). J Thorac Cardiovasc Surg. 2012. CORRECTED IN V4: Previously listed as Cushing\u2192Churchill. Richardson was the actual training mentor.","module":"02_general_surgery_spread","source_name":"Edward P. Richardson","target_name":"Edward Churchill"},{"source":30,"target":73,"edge_type":"direct_training","start_year":1920,"end_year":1923,"temporal_range":"c. 1920-1923","evidence_citation":"Emory_Archive_Elkin_FindingAid","evidence_type":"institutional_archive","confidence":"high","notes":"Daniel Collier Elkin (1893-1958) graduated from Emory University School of Medicine (1920), then served three years as intern and resident in surgery at Peter Bent Brigham Hospital in Boston under Harvey Cushing. The Emory archival finding aid states: 'Elkin served three years as an intern and resident in surgery at the Peter Bent Brigham Hospital in Boston, where he worked with Dr. Harvey W. Cushing, a pioneer of brain surgery who is often referred to as the father of modern neurosurgery. Cushing was an influential figure who shaped Elkin's interest in teaching and research.' Elkin returned to Atlanta and was appointed first chair of surgery at Emory in 1930 (existing edge in graph). He was a pioneer in vascular surgery (62 aortic aneurysm repairs by 1934, Rudolph Matas Award 1940) and served as president of ASA, ACS (1956-57), Southern Surgical Association, and multiple other societies. He co-authored the history of vascular surgery in WWII with DeBakey. This edge connects the orphaned Emory chain to the Hopkins trunk: Halsted\u2192Cushing\u2192Elkin\u2192Emory. Cushing's out-degree increases (now: Cutler, Naffziger, Elkin). PMID upgrade candidate: search for Elkin obituary in Ann Surg or Surgery c. 1959.","module":"02_general_surgery_spread","source_name":"Harvey Cushing","target_name":"Daniel Elkin"},{"source":30,"target":74,"edge_type":"society_founder","start_year":1920,"end_year":1932,"temporal_range":"1920-1932","evidence_citation":"PMID: 33307257","evidence_type":"PMID","confidence":"high","notes":"On March 19, 1920, five months after the ACS formally recognized neurosurgery as a specialty, Cushing hosted 11 surgeons at Peter Bent Brigham Hospital to form the Society of Neurological Surgeons \u2014 the first neurosurgical society in the world. Co-founders included Ernest Sachs, Alfred Adson, Charles Frazier, Gilbert Horrax, and Samuel Harvey. Walter Dandy was invited but declined due to strained relationships with Cushing and Frazier. [Phase2 upgraded institutional_archive -> PMID: 33307257 on 2026-03-18] [Verified 2026-03-18 | World Neurosurg 2021 | content_match] Cohen-Gadol AA, et al. 'The Original Cushing Society: A Historical Review of the Senior Society's First 6 Meetings.' World Neurosurg. 2021 Mar;147:e457-e464. States 'The Society of Neurological Surgeons (SNS) was ultimately founded in 1920 by Dr. Harvey Cushing.' Documents founding members, first meeting at Peter Bent Brigham Hospital, Cushing as first president.","module":"03_neurosurgery","source_name":"Harvey Cushing","target_name":"Society of Neurological Surgeons"},{"source":25,"target":75,"edge_type":"direct_training","start_year":1920,"end_year":1925,"temporal_range":"1920-1925","evidence_citation":"PMID: 12984268","evidence_type":"PMID","confidence":"high","notes":"Hart trained at Hopkins under Halsted's system and was recruited to Duke as the founding chairman of surgery. [Phase2 upgraded institutional_archive -> PMID: 12984268 on 2026-03-18] [VERIFY_NAMES: confirm Hart appears in Carter's enumeration] Carter BN. 'The fruition of Halsted's concept of surgical training.' Surgery. 1952 Sep;32(3):518-27. Secondary confirmation: PMC7828946 (Wright & Schachar, Can J Surg 2020) cites Hart as 'a former Halsted resident' referencing Carter. [Verified 2026-03-18 | PMC7828946 (Wright 2020, Can J Surg) | Explicitly identified as \"a former Halsted resident.\" Published on surgical residency history (N C Med J 1964).]","module":"01_halsted_core","source_name":"Johns Hopkins Hospital Department of Surgery","target_name":"J. Deryl Hart"},{"source":65,"target":76,"edge_type":"direct_training","start_year":1920,"end_year":1930,"temporal_range":"c.1920-c.1930","evidence_citation":"PMID: 37601473","evidence_type":"PMID","confidence":"high","notes":"[Verified 2026-03-17 | Ann Surg Open 2023 | content_match] James Barrett Brown (1899-1971) trained under Vilray Blair at Washington University beginning in the 1920s and was regarded as Blair's most important trainee. Bharani and Yeo (Ann Surg Open 2023, PMID 37601473) describe Brown as 'a disciple of Blair' who took over leadership in wartime plastic surgery during WWII. Brown succeeded Blair as chief of the WashU Division of Plastic and Reconstructive Surgery (1955-1968). Together, Blair and Brown published the first reproducible cleft lip repair technique (1929), developed the split-thickness skin grafting technique still in use today, and provided the clinical foundation for ABPS board standards. Brown served as U.S. Army Chief Consultant in Plastic Surgery during WWII and established multiple plastic surgery centers in Europe. Stelnicki et al (Plast Reconstr Surg 1999, PMID 10359266) survey Blair's surgical descendants comprehensively. This edge extends the WashU plastic surgery lineage to a second generation.","module":"08_subspecialties","source_name":"Vilray Blair","target_name":"James Barrett Brown"},{"source":77,"target":78,"edge_type":"institutional_founder","start_year":1921,"end_year":1946,"temporal_range":"1921-1946","evidence_citation":"PMID: 37941365","evidence_type":"PMID","confidence":"high","notes":"[Verified 2026-03-17 | J Med Biogr 2025 | content_match] Whipple was appointed Professor of Surgery and Director of Surgical Services at Columbia-Presbyterian in 1921 at age 39, serving as chairman for 25 years. He was the first Valentine Mott Professor of Surgery (1931). He built the modern department, expanding residency training, pioneering the pancreaticoduodenectomy (1935), and introducing multidisciplinary teams and prospective data collection. Columbia P&S represents an independent New York surgical trunk \u2014 Whipple was not Halsted-trained.","module":"02_general_surgery_spread","source_name":"Allen O. Whipple","target_name":"Columbia University Department of Surgery"},{"source":50,"target":79,"edge_type":"institutional_founder","start_year":1922,"end_year":1933,"temporal_range":"1922-1933","evidence_citation":"ACS_COT_100th_Anniversary","evidence_type":"institutional_archive","confidence":"high","notes":"In 1922, Scudder organized a conference of 26 prominent surgeons at MGH to standardize fracture treatment. The ACS Board of Regents then established the Committee on Fractures with Scudder as first chair (1922-1933). The committee expanded to the Committee on Fractures and Other Trauma (1939), then was renamed the Committee on Trauma (1949). Today the ACS COT oversees 3,500+ Fellows, runs the trauma center verification program, ATLS, and TQIP (already in graph). Scudder also initiated the annual Oration on Fractures (1929), now the Scudder Oration on Trauma \u2014 one of the highest honors in trauma surgery.","module":"09_trauma_acute_infection","source_name":"Charles Scudder","target_name":"ACS Committee on Trauma"},{"source":25,"target":80,"edge_type":"direct_training","start_year":1922,"end_year":1925,"temporal_range":"1922-1925","evidence_citation":"PMID: 31944636","evidence_type":"PMID","confidence":"high","notes":"[Verified 2026-03-17 | Can J Surg 2020 | content_match] Blalock trained directly under the Halstedian system at Hopkins before returning as Chief of Surgery to perform the first blue baby operation.","module":"01_halsted_core","source_name":"Johns Hopkins Hospital Department of Surgery","target_name":"Alfred Blalock"},{"source":25,"target":81,"edge_type":"direct_training","start_year":1922,"end_year":1926,"temporal_range":"1922-1926","evidence_citation":"JHM_Archive_Blakemore","evidence_type":"institutional_archive","confidence":"high","notes":"Blakemore trained at Hopkins (1922-1926) before establishing the Columbia vascular lineage. Training dates begin year of Halsted's death; likely trained under post-Halsted leadership. Carter 1952 (PMID 12984268) covers Halsted appointees only \u2014 cannot confirm Blakemore is named. Reverted from PMID to institutional_archive 2026-03-18.","module":"01_halsted_core","source_name":"Johns Hopkins Hospital Department of Surgery","target_name":"Arthur Blakemore"},{"source":57,"target":82,"edge_type":"institutional_founder","start_year":1922,"end_year":1943,"temporal_range":"1922-1943","evidence_citation":"PMID: 12984268","evidence_type":"PMID","confidence":"high","notes":"Reid reorganized the department, formally importing the Halstedian residency model to the Midwest. [Phase2 upgraded institutional_archive -> PMID: 12984268 on 2026-03-18] [Verified 2026-03-18 | Surgery 1952 | content_match] Carter BN. 'The fruition of Halsted's concept of surgical training.' Carter was himself a Cincinnati trainee and documents the Halsted->Heuer->Reid lineage at Cincinnati. PMC7828946 confirms Reid accompanied Heuer to Cincinnati in 1922.","module":"02_general_surgery_spread","source_name":"Mont Reid","target_name":"University of Cincinnati Department of Surgery"},{"source":53,"target":83,"edge_type":"institutional_founder","start_year":1923,"end_year":1953,"temporal_range":"1923-1953","evidence_citation":"Lahey_Archive_Founder","evidence_type":"institutional_archive","confidence":"high","notes":"Lahey founded the clinic with a massive early volume in thyroidectomies, establishing one of the first high-volume endocrine surgical centers.","module":"12_governance_societies","source_name":"Frank Lahey","target_name":"Lahey Clinic"},{"source":84,"target":85,"edge_type":"programmatic_accreditation","start_year":1924,"end_year":2026,"temporal_range":"1924-Present","evidence_citation":"ABOHNS_Archive_ABMS","evidence_type":"institutional_archive","confidence":"high","notes":"The American Board of Otolaryngology (ABOto) was founded and incorporated in 1924, the second specialty certifying body established after the American Board of Ophthalmology (1916). At the initiative of the Triological Society in 1912, the proposal for standardized post-graduate certification was published in The Laryngoscope in 1913. The ABOHNS is a founding member board of ABMS (established 1933) and confirmed as one of 24 current ABMS member boards on the ABMS website. This edge follows the identical pattern of existing board-ABMS edges (ABS, ABOS, ABNS, ABCRS, ABPS). BRIDGE EDGE: Merges the ABO-HNS/Triological island (Component 7, 2 nodes) into the main component via the ABMS governance backbone.","module":"12_governance_societies","source_name":"American Board of Otolaryngology-Head and Neck Surgery","target_name":"American Board of Medical Specialties"},{"source":59,"target":86,"edge_type":"institutional_founder","start_year":1924,"end_year":1952,"temporal_range":"1924-1952","evidence_citation":"PMID: 38441192","evidence_type":"PMID","confidence":"high","notes":"[Phase2 replaced PMID: 12150380 -> PMID: 38441192 on 2026-03-17] [Verified 2026-03-17 | Dis Colon Rectum 2024 | content_match] Buie established the Section of Proctology at the Mayo Clinic, formalizing the institutional subspecialty.","module":"08_subspecialties","source_name":"Louis A. Buie","target_name":"Mayo Clinic Section of Proctology"},{"source":24,"target":87,"edge_type":"direct_training","start_year":1924,"end_year":1927,"temporal_range":"1924-1927","evidence_citation":"PMID: 17275843","evidence_type":"PMID","confidence":"high","notes":"[Verified 2026-03-17 | J Surg Res 2007 | content_match] Wangensteen completed a crucial fellowship at the Mayo Clinic, importing their systematic approach back to Minnesota to build his own dynasty.","module":"02_general_surgery_spread","source_name":"Mayo Clinic Department of Surgery","target_name":"Owen Wangensteen"},{"source":88,"target":84,"edge_type":"society_founder","start_year":1924,"end_year":1933,"temporal_range":"1924-1933","evidence_citation":"ABOHNS_Archive_History","evidence_type":"institutional_archive","confidence":"high","notes":"The American Board of Otolaryngology (ABOto) was founded and incorporated in 1924, the second specialty certifying board in the United States after the American Board of Ophthalmology (1916). The initiative originated at the 1912 meeting of the Triological Society (formally the American Laryngological, Rhinological, and Otological Society), where Dr. Wishart proposed a standardized period of postgraduate education with certification. The ABOto was co-founded by representatives from the Triological Society, the American Academy of Ophthalmology and Otolaryngology, and the AMA Section on Otolaryngology. ABOto was a founding member of the American Board of Medical Specialties (ABMS) in 1933. The board was renamed the American Board of Otolaryngology-Head and Neck Surgery (ABOHNS) in 2018. This edge follows the established society-to-board spawning pattern documented throughout the graph (AOA\u2192ABOS 1934, ACS/ASA\u2192ABS 1937, Cushing Society\u2192ABNS 1940), but predates all of them \u2014 ABOto is the oldest surgical board. End_year of 1933 reflects the formalization of ABOto's role as a founding ABMS member.","module":"08_subspecialties","source_name":"Triological Society","target_name":"American Board of Otolaryngology-Head and Neck Surgery"},{"source":44,"target":89,"edge_type":"institutional_founder","start_year":1925,"end_year":1952,"temporal_range":"1925-1952","evidence_citation":"VUMC_Archive_Brooks","evidence_type":"institutional_archive","confidence":"high","notes":"Brooks established Vanderbilt's surgical residency program modeled entirely on the Hopkins system.","module":"02_general_surgery_spread","source_name":"Barney Brooks","target_name":"Vanderbilt University Department of Surgery"},{"source":90,"target":91,"edge_type":"institutional_founder","start_year":1925,"end_year":1947,"temporal_range":"1925-1947","evidence_citation":"UChicago_Surgery_History","evidence_type":"institutional_archive","confidence":"high","notes":"Phemister was the first full-time professor and chairman of surgery at the University of Chicago, serving from 1925 to 1947. Rush Medical College MD 1904 with postgraduate study in Europe \u2014 NOT Halsted-trained. He built the department on the principle that no faculty member should teach unless actively engaged in research. ASA president 1938, ACS president. He recruited Percival Bailey (Cushing trainee, already in graph) to head neurosurgery in 1928 and invited Charles Huggins to join the faculty in 1927. Huggins went on to win the Nobel Prize in 1966 for hormonal cancer therapy.","module":"02_general_surgery_spread","source_name":"Dallas Phemister","target_name":"University of Chicago Department of Surgery"},{"source":70,"target":92,"edge_type":"institutional_founder","start_year":1925,"end_year":1955,"temporal_range":"1925-1955","evidence_citation":"PMID: 26811046","evidence_type":"PMID","confidence":"high","notes":"[Verified 2026-03-17 | Semin Thorac Cardiovasc Surg 2015 | content_match] CITATION UPGRADE: Replaces Stanford_Archive_Holman. Woo YJ, Reitz BA, 'One Hundred Years of History at Stanford U
