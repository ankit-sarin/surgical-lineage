rt_year":1995,"end_year":1996,"temporal_range":"1995-1996","evidence_citation":"ASBrS_Archive_Founders","evidence_type":"institutional_archive","confidence":"high","notes":"Zannis organized the founding of ASBrS to provide a dedicated governance and advocacy platform for surgeons specializing exclusively in breast care.","module":"07_oncology_trials","source_name":"Victor Zannis","target_name":"American Society of Breast Surgeons"},{"source":255,"target":139,"edge_type":"governance_leadership","start_year":1996,"end_year":2010,"temporal_range":"1996-2010","evidence_citation":"institutional_archive","evidence_type":"institutional_archive","confidence":"high","notes":"Callender served as Chair of the Department of Surgery at Howard University College of Medicine. He also founded the Howard University Hospital Transplant Center in 1974 \u2014 the first minority-directed transplant program in the US. CANDIDATE FOR PMID UPGRADE: search for Callender Howard transplant J Natl Med Assoc.","module":"02_general_surgery_spread","source_name":"Clive Callender","target_name":"Howard University Department of Surgery"},{"source":250,"target":136,"edge_type":"governance_leadership","start_year":1997,"end_year":1998,"temporal_range":"c.1997-c.1998","evidence_citation":"PMID: 18286472","evidence_type":"PMID","confidence":"moderate","notes":"[Verified 2026-03-17 | J Surg Oncol 2008 | content_match] Brennan served as president of the Society of Surgical Oncology. The J Surg Oncol tribute issue (2008, PMID 18286472) and the ACS profile confirm this presidency. The SSO is already in the graph via Memorial Hospital->SSO (institutional_founder in 07_oncology_trials) and SSO->ABS (programmatic_accreditation). Exact presidency years approximated; the ACS and MSK India profiles list SSO presidency without specifying dates. Confidence moderate due to estimated dates. This edge creates a second pathway from MSK to the SSO governance backbone: the existing Memorial Hospital->SSO founding edge is now paralleled by Brennan->SSO presidential leadership.","module":"07_oncology_trials","source_name":"Murray F. Brennan","target_name":"Society of Surgical Oncology"},{"source":51,"target":302,"edge_type":"institutional_founder","start_year":1998,"end_year":2011,"temporal_range":"1998-2011","evidence_citation":"College_Archive","evidence_type":"institutional_archive","confidence":"moderate","notes":"[Phase2 downgraded from PMID: 10452656 to institutional_archive on 2026-03-17 \u2014 no PubMed source found] The ACS founded ACOSOG to specifically evaluate the surgical management of solid tumors through prospective, multi-institutional clinical trials.","module":"07_oncology_trials","source_name":"American College of Surgeons","target_name":"American College of Surgeons Oncology Group"},{"source":190,"target":303,"edge_type":"institutional_succession","start_year":1998,"end_year":2026,"temporal_range":"1998-Present","evidence_citation":"AHNS_Archive_Merger","evidence_type":"institutional_archive","confidence":"high","notes":"In 1998, the Society of Head and Neck Surgeons (SHNS, founded 1954 by Hayes Martin, general surgeons) and the American Society for Head and Neck Surgery (ASHNS, founded 1958 by John Conley, otolaryngologists) merged to form the American Head and Neck Society (AHNS). The merger discussions began as early as 1960 but required nearly four decades to achieve, with formal negotiations intensifying after the 1996 International Conference on Head and Neck Cancer in Toronto. The first co-presidents were Ashok Shaha and K. Thomas Robbins. This is a convergence node pattern paralleling the NRG Oncology merger (GOG + NSABP + RTOG, 2012) already in the graph, though the AHNS merger involved two societies from different parent specialties converging on a shared anatomic domain, rather than trial networks merging under NCI reorganization. Only the SHNS\u2192AHNS edge is included here; the ASHNS\u2192AHNS edge is omitted to keep the graph focused on the primary surgical lineage (Martin/general surgery) rather than the otolaryngology branch.","module":"08_subspecialties","source_name":"Society of Head and Neck Surgeons","target_name":"American Head and Neck Society"},{"source":136,"target":123,"edge_type":"programmatic_accreditation","start_year":1998,"end_year":2015,"temporal_range":"1998-2015","evidence_citation":"PMID: 35430661","evidence_type":"PMID","confidence":"high","notes":"[Verified 2026-03-17 | Ann Surg Oncol 2022 | content_match] Tyler D. '2022 SSO Presidential Address: What is a Surgical Oncologist? Evolution of Surgical Oncology and the Society of Surgical Oncology in an Era of Hyperspecialization.' Ann Surg Oncol. 2022;29(7):4005-13. PMC9013271. Documents the SSO's multi-decade campaign for board certification in surgical oncology: the SSO created the Surgical Oncology Advisory Council (SOAC) with the ABS in 1998, which became the pathway to the ABS Certificate in Complex General Surgical Oncology (CGSO) approved by ABMS in 2011. First board-certified surgical oncologists were certified in 2015. The 1998 SOAC establishment is the discrete founding event \u2014 SSO and ABS formalized their accreditation relationship to create a subspecialty certification pathway. This parallels the FLS\u2192ABS (2009) edge pattern where a society's program becomes mandatory for ABS certification. It also strengthens the SSO node (currently degree 1, only the James Ewing Society succession edge) and connects it to the ABS governance hub.","module":"07_oncology_trials","source_name":"Society of Surgical Oncology","target_name":"American Board of Surgery"},{"source":304,"target":287,"edge_type":"observational_study","start_year":2000,"end_year":2010,"temporal_range":"2000-2010","evidence_citation":"SOC_Archive_Dartmouth","evidence_type":"institutional_archive","confidence":"moderate","notes":"Flum's surgical outcomes research methodology was heavily influenced by Wennberg's practice variation framework at Dartmouth, creating the intellectual bridge between epidemiologic outcomes science and clinical surgical quality programs.","module":"10_quality_outcomes","source_name":"David Flum","target_name":"The Dartmouth Institute for Health Policy and Clinical Practice"},{"source":215,"target":19,"edge_type":"governance_leadership","start_year":2000,"end_year":2001,"temporal_range":"2000-2001","evidence_citation":"PMID: 29189382","evidence_type":"PMID","confidence":"high","notes":"[Verified 2026-03-17 | Ann Surg 2018 | content_match] Cameron served as ASA president, directly extending the Halsted-Blalock-Hopkins lineage into 21st-century ASA governance. Citation upgraded to PMID in V4.","module":"12_governance_societies","source_name":"John L. Cameron","target_name":"American Surgical Association"},{"source":250,"target":19,"edge_type":"governance_leadership","start_year":2000,"end_year":2001,"temporal_range":"c.2000-c.2001","evidence_citation":"MSK_Archive_Brennan","evidence_type":"institutional_archive","confidence":"moderate","notes":"Brennan served as president of the American Surgical Association. The ACS profile and MSK India page list ASA presidency among his leadership positions. Exact years approximated. The ASA presidency connects Brennan to the ASA governance hub alongside Gross (founder), Sabiston, Rhoads, and other major figures. Brennan's ASA presidency makes him the highest-profile surgical oncologist to lead the ASA, reinforcing the growing integration of oncologic surgery into mainstream academic surgery governance by the turn of the millennium.","module":"12_governance_societies","source_name":"Murray F. Brennan","target_name":"American Surgical Association"},{"source":282,"target":19,"edge_type":"governance_leadership","start_year":2001,"end_year":2002,"temporal_range":"2001-2002","evidence_citation":"PMID: 12192312","evidence_type":"PMID","confidence":"moderate","notes":"[Phase2 downgraded from PMID: 12192325 to institutional_archive on 2026-03-17 \u2014 no PubMed source found] Debas HT. 'Surgery: A Noble Profession in a Changing World.' Ann Surg. 2002 Sep;236(3):263-269. PMC1422579. Published ASA presidential address for the 2001-2002 term. Debas discusses surgery as a profession, declining interest among medical students, and the growing importance of global health. This edge connects Debas to the ASA governance hub \u2014 the same high-degree node where Wangensteen, Sabiston, Bahnson, Najarian, and Cameron already have governance edges. Debas was also ACS president (Northern California chapter) and ASA president, creating a West Coast\u2192ASA governance bridge paralleling the existing East Coast dominance. [Citation upgraded from institutional_archive to PMID: 12192312 on 2026-03-18 \u2014 Debas, Ann Surg 2002;236:263-269. Content-match confirmed: ASA presidential address, first minority president.]","module":"12_governance_societies","source_name":"Haile T. Debas","target_name":"American Surgical Association"},{"source":305,"target":306,"edge_type":"society_founder","start_year":2001,"end_year":2010,"temporal_range":"2001-2010","evidence_citation":"Historical_Archive_Group","evidence_type":"institutional_archive","confidence":"moderate","notes":"[Phase2 downgraded from PMID: 9122554 to institutional_archive on 2026-03-17 \u2014 no PubMed source found] Kehlet founded the study group based on his pioneering research into multimodal surgical rehabilitation, challenging traditional perioperative dogma.","module":"10_quality_outcomes","source_name":"Henrik Kehlet","target_name":"ERAS Study Group"},{"source":265,"target":307,"edge_type":"programmatic_accreditation","start_year":2002,"end_year":2006,"temporal_range":"2002-2006","evidence_citation":"PMID: 17120942","evidence_type":"PMID","confidence":"moderate","notes":"[Verified 2026-03-17 | Am Surg 2006 | content_match] The SIS, along with the CDC and CMS, provided the scientific evidence base and clinical practice guidelines underpinning the Surgical Infection Prevention Project (2002) and its successor SCIP (2006). SIS members authored the foundational studies on antibiotic prophylaxis timing, selection, and duration that became SIP/SCIP process measures. The ACS Manual on Control of Infection in Surgical Patients, which Altemeier co-edited, was a direct precursor. Edge type 'programmatic_accreditation' captures the scientific endorsement relationship between the academic society and the federal quality initiative.","module":"09_trauma_acute_infection","source_name":"Surgical Infection Society","target_name":"Surgical Infection Prevention Project"},{"source":253,"target":51,"edge_type":"governance_leadership","start_year":2003,"end_year":2004,"temporal_range":"2003-2004","evidence_citation":"ACS_Archive_Organ_Presidency","evidence_type":"institutional_archive","confidence":"high","notes":"Claude H. Organ Jr. (1926-2005) served as the 84th president of the American College of Surgeons (2003-2004), the second African American to hold this position after LaSalle D. Leffall Jr. (1995, already in graph). Organ earned his MD from Creighton University (1952), completed residency at Creighton, and became the first African American to chair a surgery department at a predominantly white medical school (Creighton, 1971-1982). He later established the UCSF East Bay Surgery Residency Program (1989-2003) and served as editor-in-chief of Archives of Surgery (1989-2004). He co-founded the Society of Black Academic Surgeons (1989) and authored 'A Century of Black Surgeons: The U.S.A. Experience.' He also served as chairman of the American Board of Surgery. This edge extends the URM governance chain: Leffall\u2192ACS (1995) is already in the graph; Organ\u2192ACS (2003) adds the second data point. Organ is a new node connecting to the ACS governance hub. PMID upgrade candidate: search for PMID of JAMA Surgery Nov 2005 tribute articles.","module":"12_governance_societies","source_name":"Claude H. Organ Jr.","target_name":"American College of Surgeons"},{"source":308,"target":25,"edge_type":"governance_leadership","start_year":2003,"end_year":2014,"temporal_range":"2003-2014","evidence_citation":"PMID: 19099052","evidence_type":"PMID","confidence":"high","notes":"[Phase2 reviewed \u2014 citation retained on 2026-03-17] Julie Ann Freischlag (b. 1954) became the William Stewart Halsted Professor, Director of the Department of Surgery, and Surgeon-in-Chief at The Johns Hopkins Hospital in March 2003, succeeding John L. Cameron. She was the first woman and only the seventh person to hold these posts (after Halsted, Finney, Blalock, Zuidema, Cameron, and herself \u2014 the sixth director, not the sixth person, as some sources vary on the count of acting chiefs). Rush Medical College MD 1980, general surgery residency and vascular fellowship at UCLA. Previously chief of vascular surgery at UCLA (1998-2003). At Hopkins, she created the Center for Surgical Trials and Outcomes Research (CSTOR), improved patient safety systems, and advanced faculty diversity. She also served as editor of JAMA Surgery (2005-2014). Left Hopkins in 2014 to become vice chancellor at UC Davis, then CEO of Wake Forest Baptist Medical Center (2017). Elected to the National Academy of Medicine 2015. ACS Board of Regents Chair 2012, ACS President 2018-2019. Society for Vascular Surgery president (first woman). Source: Freischlag JA. Women surgeons \u2014 still in a male-dominated world. Yale J Biol Med. 2008;81(4):203-204. Written from her Hopkins Halsted Professorship. Ghost node 'Julie Freischlag' mentioned in notes fields of Patricia Numann edges now converted to real person node.","module":"02_general_surgery_spread","source_name":"Julie Ann Freischlag","target_name":"Johns Hopkins Hospital Department of Surgery"},{"source":51,"target":309,"edge_type":"institutional_founder","start_year":2004,"end_year":2026,"temporal_range":"2004-Present","evidence_citation":"ACS_Archive_NSQIP_Governance","evidence_type":"institutional_archive","confidence":"high","notes":"The ACS established the infrastructure to house and govern the private-sector expansion of NSQIP, standardizing clinical data collection globally.","module":"10_quality_outcomes","source_name":"American College of Surgeons","target_name":"ACS National Surgical Quality Improvement Program"},{"source":279,"target":130,"edge_type":"governance_leadership","start_year":2004,"end_year":2005,"temporal_range":"2004-2005","evidence_citation":"institutional_archive","evidence_type":"institutional_archive","confidence":"high","notes":"AAST Past Presidents list documents Schwab as AAST president (2004-2005). He served as president during the critical period when the AAST was developing the Acute Care Surgery fellowship paradigm (2003 joint committee formation \u2192 2005 ACS Committee creation \u2192 2008 first fellowship approval). This edge connects Schwab's EAST founding role (1986, already in graph) to the AAST governance hub, bridging the two major US trauma societies through a single person. Schwab is also past president of EAST (already in graph as society_founder) and past president of the International Association for Trauma Surgery and Intensive Care. Penn Trauma website and ACS 2024 award confirm his AAST presidency. No PMID found for a published AAST presidential address \u2014 AAST addresses are published in J Trauma and Acute Care Surgery but Schwab's specific address PMID could not be confirmed.","module":"09_trauma_acute_infection","source_name":"C. William Schwab","target_name":"American Association for the Surgery of Trauma"},{"source":310,"target":309,"edge_type":"governance_leadership","start_year":2004,"end_year":2026,"temporal_range":"2004-Present","evidence_citation":"ACS_Archive_Ko","evidence_type":"institutional_archive","confidence":"high","notes":"Ko directed the deployment and refinement of ACS NSQIP, architecting its role as the definitive standard for surgical risk adjustment in civilian hospitals.","module":"10_quality_outcomes","source_name":"Clifford Ko","target_name":"ACS National Surgical Quality Improvement Program"},{"source":267,"target":311,"edge_type":"institutional_founder","start_year":2004,"end_year":null,"temporal_range":"2004-present","evidence_citation":"SAGES_FLS_Program","evidence_type":"institutional_archive","confidence":"high","notes":"SAGES developed and launched the Fundamentals of Laparoscopic Surgery (FLS) program in 2004 as a comprehensive educational and assessment tool for basic laparoscopic skills. The FLS committee was originally formed by SAGES in 1990 to develop educational materials. The program incorporated the McGill Inanimate System for Training and Evaluation of Laparoscopic Skills (MISTELS) as its manual skills component. ACS joined SAGES in 2005 as a joint educational partner. FLS is designed to be non-procedure-specific and applicable across all surgical specialties using laparoscopy. Since 2004, over 13,000 surgeons have successfully completed the FLS examination. FLS became the first simulation-based assessment tool mandated for board certification in any surgical specialty \u2014 a paradigm shift in surgical education from time-based to competency-based training.","module":"10_quality_outcomes","source_name":"Society of American Gastrointestinal and Endoscopic Surgeons","target_name":"Fundamentals of Laparoscopic Surgery"},{"source":293,"target":309,"edge_type":"institutional_succession","start_year":2004,"end_year":2026,"temporal_range":"2004-Present","evidence_citation":"ACS_Archive","evidence_type":"institutional_archive","confidence":"moderate","notes":"[Phase2 downgraded from PMID: 18650631 to institutional_archive on 2026-03-17 \u2014 no PubMed source found] The methodology developed within the VA system was successfully transitioned and scaled into the private sector under the governance of the American College of Surgeons.","module":"10_quality_outcomes","source_name":"VA National Surgical Quality Improvement Program","target_name":"ACS National Surgical Quality Improvement Program"},{"source":294,"target":19,"edge_type":"governance_leadership","start_year":2005,"end_year":2006,"temporal_range":"2005-2006","evidence_citation":"ASA_Past_Presidents_Registry","evidence_type":"institutional_archive","confidence":"high","notes":"Pellegrini served as president of the American Surgical Association in 2005. Confirmed by the ASA Past Presidents registry (americansurgical.org). He was also the 94th president of the American College of Surgeons (installed October 2013). Additionally served as president of the Society of Surgical Chairs and was a director of the American Board of Surgery. Awarded the French Legion of Honor. CANDIDATE FOR PMID UPGRADE: search for Pellegrini ASA presidential address in Ann Surg 2005 or 2006.","module":"12_governance_societies","source_name":"Carlos A. Pellegrini","target_name":"American Surgical Association"},{"source":304,"target":312,"edge_type":"society_founder","start_year":2005,"end_year":2015,"temporal_range":"2005-2015","evidence_citation":"SOC_Archive_Founders","evidence_type":"institutional_archive","confidence":"high","notes":"Flum drove the formation of the SOC to establish a dedicated academic society supporting the methodology and dissemination of surgical health services research.","module":"10_quality_outcomes","source_name":"David Flum","target_name":"Surgical Outcomes Club"},{"source":304,"target":309,"edge_type":"governance_leadership","start_year":2005,"end_year":2015,"temporal_range":"2005-2015","evidence_citation":"ACS_Archive_Flum","evidence_type":"institutional_archive","confidence":"high","notes":"Flum integrated his outcomes science expertise into the ongoing development of ACS NSQIP and SCOAP, solidifying the bridge between academic societies and data registries.","module":"10_quality_outcomes","source_name":"David Flum","target_name":"ACS National Surgical Quality Improvement Program"},{"source":291,"target":123,"edge_type":"governance_leadership","start_year":2005,"end_year":2010,"temporal_range":"2005-2010","evidence_citation":"PMID: 31061933","evidence_type":"PMID","confidence":"moderate","notes":"[Phase2 downgraded from PMID: 31003229 to institutional_archive on 2026-03-17 \u2014 no PubMed source found] Ponsky JL. 'Jeffrey L. Ponsky, MD, FACS.' VideoGIE. 2019 May;4(5):189-191. PMC6494182. Documents Ponsky as 'Director and Chairman of the American Board of Surgery.' He also served as SAGES president (already in graph as society_founder) and Vice President of the American Surgical Association. Ponsky trained at Case Western Reserve (medical school 1971, residency at University Hospitals Cleveland 1971-1976) and invented PEG (percutaneous endoscopic gastrostomy) in 1979 with Michael Gauderer. This edge is the single most important structural bridge between the MIS module and the graph backbone. ABS connects to ABMS (programmatic_accreditation, already in graph) and through it to the entire accreditation apparatus. Ponsky's ABS chairmanship means the co-inventor of PEG and co-founder of SAGES reached the top of the certification hierarchy for all general surgery. Ponsky goes from degree 1 to degree 2. [Citation upgraded from institutional_archive to PMID: 31061933 on 2026-03-18 \u2014 VideoGIE 2019;4:187-189. Content-match confirmed: Ponsky served as Director and Chairman of the American Board of Surgery.]","module":"12_governance_societies","source_name":"Jeffrey Ponsky","target_name":"American Board of Surgery"},{"source":215,"target":51,"edge_type":"governance_leadership","start_year":2005,"end_year":2006,"temporal_range":"2005-2006","evidence_citation":"PMID: 29189382","evidence_type":"PMID","confidence":"high","notes":"[Verified 2026-03-17 | Ann Surg 2018 | content_match] Cameron served as ACS president, directly extending the Halsted \u2192 Blalock \u2192 Hopkins surgical lineage into 21st-century governance. Citation upgraded to PMID in V4.","module":"12_governance_societies","source_name":"John L. Cameron","target_name":"American College of Surgeons"},{"source":309,"target":25,"edge_type":"programmatic_accreditation","start_year":2006,"end_year":2026,"temporal_range":"2006-Present","evidence_citation":"JHM_Archive_Quality","evidence_type":"institutional_archive","confidence":"moderate","notes":"Johns Hopkins integrated ACS NSQIP into its core departmental governance, aligning Halstedian training structures with modern empirical outcomes tracking.","module":"10_quality_outcomes","source_name":"ACS National Surgical Quality Improvement Program","target_name":"Johns Hopkins Hospital Department of Surgery"},{"source":309,"target":24,"edge_type":"programmatic_accreditation","start_year":2006,"end_year":2026,"temporal_range":"2006-Present","evidence_citation":"Mayo_Archive_Quality","evidence_type":"institutional_archive","confidence":"moderate","notes":"The Mayo Clinic adopted NSQIP standards to govern programmatic quality improvement across its multi-site surgical network.","module":"10_quality_outcomes","source_name":"ACS National Surgical Quality Improvement Program","target_name":"Mayo Clinic Department of Surgery"},{"source":51,"target":313,"edge_type":"governance_leadership","start_year":2006,"end_year":2015,"temporal_range":"2006-2015","evidence_citation":"ACS_Archive_SCIP","evidence_type":"institutional_archive","confidence":"moderate","notes":"The ACS participated in the multi-stakeholder governance of SCIP alongside CMS and the Joint Commission, connecting federal quality mandates to the surgical society governance structure.","module":"10_quality_outcomes","source_name":"American College of Surgeons","target_name":"Surgical Care Improvement Project"},{"source":307,"target":313,"edge_type":"institutional_succession","start_year":2006,"end_year":2015,"temporal_range":"2006-2015","evidence_citation":"CMS_Archive_SCIP","evidence_type":"institutional_archive","confidence":"high","notes":"The narrow focus on infection was succeeded by SCIP to broadly mandate and measure perioperative metrics tied directly to CMS reimbursement.","module":"09_trauma_acute_infection","source_name":"Surgical Infection Prevention Project","target_name":"Surgical Care Improvement Project"},{"source":274,"target":314,"edge_type":"institutional_succession","start_year":2007,"end_year":2026,"temporal_range":"2007-Present","evidence_citation":"ASMBS_Archive_History","evidence_type":"institutional_archive","confidence":"high","notes":"The society formally rebranded to ASMBS to reflect the paradigm-shifting evidence that these procedures fundamentally altered metabolic disease, largely driven by Walter Pories' early data.","module":"08_subspecialties","source_name":"American Society for Bariatric Surgery","target_name":"American Society for Metabolic and Bariatric Surgery"},{"source":301,"target":51,"edge_type":"programmatic_accreditation","start_year":2007,"end_year":2026,"temporal_range":"2007-Present","evidence_citation":"ASBrS_Archive_ACS","evidence_type":"institutional_archive","confidence":"moderate","notes":"The American Society of Breast Surgeons (ASBrS) is formally affiliated with the American College of Surgeons. ASBrS members are required to be Fellows of the ACS or eligible for ACS fellowship. The ASBrS participates in the ACS National Accreditation Program for Breast Centers (NAPBC), established 2007, which sets standards for breast center accreditation. The ASBrS also collaborates with the ACS Commission on Cancer on breast surgery quality measures. Confidence moderate because the relationship is primarily through the NAPBC accreditation program rather than a direct governance hierarchy. BRIDGE EDGE: Merges the ASBrS/Zannis island (Component 4, 2 nodes) into the main component via the ACS governance hub.","module":"07_oncology_trials","source_name":"American Society of Breast Surgeons","target_name":"American College of Surgeons"},{"source":79,"target":315,"edge_type":"institutional_founder","start_year":2008,"end_year":2010,"temporal_range":"2008-2010","evidence_citation":"ACS_COT_100th_Anniversary","evidence_type":"institutional_archive","confidence":"high","notes":"The ACS COT developed TQIP as the trauma-specific quality improvement program paralleling ACS-NSQIP (already in graph). TQIP uses the National Trauma Data Bank for benchmarking and risk-adjusted outcomes. This edge clarifies that TQIP was a COT initiative, not a direct ACS general creation \u2014 the graph previously had ACS \u2192 TQIP (institutional_founder) which remains valid as the parent, but the COT was the operational creator.","module":"09_trauma_acute_infection","source_name":"ACS Committee on Trauma","target_name":"Trauma Quality Improvement Program"},{"source":130,"target":316,"edge_type":"programmatic_accreditation","start_year":2008,"end_year":2025,"temporal_range":"2008-present","evidence_citation":"PMID: 29766096","evidence_type":"PMID","confidence":"high","notes":"[Verified 2026-03-17 | Trauma Surg Acute Care Open 2017 | content_match] Davis KA, Jurkovich GJ. 'Fellowship training in Acute Care Surgery: from inception to current state.' Trauma Surg Acute Care Open. 2017 May 22;2(1):e000095. PMC5891699. In 2005, the AAST created the Acute Care Surgery Committee to develop a training paradigm combining trauma surgery, surgical critical care, and emergency general surgery. In 2008, the first ACS Fellowship was approved by the AAST Board of Managers. By 2017, 20 programs had been approved and 82 fellows trained. The fellowship is AAST-accredited (not ACGME) with a verification process modeled on trauma center verification. This edge captures the most significant fellowship formalization event in the trauma module \u2014 it transforms the AAST from a society with only founding/accreditation edges into a programmatic accreditor for post-residency training, paralleling the ABS\u2192ABMS and ACGME accreditation pathways already in the graph. The Acute Care Surgery Fellowship Program is a new institutional node representing the national program collectively, not a single site.","module":"09_trauma_acute_infection","source_name":"American Association for the Surgery of Trauma","target_name":"Acute Care Surgery Fellowship Program"},{"source":51,"target":315,"edge_type":"institutional_founder","start_year":2008,"end_year":2026,"temporal_range":"2008-Present","evidence_citation":"ACS_Archive_TQIP","evidence_type":"institutional_archive","confidence":"high","notes":"The ACS established TQIP to extend the NSQIP risk-adjusted modeling specifically into the trauma center verification process.","module":"09_trauma_acute_infection","source_name":"American College of Surgeons","target_name":"Trauma Quality Improvement Program"},{"source":311,"target":123,"edge_type":"programmatic_accreditation","start_year":2009,"end_year":null,"temporal_range":"2009-present","evidence_citation":"ACS_SAGES_FLS_Joint_Statement","evidence_type":"institutional_archive","confidence":"high","notes":"Beginning with the 2009-2010 academic year, the ABS required all general surgery residents to successfully complete the FLS exam to be eligible to take the ABS Qualifying Exam in Surgery. This made FLS the first validated, simulation-based assessment tool mandated for board certification in any surgical discipline. The ABS also subsequently mandated the Fundamentals of Endoscopic Surgery (FES), another SAGES program, for certification. Edge type 'programmatic_accreditation' captures FLS serving as a mandatory credentialing gateway for ABS certification. This edge creates a modern cross-link between the MIS/endoscopic lineage (SAGES, degree 5) and the certification/governance lineage (ABS, degree 4), bridging two previously unconnected clusters.","module":"10_quality_outcomes","source_name":"Fundamentals of Laparoscopic Surgery","target_name":"American Board of Surgery"},{"source":306,"target":317,"edge_type":"institutional_succession","start_year":2010,"end_year":2026,"temporal_range":"2010-Present","evidence_citation":"PMID: 28795858","evidence_type":"PMID","confidence":"high","notes":"[Verified 2026-03-17 | J Laparoendosc Adv Surg Tech A 2017 | content_match] The informal academic study group evolved into a formal global governance body with strict auditing and accreditation protocols.","module":"10_quality_outcomes","source_name":"ERAS Study Group","target_name":"ERAS Society"},{"source":318,"target":317,"edge_type":"society_founder","start_year":2010,"end_year":2026,"temporal_range":"2010-Present","evidence_citation":"PMID: 28795858","evidence_type":"PMID","confidence":"high","notes":"[Verified 2026-03-17 | J Laparoendosc Adv Surg Tech A 2017 | content_match] Ljungqvist co-founded and formalized the ERAS Society, accelerating the global implementation and auditing of enhanced recovery protocols.","module":"10_quality_outcomes","source_name":"Olle Ljungqvist","target_name":"ERAS Society"},{"source":315,"target":242,"edge_type":"programmatic_accreditation","start_year":2010,"end_year":2026,"temporal_range":"2010-Present","evidence_citation":"UMD_Archive_TQIP","evidence_type":"institutional_archive","confidence":"moderate","notes":"Shock Trauma integrated TQIP benchmarks, overlaying modern multi-center data science onto Cowley's foundational clinical framework.","module":"09_trauma_acute_infection","source_name":"Trauma Quality Improvement Program","target_name":"University of Maryland Shock Trauma Center"},{"source":302,"target":319,"edge_type":"institutional_succession","start_year":2011,"end_year":2026,"temporal_range":"2011-Present","evidence_citation":"Alliance_Archive_History","evidence_type":"institutional_archive","confidence":"high","notes":"ACOSOG merged with CALGB and NCCTG to form the Alliance, consolidating surgical and medical oncology trial networks into a unified cooperative group.","module":"07_oncology_trials","source_name":"American College of Surgeons Oncology Group","target_name":"Alliance for Clinical Trials in Oncology"},{"source":263,"target":48,"edge_type":"governance_leadership","start_year":2011,"end_year":2026,"temporal_range":"2011-Present","evidence_citation":"MGH_Archive_Lillemoe","evidence_type":"institutional_archive","confidence":"high","notes":"In May 2011, Lillemoe was appointed Surgeon-in-Chief and Chief of the Department of Surgery at Massachusetts General Hospital and the W. Gerald Austen Professor of Surgery at Harvard Medical School. He also serves as Editor-in-Chief of the Annals of Surgery. The MGH Department of Surgery profile and ACS Fireside Chat confirm the appointment. This edge connects the Hopkins training lineage to the MGH institutional trunk: the chain Halsted\u2192Hopkins\u2192Cameron\u2192Lillemoe\u2192MGH creates a rare cross-institutional circuit where a Hopkins-trained surgeon leads the independent Harvard/MGH trunk. The MGH node already has edges from Richardson\u2192Churchill and Churchill\u2192MGH (WWII). Lillemoe's appointment parallels the Blalock\u2192Sabiston\u2192Duke pattern where a Hopkins trainee leads a peer institution. He was also elected ASA president, is a Senior Director of the ABS, and elected to the National Academy of Medicine (2018).","module":"02_general_surgery_spread","source_name":"Keith D. Lillemoe","target_name":"Massachusetts General Hospital Department of Surgery"},{"source":314,"target":51,"edge_type":"programmatic_accreditation","start_year":2012,"end_year":2026,"temporal_range":"2012-Present","evidence_citation":"ACS_ASMBS_Archive_MBSAQIP","evidence_type":"institutional_archive","confidence":"high","notes":"ACS and ASMBS jointly govern the Metabolic and Bariatric Surgery Accreditation and Quality Improvement Program (MBSAQIP), bridging bariatric society governance to the primary ACS quality infrastructure.","module":"08_subspecialties","source_name":"American Society for Metabolic and Bariatric Surgery","target_name":"American College of Surgeons"},{"source":248,"target":320,"edge_type":"institutional_succession","start_year":2012,"end_year":2014,"temporal_range":"2012-2014","evidence_citation":"NRG_Archive","evidence_type":"institutional_archive","confidence":"moderate","notes":"[Phase2 downgraded from PMID: 25281376 to institutional_archive on 2026-03-17 \u2014 no PubMed source found] In 2012, the GOG merged with the National Surgical Adjuvant Breast and Bowel Project (NSABP, already in graph) and the Radiation Therapy Oncology Group (RTOG) to form NRG Oncology, a new NCTN cooperative group. The acronym NRG derives from the names of the three parental groups. All federal research activities consolidated under NRG Oncology in March 2014. Philip DiSaia (GOG), Norman Wolmark (NSABP), and Walter Curran (RTOG) served as founding co-chairs.","module":"07_oncology_trials","source_name":"Gynecologic Oncology Group","target_name":"NRG Oncology"},{"source":205,"target":320,"edge_type":"institutional_succession","start_year":2012,"end_year":2014,"temporal_range":"2012-2014","evidence_citation":"NRG_Archive","evidence_type":"institutional_archive","confidence":"moderate","notes":"[Phase2 downgraded from PMID: 25281376 to institutional_archive on 2026-03-17 \u2014 no PubMed source found] The NSABP, founded by Bernard Fisher (already in graph), merged into NRG Oncology alongside GOG and RTOG. Norman Wolmark, who trained alongside Fisher at the University of Pittsburgh and succeeded him as NSABP chairman, became one of three NRG Oncology principal investigators. This edge connects the existing NSABP/Fisher clinical trials lineage to the gynecologic oncology trunk through the shared NRG Oncology institutional node.","module":"07_oncology_trials","source_name":"National Surgical Adjuvant Breast and Bowel Project","target_name":"NRG Oncology"},{"source":281,"target":103,"edge_type":"governance_leadership","start_year":2014,"end_year":2025,"temporal_range":"2014-2025","evidence_citation":"Duke_Archive_Kirk","evidence_type":"institutional_archive","confidence":"high","notes":"Kirk served as chair and inaugural Surgeon-in-Chief for Duke University Health System, a transplant immunologist extending the Halsted-Blalock-Sabiston lineage into active transplant science.","module":"02_general_surgery_spread","source_name":"Allan Kirk","target_name":"Duke University Department of Surgery"},{"source":205,"target":319,"edge_type":"programmatic_accreditation","start_year":2014,"end_year":2026,"temporal_range":"2014-Present","evidence_citation":"NCI_Archive_NCTN","evidence_type":"institutional_archive","confidence":"moderate","notes":"NSABP (now NRG Oncology) and the Alliance operate as parallel NCI-funded cooperative groups within the National Clinical Trials Network, coordinating surgical oncology protocols across the cooperative group structure.","module":"07_oncology_trials","source_name":"National Surgical Adjuvant Breast and Bowel Project","target_name":"Alliance for Clinical Trials in Oncology"},{"source":267,"target":321,"edge_type":"institutional_founder","start_year":2014,"end_year":2018,"temporal_range":"2014-2018","evidence_citation":"PMID: 24317546","evidence_type":"PMID","confidence":"high","notes":"[Verified 2026-03-17 | Surg Endosc 2014 | content_match] The Fundamentals of Endoscopic Surgery (FES) program was created by SAGES as the flexible endoscopy equivalent of the Fundamentals of Laparoscopic Surgery (FLS) program. FES is a comprehensive educational and assessment tool designed to teach and evaluate the fundamental knowledge, clinical judgment, and technical skills required in the performance of basic gastrointestinal flexible endoscopy. FES uses a virtual reality simulator (GI Bronch Mentor or GI Express) for the manual skills assessment, unlike FLS which uses a physical box trainer. The FES program was developed in collaboration with the ABS, ASCRS, ASMBS, and SSAT. SAGES launched FES publicly in 2014 and it was subsequently mandated by the ABS as part of the ABS Flexible Endoscopy Curriculum. Source: Marks JM et al. Why fundamentals of endoscopic surgery (FES)? Surg Endosc. 2014;28(3):701-703. This edge parallels the SAGES\u2192FLS (2004) edge already in the graph.","module":"10_quality_outcomes","source_name":"Society of American Gastrointestinal and Endoscopic Surgeons","target_name":"Fundamentals of Endoscopic Surgery"},{"source":317,"target":157,"edge_type":"programmatic_accreditation","start_year":2015,"end_year":2026,"temporal_range":"2015-Present","evidence_citation":"MDA_Archive_ERAS","evidence_type":"institutional_archive","confidence":"moderate","notes":"MD Anderson achieved formal validation for implementing standardized ERAS protocols, particularly bridging oncologic resection with rapid physiological recovery.","module":"10_quality_outcomes","source_name":"ERAS Society","target_name":"MD Anderson Cancer Center"},{"source":321,"target":123,"edge_type":"programmatic_accreditation","start_year":2018,"end_year":2024,"temporal_range":"2018-Present","evidence_citation":"ABS_FEC_Mandate","evidence_type":"institutional_archive","confidence":"high","notes":"Beginning with the 2017-2018 academic year, the American Board of Surgery required all general surgery certification candidates to have completed the ABS Flexible Endoscopy Curriculum, which includes successful completion of the FES program as its Level V milestone. The ABS Flexible Endoscopy Curriculum was developed by the ABS in collaboration with SAGES, ASCRS, ASMBS, and SSAT. This is the second simulation-based assessment mandated by the ABS for board certification, following FLS (mandated 2009, already in graph as FLS\u2192ABS edge). Together, the FLS\u2192ABS (2009) and FES\u2192ABS (2018) edges document the ABS's progressive incorporation of simulation-based competency assessment into board certification \u2014 a fundamental shift in how surgical competence is evaluated. Source: ABS Flexible Endoscopy Curriculum official page and SAGES press release, March 2014.","module":"10_quality_outcomes","source_name":"Fundamentals of Endoscopic Surgery","target_name":"American Board of Surgery"},{"source":308,"target":51,"edge_type":"governance_leadership","start_year":2018,"end_year":2019,"temporal_range":"2018-2019","evidence_citation":"Freischlag_ACS_Presidency","evidence_type":"institutional_archive","confidence":"high","notes":"Freischlag served as President of the American College of Surgeons 2018-2019. She had previously served as Governor (2000-2006), Regent (2006-2012), and first woman Chair of the Board of Regents (2012-2013). Her ACS presidency connects the women-in-surgery cluster to the governance backbone through a second presidential pathway alongside Leffall (1995-1996) and Numann (ABS chair). Also served as president of the Society for Vascular Surgery (first woman, 2014), Society of Surgical Chairs, and Association of VA Surgeons. ACS source: ACS Brief article, February 2026. CANDIDATE FOR PMID UPGRADE: search for Freischlag ACS presidential address in Bull Am Coll Surg or JACS 2018-2019.","module":"12_governance_societies","source_name":"Julie Ann Freischlag","target_name":"American College of Surgeons"},{"source":51,"target":322,"edge_type":"institutional_founder","start_year":2019,"end_year":null,"temporal_range":"2019-present","evidence_citation":"ACS_GSV_Standards_2019","evidence_type":"institutional_archive","confidence":"high","notes":"The ACS Geriatric Surgery Verification (GSV) Program launched in July 2019 with 30 evidence-based standards for optimizing surgical care of older adults. Developed by the ACS Geriatric Surgery Task Force in collaboration with over 50 stakeholder organizations and supported by the John A. Hartford Foundation. The ACS GSV Pilot Project (2014-2019) used ACS NSQIP infrastructure to collect geriatric-specific variables across 23 hospitals. In January 2025, CMS mandated reporting on the Age-Friendly Hospital Measure, and GSV created a new 'Age-Friendly Level' to align with this requirement. The GSV represents the newest evolution of the ACS quality verification model: COT Verification (trauma, 1987) \u2192 NSQIP (outcomes, 2004) \u2192 TQIP (trauma quality, 2008) \u2192 MBSAQIP (bariatric, 2012) \u2192 GSV (geriatric, 2019). This edge is the most recent in the entire graph (2019) and brings the temporal range into the 2020s via the CMS alignment.","module":"10_quality_outcomes","source_name":"American College of Surgeons","target_name":"Geriatric Surgery Verification Program"}]}
</script>
<script>
(function() {
  "use strict";

  var graphData = JSON.parse(document.getElementById("graph-data").textContent);

  var EDGE_LABELS = {
    direct_training:           { forward: "Trained",        reverse: "Trained by" },
    institutional_founder:     { forward: "Founded",        reverse: "Founded by" },
    society_founder:           { forward: "Founded",        reverse: "Founded by" },
    governance_leadership:     { forward: "Led / governed", reverse: "Governed by" },
    programmatic_accreditation:{ forward: "Accredits",      reverse: "Accredited by" },
    institutional_succession:  { forward: "Succeeded by",   reverse: "Succeeded" },
    observational_study:       { forward: "Studied under",  reverse: "Influenced" }
  };

  var MODULE_LABELS = {
    "01_halsted_core": "Halsted Core",
    "02_general_surgery_spread": "General Surgery Spread",
    "03_neurosurgery": "Neurosurgery",
    "04_cardiothoracic_vascular": "Cardiothoracic / Vascular",
    "05_urology": "Urology",
    "06_orthopedics": "Orthopedics",
    "07_oncology_trials": "Oncology & Trials",
    "08_subspecialties": "Subspecialties",
    "09_trauma_acute_infection": "Trauma & Acute Care",
    "10_quality_outcomes": "Quality & Outcomes",
    "11_mis_robotic": "MIS & Robotic",
    "12_governance_societies": "Governance & Societies",
    "13_pre_halsted": "Pre-Halsted",
    "14_global_military": "Global & Military"
  };

  var modSel = document.getElementById("moduleFilter");
  Object.keys(MODULE_LABELS).sort().forEach(function(k) {
    var o = document.createElement("option");
    o.value = k; o.textContent = MODULE_LABELS[k];
    modSel.appendChild(o);
  });

  var NODE_COLORS = { person: "#0A5E56", institution: "#B85D3A", society: "#2C2C2C" };

  function edgeColor(t) {
    if (t === "direct_training" || t === "observational_study") return "#0A5E56";
    if (t === "institutional_founder" || t === "society_founder") return "#B85D3A";
    if (t === "governance_leadership") return "#6B6B6B";
    return "#3D8B82";
  }
  function edgeDash(t) {
    if (t === "direct_training" || t === "observational_study") return "";
    if (t === "institutional_founder" || t === "society_founder") return "6,3";
    if (t === "governance_leadership") return "2,3";
    return "8,3,2,3";
  }

  // ── Degree + radius ──
  var degree = [];
  graphData.nodes.forEach(function(n, i) { degree[i] = n.degree || 0; });

  function nodeRadius(i) { return Math.max(4, Math.sqrt(degree[i] || 1) * 3.2); }

  // ── Label font size: logarithmic with degree ──
  function labelFontSize(i) {
    var d = degree[i] || 1;
    return Math.min(12, Math.max(8, 6 + Math.log2(d + 1) * 1.4));
  }

  // ── STATE ──
  var activeTypes = { person: true, institution: true, society: true };
  var selectedNode = null;
  var evidenceMode = false;
  var currentScale = 1;

  // ── Two-tier label thresholds ──
  function labelConfig() {
    if (currentScale < 0.3) return { minDeg: 8, useShort: true };
    if (currentScale < 0.6) return { minDeg: 5, useShort: true };
    if (currentScale < 1.0) return { minDeg: 3, useShort: true };
    if (currentScale < 1.8) return { minDeg: 2, useShort: true };
    return { minDeg: 1, useShort: currentScale < 3.0 ? false : false };
  }

  // ── Visibility helpers ──
  function getVal(id) { return document.getElementById(id).value; }

  function isNodeVisible(d) { return activeTypes[d.type]; }

  function isLinkVisible(l) {
    var sn = graphData.nodes[getIdx(l.source)];
    var tn = graphData.nodes[getIdx(l.target)];
    if (!isNodeVisible(sn) || !isNodeVisible(tn)) return false;
    var ef = getVal("edgeFilter");
    if (ef !== "all" && l.edge_type !== ef) return false;
    var era = getVal("eraFilter");
    if (era !== "all") {
      var sy = l.start_year;
      if (era === "pre1900" && sy >= 1900) return false;
      if (era === "1900-1950" && (sy < 1900 || sy >= 1950)) return false;
      if (era === "1950-2000" && (sy < 1950 || sy >= 2000)) return false;
      if (era === "2000+" && sy < 2000) return false;
    }
    var mf = getVal("moduleFilter");
    if (mf !== "all" && l.module !== mf) return false;
    return true;
  }

  // ── D3 SETUP ──
  var container = document.getElementById("graph-container");
  var W = container.clientWidth, H = container.clientHeight;
  var svg = d3.select("#graph-container").append("svg").attr("width", W).attr("height", H);

  var defs = svg.append("defs");
  ["#0A5E56","#B85D3A","#6B6B6B","#3D8B82"].forEach(function(c) {
    defs.append("marker")
      .attr("id", "arrow-" + c.replace("#",""))
      .attr("viewBox", "0 0 10 6")
      .attr("refX", 10).attr("refY", 3)
      .attr("markerWidth", 8).attr("markerHeight", 6)
      .attr("orient", "auto")
      .append("path").attr("d", "M0,0 L10,3 L0,6 Z").attr("fill", c).attr("opacity", 0.7);
  });

  var gMain = svg.append("g");
  var zoomBehavior = d3.zoom().scaleExtent([0.05, 8]).on("zoom", function(e) {
    gMain.attr("transform", e.transform);
    currentScale = e.transform.k;
    updateLabels();
  });
  svg.call(zoomBehavior);

  var hitG = gMain.append("g");
  var linkG = gMain.append("g");
  var nodeG = gMain.append("g");
  var labelG = gMain.append("g");

  var link = linkG.selectAll("line")
    .data(graphData.links).join("line")
    .attr("stroke", function(d) { return edgeColor(d.edge_type); })
    .attr("stroke-width", 1.5)
    .attr("stroke-dasharray", function(d) { return edgeDash(d.edge_type); })
    .attr("stroke-opacity", 0.5)
    .attr("marker-end", function(d) { return "url(#arrow-" + edgeColor(d.edge_type).replace("#","") + ")"; });

  var hitLine = hitG.selectAll("line")
    .data(graphData.links).join("line")
    .attr("stroke", "transparent")
    .attr("stroke-width", 12)
    .style("cursor", "pointer");

  var nodeCircle = nodeG.selectAll("circle")
    .data(graphData.nodes).join("circle")
    .attr("r", function(d, i) { return nodeRadius(i); })
    .attr("fill", function(d) { return NODE_COLORS[d.type]; })
    .attr("stroke", "#fff")
    .attr("stroke-width", 1.2)
    .attr("cursor", "pointer");

  var labelText = labelG.selectAll("text")
    .data(graphData.nodes).join("text")
    .attr("font-family", "'IBM Plex Sans', sans-serif")
    .attr("fill", "#2C2C2C")
    .attr("text-anchor", "middle")
    .attr("pointer-events", "none")
    .each(function(d, i) {
      var el = d3.select(this);
      el.attr("font-size", labelFontSize(i));
      if (d.type === "institution") el.attr("font-style", "italic");
      if (d.type === "society") {
        el.style("font-variant", "small-caps");
        el.attr("font-weight", "500");
      }
    });

  // ── Label text + collision avoidance ──
  var neighborSets = [];
  graphData.nodes.forEach(function() { neighborSets.push(new Set()); });
  graphData.links.forEach(function(l) {
    var si = typeof l.source === "object" ? l.source.index : l.source;
    var ti = typeof l.target === "object" ? l.target.index : l.target;
    neighborSets[si].add(ti);
    neighborSets[ti].add(si);
  });

  function updateLabels() {
    var cfg = labelConfig();
    var q = getVal("searchBox").toLowerCase().trim();

    // Determine which labels should be visible
    var visible = [];
    graphData.nodes.forEach(function(d, i) {
      if (!isNodeVisible(d)) { visible[i] = false; return; }
      if (q && d.id.toLowerCase().includes(q)) { visible[i] = true; return; }
      if (selectedNode !== null && (i === selectedNode || neighborSets[selectedNode].has(i))) {
        visible[i] = true; return;
      }
      visible[i] = degree[i] >= cfg.minDeg;
    });

    // Set label text
    labelText.each(function(d, i) {
      if (!visible[i]) { d3.select(this).attr("opacity", 0); return; }
      var txt;
      if (cfg.useShort) {
        txt = d.label_short || d.id;
      } else {
        txt = d.id.length > 36 ? d.id.substring(0, 34) + "\u2026" : d.id;
      }
      d3.select(this).text(txt);
    });

    // Simple collision avoidance: project to screen, hide lower-degree overlaps
    if (currentScale > 0.15) {
      var bboxes = [];
      labelText.each(function(d, i) {
        if (!visible[i]) return;
        var nd = graphData.nodes[i];
        if (!nd.x) return;
        var sx = nd.x * currentScale;
        var sy = nd.y * currentScale;
        var fs = labelFontSize(i);
        var txtLen = (d3.select(this).text() || "").length;
        var approxW = txtLen * fs * 0.55;
        var approxH = fs * 1.3;
        bboxes.push({
          idx: i,
          x: sx - approxW / 2,
          y: sy - nodeRadius(i) * currentScale - approxH - 2,
          w: approxW,
          h: approxH,
          deg: degree[i]
        });
      });

      // Sort by degree descending
      bboxes.sort(function(a, b) { return b.deg - a.deg; });

      var placed = [];
      var hidden = new Set();
      bboxes.forEach(function(bb) {
        var overlap = false;
        for (var j = 0; j < placed.length; j++) {
          var p = placed[j];
          if (bb.x < p.x + p.w && bb.x + bb.w > p.x &&
              bb.y < p.y + p.h && bb.y + bb.h > p.y) {
            overlap = true;
            break;
          }
        }
        if (overlap) {
          hidden.add(bb.idx);
        } else {
          placed.push(bb);
        }
      });

      labelText.each(function(d, i) {
        if (!visible[i]) return;
        if (hidden.has(i)) {
          d3.select(this).attr("opacity", 0);
        } else {
          d3.select(this).attr("opacity", 1);
        }
      });
    } else {
      labelText.each(function(d, i) {
        d3.select(this).attr("opacity", visible[i] ? 1 : 0);
      });
    }
  }

  // ── SIMULATION ──
  var simulation = d3.forceSimulation(graphData.nodes)
    .force("link", d3.forceLink(graphData.links).id(function(d, i) { return i; }).distance(60))
    .force("charge", d3.forceManyBody().strength(-120).distanceMax(500))
    .force("center", d3.forceCenter(W / 2, H / 2))
    .force("collision", d3.forceCollide().radius(function(d, i) { return nodeRadius(i) + 4; }))
    .force("x", d3.forceX(W / 2).strength(0.04))
    .force("y", d3.forceY(H / 2).strength(0.04))
    .alphaDecay(0.02)
    .on("tick", ticked);

  function getIdx(ref) { return typeof ref === "object" ? ref.index : ref; }

  function ticked() {
    link.attr("x1", function(d) { return d.source.x; })
      .attr("y1", function(d) { return d.source.y; })
      .attr("x2", function(d) {
        var dx = d.target.x - d.source.x, dy = d.target.y - d.source.y;
        var dist = Math.sqrt(dx * dx + dy * dy) || 1;
        var r = nodeRadius(getIdx(d.target));
        return d.target.x - (dx / dist) * (r + 4);
      })
      .attr("y2", function(d) {
        var dx = d.target.x - d.source.x, dy = d.target.y - d.source.y;
        var dist = Math.sqrt(dx * dx + dy * dy) || 1;
        var r = nodeRadius(getIdx(d.target));
        return d.target.y - (dy / dist) * (r + 4);
      });
    hitLine.attr("x1", function(d) { return d.source.x; })
      .attr("y1", function(d) { return d.source.y; })
      .attr("x2", function(d) { return d.target.x; })
      .attr("y2", function(d) { return d.target.y; });

    nodeCircle.attr("cx", function(d) { return d.x; })
      .attr("cy", function(d) { return d.y; });

    labelText.attr("x", function(d) { return d.x; })
      .attr("y", function(d, i) { return d.y - nodeRadius(i) - 4; });
  }

  // ── DRAG ──
  nodeCircle.call(d3.drag()
    .on("start", function(e, d) {
      if (!e.active) simulation.alphaTarget(0.3).restart();
      d.fx = d.x; d.fy = d.y;
    })
    .on("drag", function(e, d) { d.fx = e.x; d.fy = e.y; })
    .on("end", function(e, d) {
      if (!e.active) simulation.alphaTarget(0);
      d.fx = null; d.fy = null;
    })
  );

  // ── TOOLTIPS ──
  var tooltip = document.getElementById("tooltip");
  var edgeTooltip = document.getElementById("edgeTooltip");

  nodeCircle.on("mouseover", function(e, d) {
    tooltip.textContent = d.id;
    tooltip.className = "tooltip show";
    tooltip.style.left = (e.offsetX + 14) + "px";
    tooltip.style.top = (e.offsetY - 10) + "px";
  }).on("mousemove", function(e) {
    tooltip.style.left = (e.offsetX + 14) + "px";
    tooltip.style.top = (e.offsetY - 10) + "px";
  }).on("mouseout", function() {
    tooltip.className = "tooltip";
  });

  hitLine.on("mouseover", function(e, d) {
    var lbl = EDGE_LABELS[d.edge_type] || { forward: d.edge_type };
    var evBadge = d.evidence_type === "PMID" ? "PMID" : d.evidence_type === "DOI" ? "DOI" : "Archive";
    edgeTooltip.innerHTML =
      '<span class="et-label">' + d.source_name + ' → ' + d.target_name + '</span><br>' +
      lbl.forward + ' · ' + d.temporal_range +
      (d.confidence ? ' · ' + d.confidence : '') +
      '<div class="et-ev">' + evBadge + ': ' + d.evidence_citation + '</div>' +
      (d.notes ? '<div style="margin-top:4px;font-size:11px;opacity:0.8;max-width:340px;white-space:normal;">' +
        (d.notes.length > 200 ? d.notes.substring(0, 200) + '…' : d.notes) + '</div>' : '');
    edgeTooltip.className = "edge-tooltip show";
    edgeTooltip.style.left = (e.offsetX + 14) + "px";
    edgeTooltip.style.top = (e.offsetY - 10) + "px";
  }).on("mousemove", function(e) {
    edgeTooltip.style.left = (e.offsetX + 14) + "px";
    edgeTooltip.style.top = (e.offsetY - 10) + "px";
  }).on("mouseout", function() {
    edgeTooltip.className = "edge-tooltip";
  });

  // ── NODE CLICK → DETAIL PANEL ──
  nodeCircle.on("click", function(e, d) {
    e.stopPropagation();
    var idx = graphData.nodes.indexOf(d);
    selectNode(idx);
  });

  svg.on("click", function() { deselectNode(); });

  function selectNode(idx) {
    selectedNode = idx;
    var d = graphData.nodes[idx];
    var panelEl = document.getElementById("panel");
    panelEl.classList.remove("hidden");
    document.getElementById("panelName").textContent = d.id;
    var badge = document.getElementById("panelBadge");
    badge.textContent = d.type;
    badge.className = "badge badge-" + d.type;

    // Group connections
    var conns = {};
    graphData.links.forEach(function(l) {
      var si = getIdx(l.source), ti = getIdx(l.target);
      if (si !== idx && ti !== idx) return;
      var lbl = EDGE_LABELS[l.edge_type] || { forward: l.edge_type, reverse: l.edge_type };
      var isSource = si === idx;
      var label = isSource ? lbl.forward : lbl.reverse;
      var otherIdx = isSource ? ti : si;
      var otherNode = graphData.nodes[otherIdx];
      if (!conns[label]) conns[label] = [];
      conns[label].push({
        name: otherNode.id,
        idx: otherIdx,
        type: otherNode.type,
        range: l.temporal_range,
        notes: l.notes || "",
        evidence_type: l.evidence_type,
        evidence_citation: l.evidence_citation
      });
    });

    var body = document.getElementById("panelBody");
    body.innerHTML = "";
    Object.keys(conns).forEach(function(label) {
      var grp = document.createElement("div");
      grp.className = "conn-group";
      grp.innerHTML = '<h3>' + label + '</h3>';
      conns[label].forEach(function(c) {
        var evClass = (c.evidence_type === "PMID" || c.evidence_type === "DOI") ? "ev-badge-pmid" : "ev-badge-archive";
        var evLabel = c.evidence_type === "PMID" ? "PMID" : c.evidence_type === "DOI" ? "DOI" : "Archive";
        var item = document.createElement("div");
        item.className = "conn-item";
        item.innerHTML =
          '<span class="conn-link" data-idx="' + c.idx + '">' + c.name + '</span>' +
          '<span class="ev-badge ' + evClass + '">' + evLabel + '</span>' +
          '<div class="conn-meta">' + c.range + ' · ' + c.evidence_citation + '</div>' +
          (c.notes ? '<div class="conn-notes">' +
            (c.notes.length > 180 ? c.notes.substring(0, 180) + '…' : c.notes) + '</div>' : '');
        grp.appendChild(item);
      });
      body.appendChild(grp);
    });

    // Clickable links in panel
    body.querySelectorAll(".conn-link").forEach(function(el) {
      el.addEventListener("click", function() {
        var target = parseInt(this.getAttribute("data-idx"));
        selectNode(target);
        var nd = graphData.nodes[target];
        if (nd.x && nd.y) {
          svg.transition().duration(500).call(
            zoomBehavior.transform,
            d3.zoomIdentity.translate(W / 2 - nd.x * currentScale, H / 2 - nd.y * currentScale).scale(currentScale)
          );
        }
      });
    });

    // Highlight selected node
    nodeCircle.attr("stroke", function(nd, i) {
      if (i === idx) return "#B85D3A";
      if (neighborSets[idx].has(i)) return "#0A5E56";
      return "#fff";
    }).attr("stroke-width", function(nd, i) {
      if (i === idx) return 3;
      if (neighborSets[idx].has(i)) return 2;
      return 1.2;
    });

    link.attr("stroke-opacity", function(l) {
      var si = getIdx(l.source), ti = getIdx(l.target);
      if (si === idx || ti === idx) return 0.85;
      return 0.12;
    }).attr("stroke-width", function(l) {
      var si = getIdx(l.source), ti = getIdx(l.target);
      if (si === idx || ti === idx) return 2.5;
      return 1.5;
    });

    updateLabels();
  }

  function deselectNode() {
    selectedNode = null;
    document.getElementById("panel").classList.add("hidden");
    nodeCircle.attr("stroke", "#fff").attr("stroke-width", 1.2);
    link.attr("stroke-opacity", 0.5).attr("stroke-width", 1.5);
    applyEvidence();
    updateLabels();
  }

  document.getElementById("panelClose").addEventListener("click", deselectNode);

  // ── EVIDENCE TOGGLE ──
  document.getElementById("evidenceBtn").addEventListener("click", function() {
    evidenceMode = !evidenceMode;
    this.classList.toggle("toggle-active", evidenceMode);
    applyEvidence();
  });

  function applyEvidence() {
    if (selectedNode !== null) return; // don't override selection highlighting
    if (evidenceMode) {
      link.attr("stroke-opacity", function(d) {
        return (d.evidence_type === "PMID" || d.evidence_type === "DOI") ? 0.7 : 0.18;
      }).attr("stroke-dasharray", function(d) {
        if (d.evidence_type === "institutional_archive") return "3,4";
        return edgeDash(d.edge_type);
      });
    } else {
      link.attr("stroke-opacity", 0.5)
        .attr("stroke-dasharray", function(d) { return edgeDash(d.edge_type); });
    }
  }

  // ── FILTERS ──
  function applyFilters() {
    if (selectedNode !== null) deselectNode();

    nodeCircle.attr("opacity", function(d) { return isNodeVisible(d) ? 1 : 0; })
      .attr("pointer-events", function(d) { return isNodeVisible(d) ? "all" : "none"; });

    link.attr("display", function(d) { return isLinkVisible(d) ? null : "none"; });
    hitLine.attr("display", function(d) { return isLinkVisible(d) ? null : "none"; });

    // Search highlighting
    var q = getVal("searchBox").toLowerCase().trim();
    if (q) {
      nodeCircle.attr("opacity", function(d) {
        if (!isNodeVisible(d)) return 0;
        return d.id.toLowerCase().includes(q) ? 1 : 0.15;
      });
    }

    updateLabels();
    applyEvidence();
  }

  // Node toggles
  document.querySelectorAll(".node-toggle").forEach(function(el) {
    el.addEventListener("click", function() {
      var type = this.getAttribute("data-type");
      activeTypes[type] = !activeTypes[type];
      this.classList.toggle("active", activeTypes[type]);
      applyFilters();
    });
  });

  document.getElementById("edgeFilter").addEventListener("change", applyFilters);
  document.getElementById("eraFilter").addEventListener("change", applyFilters);
  document.getElementById("moduleFilter").addEventListener("change", applyFilters);
  document.getElementById("searchBox").addEventListener("input", applyFilters);

  // ── RESET & FIT ──
  document.getElementById("resetBtn").addEventListener("click", function() {
    document.getElementById("edgeFilter").value = "all";
    document.getElementById("eraFilter").value = "all";
    document.getElementById("moduleFilter").value = "all";
    document.getElementById("searchBox").value = "";
    activeTypes = { person: true, institution: true, society: true };
    document.querySelectorAll(".node-toggle").forEach(function(el) { el.classList.add("active"); });
    evidenceMode = false;
    document.getElementById("evidenceBtn").classList.remove("toggle-active");
    deselectNode();
    applyFilters();
    svg.transition().duration(500).call(zoomBehavior.transform, d3.zoomIdentity.translate(0, 0).scale(1));
  });

  document.getElementById("fitBtn").addEventListener("click", function() {
    var xMin = Infinity, xMax = -Infinity, yMin = Infinity, yMax = -Infinity;
    graphData.nodes.forEach(function(d) {
      if (!isNodeVisible(d) || !d.x) return;
      if (d.x < xMin) xMin = d.x;
      if (d.x > xMax) xMax = d.x;
      if (d.y < yMin) yMin = d.y;
      if (d.y > yMax) yMax = d.y;
    });
    if (xMin === Infinity) return;
    var pad = 60;
    var dx = xMax - xMin + pad * 2;
    var dy = yMax - yMin + pad * 2;
    var scale = Math.min(W / dx, H / dy, 2);
    var cx = (xMin + xMax) / 2;
    var cy = (yMin + yMax) / 2;
    svg.transition().duration(600).call(
      zoomBehavior.transform,
      d3.zoomIdentity.translate(W / 2 - cx * scale, H / 2 - cy * scale).scale(scale)
    );
  });

  // Initial label update
  updateLabels();

})();
</script>
</body>
</html>
