ple transplant center directors."}, {"source": 78, "target": 36, "edge_type": "governance_leadership", "start_year": 1969, "module": "02_general_surgery_spread", "source_name": "W. Gerald Austen", "target_name": "Massachusetts General Hospital Department of Surgery", "temporal_range": "1969-1997", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 3530150", "notes": "William Gerald 'Jerry' Austen (1930-2022) was appointed Chief of Surgical Services at MGH in 1969 at the age of 39, a position he held for 29 years until 1997 (additionally Surgeon-in-Chief from 1989-1997). He was named the first Edward D. Churchill Professor of Surgery at Harvard in 1974. Austen graduated from MIT (1951, mechanical engineering) and Harvard Medical School (1955), completed general surgery and cardiothoracic surgery residencies at MGH, then spent two years at the National Heart Institute (NIH) before returning to MGH in 1963. His engineering background enabled him to co-design (with Robert Shaw) a cardiopulmonary bypass machine and (with Mortimer Buckley) the intra-aortic balloon pump. He was a founding trustee of Partners HealthCare and founding president/CEO of the Massachusetts General Physicians Organization. Austen was president of the AAS, SUS, ASA, AHA, AATS, and ACS (1992-1993). His 29-year tenure as MGH chief parallels Leffall's 25-year chairmanship at Howard (Priority 1) and represents one of the longest departmental leaderships in the graph."}, {"source": 51, "target": 45, "edge_type": "governance_leadership", "start_year": 1970, "module": "02_general_surgery_spread", "source_name": "LaSalle D. Leffall Jr.", "target_name": "Howard University Department of Surgery", "temporal_range": "1970-1995", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 18481473", "notes": "[Verified 2026-03-17 | J Natl Med Assoc 2008 | content_match] Leffall joined the Howard faculty in 1962 as assistant professor of surgery and was appointed Chairman of the Department of Surgery in 1970, a position he held for 25 years until 1995. In 1992, he was named the first Charles R. Drew Professor of Surgery — the first endowed chair in the history of Howard's Department of Surgery. During his tenure, Leffall taught approximately 6,000 medical students and trained over 300 general surgery residents. He also served as principal civilian consultant to the General Surgery Service at Walter Reed Army Medical Center for 30 years (1970-2000). The dual edges (Howard trained Leffall; Leffall led Howard) create a bidirectional circuit paralleling the pattern seen with Samuel D. Gross at Jefferson (trained by Jefferson, later led Jefferson) and William Altemeier at Cincinnati — both already documented in the graph. This circuit is the signature of a surgeon who returns to transform the institution that formed him."}, {"source": 63, "target": 79, "edge_type": "society_founder", "start_year": 1974, "module": "02_general_surgery_spread", "source_name": "Thomas Starzl", "target_name": "American Society of Transplant Surgeons", "temporal_range": "1974-1975", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 3279623", "notes": "[Phase2 replaced PMID: 10457723 -> PMID: 3279623 on 2026-03-17] [Verified 2026-03-17 | Transplant Proc 1988 | content_match] Starzl organized the founding of the ASTS to specifically govern the surgical training and credentialing standards for abdominal organ transplantation."}, {"source": 63, "target": 80, "edge_type": "institutional_founder", "start_year": 1981, "module": "02_general_surgery_spread", "source_name": "Thomas Starzl", "target_name": "University of Pittsburgh Transplant Program", "temporal_range": "1981-2017", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 22980971", "notes": "[Phase2 replaced PMID: 23225838 -> PMID: 22980971 on 2026-03-17] [Verified 2026-03-17 | Cell 2012 | content_match] Starzl moved from Colorado to Pittsburgh in 1981, building the world's largest and most productive organ transplant center."}, {"source": 63, "target": 81, "edge_type": "direct_training", "start_year": 1983, "module": "02_general_surgery_spread", "source_name": "Thomas Starzl", "target_name": "Andreas Tzakis", "temporal_range": "1983-1994", "confidence": "moderate", "evidence_type": "institutional_archive", "evidence_citation": "Pittsburgh_Archive_Tzakis", "notes": "[Phase2 downgraded from PMID: 28791702 to institutional_archive on 2026-03-17 — no PubMed source found] Tzakis completed his transplant fellowship under Starzl at Pittsburgh, developing novel liver transplant techniques and the first successful multivisceral transplant program before founding the Miami Transplant Institute."}, {"source": 31, "target": 82, "edge_type": "direct_training", "start_year": 1987, "module": "02_general_surgery_spread", "source_name": "Duke University Department of Surgery", "target_name": "Allan Kirk", "temporal_range": "1987-1995", "confidence": "high", "evidence_type": "institutional_archive", "evidence_citation": "Duke_Archive_Kirk", "notes": "Kirk received his MD (1987), PhD in immunology (1992), and completed his general surgery residency (1995) all at Duke, later returning as chair in 2014 extending the Sabiston lineage into the modern era."}, {"source": 83, "target": 73, "edge_type": "governance_leadership", "start_year": 1987, "module": "02_general_surgery_spread", "source_name": "Haile T. Debas", "target_name": "UCSF Department of Surgery", "temporal_range": "1987-1993", "confidence": "low", "evidence_type": "DOI", "evidence_citation": "DOI: 10.1007/s00268-022-06710-1", "notes": "[VERIFY_FAILED 2026-03-17 — HTTP 404; was confidence:high] Sims CA et al. 'Inspirational Leaders in Surgery: Dr. Haile Debas.' World J Surg. 2022;46(12):2933-2935. PMC9436831. Documents Debas as chair of UCSF Department of Surgery (1987-1993), becoming the first African-born chair of an American Department of Surgery. Under his leadership UCSF became a leading center for transplant surgery — the first UCSF liver transplant was in 1988, thoracic organ transplants in 1989. Debas subsequently became Dean of UCSF School of Medicine (1993-2003) and 7th Chancellor of UCSF (1997). Born in Asmara, Eritrea (1937), trained at McGill and UBC, faculty at UBC (1970-1980), UCLA (1980-1985), and UW Division of GI Surgery (1985-1987) before UCSF chairmanship. This is the first governance_leadership edge connecting a new person to a West Coast institution in the expansion — UCSF goes from degree 2 to degree 3 and gains its first post-1960s link. Also adds global/African URM representation (the graph's first African-born node)."}, {"source": 69, "target": 84, "edge_type": "governance_leadership", "start_year": 1987, "module": "02_general_surgery_spread", "source_name": "Olga Jonasson", "target_name": "Ohio State University Department of Surgery", "temporal_range": "1987-1993", "confidence": "high", "evidence_type": "DOI", "evidence_citation": "DOI: 10.1007/s00268-021-06302-1", "notes": "[Verified 2026-03-17 | World j. surg. 2022 | content_match] Sims CA, Leemaster J, Pawlik TM. 'Inspirational Women in Surgery: Olga Jonasson, the Legacy of the First Female Chair of an Academic Department of Surgery.' World J Surg. 2022;46:755-756. PMC8410170. Documents Jonasson as the first woman to chair an academic surgery department at a co-educational US medical school (Ohio State, 1987). She was named Robert M. Zollinger Professor of Surgery. Previously she was chair at Cook County Hospital (1977) — also a first for women. At Ohio State she championed resident well-being and humanitarian care. She served as ACS Regent (1976, already in graph) and ABS board member. Jonasson's degree goes from 2 to 4, transforming her from a leaf into a hub connecting training (Cole), governance (ACS, ABS), and institutional leadership (Ohio State)."}, {"source": 85, "target": 58, "edge_type": "governance_leadership", "start_year": 1993, "module": "02_general_surgery_spread", "source_name": "Carlos A. Pellegrini", "target_name": "University of Washington Department of Surgery", "temporal_range": "1993-2018", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 31634177", "notes": "Carlos Alberto Pellegrini (b. 1944, Argentina) became the Henry N. Harkins Professor and Chair of the Department of Surgery at the University of Washington in January 1993, succeeding C. James Carrico (interim chairs Ashbaugh and Clowes). He served until retirement in 2018 (25 years). MD from University of Rosario (Argentina) 1971, surgical residency at University of Chicago, faculty at UCSF 1979-1993. At UW he created the Center for Videoendoscopic Surgery, the Center for Gastric and Esophageal Surgery, and the WWAMI Institute for Simulation in Healthcare (WISH, 2005). Pioneer in minimally invasive gastrointestinal surgery. Also served as founding Chief Medical Officer of UW Medicine. This edge extends the UW succession chain: Harkins (1947-1967) → Merendino (1964-1972) → [Stevenson, Shires, Carrico] → Pellegrini (1993-2018). Also served as ASA president (2005) and ACS president (94th, 2013). CANDIDATE FOR PMID UPGRADE: search for Pellegrini ASA presidential address in Ann Surg 2005-2006."}, {"source": 86, "target": 1, "edge_type": "governance_leadership", "start_year": 2003, "module": "02_general_surgery_spread", "source_name": "Julie Ann Freischlag", "target_name": "Johns Hopkins Hospital Department of Surgery", "temporal_range": "2003-2014", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 19099052", "notes": "[Phase2 reviewed — citation retained on 2026-03-17] Julie Ann Freischlag (b. 1954) became the William Stewart Halsted Professor, Director of the Department of Surgery, and Surgeon-in-Chief at The Johns Hopkins Hospital in March 2003, succeeding John L. Cameron. She was the first woman and only the seventh person to hold these posts (after Halsted, Finney, Blalock, Zuidema, Cameron, and herself — the sixth director, not the sixth person, as some sources vary on the count of acting chiefs). Rush Medical College MD 1980, general surgery residency and vascular fellowship at UCLA. Previously chief of vascular surgery at UCLA (1998-2003). At Hopkins, she created the Center for Surgical Trials and Outcomes Research (CSTOR), improved patient safety systems, and advanced faculty diversity. She also served as editor of JAMA Surgery (2005-2014). Left Hopkins in 2014 to become vice chancellor at UC Davis, then CEO of Wake Forest Baptist Medical Center (2017). Elected to the National Academy of Medicine 2015. ACS Board of Regents Chair 2012, ACS President 2018-2019. Society for Vascular Surgery president (first woman). Source: Freischlag JA. Women surgeons — still in a male-dominated world. Yale J Biol Med. 2008;81(4):203-204. Written from her Hopkins Halsted Professorship. Ghost node 'Julie Freischlag' mentioned in notes fields of Patricia Numann edges now converted to real person node."}, {"source": 82, "target": 31, "edge_type": "governance_leadership", "start_year": 2014, "module": "02_general_surgery_spread", "source_name": "Allan Kirk", "target_name": "Duke University Department of Surgery", "temporal_range": "2014-2025", "confidence": "high", "evidence_type": "institutional_archive", "evidence_citation": "Duke_Archive_Kirk", "notes": "Kirk served as chair and inaugural Surgeon-in-Chief for Duke University Health System, a transplant immunologist extending the Halsted-Blalock-Sabiston lineage into active transplant science."}, {"source": 57, "target": 87, "edge_type": "direct_training", "start_year": 1970, "module": "02_general_surgery_spread", "source_name": "David Sabiston", "target_name": "R. Randal Bollinger", "temporal_range": "1970-1980", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 39257568", "notes": "[Phase2 reviewed — citation retained on 2026-03-17] Ralph Randal Bollinger (1944-) received his MD from Tulane and was accepted in 1970 into the Duke general surgical residency under Sabiston while simultaneously pursuing a PhD in immunology with D. Bernard Amos. Residency was interrupted by 2 years of USAF service. Sabiston appointed him to the Duke surgery faculty in 1980 as chief of transplantation (1983). Bollinger performed the first liver transplant in North Carolina (1986) and mentored Allan D. Kirk (future Duke surgery chair) and Stuart Knechtle in his transplant immunology laboratory. The Bollinger-Kirk lineage creates a verified 4-generation chain: Blalock-Sabiston-Bollinger-Kirk. Kirk et al (Front Transplant 2024) document Bollinger's training under Sabiston explicitly."}, {"source": 88, "target": 31, "edge_type": "governance_leadership", "start_year": 1994, "module": "02_general_surgery_spread", "source_name": "Robert W. Anderson", "target_name": "Duke University Department of Surgery", "temporal_range": "1994-2003", "confidence": "high", "evidence_type": "institutional_archive", "evidence_citation": "Duke_Archive_Anderson", "notes": "Anderson succeeded Sabiston as chairman of the Duke Department of Surgery in 1994 and served until 2003. As a Sabiston trainee who returned to lead the department, Anderson creates a bidirectional circuit (Sabiston trained Anderson at Duke; Anderson led Duke after Sabiston) — a pattern seen elsewhere in the graph with Gross at Jefferson and Altemeier at Cincinnati. The Duke succession chain is now Hart (1930-1960) - Gardner (1960-1964) - Sabiston (1964-1994) - Anderson (1994-2003) - Jacobs (2003-2012) - Kirk (2014-2025) - Allen (2025-present)."}, {"source": 57, "target": 89, "edge_type": "direct_training", "start_year": 1974, "module": "02_general_surgery_spread", "source_name": "David Sabiston", "target_name": "W. Randolph Chitwood Jr.", "temporal_range": "c.1974-c.1982", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 14703738", "notes": "[Phase2 reviewed — citation retained on 2026-03-17] W. Randolph Chitwood Jr. trained in general and cardiothoracic surgery at Duke under Sabiston and subsequently became Professor and Chairman of the Department of Surgery at the Brody School of Medicine, East Carolina University (Greenville, NC). He authored the definitive review of Sabiston's educational legacy (Ann Surg 2003, PMID 14703738), which documents Sabiston's training of 154 chief residents with 41 becoming department chairs or division chiefs. Chitwood was a pioneer in robotic mitral valve surgery and served as founding member and president of the Sabiston Society. Exact residency dates approximated from career timeline."}, {"source": 57, "target": 90, "edge_type": "direct_training", "start_year": 1975, "module": "02_general_surgery_spread", "source_name": "David Sabiston", "target_name": "James L. Cox", "temporal_range": "c.1975-1983", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 25135240", "notes": "[Phase2 reviewed — citation retained on 2026-03-17] James L. Cox trained at Duke under Sabiston, rising to associate professor of surgery in 1983 before being recruited to Washington University in St. Louis as professor and chief of cardiothoracic surgery at age 40. At Duke, Cox established a surgical electrophysiology laboratory where he began the research that led to the maze procedure for atrial fibrillation — one of the most impactful surgical innovations of the late 20th century. He became the 81st president of the AATS. D'Amico (JTCVS 2015, PMID 25135240) lists Cox as one of four AATS presidents trained by Sabiston (alongside Ebert, Crawford, and Spray). The Cox AATS Historical Perspectives article (JTCVS 2013) confirms his Duke training under Sabiston and laboratory work."}, {"source": 57, "target": 91, "edge_type": "direct_training", "start_year": 1965, "module": "02_general_surgery_spread", "source_name": "David Sabiston", "target_name": "Robert H. Jones", "temporal_range": "1965-1975", "confidence": "high", "evidence_type": "institutional_archive", "evidence_citation": "Duke_Archive_Jones", "notes": "Robert H. Jones received his MD from Johns Hopkins University in 1965 and was 'one of the first Duke University surgical residents taught by Dr. David C. Sabiston, Jr.' per the Duke Department of Surgery memorial. His residency was interrupted by military service as a Captain in the Air Force. He joined the Duke faculty as assistant professor in 1975 and spent 40 years at Duke as a cardiac surgeon, clinical investigator, and resident educator. Jones was a Howard Hughes Investigator who made seminal contributions in nuclear cardiology imaging and was instrumental in developing the Duke Cardiovascular Disease Databank. No published PMID specifically documents his residency dates; the Duke Department of Surgery memorial page is the primary source."}, {"source": 14, "target": 92, "edge_type": "direct_training", "start_year": 1951, "module": "02_general_surgery_spread", "source_name": "Alfred Blalock", "target_name": "J. Alex Haller Jr.", "temporal_range": "1951-1959", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 22248679", "notes": "[Verified 2026-03-17 | J Thorac Cardiovasc Surg 2012 | content_match] Jacob Alexander Haller Jr. (1927-2018) received his MD from Johns Hopkins in 1951, returned to complete his surgical residency at Hopkins (1955-1959) after military service, then joined the University of Louisville faculty. In 1963, Blalock recruited Haller back to Hopkins to found the Division of Pediatric Surgery — one of the first accredited pediatric surgery training programs in the US. Haller served as inaugural Robert Garrett Professor of Pediatric Surgery and Surgeon-in-Charge of the Children's Medical and Surgical Center for nearly 30 years. He established the first US Children's Trauma Centre (1973) and contributed to the first PALS protocol. Conte (JTCVS 2012, PMID 22248679) lists Haller among Blalock's division chiefs. The Hopkins Medicine obituary (2018) and BAPS obituary confirm his training under Blalock. This edge connects the Blalock hub to the pediatric surgery subspecialty."}, {"source": 14, "target": 93, "edge_type": "direct_training", "start_year": 1941, "module": "02_general_surgery_spread", "source_name": "Alfred Blalock", "target_name": "C. Rollins Hanlon", "temporal_range": "c.1941-1948", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 22248679", "notes": "[Verified 2026-03-17 | J Thorac Cardiovasc Surg 2012 | content_match] C. Rollins Hanlon trained under Blalock at Johns Hopkins and co-developed the Blalock-Hanlon operation (1948) for transposition of the great vessels. The ACS biographical profile confirms Hanlon later served as ACS Executive Director (1969-1986) and ACS President (1987-1988), making him one of the most powerful figures in American surgical governance during that period. Conte (JTCVS 2012, PMID 22248679) documents the Blalock training context. The ACS profile explicitly describes Hanlon working with Blalock on congenital heart operations at Hopkins. This edge connects the Blalock training hub to the ACS governance backbone (Hanlon had a direct governance role at the ACS already in the graph as a major node)."}, {"source": 14, "target": 94, "edge_type": "direct_training", "start_year": 1953, "module": "02_general_surgery_spread", "source_name": "Alfred Blalock", "target_name": "James Jude", "temporal_range": "c.1953-c.1961", "confidence": "moderate", "evidence_type": "PMID", "evidence_citation": "PMID: 22248679", "notes": "[Verified 2026-03-17 | J Thorac Cardiovasc Surg 2012 | content_match] James R. Jude was a surgical resident at Johns Hopkins under Blalock. In 1960, together with William Kouwenhoven and G. Guy Knickerbocker, Jude co-developed external cardiac massage (closed-chest CPR) at Hopkins — one of the most consequential medical innovations of the 20th century. Conte (JTCVS 2012, PMID 22248679) lists Jude among Blalock's division chiefs. The PBS 'Partners of the Heart' documentary identifies Jude in the Blalock trainee cohort. Confidence moderate due to approximated residency dates. The CPR innovation alone makes Jude one of the highest-impact trainees in the graph despite being a less prominent figure than Sabiston or Cooley in traditional surgical lineage narratives."}, {"source": 14, "target": 95, "edge_type": "direct_training", "start_year": 1947, "module": "02_general_surgery_spread", "source_name": "Alfred Blalock", "target_name": "William Muller", "temporal_range": "c.1947-c.1955", "confidence": "moderate", "evidence_type": "PMID", "evidence_citation": "PMID: 22248679", "notes": "[Verified 2026-03-17 | J Thorac Cardiovasc Surg 2012 | content_match] William H. Muller Jr. was a Blalock chief resident at Hopkins who subsequently became chairman of the Department of Surgery at the University of Virginia. Conte (JTCVS 2012, PMID 22248679) explicitly lists Muller among Blalock's department chairmen alongside Sabiston, Longmire, and Greenfield. Exact residency dates approximated. Confidence moderate due to estimated dates and limited published biographical detail beyond the Conte citation."}, {"source": 26, "target": 96, "edge_type": "direct_training", "start_year": 1938, "module": "02_general_surgery_spread", "source_name": "Owen Wangensteen", "target_name": "Richard L. Varco", "temporal_range": "1938-1943", "confidence": "moderate", "evidence_type": "institutional_archive", "evidence_citation": "Minnesota_Archive_Varco", "notes": "[Phase2 downgraded from PMID: 12717368 to institutional_archive on 2026-03-17 — no PubMed source found] Richard Lynn Varco (1912-2004) earned his MB/MD (1937) and PhD in Surgery (1944) at the University of Minnesota. He served as research fellow in the Department of Surgery (1938-1940), fellow in Physiology (1940-1942), and senior resident (1942-1943) under Wangensteen's chairmanship. He rose to Professor (1950) and Regents' Professor (1974). Varco co-pioneered open-heart surgery as a member of the team that performed the world's first open-heart repair under direct vision (with F. John Lewis, Sept 2, 1952) and was central to the cross-circulation operations with C. Walton Lillehei (1954). He also performed the first organ transplant at Minnesota (kidney, 1963) and co-invented the implantable drug infusion pump with Henry Buchwald (1969). Citation is Najarian JS, 'Richard L. Varco, MD, PhD: the compleat academic surgeon,' Surgery 2003;133(4):451-2."}, {"source": 26, "target": 97, "edge_type": "direct_training", "start_year": 1960, "module": "02_general_surgery_spread", "source_name": "Owen Wangensteen", "target_name": "Henry Buchwald", "temporal_range": "1960-1966", "confidence": "high", "evidence_type": "institutional_archive", "evidence_citation": "UMN_Archive_Buchwald_Wangensteen", "notes": "Henry Buchwald (b. 1932, Vienna) earned his MD at Columbia P&S (1957), interned at Columbia-Presbyterian, then entered the University of Minnesota surgical residency in 1960 under Wangensteen's chairmanship, earning an MS (Biochemistry) and PhD (Surgery) by 1966. Wangensteen is explicitly identified as Buchwald's mentor by the UMN Department of Surgery. Buchwald became the first Owen H. and Sarah Davidson Wangensteen Chair in Experimental Surgery. He pioneered partial ileal bypass for hyperlipidemia, led the NIH-funded POSCH trial proving cholesterol lowering reduces heart disease, co-founded metabolic/bariatric surgery as a discipline, and co-invented the implantable infusion pump with Varco. His day-to-day clinical mentor was Richard Varco, but Wangensteen was the formal departmental chair and training program director. PMID upgrade candidate: PMID 17275843 (Edlich, Wangensteen tribute, J Surg Res 2007) likely names Buchwald in full text but could not be verified from abstract alone."}, {"source": 49, "target": 98, "edge_type": "direct_training", "start_year": 1934, "module": "02_general_surgery_spread", "source_name": "I.S. Ravdin", "target_name": "Jonathan E. Rhoads", "temporal_range": "1934-1939", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 14606488", "notes": "[Phase2 reviewed — citation retained on 2026-03-17] Jonathan Evans Rhoads (1907-2002) completed his surgical residency at the Hospital of the University of Pennsylvania from 1934 to 1939 under I.S. Ravdin. Though Eldridge Eliason was nominally the department chairman, Barker (Proc Am Philos Soc 2003, PMID 14606488; Ann Surg 2002, PMC1422501) states explicitly that 'Dr. Rhoads' real mentor was I. S. Ravdin, who had a service totally independent of Eliason's that was staffed by his own residents.' Ravdin's confidence in Rhoads was so great that he selected Rhoads as his own surgeon when he developed acute cholecystitis. When Ravdin left for Burma in WWII, the 36-year-old Rhoads was left in charge of the entire surgical service — with a skeleton crew that included the young C. Everett Koop. Rhoads received his MD from Johns Hopkins (1932) and his ScD from Penn (1940)."}, {"source": 98, "target": 50, "edge_type": "governance_leadership", "start_year": 1959, "module": "02_general_surgery_spread", "source_name": "Jonathan E. Rhoads", "target_name": "University of Pennsylvania Department of Surgery", "temporal_range": "1959-1972", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 14606488", "notes": "[Phase2 reviewed — citation retained on 2026-03-17] Rhoads succeeded Ravdin as John Rhea Barton Professor and Chairman of Surgery at Penn in 1959 and served until 1972. During these 12 years, he simultaneously served as president of the ACS (1971-1972), ASA (1972-1973), and American Cancer Society, as editor of the Annals of Surgery and the journal Cancer, and as chairman of the National Cancer Advisory Board. From his chairmanship, 62 surgical graduates achieved faculty positions at 34 medical schools with 11 becoming department chairs. This creates a Ravdin-Rhoads succession at Penn paralleling the Hart-Sabiston-Anderson chain at Duke and the Halsted-Young succession at Hopkins. The Penn surgical trunk now extends: Physick (1805) - Ravdin (1945) - Rhoads (1959)."}, {"source": 98, "target": 99, "edge_type": "direct_training", "start_year": 1963, "module": "02_general_surgery_spread", "source_name": "Jonathan E. Rhoads", "target_name": "Clyde F. Barker", "temporal_range": "c.1963-c.1969", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 14606488", "notes": "[Verified 2026-03-17 | Proc Am Philos Soc 2003 | content_match] Clyde F. Barker trained as a surgical resident at the Hospital of the University of Pennsylvania during the Rhoads chairmanship (c.1963-1969). Barker subsequently became the Donald Guthrie Professor of Surgery at Penn and authored the definitive obituaries of Rhoads in the Annals of Surgery (PMC1422501), Proceedings of the American Philosophical Society (PMID 14606488), and Surgery (2003). The PMC article 'Heroes and Friends' by Edward M. Copeland III (PMID not confirmed, PMC1421048) describes entering the Penn residency in 1963 and training alongside Barker under Rhoads. Barker later became Penn surgery chair, creating a 3-generation succession: Ravdin-Rhoads-Barker. Exact residency dates approximated from the Copeland memoir timeline."}, {"source": 20, "target": 100, "edge_type": "direct_training", "start_year": 1929, "module": "02_general_surgery_spread", "source_name": "Elliott Cutler", "target_name": "Robert M. Zollinger", "temporal_range": "c. 1929-1932", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 12946817", "notes": "[Verified 2026-03-17 | Am J Surg 2003 | content_match] Robert Milton Zollinger (1903-1992) earned his MD from Ohio State (1927), interned at Peter Bent Brigham Hospital (1928), then completed his surgical residency under Elliott Cutler at Western Reserve University (c. 1929-1932). Cutler returned to Brigham as Moseley Professor of Surgery in 1932; Zollinger subsequently held faculty positions before returning to Ohio State as chair in 1947. This edge extends the Halsted-Cushing-Cutler chain to a 4th generation. Citation is Lewis L, Van Brimmer B, 'A biography of Robert Milton Zollinger, M.D.,' Am J Surg 2003;186(3):205-7."}, {"source": 100, "target": 84, "edge_type": "governance_leadership", "start_year": 1947, "module": "02_general_surgery_spread", "source_name": "Robert M. Zollinger", "target_name": "Ohio State University Department of Surgery", "temporal_range": "1947-1974", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 12946818", "notes": "[Verified 2026-03-17 | Am J Surg 2003 | content_match] Zollinger returned to his alma mater as professor and chair of surgery in 1947, transforming Ohio State from a modest Midwestern program into a nationally recognized surgical training center over a 27-year tenure. He co-discovered the Zollinger-Ellison syndrome with Edwin Ellison (1955), whom he recruited to Ohio State. The endowed Robert M. Zollinger Chair of Surgery was later established in his honor. His successor as chair was Larry C. Carey (1975). Citation is Zollinger RM Sr, Ellison EC, 'A history of the Ohio State University Department of Surgery,' Am J Surg 2003;186(3):208-10."}, {"source": 61, "target": 101, "edge_type": "direct_training", "start_year": 1970, "module": "02_general_surgery_spread", "source_name": "Peter Bent Brigham Hospital Department of Surgery", "target_name": "Murray F. Brennan", "temporal_range": "1970-1975", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 31944281", "notes": "[Phase2 reviewed — citation retained on 2026-03-17] Murray Frederick Brennan (b. 1940, New Zealand) received his MB ChB from the University of Otago (1964), then won a Fulbright Scholarship as a clinical research fellow in surgery at Harvard Medical School and completed a second surgical residency at the Peter Bent Brigham Hospital (c.1970-1975). Printz (Cancer 2020, PMID 31944281) confirms the Brigham training. During this period Francis D. Moore was surgeon-in-chief at the Brigham (until 1976), and Steven Rosenberg was a fellow resident who later recruited Brennan to the NCI. This edge connects Brennan to the Moore/Brigham trunk already in the graph (Moore->Brigham Department, Murray->Brigham Transplant), creating a pathway from the Harvard/Brigham institutional lineage to MSK surgical oncology."}, {"source": 14, "target": 102, "edge_type": "direct_training", "start_year": 1934, "module": "02_general_surgery_spread", "source_name": "Alfred Blalock", "target_name": "Mark M. Ravitch", "temporal_range": "1934-1943", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 32106907", "notes": "[Phase2 reviewed — citation retained on 2026-03-17] Mark Mitchell Ravitch (1910-1989) earned his MD from Johns Hopkins (1934) and completed his surgical training there under Alfred Blalock, finishing as chief resident in 1943. Their personal and professional relationship lasted throughout Blalock's lifetime. After Army service in WWII (56th General Hospital, France), Ravitch returned to Hopkins as professor of surgery (1946). He held positions at Columbia P&S / Mount Sinai (1952-1955), returned to Hopkins (1956), spent time at University of Chicago (1966-1969), then moved to University of Pittsburgh / Montefiore Hospital (1969-1989). Ravitch introduced modern surgical stapling to the United States after observing Soviet stapling instruments in Kiev (1958), developing them with Felicien Steichen for commercial use by 1967. He also pioneered the Ravitch procedure for pectus excavatum and non-operative management of intussusception. He authored 453 papers, 101 book chapters, and 22 books, including 'A Century of Surgery' (history of the ASA). Citation is Abeshouse M, Goldstein S, Phillips B, 'Mark M. Ravitch: A Staple in Surgical History and Innovation,' Am Surg 2020;86(2):e89-e91."}, {"source": 24, "target": 103, "edge_type": "direct_training", "start_year": 1949, "module": "02_general_surgery_spread", "source_name": "Columbia University Department of Surgery", "target_name": "Keith Reemtsma", "temporal_range": "1949-1957", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 25135241", "notes": "[Verified 2026-03-17 | J Thorac Cardiovasc Surg 2015 | content_match] Keith Reemtsma (1925-2000) earned his MD from the University of Pennsylvania (1949), then completed his surgical internship and residency at Columbia-Presbyterian Medical Center (1949-1957) under George Humphreys, with an interruption for Korean War service as a Navy surgeon (1951-1954). He was chief resident at Columbia and earned a doctorate in medical science there (1958). He then moved to Tulane University (1958-1966), recruited by Oscar Creech Jr. (a DeBakey trainee, already in graph from Session 1 T2-01), where he performed the pioneering chimpanzee-to-human kidney xenotransplants (1963-1964). Citation is DeAnda A, Balsam LB, 'Historical perspectives of The American Association for Thoracic Surgery: Keith Reemtsma (1925-2000),' J Thorac Cardiovasc Surg 2015;149(3):762-4."}, {"source": 103, "target": 24, "edge_type": "governance_leadership", "start_year": 1971, "module": "02_general_surgery_spread", "source_name": "Keith Reemtsma", "target_name": "Columbia University Department of Surgery", "temporal_range": "1971-1994", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 25135241", "notes": "[Verified 2026-03-17 | J Thorac Cardiovasc Surg 2015 | content_match] Reemtsma was appointed chairman of the Department of Surgery at Columbia University College of Physicians and Surgeons in 1971, a position he held for 23 years until 1994. He had previously served as chair at the University of Utah (1966-1971), where he assembled the team that produced the first artificial heart. At Columbia, he transformed the department from a focus on radical excision toward transplantation, reconstruction, and repair. He established the Columbia heart transplant program with Eric Rose and recruited Mark Hardy to build the kidney transplant and dialysis service. He also founded the International Center for Health Outcomes and Innovation Research. This creates a bidirectional circuit with the training edge above (trained at Columbia, returned as chair), paralleling the Cameron-Hopkins circuit already in the graph. Citation same as training edge."}, {"source": 73, "target": 104, "edge_type": "direct_training", "start_year": 1949, "module": "02_general_surgery_spread", "source_name": "UCSF Department of Surgery", "target_name": "William Silen", "temporal_range": "c. 1949-1955", "confidence": "high", "evidence_type": "institutional_archive", "evidence_citation": "HMS_Archive_Silen", "notes": "William Silen (1927-2022) graduated from UCSF Medical School (1949) and trained in surgery at UCSF. CORRECTION: The expansion target T2-09 incorrectly stated Silen trained at Hopkins under Blalock. All verified sources (Harvard DICP profile, BIDMC history, obituaries) confirm he trained at UCSF. Exact residency years approximated as c. 1949-1955. This creates a second outgoing training edge for the UCSF Department of Surgery (alongside the existing Dunphy node), extending the West Coast academic surgery network. PMID upgrade candidate: search for Silen tribute in Annals of Surgery or JACS post-2022."}, {"source": 104, "target": 105, "edge_type": "institutional_founder", "start_year": 1966, "module": "02_general_surgery_spread", "source_name": "William Silen", "target_name": "Beth Israel Hospital Department of Surgery", "temporal_range": "1966-1994", "confidence": "high", "evidence_type": "institutional_archive", "evidence_citation": "BIDMC_Archive_Silen", "notes": "Silen was chief of surgery at Beth Israel Hospital (BIH) and the Johnson and Johnson Professor of Surgery at Harvard Medical School from 1966 to 1994, a 28-year tenure that built BIH into a major Harvard surgical training program. He edited Cope's Early Diagnosis of the Acute Abdomen for generations and published landmark work on stress ulcer pathogenesis. After stepping down as chair, he became the first Dean for Faculty Development and Diversity at Harvard Medical School. Edge typed as institutional_founder rather than governance_leadership because Silen effectively created the modern BIH surgical program as a nationally recognized training center. Creates a new institutional node (Beth Israel Hospital Department of Surgery) in the Harvard ecosystem alongside the existing Brigham and MGH nodes."}, {"source": 14, "target": 106, "edge_type": "direct_training", "start_year": 1946, "module": "02_general_surgery_spread", "source_name": "Alfred Blalock", "target_name": "H. William Scott Jr.", "temporal_range": "1946-1952", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 37746597", "notes": "[Phase2 reviewed — citation retained on 2026-03-17] H. William Scott Jr. (1916-1998) graduated from Harvard Medical School (1941), completed surgical residency at Peter Bent Brigham Hospital and Boston Children's Hospital, held the Harvey Cushing Fellowship in Neurosurgery at Brigham (1945), then served as assistant resident and chief resident under Alfred Blalock at Johns Hopkins (1946-1947). He remained on the Hopkins faculty as instructor through associate professor (1946-1952) before being recruited to Vanderbilt. Blalock directly recommended Scott for the Vanderbilt chairmanship, telling him 'he could not turn down the opportunity and that he wanted me to go and do everything I could to turn Vanderbilt into a Hopkins.' Scott was president of ASA, ACS, Southern Surgical Association, Halsted Society, and multiple other societies. Citation is Merrill WH, Geevarghese SK, 'Genius is Largely a Matter of Making a Continuous Effort: A Reappraisal of the Contributions of H. William Scott, Jr., MD,' Ann Surg Open 2023;4(3):e312."}, {"source": 106, "target": 28, "edge_type": "institutional_succession", "start_year": 1952, "module": "02_general_surgery_spread", "source_name": "H. William Scott Jr.", "target_name": "Vanderbilt University Department of Surgery", "temporal_range": "1952-1982", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 37746597", "notes": "[Phase2 reviewed — citation retained on 2026-03-17] Scott succeeded Barney Brooks as chair of surgery at Vanderbilt in 1952, at age 36 the youngest surgery chair in the country. He held the position for 30 years until 1982, establishing a surgical research facility, creating specialty divisions (urology, orthopedics, neurosurgery), and training many academic surgeons. The H. William Scott Jr. Society was founded in 1972 by his former residents. His successor was John Sawyers (interim 1982-1983, then permanent). John Cameron was initially recruited from Hopkins but chose to remain in Baltimore. This creates the chain Halsted→Brooks→Vanderbilt→Scott (via Blalock), showing how two separate Halsted trainees (Brooks and Blalock) converged on the same institution across generations. Citation same as training edge."}, {"source": 5, "target": 32, "edge_type": "direct_training", "start_year": 1920, "module": "02_general_surgery_spread", "source_name": "Harvey Cushing", "target_name": "Daniel Elkin", "temporal_range": "c. 1920-1923", "confidence": "high", "evidence_type": "institutional_archive", "evidence_citation": "Emory_Archive_Elkin_FindingAid", "notes": "Daniel Collier Elkin (1893-1958) graduated from Emory University School of Medicine (1920), then served three years as intern and resident in surgery at Peter Bent Brigham Hospital in Boston under Harvey Cushing. The Emory archival finding aid states: 'Elkin served three years as an intern and resident in surgery at the Peter Bent Brigham Hospital in Boston, where he worked with Dr. Harvey W. Cushing, a pioneer of brain surgery who is often referred to as the father of modern neurosurgery. Cushing was an influential figure who shaped Elkin's interest in teaching and research.' Elkin returned to Atlanta and was appointed first chair of surgery at Emory in 1930 (existing edge in graph). He was a pioneer in vascular surgery (62 aortic aneurysm repairs by 1934, Rudolph Matas Award 1940) and served as president of ASA, ACS (1956-57), Southern Surgical Association, and multiple other societies. He co-authored the history of vascular surgery in WWII with DeBakey. This edge connects the orphaned Emory chain to the Hopkins trunk: Halsted→Cushing→Elkin→Emory. Cushing's out-degree increases (now: Cutler, Naffziger, Elkin). PMID upgrade candidate: search for Elkin obituary in Ann Surg or Surgery c. 1959."}, {"source": 36, "target": 34, "edge_type": "direct_training", "start_year": 1912, "module": "02_general_surgery_spread", "source_name": "Massachusetts General Hospital Department of Surgery", "target_name": "Frederick Coller", "temporal_range": "1912-c. 1917", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 14036574", "notes": "Frederick Amasa Coller (1887-1964) graduated from Harvard Medical School (1912) and was appointed intern on the west surgical service at Massachusetts General Hospital. He was the first surgical resident appointed at MGH, chosen by unanimous vote of all attending surgeons. He served in WWI in France as a member of the Harvard Medical Unit led by Harvey Cushing, taking over one of the surgical services of the American Ambulance Service. After the war he joined the University of Michigan in 1920. Coller was already in the graph with two outgoing edges (→Michigan Dept of Surgery as institutional_founder, →Jonasson via Warren Cole) but had NO incoming training edge, making him an orphaned source node. This edge connects Michigan to the Harvard/MGH cluster through the chain MGH→Coller→Michigan→Jonasson→Ohio State, creating a 4-node institutional corridor from Boston to the Midwest. PMID upgrade candidate: PMID 14257360 (Ann R Coll Surg Engl 1965 obituary) or full text of Ann Surg 1961 supplement (PMC1466805) should confirm MGH training. [Citation upgraded from institutional_archive to PMID: 14036574 on 2026-03-18 — Adie, Ann Surg 1961;154(Suppl):18-24. Content-match confirmed: Coller first appointed intern on West Surgical Service at MGH July 1912, then surgical residency.]"}, {"source": 71, "target": 107, "edge_type": "direct_training", "start_year": 1978, "module": "02_general_surgery_spread", "source_name": "John L. Cameron", "target_name": "Keith D. Lillemoe", "temporal_range": "1978-1985", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 29189382", "notes": "[V8 upgraded institutional_archive -> PMID: PMID: 29189382 on 2026-03-31] Javed AA, Weiss MJ. 'John L. Cameron: A Historical Perspective.' Ann Surg. 2018;267(2S Suppl 2):S40-S44. Keith D. Lillemoe (MD Johns Hopkins 1978) served his entire surgical training at The Johns Hopkins Hospital (1978-1985) under John L. Cameron, who became Hopkins surgery chair in 1984. The SUS Lifetime Achievement Award profile (2021) states that Cameron was named chair when Lillemoe was a 4th-year resident, and that 'even now, four decades after finishing his residency, Dr. Cameron is still his mentor.' Cameron recruited Lillemoe and Charles Yeo as the first wave of faculty to build the Hopkins pancreatic surgery program, growing from 20 to 200 Whipple procedures per year. Lillemoe served as associate program director (1993-2003) and vice-chairman (1997-2003) before leaving Hopkins. The AHPBA profile and ACS Fireside Chat confirm the training relationship. CORRECTION to expansion target T3-06: The target listed 'Cameron→Lillemoe→Kirk' as a Hopkins succession, but Lillemoe went to Indiana (2003) then MGH (2011), not back to Hopkins. Kirk is at Duke. The actual Hopkins succession post-Cameron is Freischlag (already in graph)."}, {"source": 107, "target": 36, "edge_type": "governance_leadership", "start_year": 2011, "module": "02_general_surgery_spread", "source_name": "Keith D. Lillemoe", "target_name": "Massachusetts General Hospital Department of Surgery", "temporal_range": "2011-Present", "confidence": "high", "evidence_type": "institutional_archive", "evidence_citation": "MGH_Archive_Lillemoe", "notes": "In May 2011, Lillemoe was appointed Surgeon-in-Chief and Chief of the Department of Surgery at Massachusetts General Hospital and the W. Gerald Austen Professor of Surgery at Harvard Medical School. He also serves as Editor-in-Chief of the Annals of Surgery. The MGH Department of Surgery profile and ACS Fireside Chat confirm the appointment. This edge connects the Hopkins training lineage to the MGH institutional trunk: the chain Halsted→Hopkins→Cameron→Lillemoe→MGH creates a rare cross-institutional circuit where a Hopkins-trained surgeon leads the independent Harvard/MGH trunk. The MGH node already has edges from Richardson→Churchill and Churchill→MGH (WWII). Lillemoe's appointment parallels the Blalock→Sabiston→Duke pattern where a Hopkins trainee leads a peer institution. He was also elected ASA president, is a Senior Director of the ABS, and elected to the National Academy of Medicine (2018)."}, {"source": 47, "target": 108, "edge_type": "direct_training", "start_year": 1947, "module": "02_general_surgery_spread", "source_name": "Henry Harkins", "target_name": "Lloyd M. Nyhus", "temporal_range": "1947-1956", "confidence": "high", "evidence_type": "DOI", "evidence_citation": "DOI: 10.1007/s10029-009-0522-1", "notes": "[Phase2 reviewed — citation retained on 2026-03-17] Lloyd Milton Nyhus (1923-2008) earned his MD from the Medical College of Alabama (1947) and completed surgical training at the University of Washington under his mentor Henry Harkins, finishing in 1956. He remained on the UW faculty until being recruited to the University of Illinois in 1967. Nyhus co-authored his first hernia publication with Harkins (Nyhus LM, Stevenson JK, Harkins HN, 'Preperitoneal herniorrhaphy,' West J Surg 1959), establishing the preperitoneal approach that bears his name (Nyhus classification). Harkins is already in the graph with Hopkins→Harkins (direct_training) and Harkins→UW (institutional_founder). This edge extends the chain: Hopkins→Harkins→Nyhus→Illinois. Citation is DeBord JR, 'Lloyd Milton Nyhus, MD,' Hernia 2009;13:405-6. PMID upgrade candidate: verify if this DOI has an associated PMID in PubMed."}, {"source": 108, "target": 109, "edge_type": "institutional_succession", "start_year": 1967, "module": "02_general_surgery_spread", "source_name": "Lloyd M. Nyhus", "target_name": "University of Illinois College of Medicine Department of Surgery", "temporal_range": "1967-1989", "confidence": "moderate", "evidence_type": "institutional_archive", "evidence_citation": "of_Archive_Nyhus", "notes": "[Phase2 downgraded from DOI: 10.1007/s10029-009-0522-1 to institutional_archive on 2026-03-17 — no PubMed source found] Nyhus was recruited to succeed Warren Cole (already in graph; Cole→Jonasson training edge exists) as Warren H. Cole Professor and Head of the Department of Surgery at the University of Illinois College of Medicine at Chicago in 1967. He held the position for 22 years until 1989, training nearly 300 surgeons. He was named to the Warren H. Cole Chair, explicitly linking his institutional role to Cole's legacy. Nyhus authored the definitive hernia textbook (Hernia, co-authored with Harkins, later with Condon), Mastery of Surgery, and Surgery of the Stomach and Duodenum. He served as chairman of the American Board of Surgery, president of the International Society of Surgery, president of the Society of University Surgeons, and first vice-president of both the ACS and ASA. University of Illinois is a new institutional node, connecting through the implicit Cole lineage. Citation same as training edge."}, {"source": 110, "target": 111, "edge_type": "governance_leadership", "start_year": 1971, "module": "02_general_surgery_spread", "source_name": "Claude H. Organ Jr.", "target_name": "Creighton University Department of Surgery", "temporal_range": "1971-1982", "confidence": "high", "evidence_type": "institutional_archive", "evidence_citation": "ACS_Archive_Organ_Presidency", "notes": "Organ was appointed chair of surgery at Creighton University in 1971, becoming the first African American to chair a surgery department at a predominantly white medical school in the United States. He held this position for 11 years (1971-1982), developing the surgical residency program before moving to the University of Oklahoma (1982-1988) and then UCSF East Bay (1989-2003). Creighton University Department of Surgery is a new institutional node. Organ trained entirely within the Creighton system (MD 1952, residency, MS in Surgery 1957), so no training edge to an existing graph node is available — he is connected to the main trunk solely through the ACS governance hub."}, {"source": 76, "target": 112, "edge_type": "direct_training", "start_year": 1970, "module": "02_general_surgery_spread", "source_name": "John Najarian", "target_name": "David Sutherland", "temporal_range": "1970-1974", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 36528870", "notes": "Sutherland trained in Najarian's transplant fellowship at Minnesota. He pioneered pancreas and islet transplantation and remained at Minnesota for his entire career. Knatterud et al. (Clin Transplant 2023) Najarian Festschrift documents the training program and names Sutherland among the prominent graduates."}, {"source": 76, "target": 113, "edge_type": "direct_training", "start_year": 1971, "module": "02_general_surgery_spread", "source_name": "John Najarian", "target_name": "Clive Callender", "temporal_range": "1971-1973", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 36528870", "notes": "Callender trained in kidney transplantation under Najarian and Richard Simmons at Minnesota (1971-1973). Knatterud et al. (Clin Transplant 2023) Najarian Festschrift names Callender specifically as a trainee who 'founded the transplant program at Howard University College of Medicine.' Callender was the third African American transplant surgeon."}, {"source": 113, "target": 45, "edge_type": "governance_leadership", "start_year": 1996, "module": "02_general_surgery_spread", "source_name": "Clive Callender", "target_name": "Howard University Department of Surgery", "temporal_range": "1996-2010", "confidence": "high", "evidence_type": "institutional_archive", "evidence_citation": "institutional_archive", "notes": "Callender served as Chair of the Department of Surgery at Howard University College of Medicine. He also founded the Howard University Hospital Transplant Center in 1974 — the first minority-directed transplant program in the US. CANDIDATE FOR PMID UPGRADE: search for Callender Howard transplant J Natl Med Assoc."}, {"source": 22, "target": 60, "edge_type": "direct_training", "start_year": 1939, "module": "02_general_surgery_spread", "source_name": "Edward Churchill", "target_name": "Francis D. Moore", "temporal_range": "1939-1946", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMCID: PMC1422478", "notes": "Moore trained at MGH under Churchill's rectangular residency system (1939-1946 including wartime service). Brennan (Ann Surg 2002, PMC1422478) documents Moore's MGH residency and subsequent Brigham appointment. Moore was not Hopkins-trained — he came through the independent MGH/Harvard system. [V6 verification: original PMID 11885952 failed content match — downgraded to institutional_archive with PMC1422478] [Citation upgraded from institutional_archive to PMCID: PMC1422478 on 2026-03-18 — Brennan, Ann Surg 2002;235:600-601. Content-match confirmed: Moore residency at MGH documented.]"}, {"source": 60, "target": 66, "edge_type": "direct_training", "start_year": 1951, "module": "02_general_surgery_spread", "source_name": "Francis D. Moore", "target_name": "Joseph E. Murray", "temporal_range": "1951-1954", "c ns — the first neurosurgical society in the world. Co-founders included Ernest Sachs, Alfred Adson, Charles Frazier, Gilbert Horrax, and Samuel Harvey. Walter Dandy was invited but declined due to strained relationships with Cushing and Frazier. [Phase2 upgraded institutional_archive -> PMID: 33307257 on 2026-03-18] [Verified 2026-03-18 | World Neurosurg 2021 | content_match] Cohen-Gadol AA, et al. 'The Original Cushing Society: A Historical Review of the Senior Society's First 6 Meetings.' World Neurosurg. 2021 Mar;147:e457-e464. States 'The Society of Neurological Surgeons (SNS) was ultimately founded in 1920 by Dr. Harvey Cushing.' Documents founding members, first meeting at Peter Bent Brigham Hospital, Cushing as first president."}, {"source": 137, "target": 142, "edge_type": "institutional_founder", "start_year": 1926, "module": "03_neurosurgery", "source_name": "Walter Dandy", "target_name": "Johns Hopkins Hospital Department of Neurosurgery", "temporal_range": "1926-1946", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 40609741", "notes": "[Phase2 replaced PMID: 20305736 -> PMID: 40609741 on 2026-03-17] [Verified 2026-03-17 | Neurocirugia (Engl Ed) 2025 | content_match] Dandy established the first dedicated neurosurgical intensive care unit."}, {"source": 9, "target": 73, "edge_type": "institutional_founder", "start_year": 1929, "module": "03_neurosurgery", "source_name": "Howard Naffziger", "target_name": "UCSF Department of Surgery", "temporal_range": "1929-1947", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 8692401", "notes": "Naffziger became chair in 1929 and developed a residency program explicitly modeled after Halsted's system, transforming UCSF into a nationally prominent surgical program. [Phase2 upgraded institutional_archive -> PMID: 8692401 on 2026-03-18] [Verified 2026-03-18 | Neurosurgery 1996 | content_match] Rosegay H. 'A history of neurological surgery at the University of California nford institutional nodes are now bridged through Shumway's governance of both. Stanford Department of Surgery goes from degree 1 (Holman, 1925) to degree 2, gaining its first post-1925 edge."}, {"source": 173, "target": 181, "edge_type": "direct_training", "start_year": 1975, "module": "04_cardiothoracic_vascular", "source_name": "Norman Shumway", "target_name": "Bruce Reitz", "temporal_range": "1975-1981", "confidence": "high", "evidence_type": "institutional_archive", "evidence_citation": "Stanford_Archive_Reitz", "notes": "Reitz trained under Shumway at Stanford and performed the world's first successful heart-lung transplant in 1981, extending the Minnesota-Stanford cardiac transplant lineage."}, {"source": 57, "target": 165, "edge_type": "governance_leadership", "start_year": 1978, "module": "04_cardiothoracic_vascular", "source_name": "David Sabiston", "target_name": "American Association for Thoracic Surgery", "temporal_range": "1978-1979", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 22248679", "notes": "[Verified 2026-03-17 | J Thorac Cardiovasc Surg 2012 | content_match] Sabiston served as 65th president of the AATS; four of his trainees (Ebert, Cox, Crawford Jr, Spray) subsequently became AATS presidents, extending the Halsted-Blalock lineage through cardiothoracic governance."}, {"source": 172, "target": 182, "edge_type": "direct_training", "start_year": 1982, "module": "04_cardiothoracic_vascular", "source_name": "E. Stanley Crawford", "target_name": "Hazim Safi", "temporal_range": "1982-1983", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 27751576", "notes": "[V8 upgraded institutional_archive -> PMID: PMID: 27751576 on 2026-03-31] Hittinger SA, Theruvath TP, Ikonomidis JS. 'Historical perspectives of The American Association for Thoracic Surgery: Joseph S. Coselli, MD.' J Thorac Cardiovasc Surg. 2017;153(1):2-5. States 'Safi changed institutions, leaving Coselli to run Crawford's service on his own' — confirming Safi as Crawford associate at Baylor before departing to found UTHealth CT department in 1999. Additionally, multiple biographical sources (HCA Houston, Audible Bleeding podcast) confirm 'studying under Dr. Michael DeBakey and Dr. Stanley Crawford' at Baylor CT residency 1977-1983. Safi trained under Crawford at Baylor, later succeeding his lineage by establishing the dedicated comprehensive aortic center at UTHealth."}, {"source": 38, "target": 183, "edge_type": "direct_training", "start_year": 1960, "module": "04_cardiothoracic_vascular", "source_name": "Michael DeBakey", "target_name": "George P. Noon", "temporal_range": "1960-1965", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 26635916", "notes": "George P. Noon (MD Baylor 1960) began his surgical residency at Baylor in 1960 under DeBakey and joined the faculty in 1965. The Baylor Department of Surgery History of Leadership page documents that Noon 'brought great distinction to Baylor College of Medicine beginning in 1956, when he was a medical student, and to the Department of Surgery since 1965.' In 1968, Noon and DeBakey performed among the first heart transplants in the US. In 1988, Noon and DeBakey met with NASA engineers to develop the miniature axial flow blood pump (MicroMed DeBakey-Noon VAD). Noon supervised the Yeltsin bypass surgery alongside DeBakey in 1996. Over 350 publications. The Noon-DeBakey partnership represents one of the longest surgeon-mentor collaborations in American cardiovascular surgery history (1960-2008). [Phase2 upgraded institutional_archive -> PMID: 26635916 on 2026-03-18] [Verified 2026-03-18 | Methodist Debakey Cardiovasc J 2015 | content_match] States that 'Edward B. Dietrich and George P. Noon finished their cardiovascular surgical training and joined DeBakey' in 1965."}, {"source": 38, "target": 184, "edge_type": "direct_training", "start_year": 1964, "module": "04_cardiothoracic_vascular", "source_name": "Michael DeBakey", "target_name": "Kenneth L. Mattox", "temporal_range": "1964-c.1970", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 26635916", "notes": "Kenneth L. Mattox (b. 1938, MD Baylor 1964) trained in general and thoracic surgery at Baylor under DeBakey and became professor and vice chairman of surgery in the Michael E. DeBakey Department of Surgery. He serves as chief of staff and chief of surgery at Ben Taub General Hospital (Harris County's Level I trauma center). Mattox authored the definitive personal tribute 'Michael Ellis DeBakey, MD: Texas Physician Personified' in Texas Medicine (2008), written from the perspective of a trainee and career-long colleague. He is internationally recognized as a leader in trauma surgery and organized the annual Trauma, Critical Care and Acute Care Surgery conference for decades. This edge connects the DeBakey cardiovascular hub to the trauma surgery network. [Phase2 upgraded institutional_archive -> PMID: 26635916 on 2026-03-18] [Verified 2026-03-18 | Methodist Debakey Cardiovasc J 2015 | content_match] Winters article names DeBakey's team including Mattox. BCM History of Leadership page confirms Mattox trained under DeBakey. Mattox also authored PMID 20073164 (Methodist Debakey Cardiovasc J 2009) as a DeBakey tribute."}, {"source": 38, "target": 185, "edge_type": "direct_training", "start_year": 1950, "module": "04_cardiothoracic_vascular", "source_name": "Michael DeBakey", "target_name": "George C. Morris Jr.", "temporal_range": "1950-c.1956", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 26635916", "notes": "George C. Morris Jr. (MD University of Pennsylvania 1948) served as 'the first surgical resident under Dr. Michael E. DeBakey in 1950' per the Baylor Department of Surgery History of Leadership page. DeBakey stated that 'George Morris was one of the best surgeons he ever trained.' Morris became a pioneer in peripheral vascular surgery at Baylor and published extensively with DeBakey on arterial reconstruction. He served as chief of surgery at the DeBakey VA Medical Center. As DeBakey's first resident at Baylor, Morris represents the origin point of the Baylor surgical training lineage. [Phase2 upgraded institutional_archive -> PMID: 26635916 on 2026-03-18] [Verified 2026-03-18 | Methodist Debakey Cardiovasc J 2015 | content_match] Names Morris among DeBakey's legendary surgical associates. BCM History of Leadership confirms Morris as DeBakey trainee."}, {"source": 38, "target": 186, "edge_type": "direct_training", "start_year": 1958, "module": "04_cardiothoracic_vascular", "source_name": "Michael DeBakey", "target_name": "H. Edward Garrett Sr.", "temporal_range": "c.1958-1964", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 26635916", "notes": "H. Edward Garrett Sr. 'joined the Department of Surgery faculty after completing his training in general and thoracic surgery at Baylor College of Medicine under the direction of Dr. Michael E. DeBakey' per the Baylor History of Leadership page. In 1964, Garrett performed the first successful coronary artery bypass graft and subsequently published the first series of bypass operations for lower leg arteries. This operation — arguably the most consequential procedure in modern cardiovascular surgery — was performed by a DeBakey trainee using techniques developed under DeBakey's mentorship. Exact residency start date approximated from career timeline. [Phase2 upgraded institutional_archive -> PMID: 26635916 on 2026-03-18] [Verified 2026-03-18 | Methodist Debakey Cardiovasc J 2015 | content_match] States 'Dr. Ed Garrett completed his cardiovascular surgical training at Baylor and joined the DeBakey staff' and 'in 1964 performed the first aorta-to-coronary artery bypass.' BCM History of Leadership confirms training under DeBakey."}, {"source": 38, "target": 187, "edge_type": "direct_training", "start_year": 1949, "module": "04_cardiothoracic_vascular", "source_name": "Michael DeBakey", "target_name": "Oscar Creech Jr.", "temporal_range": "1949-1956", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 26635916", "notes": "Oscar Creech Jr. (MD Jefferson Medical College 1941, residency Tulane) joined DeBakey at Baylor University College of Medicine in 1949, one of DeBakey's earliest recruits along with Cooley and Morris. Cooley's memorial for DeBakey (Tex Heart Inst J 2008) names Creech among the founding Baylor surgery staff: 'His early staff included me and Drs. Oscar Creech, B.W. Haynes, and John Howard.' Creech served at Baylor until 1956, then returned to Tulane University as professor and chair of the Department of Surgery, thereby extending the DeBakey lineage back to the Ochsner/Tulane trunk from which DeBakey himself originated — creating a Hopkins-like bidirectional circuit (Ochsner trained DeBakey at Tulane; DeBakey trained Creech at Baylor; Creech returned to lead Tulane). [Phase2 upgraded institutional_archive -> PMID: 26635916 on 2026-03-18] [Verified 2026-03-18 | Methodist Debakey Cardiovasc J 2015 | content_match] Names 'Oscar Creech Jr. (1949)' as one of DeBakey's first associates at Baylor. BCM History of Leadership confirms Creech joined DeBakey in 1949."}, {"source": 56, "target": 188, "edge_type": "direct_training", "start_year": 1966, "module": "04_cardiothoracic_vascular", "source_name": "John Kirklin", "target_name": "Albert Pacifico", "temporal_range": "1966-1972", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 32497720", "notes": "Pacifico trained in CT surgery under Kirklin at UAB. Holman et al. (Semin Thorac Cardiovasc Surg 2020) documents the UAB CT training lineage. Stephenson (JTCVS 2007) Figure 2 photographs Pacifico with Kirklin at UAB (~1970). Pacifico succeeded Kirklin as chief of CT surgery at UAB."}, {"source": 56, "target": 189, "edge_type": "direct_training", "start_year": 1967, "module": "04_cardiothoracic_vascular", "source_name": "John Kirklin", "target_name": "Nicholas Kouchoukos", "temporal_range": "1967-1973", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 32497720", "notes": "Kouchoukos trained in CT surgery under Kirklin at UAB. Holman et al. (Semin Thorac Cardiovasc Surg 2020) names him among Kirklin's UAB trainees. Kouchoukos became co-author of the 3rd edition of Kirklin/Barratt-Boyes Cardiac Surgery (2003) and a leading aortic surgeon at Washington University."}, {"source": 172, "target": 190, "edge_type": "direct_training", "start_year": 1984, "module": "04_cardiothoracic_vascular", "source_name": "E. Stanley Crawford", "target_name": "Joseph S. Coselli", "temporal_range": "1984-1991", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 27751576", "notes": "TARGET MODULE: 04_cardiothoracic_vascular. Hittinger SA, Theruvath TP, Ikonomidis JS. 'Historical perspectives of The American Association for Thoracic Surgery: Joseph S. Coselli, MD.' J Thorac Cardiovasc Surg. 2017;153(1):2-5. Coselli completed general surgery residency (1977-82) and CT surgery fellowship (1982-84) at Baylor under DeBakey, then became Crawford's junior associate. Crawford personally recruited him: 'When you finish, if you elect to, come on board.' After Crawford's death in January 1991, Coselli continued Crawford's aortic surgery legacy as chief of CT surgery at Baylor. Has performed >10,000 aortic repairs including >3,600 thoracoabdominal. This extends the DeBakey→Crawford→Coselli chain to three generations and adds the Baylor aortic surgery succession."}, {"source": 191, "target": 192, "edge_type": "governance_leadership", "start_year": 1895, "module": "04_cardiothoracic_vascular", "source_name": "Rudolph Matas", "target_name": "Tulane University Department of Surgery", "temporal_range": "1895-1927", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 35412399", "notes": "TARGET MODULE: 04_cardiothoracic_vascular. Matas appointed Chair of Surgery at Tulane at age 35 (1895), held position 32 years until emeritus 1927. Called 'Father of Vascular Surgery' by William Osler. Pioneer of endoaneurysmorrhaphy. First Tulane and New Orleans node in graph. Field RJ. Am Surg. 2022;88(5):823-827. V9 expansion Apr 2026."}, {"source": 191, "target": 165, "edge_type": "society_founder", "start_year": 1917, "module": "04_cardiothoracic_vascular", "source_name": "Rudolph Matas", "target_name": "American Association for Thoracic Surgery", "temporal_range": "1917-1919", "confidence": "high", "evidence_type": "institutional_archive", "evidence_citation": "NLM_AATS_Finding_Aid", "notes": "TARGET MODULE: 04_cardiothoracic_vascular. Matas was one of 50 founding members of AATS at AMA Annual Meeting June 7 1917, served as 3rd President in 1919. NLM Archives confirm founding membership. Joins Willy Meyer as second AATS co-founder edge. PMID upgrade candidate: JTCVS 1996 Matas biography. V9 expansion Apr 2026."}, {"source": 38, "target": 193, "edge_type": "direct_training", "start_year": 1959, "module": "04_cardiothoracic_vascular", "source_name": "Michael DeBakey", "target_name": "F. William Blaisdell", "temporal_range": "1959-1960", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 32649610", "notes": "[V10 UC Davis | route: 04_cardiothoracic_vascular] F. William Blaisdell completed a postresidency fellowship in cardiovascular surgery under Michael DeBakey in Houston. Knudson et al., J Trauma Acute Care Surg 2020;89(4):603-606 (PMID 32649610, full-text content-match verified): 'His postresidency training included a fellowship in cardiovascular surgery under Michael DeBakey in Houston.' THIS EDGE IS THE CONNECTIVITY BRIDGE anchoring the UC Davis cluster to the main component (DeBakey is an existing high-degree node). Exact fellowship years not stated in source; estimated 1959-1960 from his 1960 appointment as Chief of Surgical Service, SF VA. A Francis Moore->Blaisdell (Peter Bent Brigham) edge asserted by web
