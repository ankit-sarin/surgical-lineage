<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Surgical Lineage Atlas</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
:root {
  --ds-primary: #0A5E56;
  --ds-primary-mid: #3D8B82;
  --ds-primary-light: #DFF0ED;
  --ds-dark: #2C2C2C;
  --ds-accent: #B85D3A;
  --ds-accent-light: #F2E0D6;
  --ds-surface: #DFEBE9;
  --ds-bg: #EEF5F4;
  --ds-text: #2C2C2C;
  --ds-text-muted: #6B6B6B;
  --ds-border: #C5CDD6;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: 'IBM Plex Sans', Calibri, sans-serif;
  background: var(--ds-bg);
  color: var(--ds-text);
}
#app { display: flex; flex-direction: column; height: 100vh; }
header {
  background: var(--ds-primary);
  color: #fff;
  padding: 10px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  z-index: 10;
}
header .brand h1 {
  font-family: 'Fraunces', Georgia, serif;
  font-weight: 600;
  font-size: 20px;
  letter-spacing: -0.01em;
}
header .stats {
  display: flex;
  gap: 18px;
  font-family: 'IBM Plex Mono', Consolas, monospace;
  font-size: 12px;
  opacity: 0.85;
}
header .stats .stat-val { font-weight: 600; color: #fff; }
.toolbar {
  background: #fff;
  border-bottom: 1px solid var(--ds-border);
  padding: 8px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  flex-shrink: 0;
  font-size: 13px;
}
.toolbar label { font-weight: 500; color: var(--ds-text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
.toolbar select, .toolbar input[type="text"] {
  border: 1px solid var(--ds-border);
  border-radius: 4px;
  padding: 4px 8px;
  font-family: inherit;
  font-size: 13px;
  background: #fff;
  color: var(--ds-text);
}
.toolbar input[type="text"] { width: 160px; }
.toolbar .sep { width: 1px; height: 24px; background: var(--ds-border); }
.toolbar button {
  background: var(--ds-surface);
  border: 1px solid var(--ds-border);
  border-radius: 4px;
  padding: 4px 12px;
  font-family: inherit;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  color: var(--ds-text);
}
.toolbar button:hover { background: var(--ds-primary-light); }
.toolbar button.toggle-active {
  background: var(--ds-primary);
  color: #fff;
  border-color: var(--ds-primary);
}
.toolbar button.toggle-recessed {
  background: var(--ds-text-muted);
  color: #fff;
  border-color: var(--ds-text-muted);
}
.node-toggles { display: flex; gap: 6px; }
.node-toggle {
  display: flex; align-items: center; gap: 4px;
  padding: 3px 8px; border-radius: 4px;
  cursor: pointer; font-size: 12px; font-weight: 500;
  border: 2px solid transparent;
  user-select: none;
}
.node-toggle.active { border-color: currentColor; }
.node-toggle .dot { width: 10px; height: 10px; border-radius: 50%; }
.main { display: flex; flex: 1; overflow: hidden; position: relative; }
#graph-container { flex: 1; position: relative; overflow: hidden; background: var(--ds-bg); }
svg { width: 100%; height: 100%; }
.panel {
  width: 360px;
  background: #fff;
  border-left: 1px solid var(--ds-border);
  overflow-y: auto;
  flex-shrink: 0;
  transition: margin-right 0.25s ease;
  padding: 0;
}
.panel.hidden { margin-right: -360px; }
.panel-header {
  padding: 16px;
  border-bottom: 1px solid var(--ds-border);
  position: sticky;
  top: 0;
  background: #fff;
  z-index: 2;
}
.panel-header h2 {
  font-family: 'Fraunces', Georgia, serif;
  font-size: 18px;
  font-weight: 600;
  color: var(--ds-dark);
  line-height: 1.3;
  margin-bottom: 6px;
  padding-right: 30px;
}
.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 3px;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.badge-person { background: var(--ds-primary); color: #fff; }
.badge-institution { background: var(--ds-accent); color: #fff; }
.badge-society { background: var(--ds-dark); color: #fff; }
.panel-close {
  position: absolute;
  top: 12px;
  right: 12px;
  background: none;
  border: none;
  font-size: 20px;
  cursor: pointer;
  color: var(--ds-text-muted);
  line-height: 1;
}
.panel-body { padding: 16px; }
.conn-group { margin-bottom: 14px; }
.conn-group h3 {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--ds-primary);
  margin-bottom: 6px;
  padding-bottom: 4px;
  border-bottom: 1px solid var(--ds-primary-light);
}
.conn-item {
  padding: 6px 0;
  border-bottom: 1px solid #f0f0f0;
  font-size: 13px;
  line-height: 1.5;
}
.conn-item:last-child { border-bottom: none; }
.conn-link {
  color: var(--ds-primary);
  cursor: pointer;
  text-decoration: none;
  font-weight: 500;
}
.conn-link:hover { text-decoration: underline; }
.conn-meta { font-size: 11px; color: var(--ds-text-muted); margin-top: 2px; }
.conn-notes { font-size: 11px; color: var(--ds-text-muted); font-style: italic; margin-top: 2px; }
.ev-badge {
  display: inline-block;
  padding: 1px 5px;
  border-radius: 3px;
  font-size: 9px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  margin-left: 6px;
  vertical-align: middle;
}
.ev-badge-pmid { background: var(--ds-primary); color: #fff; }
.ev-badge-doi { background: var(--ds-primary-mid); color: #fff; }
.ev-badge-archive { background: #d0d0d0; color: #666; }
.legend {
  position: absolute;
  bottom: 16px;
  left: 16px;
  background: rgba(255,255,255,0.95);
  border: 1px solid var(--ds-border);
  border-radius: 6px;
  padding: 12px 16px;
  font-size: 11px;
  z-index: 5;
  max-width: 240px;
}
.legend h4 {
  font-weight: 600;
  margin-bottom: 6px;
  color: var(--ds-dark);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.legend-item { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.tooltip {
  position: absolute;
  pointer-events: none;
  background: rgba(44,44,44,0.92);
  color: #fff;
  padding: 6px 10px;
  border-radius: 4px;
  font-size: 12px;
  z-index: 20;
  white-space: nowrap;
  opacity: 0;
  transition: opacity 0.15s;
}
.tooltip.show { opacity: 1; }
.edge-tooltip {
  position: absolute;
  pointer-events: none;
  background: rgba(44,44,44,0.95);
  color: #fff;
  padding: 8px 12px;
  border-radius: 4px;
  font-size: 12px;
  z-index: 20;
  max-width: 360px;
  opacity: 0;
  transition: opacity 0.15s;
  line-height: 1.5;
}
.edge-tooltip.show { opacity: 1; }
.edge-tooltip .et-label { font-weight: 600; color: var(--ds-primary-light); }
.edge-tooltip .et-ev { font-size: 10px; opacity: 0.75; margin-top: 2px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><h1>Surgical Lineage Atlas</h1></div>
    <div class="stats">
      <span><span class="stat-val" id="statEdges">0</span> edges</span>
      <span><span class="stat-val" id="statNodes">0</span> nodes</span>
      <span><span class="stat-val" id="statPersons">0</span> persons</span>
      <span><span class="stat-val" id="statInstitutions">0</span> institutions</span>
      <span><span class="stat-val" id="statSocieties">0</span> societies</span>
    </div>
  </header>
  <div class="toolbar">
    <div class="node-toggles">
      <div class="node-toggle active" data-type="person" style="color: var(--ds-primary);">
        <span class="dot" style="background: var(--ds-primary);"></span> Person
      </div>
      <div class="node-toggle active" data-type="institution" style="color: var(--ds-accent);">
        <span class="dot" style="background: var(--ds-accent);"></span> Institution
      </div>
      <div class="node-toggle active" data-type="society" style="color: var(--ds-dark);">
        <span class="dot" style="background: var(--ds-dark);"></span> Society
      </div>
    </div>
    <div class="sep"></div>
    <label>Edge</label>
    <select id="edgeFilter">
      <option value="all">All Types</option>
      <option value="direct_training">Training</option>
      <option value="institutional_founder">Inst. Founding</option>
      <option value="society_founder">Society Founding</option>
      <option value="governance_leadership">Governance</option>
      <option value="programmatic_accreditation">Accreditation</option>
      <option value="institutional_succession">Succession</option>
      <option value="observational_study">Observational</option>
      <option value="institutional_parent">Hierarchy</option>
    </select>
    <div class="sep"></div>
    <label>Era</label>
    <select id="eraFilter">
      <option value="all">All Eras</option>
      <option value="pre1900">Pre-1900</option>
      <option value="1900-1950">1900–1950</option>
      <option value="1950-2000">1950–2000</option>
      <option value="2000+">2000+</option>
    </select>
    <div class="sep"></div>
    <label>Module</label>
    <select id="moduleFilter">
      <option value="all">All Modules</option>
    </select>
    <div class="sep"></div>
    <input type="text" id="searchBox" placeholder="Search nodes…">
    <div class="sep"></div>
    <button id="evidenceBtn">Evidence</button>
    <button id="hierarchyBtn">Hierarchy</button>
    <div class="sep"></div>
    <button id="resetBtn">Reset</button>
    <button id="fitBtn">Fit View</button>
  </div>
  <div class="main">
    <div id="graph-container">
      <div class="tooltip" id="tooltip"></div>
      <div class="edge-tooltip" id="edgeTooltip"></div>
      <div class="legend">
        <h4>Nodes</h4>
        <div class="legend-item"><span class="legend-dot" style="background:#0A5E56;"></span> Person</div>
        <div class="legend-item"><span class="legend-dot" style="background:#B85D3A;"></span> Institution</div>
        <div class="legend-item"><span class="legend-dot" style="background:#2C2C2C;"></span> Society</div>
        <h4 style="margin-top:10px;">Edges</h4>
        <div class="legend-item"><svg width="24" height="8"><line x1="0" y1="4" x2="24" y2="4" stroke="#0A5E56" stroke-width="2"/></svg> Training / Observational</div>
        <div class="legend-item"><svg width="24" height="8"><line x1="0" y1="4" x2="24" y2="4" stroke="#B85D3A" stroke-width="2" stroke-dasharray="6,3"/></svg> Founding</div>
        <div class="legend-item"><svg width="24" height="8"><line x1="0" y1="4" x2="24" y2="4" stroke="#6B6B6B" stroke-width="2" stroke-dasharray="2,3"/></svg> Governance</div>
        <div class="legend-item"><svg width="24" height="8"><line x1="0" y1="4" x2="24" y2="4" stroke="#3D8B82" stroke-width="2" stroke-dasharray="8,3,2,3"/></svg> Accreditation / Succession</div>
        <div class="legend-item"><svg width="24" height="8"><line x1="0" y1="4" x2="24" y2="4" stroke="#C5CDD6" stroke-width="1" stroke-dasharray="1,3"/></svg> Part of (hierarchy)</div>
      </div>
    </div>
    <div class="panel hidden" id="panel">
      <div class="panel-header">
        <button class="panel-close" id="panelClose">&times;</button>
        <h2 id="panelName"></h2>
        <span class="badge" id="panelBadge"></span>
      </div>
      <div class="panel-body" id="panelBody"></div>
    </div>
  </div>
</div>

name": "Warfield Firor", "temporal_range": "1917-1921", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 12984268", "notes": "Warfield M. Firor received his A&S degree from Johns Hopkins in 1917 and his MD in 1921, training in surgery under the Halstedian system. Halsted died in September 1922, making Firor among the last surgeons formed directly within the original Halsted program. Firor became professor of surgery at the School of Medicine and acting surgeon-in-chief of the hospital from 1939 to 1941. He was best known for pioneering work on tetanus toxin and its effect on the spinal cord. He chaired the American Board of Surgery and the Joint Conference Committee on Graduate Training in Surgery. JHU awarded him an honorary doctorate in 1980. He died in 1988 at age 91. An endowed professorship in his name is currently held at Hopkins. [Phase2 upgraded institutional_archive -> PMID: 12984268 on 2026-03-18] [VERIFY_NAMES: confirm Firor appears in Carter's enumeration] Carter BN. 'The fruition of Halsted's concept of surgical training.' Surgery. 1952 Sep;32(3):518-27. [Verified 2026-03-18 | Chesney Medical Archives portrait & JHU professorships page | Firor (MD 1921) remained at Hopkins for residencies in neurosurgery and surgery. Acting surgeon-in-chief 1939-1941. Overlapped with Halsted's final year.]"}, {"source": 0, "target": 12, "edge_type": "direct_training", "start_year": 1919, "module": "01_halsted_core", "source_name": "William Stewart Halsted", "target_name": "Emile Holman", "temporal_range": "1919-1923", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 27400656", "notes": "[Phase2 replaced PMID: 4885802 -> PMID: 27400656 on 2026-03-17] [Verified 2026-03-17 | J Surg Educ 2016 | content_match] Holman was Halsted's final chief resident before Halsted's death in 1922."}, {"source": 1, "target": 13, "edge_type": "direct_training", "start_year": 1920, "module": "01_halsted_core", "source_name": "Johns Hopkins H r": 1907, "module": "02_general_surgery_spread", "source_name": "Joseph Marshall Flint", "target_name": "Yale University Department of Surgery", "temporal_range": "1907-1921", "confidence": "high", "evidence_type": "institutional_archive", "evidence_citation": "Yale_Surgery_Archive_History", "notes": "Joseph Marshall Flint (1872-1944) became the first full-time Professor of Surgery at Yale in 1907, establishing the academic triad of patient care, education, and research that defines modern surgical departments. Flint received his MD from Johns Hopkins in 1900 (where he would have absorbed the Halstedian culture, though he trained primarily as an anatomist, not as a Halsted surgical resident), then served as professor of anatomy at the University of California (1901-1907). At Yale, he instituted a formal surgical residency based on the Halsted model — defined curriculum, graded responsibility, specified years — making Yale one of the earliest institutions outside Hopkins to adopt this training structure. He also pioneered the dog surgery course modeled on Harvey Cushing's approach at Hopkins. During World War I, Flint designed and commanded Mobile Hospital Unit No. 39 (the Yale Unit) in France, receiving the Distinguished Service Medal. He contracted the Spanish Flu during service and never fully recovered. His successor Samuel Clark Harvey (1924-1948) built the residency into a nationally recognized program. This edge creates the Yale Department of Surgery node as a Hopkins-model institutional spread, parallel to the existing edges for Minnesota (Wangensteen), Duke (Hart/Sabiston), and Michigan (Coller)."}, {"source": 5, "target": 20, "edge_type": "direct_training", "start_year": 1914, "module": "02_general_surgery_spread", "source_name": "Harvey Cushing", "target_name": "Elliott Cutler", "temporal_range": "1914-1920", "confidence": "high", "evidence_type": "institutional_archive", "evidence_citation": "HMS_Archive_Cutler", "notes": "Cutler trained under Cushing at Brigham and succeeded him as Moseley Professor of Surgery at Harvard, performing one of the earliest mitral valve operations."}, {"source": 21, "target": 22, "edge_type": "direct_training", "start_year": 1920, "module": "02_general_surgery_spread", "source_name": "Edward P. Richardson", "target_name": "Edward Churchill", "temporal_range": "1920-1924", "confidence": "moderate", "evidence_type": "institutional_archive", "evidence_citation": "Harvard_Archive_Churchill", "notes": "[Phase2 downgraded from PMID: 15523385 to institutional_archive on 2026-03-17 — no PubMed source found] Edward Delos Churchill (1895-1972) graduated from Harvard Medical School cum laude in 1920 and completed his surgical internship and residency at Massachusetts General Hospital under Edward P. Richardson, the John Homans Professor of Surgery and Chief of the West Surgical Service. Churchill continued at MGH as an associate surgeon after residency completion in 1924. He studied in Europe on a Moseley Traveling Fellowship (1926-1927) in Copenhagen, Munich, and Berlin. He returned to MGH in 1927 under Richardson. Richardson sustained an incapacitating stroke in 1930, and Churchill succeeded him as John Homans Professor in 1931. Churchill was NOT trained by Harvey Cushing — Cushing was at Peter Bent Brigham Hospital, a separate Harvard-affiliated institution. The previous edge incorrectly listed Cushing as Churchill's trainer. Sources: Grillo HC. Edward D. Churchill and the rectangular surgical residency. Surgery. 2004;136(5):947-952. Wright CD. Historical perspectives of the AATS: Edward D. Churchill (1895-1972). J Thorac Cardiovasc Surg. 2012. CORRECTED IN V4: Previously listed as Cushing→Churchill. Richardson was the actual training mentor."}, {"source": 23, "target": 24, "edge_type": "institutional_founder", "start_year": 1921, "module": "02_general_surgery_spread", "source_name": "Allen O. Whipple", "target_name": "Columbia University Department of Surgery", "temporal_range": "1921-1946", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 37941365", "notes": "[Verified 2026-03-17 | J Med Biogr 2025 | content_match] Whipple was appointed Professor of Surgery and Director of Surgical Services at Columbia-Presbyterian in 1921 at age 39, serving as chairman for 25 years. He was the first Valentine Mott Professor of Surgery (1931). He built the modern department, expanding residency training, pioneering the pancreaticoduodenectomy (1935), and introducing multidisciplinary teams and prospective data collection. Columbia P&S represents an independent New York surgical trunk — Whipple was not Halsted-trained."}, {"source": 10, "target": 25, "edge_type": "institutional_founder", "start_year": 1922, "module": "02_general_surgery_spread", "source_name": "Mont Reid", "target_name": "University of Cincinnati Department of Surgery", "temporal_range": "1922-1943", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 12984268", "notes": "Reid reorganized the department, formally importing the Halstedian residency model to the Midwest. [Phase2 upgraded institutional_archive -> PMID: 12984268 on 2026-03-18] [Verified 2026-03-18 | Surgery 1952 | content_match] Carter BN. 'The fruition of Halsted's concept of surgical training.' Carter was himself a Cincinnati trainee and documents the Halsted->Heuer->Reid lineage at Cincinnati. PMC7828946 confirms Reid accompanied Heuer to Cincinnati in 1922."}, {"source": 17, "target": 26, "edge_type": "direct_training", "start_year": 1924, "module": "02_general_surgery_spread", "source_name": "Mayo Clinic Department of Surgery", "target_name": "Owen Wangensteen", "temporal_range": "1924-1927", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 17275843", "notes": "[Verified 2026-03-17 | J Surg Res 2007 | content_match] Wangensteen completed a crucial fellowship at the Mayo Clinic, importing their systematic approach back to Minnesota to build his own dynasty."}, {"source": 12, "target": 27, "edge_type": "institutional_founder", "start_year": 1925, "module": "02_general_surgery_spread", "source_name": "Emile Holman", "target_name": "Stanford University Department of Surgery", "temporal_range": "1925-1955", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 26811046", "notes": "[Verified 2026-03-17 | Semin Thorac Cardiovasc Surg 2015 | content_match] CITATION UPGRADE: Replaces Stanford_Archive_Holman. Woo YJ, Reitz BA, 'One Hundred Years of History at Stanford University: Thoracic and Cardiovascular Surgery,' Semin Thorac Cardiovasc Surg 2015;27(4):388-97. Documents Holman as first chairman of the Department of Surgery at Stanford (1926-1955), educated at Stanford and Johns Hopkins, trained by Halsted and later Cushing. He performed extracardiac and closed heart procedures and served as the 33rd AATS president. Original expansion target T3-02 proposed adding Holman→successor chain but the post-Holman general surgery succession (Roy Cohn, James Mark) lacks PMID-documented training relationships. The Shumway cardiac surgery chain is already well-represented in the graph. Target downgraded to citation upgrade only."}, {"source": 8, "target": 28, "edge_type": "institutional_founder", "start_year": 1925, "module": "02_general_surgery_spread", "source_name": "Barney Brooks", "target_name": "Vanderbilt University Department of Surgery", "temporal_range": "1925-1952", "confidence": "high", "evidence_type": "institutional_archive", "evidence_citation": "VUMC_Archive_Brooks", "notes": "Brooks established Vanderbilt's surgical residency program modeled entirely on the Hopkins system."}, {"source": 29, "target": 30, "edge_type": "institutional_founder", "start_year": 1925, "module": "02_general_surgery_spread", "source_name": "Dallas Phemister", "target_name": "University of Chicago Department of Surgery", "temporal_range": "1925-1947", "confidence": "high", "evidence_type": "institutional_archive", "evidence_citation": "UChicago_Surgery_History", "notes": "Phemister was the first full-time professor and chairman of surgery at the University of Chicago, serving from 1925 to 1947. Rush Medical College MD 1904 with postgraduate study in Europe — NOT Halsted-trained. He built the department on the principle that no faculty member should teach unless actively engaged in research. ASA president 1938, ACS president. He recruited Percival Bailey (Cushing trainee, already in graph) to head neurosurgery in 1928 and invited Charles Huggins to join the faculty in 1927. Huggins went on to win the Nobel Prize in 1966 for hormonal cancer therapy."}, {"source": 13, "target": 31, "edge_type": "institutional_founder", "start_year": 1930, "module": "02_general_surgery_spread", "source_name": "J. Deryl Hart", "target_name": "Duke University Department of Surgery", "temporal_range": "1930-1960", "confidence": "high", "evidence_type": "institutional_archive", "evidence_citation": "Duke_Archive_Hart", "notes": "Hart was the founding chairman of surgery at Duke, establishing the residency program that Sabiston later transformed into one of the nation's premier surgical training centers."}, {"source": 13, "target": 31, "edge_type": "governance_leadership", "start_year": 1930, "module": "02_general_surgery_spread", "source_name": "J. Deryl Hart", "target_name": "Duke University Department of Surgery", "temporal_range": "1930-1960", "confidence": "high", "evidence_type": "institutional_archive", "evidence_citation": "Duke_Archive_Hart", "notes": "Hart served as Duke's first surgery chair for 30 years and later as university president, establishing the institutional culture that Sabiston inherited and amplified."}, {"source": 32, "target": 33, "edge_type": "institutional_founder", "start_year": 1930, "module": "02_general_surgery_spread", "source_name": "Daniel Elkin", "target_name": "Emory University Department of Surgery", "temporal_range": "1930-1955", "confidence": "high", "evidence_type": "institutional_archive", "evidence_citation": "Emory_Archive_Elkin", "notes": "Elkin was the first official chair of surgery at Emory (1930), the first J.B. Whitehead Professor, and a pioneer in vascular surgery including early aneurysm repair and carotid endarterectomy."}, {"source": 34, "target": 35, "edge_type": "institutional_founder", "start_year": 1930, "module": "02_general_surgery_spread", "source_name": "Frederick Coller", "target_name": "University of Michigan Department of Surgery", "temporal_range": "1930-1957", "confidence": "high", "evidence_type": "institutional_archive", "evidence_citation": "ACS_Coller_Archive", "notes": "Coller arrived at Michigan in 1920 from Harvard and was appointed Chairman of Surgery in 1930, serving for 27 years until 1957. Harvard-trained — NOT Halsted-connected. He restructured the American surgical residency format, conducted landmark research on water balance and electrolytes, and trained over 200 surgeons who became professors and chiefs nationally. ASA president 1943, ACS president 1949, first Chairman of the ABS Residency Review Committee for Surgery in 1954."}, {"source": 22, "target": 36, "edge_type": "governance_leadership", "start_year": 1931, "module": "02_general_surgery_spread", "source_name": "Edward Churchill", "target_name": "Massachusetts General Hospital Department of Surgery", "temporal_range": "1931-1962", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 32808916", "notes": "[Verified 2026-03-17 | Surg Innov 2021 | content_match] Edward Delos Churchill (1895-1972) succeeded Edward P. Richardson as the John Homans Professor of Surgery at Harvard Medical School and Chief of the West Surgical Service at MGH in 1931, after Richardson suffered an incapacitating stroke. In 1948 he was additionally appointed Chief of the General Surgical Service. Churchill held these positions until receiving emeritus status in 1962 — a 31-year tenure. Churchill redesigned the MGH surgical residency in 1938, replacing the Halstedian pyramidal model with a 'rectangular' program that finished the same number of residents it accepted. This innovation — training all accepted residents to completion rather than eliminating them competitively — became the template for all modern US surgical training programs. Churchill trained at Harvard Medical School (not Hopkins) and completed his surgical residency at MGH under Edward P. Richardson (1920-1924). He was NOT trained by Harvey Cushing, who was at the separate Peter Bent Brigham Hospital. Corrected in V4.. His MGH department node creates the institutional terminus for the Halsted→Cushing→Churchill chain, extending the Halstedian invasion pattern to Boston. Churchill also trained John H. Gibbon Jr. (inventor of the heart-lung machine) in his lab, though Gibbon is not yet in the graph."}, {"source": 37, "target": 38, "edge_type": "direct_training", "start_year": 1932, "module": "02_general_surgery_spread", "source_name": "Alton Ochsner", "target_name": "Michael DeBakey", "temporal_range": "1932-1937", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 22822308", "notes": "[Phase2 replaced PMID: 18693427 -> PMID: 22822308 on 2026-03-17] [Verified 2026-03-17 | Ochsner J 2002 | content_match] DeBakey completed his residency and early faculty tenure under Ochsner at Tulane."}, {"source": 7, "target": 39, "edge_type": "institutional_founder", "start_year": 1932, "module": "02_general_surgery_spread", "source_name": "George Heuer", "target_name": "Cornell University Department of Surgery", "temporal_range": "1932-1947", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 12984268", "notes": "Heuer established the modern surgical department at Cornell, directly importing the Halstedian residency system to New York. [Phase2 upgraded institutional_archive -> PMID: 12984268 on 2026-03-18] [Verified 2026-03-18 | Surgery 1952 | content_match] Carter BN. 'The fruition of Halsted's concept of surgical training.' Heuer was Halsted's 13th resident. PMC7828946 documents Heuer's recruitment to Cornell in 1932 and establishment of the Halstedian residency there."}, {"source": 6, "target": 40, "edge_type": "direct_training", "start_year": 1934, "module": "02_general_surgery_spread", "source_name": "John Homans", "target_name": "Robert E. Gross", "temporal_range": "1934-1938", "confidence": "high", "evidence_type": "institutional_archive", "evidence_citation": "BCH_Archive_Gross", "notes": "Gross trained under Homans and Elliott Cutler in the Harvard/Brigham system before migrating to pediatric surgery and performing the first successful PDA ligation."}, {"source": 41, "target": 42, "edge_type": "direct_training", "start_year": 1935, "module": "02_general_surgery_spread", "source_name": "Evarts A. Graham", "target_name": "Carl Moyer", "temporal_range": "1935-1940", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 4559844", "notes": "Moyer trained under Graham at Washington University before becoming chairman of surgery at multiple institutions. [Phase2 upgraded institutional_archive -> PMID: 4559844 on 2026-03-18] [VERIFY_NAMES: confirm Moyer named as Graham trainee] Olch PD. 'Evarts A. Graham, the American College of Surgeons, and the American Board of Surgery.' J Hist Med Allied Sci. 1972 Jul;27(3):247-61. Graham trained 20 surgical department chairs; Moyer is likely named in this enumeration. Secondary: PMC1356224 review states Graham trained '20 surgical department chairs and 26 chiefs of service.' [Verified 2026-03-18 | WashU Dept of Surgery history & WashU residency history page | Moyer confirmed as Graham's direct successor, appointed chair 1951. Graham trained 40+ future department chairs.]"}, {"source": 20, "target": 43, "edge_type": "direct_training", "start_year": 1937, "module": "02_general_surgery_spread", "source_name": "Elliott Cutler", "target_name": "J. Englebert Dunphy", "temporal_range": "1937-1942", "confidence": "high", "evidence_type": "institutional_archive", "evidence_citation": "UCSF_Archive_Dunphy", "notes": "Dunphy trained under Cutler, one of Cushing's residents, at Harvard/Brigham before eventually being recruited to chair UCSF Surgery in 1964."}, {"source": 23, "target": 44, "edge_type": "direct_training", "start_year": 1938, "module": "02_general_surgery_spread", "source_name": "Allen O. Whipple", "target_name": "Charles R. Drew", "temporal_range": "1938-1940", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 16632995", "notes": "[Phase2 reviewed — citation retained on 2026-03-17] Charles Richard Drew (1904-1950) received a Rockefeller Fellowship in surgery to train at Columbia University's Presbyterian Hospital (1938-1940) under Allen O. Whipple, chairman of the Department of Surgery. Whipple initially assigned Drew to John Scudder's surgical laboratory, but Drew's skill and presence persuaded Whipple to admit him to the surgical residency — no Black physician had previously been granted a residency or staff privileges at Presbyterian. Whipple became one of Drew's strongest advocates, and with Whipple's sponsorship Drew passed the American Board of Surgery examinations. Drew earned his Doctor of Medical Science degree from Columbia in June 1940, the first African American to do so, with a dissertation on blood preservation that laid the foundation for modern blood banking. Whipple attended Drew's funeral in 1950. This edge extends the Columbia/Whipple trunk to an independent institutional lineage at Howard University and represents the first Black surgeon trained in the existing graph's Columbia department."}, {"source": 15, "target": 24, "edge_type": "governance_leadership", "start_year": 1940, "module": "02_general_surgery_spread", "source_name": "Arthur Blakemore", "target_name": "Columbia University Department of Surgery", "temporal_range": "1940-1964", "confidence": "high", "evidence_type": "institutional_archive", "evidence_citation": "Columbia_Archive_Blakemore", "notes": "Blakemore served as a senior faculty member and vascular surgery leader at Columbia during and after the Whipple era, bridging the Hopkins-trained vascular lineage (Blakemore trained Voorhees in the synthetic graft innovation) into the Columbia department. This edge formally connects the Halstedian trunk to the independent Columbia trunk via a shared institutional node."}, {"source": 44, "target": 45, "edge_type": "governance_leadership", "start_year": 1941, "module": "02_general_surgery_spread", "source_name": "Charles R. Drew", "target_name": "Howard University Department of Surgery", "temporal_range": "1941-1950", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 16632995", "notes": "[Phase2 reviewed — citation retained on 2026-03-17] In October 1941, Drew was appointed Chairman of the Department of Surgery at Howard University College of Medicine and Chief of Surgery at Freedmen's Hospital (Howard's main teaching facility). That same month, he became the first African American appointed as an examiner for the American Board of Surgery. Drew's mission at Howard was to train a generation of elite Black surgeons who would meet the most rigorous national standards and then place them in strategic positions throughout the country. He created a rigorous residency program modeled on the standards he absorbed at Columbia under Whipple. Drew held the chairmanship until his death on April 1, 1950, from injuries sustained in an automobile accident near Burlington, North Carolina, while en route to a surgical conference at Tuskegee. His last lecture — to the sophomore class on Shock, Plasma, and Water Balance — was delivered on March 31, 1950. Sitting in the front row of that lecture was 19-year-old LaSalle D. Leffall Jr., who would graduate first in his class in 1952 and ultimately succeed Drew's legacy at Howard."}, {"source": 37, "target": 46, "edge_type": "institutional_founder", "start_year": 1942, "module": " Penn — NOT Halsted-connected. ASA president 1958, ACS president 1960-1961. He operated on President Eisenhower for Crohn's disease in 1956 and chaired the NIH Clinical Studies Panel that catalyzed the NSABP (already in graph). His mentee Bernard Fisher (already in graph as NSABP founder) overturned the Halstedian radical mastectomy paradigm."}, {"source": 44, "target": 51, "edge_type": "direct_training", "start_year": 1945, "module": "02_general_surgery_spread", "source_name": "Charles R. Drew", "target_name": "LaSalle D. Leffall Jr.", "temporal_range": "1945-1950", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 16632995", "notes": "[Verified 2026-03-17 | Ann Surg 2006 | content_match] Cornwell EE 3rd, Chang DC, Leffall LD Jr. 'The Southern Surgical Association History of Medicine Scholarship Presentation: Dr. Charles Drew, a Surgical Pioneer.' Ann Surg. 2006 May;243(5):612-618. PMC1570555. Documents that Leffall was a sophomore medical student in Drew's final lecture on March 31, 1950 — the day before Drew's fatal automobile accident. Drew was chief of surgery at Howard (1941-1950, already in graph) and taught Leffall during medical school. Though Drew died before Leffall completed medical school (1952), the mentorship was formative: Leffall became the first Charles R. Drew Professor of Surgery at Howard (1992) and spent 50+ years continuing Drew's legacy. The graph already has Drew→Howard (governance) and Howard→Leffall (institutional training), but no person-to-person edge. This creates a three-generation training chain: Whipple→Drew→Leffall, the longest URM lineage in the graph."}, {"source": 26, "target": 52, "edge_type": "direct_training", "start_year": 1946, "module": "02_general_surgery_spread", "source_name": "Owen Wangensteen", "target_name": "C. Walton Lillehei", "temporal_range": "1946-1951", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 15919253", "notes": "[Phase2 replaced PMID: 10527140 -> PMID: ssor as surgery program director), W. Montague Cobb (professor of anatomy), and Jack White (who would direct Leffall toward surgical oncology training). Leffall completed his internship at Homer G. Phillips Hospital in St. Louis (1952-1953), then returned to the Howard system for surgical residency: assistant resident at D.C. General Hospital and Freedmen's Hospital (1953-1956), followed by chief residency at Freedmen's Hospital (1956-1957). The start_year of 1948 reflects medical school entry; the end_year of 1957 reflects completion of the chief residency. This training period spans the Drew era (Drew died during Leffall's second year of medical school) and its immediate succession under Syphax and White."}, {"source": 59, "target": 19, "edge_type": "governance_leadership", "start_year": 1948, "module": "02_general_surgery_spread", "source_name": "Gustaf Lindskog", "target_name": "Yale University Department of Surgery", "temporal_range": "1948-1966", "confidence": "high", "evidence_type": "institutional_archive", "evidence_citation": "Yale_Surgery_Archive_Lindskog", "notes": "Gustaf E. Lindskog (1903-2002) served as the William Carmalt Professor of Surgery and Chairman of the Department of Surgery at Yale from 1948 to 1966, simultaneously serving as surgeon-in-chief of Grace-New Haven Community Hospital (later Yale-New Haven Hospital). Lindskog graduated from Harvard Medical School (1928), interned at Lakeside Hospital in Cleveland, completed surgical residency at Yale (1929-1932), and was a National Research Council Fellow at Massachusetts General Hospital (1932-1933) before returning to Yale permanently. In 1942, as an assistant professor of surgery, Lindskog administered the first intravenous chemotherapy to a human cancer patient — a 47-year-old man with lymphosarcoma (known only as 'J.D.') — using nitrogen mustard developed by pharmacologists Louis Goodman and Alfred Gilman under a secret wartime chemical warfare research program. This event, kept classified until after the war, launched the era of cancer chemotherapy. Lindskog also recruited William Glenn, who developed the Glenn shunt for congenital heart disease and the first working model of an artificial heart. Lindskog was a member of the American Surgical Association, AATS, and a Fellow of the ACS. He died at age 99. This edge extends Yale's surgical lineage from the founding era (Flint) through the mid-century golden age of thoracic and oncologic surgery."}, {"source": 60, "target": 61, "edge_type": "governance_leadership", "start_year": 1948, "module": "02_general_surgery_spread", "source_name": "Francis D. Moore", "target_name": "Peter Bent Brigham Hospital Department of Surgery", "temporal_range": "1948-1976", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 26349933", "notes": "[Phase2 replaced PMID: 11930218 -> PMID: 26349933 on 2026-03-17] [Verified 2026-03-17 | J Clin Anesth 2016 | content_match] Souba WW, Wilmore DW. 'Francis Daniels Moore, 1913-2001.' Ann Surg. 2002 Apr;235(4):453-7. PMC1422478. Documents Moore (1913-2001) as Surgeon-in-Chief at Peter Bent Brigham Hospital and Moseley Professor of Surgery at Harvard Medical School from 1948 to 1976. At age 34, he was the youngest surgery chief in Harvard's history. Under Moore's leadership, the department pioneered organ transplantation (Murray), open-heart surgery, and the metabolic care of the surgical patient. Moore trained at MGH (Harvard surgical residency) but spent his entire chairmanship at Brigham. His book 'The Metabolic Care of the Surgical Patient' (1959) was the standard text for decades. Moore was a member of the 1954 transplant surgical team. This edge creates the institutional governance context for Murray's transplant work — Moore provided the academic environment and institutional protection that enabled a decade of experimental transplant attempts before the 1954 success. The Brigham Department of Surgery node is new and distinct from the two existing Brigham unctioned as an interdisciplinary unit within the department. Source: Niumsawatt V et al. Joseph Murray: Pioneering Plastic Surgeon and Father of the First Organ Transplant. Ann Plast Surg. 2021;87(5):e74-e80. BRIDGE EDGE: Connects the Moore/Brigham Dept 2-node island to the main component via the Brigham Transplant Program (which links to Murray, already in the main component)."}, {"source": 1, "target": 63, "edge_type": "direct_training", "start_year": 1952, "module": "02_general_surgery_spread", "source_name": "Johns Hopkins Hospital Department of Surgery", "target_name": "Thomas Starzl", "temporal_range": "1952-1956", "confidence": "moderate", "evidence_type": "institutional_archive", "evidence_citation": "Hopkins_Archive_Starzl", "notes": "[Phase2 downgraded from PMID: 23225838 to institutional_archive on 2026-03-17 — no PubMed source found] Starzl completed his surgical residency at Hopkins, bridging the classical general surgery trunk to the genesis of liver transplantation."}, {"source": 54, "target": 64, "edge_type": "institutional_founder", "start_year": 1952, "module": "02_general_surgery_spread", "source_name": "F. John Lewis", "target_name": "University of Minnesota Open Heart Surgery Program", "temporal_range": "1952-1960", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 17275843", "notes": "[Verified 2026-03-17 | J Surg Res 2007 | content_match] Lewis led the team that performed the world's first successful open-heart surgery using hypothermia in 1952, establishing Minnesota as the birthplace of cardiac surgery."}, {"source": 1, "target": 65, "edge_type": "direct_training", "start_year": 1954, "module": "02_general_surgery_spread", "source_name": "Johns Hopkins Hospital Department of Surgery", "target_name": "Peter Safar", "temporal_range": "1954-1955", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 35839834", "notes": "[Phase2 replaced PMID: 11153604 -> PMID: 35839834 on 2026-03-17] [Verified 2026-03-17 | Anesth Analg 2022 | content_match] Safar completed anesthesiology training and clinical work at Hopkins, connecting the genesis of modern critical care to the Halstedian root."}, {"source": 66, "target": 62, "edge_type": "institutional_founder", "start_year": 1954, "module": "02_general_surgery_spread", "source_name": "Joseph E. Murray", "target_name": "Peter Bent Brigham Hospital Renal Transplant Program", "temporal_range": "1954-1971", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 15631913", "notes": "[Verified 2026-03-17 | J Am Coll Surg 2005 | content_match] Murray JE. 'The first successful organ transplants in man.' J Am Coll Surg. 2005 Jan;200(1):5-9. Murray's own first-person account. On December 23, 1954, Murray performed the world's first successful human organ transplant — a kidney between identical twins Richard and Ronald Herrick — at Peter Bent Brigham Hospital, Operating Room 2. In 1959, he performed the first transplant between non-identical twins. In 1962, he performed the first successful kidney transplant from an unrelated cadaver donor using azathioprine immunosuppression (developed with Elion and Hitchings). Murray directed the Brigham transplant program until stepping down in 1971 to return to plastic surgery at Children's Hospital. He was awarded the Nobel Prize in Physiology or Medicine in 1990. The Brigham transplant program is the single most important missing institutional node in the graph — it is the origin of all organ transplantation. It represents a parallel origin trunk to Starzl (liver, Pittsburgh) and Shumway (heart, Stanford), both already in the graph. The Peter Bent Brigham Hospital later became Brigham and Women's Hospital (1980)."}, {"source": 52, "target": 67, "edge_type": "direct_training", "start_year": 1956, "module": "02_general_surgery_spread", "source_name": "C. Walton Lillehei", "target_name": "Christiaan Barnard", "temporal_range": "1956-1958", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 20497008", "notes": "[Phase2 replaced PMID: 11845877 -> PMID: 20497008 on 2026-03-17] [Verified 2026-03-17 | J Invest Surg 2010 | content_match] Barnard trained at Minnesota, heavily mentored by Lillehei in advanced cardiothoracic techniques before returning to Cape Town."}, {"source": 68, "target": 69, "edge_type": "direct_training", "start_year": 1956, "module": "02_general_surgery_spread", "source_name": "Warren Cole", "target_name": "Olga Jonasson", "temporal_range": "1956-1963", "confidence": "moderate", "evidence_type": "DOI", "evidence_citation": "DOI: 10.1097/01.sla.0000248100.13289.c0", "notes": "[Phase2 downgraded from PMID: 17473177 to institutional_archive on 2026-03-17 — no PubMed source found] Prinz RA, Thistlethwaite JR. 'Olga Jonasson, MD: Surgeon, Mentor, Teacher, Friend.' Arch Surg. 2007 May;142(5):490-492. PMC1856623. Documents that Jonasson 'studied under Warren Cole, MD, FACS, at the University of Illinois College of Medicine' for her surgical residency. When she told Cole she wanted to become a surgeon, 'even though a woman, he thought the idea totally absurd' — but ultimately accepted her. She was elected to AOA during medical school and began teaching surgery at U of I in 1963 after residency. Warren Cole (1898-1990) was chair of surgery at U of I (1930-1967) and pioneer of oral cholecystography. This is the first direct_training edge involving a woman in the entire graph — it connects Jonasson's governance-only subgraph to the training lineage backbone. [Citation upgraded from institutional_archive to DOI on 2026-03-18 — Husser & Neumayer, Ann Surg 2006;244:839-840. PMC1856623. Content-match confirmed: Cole accepted Jonasson into residency at University of Illinois.]"}, {"source": 70, "target": 51, "edge_type": "direct_training", "start_year": 1957, "module": "02_general_surgery_spread", "source_name": "Memorial Sloan Kettering Cancer Center", "target_name": "LaSalle D. Leffall Jr.", "temporal_range": "1957-1959", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 18481473", "notes": "[Verified 2026-03-17 | J Natl Med Assoc 2008 | content_match] Leffall completed a senior fellowship in surgical oncology at Memorial Sloan Kettering Cancer Center (1957-1959), the first African American to hold such a fellowship there. He was directed toward MSK by his mentor Jack White at Howard. Leffall specialized in colon and rectal, breast, and head and neck cancers. This edge connects the Howard/Drew lineage to the existing Memorial Sloan Kettering node (already connected to the James Ewing Society and the Memorial Hospital for Cancer and Allied Diseases in the graph). The MSK fellowship bridges the independent Howard training trunk into the established oncology cluster, creating a cross-lineage pathway analogous to how Patrick Walsh's UCLA-to-Hopkins recruitment bridges the urology trunk."}, {"source": 56, "target": 17, "edge_type": "governance_leadership", "start_year": 1960, "module": "02_general_surgery_spread", "source_name": "John Kirklin", "target_name": "Mayo Clinic Department of Surgery", "temporal_range": "1960-1966", "confidence": "high", "evidence_type": "institutional_archive", "evidence_citation": "UAB_Archive_Kirklin", "notes": "Kirklin chaired the Mayo Clinic Department of Surgery and pioneered open-heart surgery using the heart-lung machine before being recruited to UAB in 1966."}, {"source": 1, "target": 71, "edge_type": "direct_training", "start_year": 1962, "module": "02_general_surgery_spread", "source_name": "Johns Hopkins Hospital Department of Surgery", "target_name": "John L. Cameron", "temporal_range": "1962-1971", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 29189382", "notes": "[Verified 2026-03-17 | Ann Surg 2018 | content_match] Cameron received his MD from Hopkins in 1962 and completed all general and thoracic surgical training there, later serving as Alfred Blalock Professor and Chairman of Surgery for 19 years (1984-2003)."}, {"source": 57, "target": 31, "edge_type": "institutional_founder", "start_year": 1964, "module": "02_general_surgery_spread", "source_name": "David Sabiston", "target_name": "Duke University Department of Surgery", "temporal_range": "1964-1994", "confidence": "high", "evidence_type": "institutional_archive", "evidence_citation": "Duke_Archive_Sabiston", "notes": "Sabiston served as James B. Duke Professor and Chairman of Surgery for 30 years, training 154 chief residents and building one of the premier academic surgical programs."}, {"source": 53, "target": 72, "edge_type": "governance_leadership", "start_year": 1963, "module": "02_general_surgery_spread", "source_name": "Henry Bahnson", "target_name": "University of Pittsburgh Department of Surgery", "temporal_range": "1963-1987", "confidence": "high", "evidence_type": "institutional_archive", "evidence_citation": "Pitt_Archive_Bahnson_Chair", "notes": "[V11 semantic fix] Reclassified from institutional_founder to governance_leadership: Bahnson was the second full-time chair of the Pitt Department of Surgery (1963-1987, the school's longest chairmanship), recruited from Johns Hopkins; he led but did not found the department (General Surgery dates to the medical college's 1886 founding; see Manifest A). First holder of the George V. Foster Chair in Surgery."}, {"source": 43, "target": 73, "edge_type": "governance_leadership", "start_year": 1964, "module": "02_general_surgery_spread", "source_name": "J. Englebert Dunphy", "target_name": "UCSF Department of Surgery", "temporal_range": "1964-1975", "confidence": "high", "evidence_type": "institutional_archive", "evidence_citation": "UCSF_Archive_Dunphy", "notes": "Dunphy chaired UCSF Surgery from 1964-1975, integrating the residency across three hospitals, founding the wound healing research program and the nation's first organized trauma service at SFGH."}, {"source": 55, "target": 58, "edge_type": "governance_leadership", "start_yea
