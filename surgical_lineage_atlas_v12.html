iation", "temporal_range": "1909-1945", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 12544287", "notes": "[Verified 2026-03-17 | J Urol 2003 | content_match] Young served as AUA president in 1909 and founded the Journal of Urology in 1917, serving as its first editor-in-chief until his death in 1945. The AUA absorbed the Journal in 1921 and it became the official AUA scientific publication. The AUA eventually headquartered at Young's Baltimore estate, physically and symbolically fusing the independent Guiteras-New York origin with the Halstedian Hopkins trunk. Young is universally regarded as the Father of Modern American Urology."}, {"source": 4, "target": 197, "edge_type": "institutional_founder", "start_year": 1915, "module": "05_urology", "source_name": "Hugh Hampton Young", "target_name": "Brady Urological Institute", "temporal_range": "1915-1942", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 39038727", "notes": "[Phase2 replaced PMID: 25442801 -> PMID: 39038727 on 2026-03-17] [Verified 2026-03-17 | Urology 2024 | content_match] Young founded the Brady Urological Institute at Hopkins, establishing the first dedicated, modern residency model for urology."}, {"source": 196, "target": 198, "edge_type": "society_founder", "start_year": 1934, "module": "05_urology", "source_name": "American Urological Association", "target_name": "American Board of Urology", "temporal_range": "1934-1935", "confidence": "high", "evidence_type": "institutional_archive", "evidence_citation": "ABU_Archive_History", "notes": "The ABU was organized in Chicago on September 24, 1934 and incorporated in Delaware on May 6, 1935. It was established through the combined efforts of the AUA, the American Association of Genito-Urinary Surgeons, and the AMA Section on Urology. The ABU is one of 24 ABMS member boards and certifies all urologists in the United States. This follows the established graph pattern of professional societies spawning certification boards (AOA → ABOS, ACS/ASA → ABS)."}, {"source": 199, "target": 200, "edge_type": "direct_training", "start_year": 1967, "module": "05_urology", "source_name": "UCLA Department of Surgery", "target_name": "Patrick Walsh", "temporal_range": "1967-1971", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 17437775", "notes": "Walsh completed his urology residency and an endocrinology fellowship at the UCLA School of Medicine under Willard E. Goodwin (1967-1971). Goodwin was one of the pioneers of renal transplantation and reconstructive urology at UCLA. Walsh's training path: Case Western Reserve MD (1964), Peter Bent Brigham Hospital surgery residency (Boston), Children's Hospital Medical Center pediatric surgery (Boston), UCLA urology residency and endocrinology fellowship. He was recruited to Hopkins in 1974 at age 35 to direct the Brady Urological Institute after Ben Gittes (his San Diego mentor) declined the position. This edge uses the existing UCLA Department of Surgery institutional node, as urologic surgery at UCLA was administratively within the Department of Surgery. This is the first direct_training edge in the urology module, filling the most significant structural gap. Walsh was NOT Hopkins-trained — he represents an independent West Coast training lineage arriving at a Hopkins institution, paralleling Starzl's Hopkins-to-Pittsburgh path. [Phase2 upgraded institutional_archive -> PMID: 17437775 on 2026-03-18] [Verified 2026-03-18 | J Urol 2007 | content_match] Walsh PC. 'The discovery of the cavernous nerves and development of nerve sparing radical retropubic prostatectomy.' J Urol. 2007 May;177(5):1632-5. Walsh's autobiographical account references his UCLA urology training under Willard E. Goodwin. Shared PMID with Walsh->Brady governance edge."}, {"source": 200, "target": 197, "edge_type": "governance_leadership", "start_year": 1974, "module": "05_urology", "source_name": "Patrick Walsh", "target_name": "Brady Urological Institute", "temporal_range": "1974-2004", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 17437775", "notes": "[Phase2 reviewed — citation retained on 2026-03-17] Walsh served as Chairman of the Brady Urological Institute from 1974 to 2004, transforming it from a declining program into the world's leading prostate cancer center. Case Western Reserve MD 1964, Peter Bent Brigham general surgery residency, UCLA urology residency — NOT Hopkins-trained; recruited externally. On April 26, 1982, he performed the first purposeful nerve-sparing radical prostatectomy, revolutionizing prostate cancer treatment. By 2002, prostate cancer deaths had declined 33%. He trained 62 residents who carried the technique worldwide and edited Campbell's Urology for 25 years (renamed Campbell-Walsh Urology in 2012). His directorship bridges the Hugh Hampton Young founding era (1915) to the modern era of the Brady."}, {"source": 200, "target": 196, "edge_type": "governance_leadership", "start_year": 1982, "module": "05_urology", "source_name": "Patrick Walsh", "target_name": "American Urological Association", "temporal_range": "1982-2012", "confidence": "high", "evidence_type": "institutional_archive", "evidence_citation": "Hopkins_Brady_History", "notes": "Walsh served as editor-in-chief of Campbell's Urology (the definitive urological textbook, now Campbell-Walsh-Wein Urology) for 25 years and was president of both the American Association of Genito-Urinary Surgeons and the Clinical Society of Genito-Urinary Surgeons. He was identified as the most cited urologist in the world in 2023. His nerve-sparing technique made radical prostatectomy the most common treatment for localized prostate cancer, fundamentally reshaping AUA practice guidelines."}, {"source": 201, "target": 202, "edge_type": "institutional_founder", "start_year": 1984, "module": "05_urology", "source_name": "Ralph V. Clayman", "target_name": "Washington University Division of Urologic Surgery", "temporal_range": "1984-2002", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 1830346", "notes": "[Verified 2026-03-17 | J Urol 1991 | content_match] Clayman RV, Kavoussi LR, Soper NJ, et al. 'Laparoscopic nephrectomy: initial case report.' J Urol. 1991 Aug;146(2):278-82. Clayman joined Washington University in 1984 as faculty in the Division of Urologic Surgery, rising to Professor of Urology and Radiology and Director of the Midwest Stone Institute. On June 25, 1990, he and his team performed the world's first laparoscopic nephrectomy on an 85-year-old woman with a 3cm renal mass — the most transformative single procedure in urologic surgery since Walsh's nerve-sparing prostatectomy. He trained at UC San Diego (MD) and University of Minnesota (urology residency), where he was exposed to endourology by Arthur Smith. His WashU program became the global training epicenter for minimally invasive urologic surgery. This creates a completely independent endourology trunk parallel to the Brady/Hopkins lineage, based at WashU (which already has nodes for the Graham/cardiothoracic and Blair/plastic surgery lineages)."}, {"source": 201, "target": 203, "edge_type": "society_founder", "start_year": 1984, "module": "05_urology", "source_name": "Ralph V. Clayman", "target_name": "Endourological Society", "temporal_range": "1984-2002", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMC3015495", "notes": "[Verified 2026-03-17 | Curr Top Microbiol Immunol 1986] Tran MGB, Bhatt NR. 'Profile of Ralph Victor Clayman, MD: Professor and Chair, Department of Urology University of California Irvine.' J Endourol. 2010 Dec;24(12):1873-5. PMC3015495. Clayman co-founded the Endourological Society (exact founding year 1984) with Arthur D. Smith of Long Island Jewish Medical Center. The society publishes the Journal of Endourology (co-edited by Clayman and Smith) and is the global professional body for minimally invasive urologic surgery. The society now has chapters on every continent. This follows the established graph pattern of surgeon-innovators founding professional societies to disseminate their techniques (paralleling SAGES, SIS, EAST). The Endourological Society is the urologic equivalent of SAGES in general surgery."}, {"source": 76, "target": 201, "edge_type": "direct_training", "start_year": 1973, "module": "05_urology", "source_name": "John Najarian", "target_name": "Ralph V. Clayman", "temporal_range": "1973-1979", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMCID: PMC3015495", "notes": "Clayman completed general surgery and urology residency at University of Minnesota, 1973-1979. Najarian was Chair of Surgery at UMN (1967-1993). Clayman's general surgery preliminary training was under Najarian's department. Source: Profile of Ralph Victor Clayman, MD. J Endourol. 2010. PMCID: PMC3015495. TARGET MODULE: 05_urology.json"}, {"source": 200, "target": 204, "edge_type": "direct_training", "start_year": 1989, "module": "05_urology", "source_name": "Patrick Walsh", "target_name": "Alan W. Partin", "temporal_range": "1989-1995", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMCID: PMC11316887", "notes": "TARGET MODULE: 05_urology. Obituary: 'ALAN PARTIN, MD, PhD: 1961-2023.' PMC11316887. Partin earned his MD (1989) and PhD in pharmacology (1988) at Johns Hopkins. As a graduate student 'under the guidance of Patrick Walsh,' Partin published landmark prostate staging work. Completed urology residency at Hopkins (1989-1995), joined Brady faculty 1995. Walsh trained 62 residents total; 87% pursued academic urology; 23 became department directors. The Walsh→Partin chain extends the Hopkins urology lineage: Young→Brady→Walsh→Partin, creating a 4-generation institutional succession at a single department."}, {"source": 204, "target": 197, "edge_type": "governance_leadership", "start_year": 2004, "module": "05_urology", "source_name": "Alan W. Partin", "target_name": "Brady Urological Institute", "temporal_range": "2004-2022", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMCID: PMC11316887", "notes": "TARGET MODULE: 05_urology. Partin was the 4th Brady director (after Young, Scott, Walsh), serving 2004-2022. Under his leadership the Brady doubled its research space and established the Greenberg Bladder Cancer Institute. Developed the Partin Tables — the first validated nomogram for prostate cancer staging. Published >600 papers, editor-in-chief of Urology journal, co-editor of Campbell-Walsh-Wein Urology textbook. Died March 2023 from glioblastoma at age 62. Succeeded by Mohamad Allaf (2022-present), also a Walsh trainee. Creates a closed loop: Hopkins trains → Brady director → trains next director, paralleling the Halsted→Hopkins pattern."}, {"source": 205, "target": 206, "edge_type": "institutional_founder", "start_year": 1863, "module": "06_orthopedics", "source_name": "James Knight", "target_name": "Hospital for the Ruptured and Crippled", "temporal_range": "1863-1887", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 16272913", "notes": "[Phase2 replaced PMID: 2504092 -> PMID: 16272913 on 2026-03-17] [Verified 2026-03-17 | Orthop Nurs 2005 | content_match] Knight founded the institution (now Hospital for Special Surgery) specifically for orthopedic rehabilitation, establishing a parallel trunk to general surgery."}, {"source": 207, "target": 206, "edge_type": "institutional_succession", "start_year": 1887, "module": "06_orthopedics", "source_name": "Virgil Gibney", "target_name": "Hospital for the Ruptured and Crippled", "temporal_range": "1887-1925", "confidence": "high", "evidence_type": "institutional_archive", "evidence_citation": "HSS_Archive_Gibney", "notes": "Gibney succeeded Knight as Surgeon-in-Chief and established the first formal orthopedic residency program in the United States in 1887."}, {"source": 207, "target": 208, "edge_type": "society_founder", "start_year": 1887, "module": "06_orthopedics", "source_name": "Virgil Gibney", "target_name": "American Orthopaedic Association", "temporal_range": "1887-1912", "confidence": "low", "evidence_type": "PMID", "evidence_citation": "PMID: 19763730", "notes": "[VERIFY_FAILED 2026-03-17 — No PubmedArticle returned; was confidence:high] Gibney was a founding member of the AOA at the January 1887 organizational meeting at Newton Shaffer's home in New York, and served as its first president. He is the only individual to have served as AOA president twice (1887 and 1912). The AOA was the first organized orthopaedic body in the world, predating any European equivalent."}, {"source": 209, "target": 210, "edge_type": "institutional_founder", "start_year": 1909, "module": "06_orthopedics", "source_name": "Willis Campbell", "target_name": "Campbell Clinic", "temporal_range": "1909-1941", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 10818976", "notes": "[Verified 2026-03-17 | Clin Orthop Relat Res 2000 | content_match] Campbell opened his orthopaedic practice in Memphis in 1909 after studying in London and Vienna. He organized the Department of Orthopaedic Surgery at the University of Tennessee in 1910 and established the first orthopaedic residency program in 1924. He authored Campbell's Operative Orthopaedics (1939), which remains the definitive textbook in the field."}, {"source": 208, "target": 211, "edge_type": "society_founder", "start_year": 1931, "module": "06_orthopedics", "source_name": "American Orthopaedic Association", "target_name": "American Academy of Orthopaedic Surgeons", "temporal_range": "1931-1933", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 18196367", "notes": "In 1931, the AOA formed a committee to establish a more broadly representative national orthopaedic organization without the AOA's membership restrictions. This committee directly catalyzed the founding of the AAOS in 1933. [Phase2 upgraded institutional_archive -> PMID: 18196367 on 2026-03-18] [Verified 2026-03-18 | Clin Orthop Relat Res 2008 | content_match] Brand RA. 'AAOS 75th Anniversary Tribute to Past Presidents: Editorial Comment.' Clin Orthop Relat Res. 2008 Jan;466(1):2-4. Documents AOA committee formation in 1931 leading to AAOS founding at Northwestern University in January 1933. Identifies seven AAOS founders and their AOA connections."}, {"source": 209, "target": 211, "edge_type": "society_founder", "start_year": 1933, "module": "06_orthopedics", "source_name": "Willis Campbell", "target_name": "American Academy of Orthopaedic Surgeons", "temporal_range": "1933-1935", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 18196369", "notes": "[Verified 2026-03-17 | Clin Orthop Relat Res 2008 | content_match] Campbell co-founded the AAOS and served as its first elected president at the inaugural meeting held at Northwestern University in January 1933. The AAOS grew from the American Orthopaedic Association's 1931 committee to establish a broadly representative national orthopaedic society. It is now the world's largest musculoskeletal association with over 39,000 members."}, {"source": 208, "target": 212, "edge_type": "society_founder", "start_year": 1933, "module": "06_orthopedics", "source_name": "American Orthopaedic Association", "target_name": "American Board of Orthopaedic Surgery", "temporal_range": "1933-1934", "confidence": "high", "evidence_type": "institutional_archive", "evidence_citation": "ABOS_Archive_History", "notes": "A second AOA committee in 1931 was charged with establishing an orthopaedic specialty board. In January 1933 the AOA recommended the composition of the board, and in February 1934 the ABOS was officially incorporated with representatives from the AOA, AAOS, and AMA Section on Orthopaedic Surgery."}, {"source": 206, "target": 213, "edge_type": "institutional_succession", "start_year": 1940, "module": "06_orthopedics", "source_name": "Hospital for the Ruptured and Crippled", "target_name": "Hospital for Special Surgery", "temporal_range": "1940-1955", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 19048348", "notes": "[Verified 2026-03-17 | HSS J 2009 | content_match] Levine DB. 'The Hospital for the Ruptured and Crippled renamed the Hospital for Special Surgery 1940; the war years 1941-1945.' HSS J. 2009 Feb;5(1):1-8. In 1940, the Board of Managers under surgeon-in-chief Philip D. Wilson changed the name from Hospital for the Ruptured and Crippled to Hospital for Special Surgery (HSS). Wilson had been recruited in 1935 to revitalize the institution, and the renaming reflected the modernization of the hospital from a 19th-century charitable institution to a modern academic orthopaedic center. HSS affiliated with Cornell University Medical College and New York Hospital in 1949-1951. This succession edge closes the gap between the existing R&C institutional node (Knight 1863, Gibney 1887) and the modern HSS, the oldest orthopaedic hospital in the United States and currently ranked #1 nationally for orthopaedics."}, {"source": 214, "target": 215, "edge_type": "governance_leadership", "start_year": 1955, "module": "06_orthopedics", "source_name": "Mark B. Coventry", "target_name": "Mayo Clinic Department of Orthopedic Surgery", "temporal_range": "1955-1984", "confidence": "high", "evidence_type": "institutional_archive", "evidence_citation": "AOA_Archive_Coventry_Pillar", "notes": "Coventry was appointed chairman of the Mayo Clinic Department of Orthopedics in 1955, serving until his retirement in 1984. He had joined Mayo's staff in 1942, interrupted by WWII service in the Medical Corps of the US Naval Reserve (Guadalcanal, New Guinea, Philippines). He attended the University of Michigan before joining Mayo. Under his chairmanship, Mayo's orthopedic department performed the first FDA-approved cemented total hip arthroplasty in the US (1969), established the first total jo D: 4707443", "notes": "[Verified 2026-03-17 | Orthop Clin North Am 1973 | content_match] Coventry MB. 'The surgical technique of total hip arthroplasty, modified from Charnley, as done at the Mayo Clinic.' Orthop Clin North Am. 1973 Apr;4(2):473-82. Coventry (1913-1994), then chairman of Mayo's Department of Orthopedics, traveled to Europe in the late 1960s to study hip replacement procedures and visited Charnley at Wrightington. According to Bernard Morrey (Coventry's successor): 'Coventry thought that Charnley's approach and philosophy was the most sound.' Coventry returned to Rochester and performed the first FDA-approved total hip arthroplasty using methylmethacrylate in the United States on March 10, 1969. Coventry's own 1973 publication explicitly titles the Mayo technique as 'modified from Charnley,' documenting the direct knowledge transfer. This observational_study edge parallels the Blair→Gillies edge in plastic surgery as a transatlantic knowledge bridge that launched an American specialty program."}, {"source": 214, "target": 208, "edge_type": "governance_leadership", "start_year": 1977, "module": "06_orthopedics", "source_name": "Mark B. Coventry", "target_name": "American Orthopaedic Association", "temporal_range": "1977-1978", "confidence": "high", "evidence_type": "institutional_archive", "evidence_citation": "AOA_Archive_Coventry_Pillar", "notes": "Coventry served as president of the American Orthopaedic Association in 1977, as documented by the AOA's Pillar of the Orthopaedic Profession program honoring him. He also served as president of the Clinical Orthopaedic Society, The Hip Society, and the Orthopaedic Research and Education Foundation (OREF). His AOA presidency connects the arthroplasty lineage (Charnley→Coventry) back to the existing AOA node in the graph, creating a chain from Wrightington through Mayo to the professional society that founded both AAOS and ABOS. Coventry published over 250 articles and 31 book chapters and established the nto a unified comprehensive cancer center."}, {"source": 227, "target": 228, "edge_type": "society_founder", "start_year": 1969, "module": "07_oncology_trials", "source_name": "George C. Lewis Jr.", "target_name": "Society of Gynecologic Oncology", "temporal_range": "1969-1975", "confidence": "high", "evidence_type": "institutional_archive", "evidence_citation": "SGO_Archive_History", "notes": "Lewis, Professor and Chair of Obstetrics and Gynecology at Hahnemann Medical College, served as the first president of SGO at its founding in January 1969. The society was initiated by John Mikuta and Hervy Averette, who sketched out the concept on cocktail napkins at the Monteleone Hotel in New Orleans. Lewis challenged the founding group to define aims that would justify a new subspecialty. The SGO drove formal subspecialty certification in gynecologic oncology through ABOG in 1974."}, {"source": 227, "target": 229, "edge_type": "institutional_founder", "start_year": 1970, "module": "07_oncology_trials", "source_name": "George C. Lewis Jr.", "target_name": "Gynecologic Oncology Group", "temporal_range": "1970-1985", "confidence": "high", "evidence_type": "institutional_archive", "evidence_citation": "GOG_50th_Anniversary", "notes": "Lewis was a key organizer of the GOG, which was founded in 1970 and initially housed within the American College of Obstetricians and Gynecologists. He was elected GOG chair in 1975 and restructured the group from an informal collaboration into a rigorous NCI-funded cooperative group with centralized protocol development. The GOG was the only NCI cooperative group focused exclusively on pelvic malignancies and grew to nearly 200 member institutions."}, {"source": 230, "target": 231, "edge_type": "society_founder", "start_year": 1995, "module": "07_oncology_trials", "source_name": "Victor Zannis", "target_name": "American Society of Breast Surgeons", "temporal_range": "1995-1996", "confidence": "high", "evidence_type": "institutional_archive", "evidence_citation": "ASBrS_Archive_Founders", "notes": "Zannis organized the founding of ASBrS to provide a dedicated governance and advocacy platform for surgeons specializing exclusively in breast care."}, {"source": 223, "target": 232, "edge_type": "institutional_founder", "start_year": 1998, "module": "07_oncology_trials", "source_name": "American College of Surgeons", "target_name": "American College of Surgeons Oncology Group", "temporal_range": "1998-2011", "confidence": "moderate", "evidence_type": "institutional_archive", "evidence_citation": "College_Archive", "notes": "[Phase2 downgraded from PMID: 10452656 to institutional_archive on 2026-03-17 — no PubMed source found] The ACS founded ACOSOG to specifically evaluate the surgical management of solid tumors through prospective, multi-institutional clinical trials."}, {"source": 220, "target": 233, "edge_type": "programmatic_accreditation", "start_year": 1998, "module": "07_oncology_trials", "source_name": "Society of Surgical Oncology", "target_name": "American Board of Surgery", "temporal_range": "1998-2015", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 35430661", "notes": "[Verified 2026-03-17 | Ann Surg Oncol 2022 | content_match] Tyler D. '2022 SSO Presidential Address: What is a Surgical Oncologist? Evolution of Surgical Oncology and the Society of Surgical Oncology in an Era of Hyperspecialization.' Ann Surg Oncol. 2022;29(7):4005-13. PMC9013271. Documents the SSO's multi-decade campaign for board certification in surgical oncology: the SSO created the Surgical Oncology Advisory Council (SOAC) with the ABS in 1998, which became the pathway to the ABS Certificate in Complex General Surgical Oncology (CGSO) approved by ABMS in 2011. First board-certified surgical oncologists were certified in 2015. The 1998 SOAC establishment is the discrete founding event — SSO and ABS formalized their accreditation relationship to create a subspecialty certification pathway. This parallels the FLS→ABS (2009) edge pattern where a society's program becomes mandatory for ABS certification. It also strengthens the SSO node (currently degree 1, only the James Ewing Society succession edge) and connects it to the ABS governance hub."}, {"source": 232, "target": 234, "edge_type": "institutional_succession", "start_year": 2011, "module": "07_oncology_trials", "source_name": "American College of Surgeons Oncology Group", "target_name": "Alliance for Clinical Trials in Oncology", "temporal_range": "2011-Present", "confidence": "high", "evidence_type": "institutional_archive", "evidence_citation": "Alliance_Archive_History", "notes": "ACOSOG merged with CALGB and NCCTG to form the Alliance, consolidating surgical and medical oncology trial networks into a unified cooperative group."}, {"source": 229, "target": 235, "edge_type": "institutional_succession", "start_year": 2012, "module": "07_oncology_trials", "source_name": "Gynecologic Oncology Group", "target_name": "NRG Oncology", "temporal_range": "2012-2014", "confidence": "moderate", "evidence_type": "institutional_archive", "evidence_citation": "NRG_Archive", "notes": "[Phase2 downgraded from PMID: 25281376 to institutional_archive on 2026-03-17 — no PubMed source found] In 2012, the GOG merged with the National Surgical Adjuvant Breast and Bowel Project (NSABP, already in graph) and the Radiation Therapy Oncology Group (RTOG) to form NRG Oncology, a new NCTN cooperative group. The acronym NRG derives from the names of the three parental groups. All federal research activities consolidated under NRG Oncology in March 2014. Philip DiSaia (GOG), Norman Wolmark (NSABP), and Walter Curran (RTOG) served as founding co-chairs."}, {"source": 226, "target": 235, "edge_type": "institutional_succession", "start_year": 2012, "module": "07_oncology_trials", "source_name": "National Surgical Adjuvant Breast and Bowel Project", "target_name": "NRG Oncology", "temporal_range": "2012-2014", "confidence": "moderate", "evidence_type": "institutional_archive", "evidence_citation": "NRG_Archive", "notes": "[Phase2 downgraded from PMID: 25281376 to institutional_archive on 2026-03-17 — no PubMed source found] The NSABP, founded by Bernard Fisher (already in graph), merged into NRG Oncology alongside GOG and RTOG. Norman Wolmark, who trained alongside Fisher at the University of Pittsburgh and succeeded him as NSABP chairman, became one of three NRG Oncology principal investigators. This edge connects the existing NSABP/Fisher clinical trials lineage to the gynecologic oncology trunk through the shared NRG Oncology institutional node."}, {"source": 226, "target": 234, "edge_type": "programmatic_accreditation", "start_year": 2014, "module": "07_oncology_trials", "source_name": "National Surgical Adjuvant Breast and Bowel Project", "target_name": "Alliance for Clinical Trials in Oncology", "temporal_range": "2014-Present", "confidence": "moderate", "evidence_type": "institutional_archive", "evidence_citation": "NCI_Archive_NCTN", "notes": "NSABP (now NRG Oncology) and the Alliance operate as parallel NCI-funded cooperative groups within the National Clinical Trials Network, coordinating surgical oncology protocols across the cooperative group structure."}, {"source": 231, "target": 223, "edge_type": "programmatic_accreditation", "start_year": 2007, "module": "07_oncology_trials", "source_name": "American Society of Breast Surgeons", "target_name": "American College of Surgeons", "temporal_range": "2007-Present", "confidence": "moderate", "evidence_type": "institutional_archive", "evidence_citation": "ASBrS_Archive_ACS", "notes": "The American Society of Breast Surgeons (ASBrS) is formally affiliated with the American College of Surgeons. ASBrS members are required to be Fellows of the ACS or eligible for ACS fellowship. The ASBrS participates in the ACS National Accreditation Program for Breast Centers (NAPBC), established 2007, which sets standards for breast center accreditation. The ASBrS also collaborates with the ACS Commission on Cancer on breast surgery quality measures. Confidence moderate because the relationship is primarily through the NAPBC accreditation program rather than a direct governance hierarchy. BRIDGE EDGE: Merges the ASBrS/Zannis island (Component 4, 2 nodes) into the main component via the ACS governance hub."}, {"source": 101, "target": 70, "edge_type": "governance_leadership", "start_year": 1985, "module": "07_oncology_trials", "source_name": "Murray F. Brennan", "target_name": "Memorial Sloan Kettering Cancer Center", "temporal_range": "1985-2006", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 31944281", "notes": "[Phase2 reviewed — citation retained on 2026-03-17] Brennan served as Chairman of the Department of Surgery at Memorial Sloan Kettering Cancer Center from 1985 to 2006 (21 years), transforming it into the preeminent surgical oncology training program in the world. During his tenure he trained over 350 surgical oncology fellows, many of whom became leaders at institutions across the US and internationally. He joined MSK in 1981 as chief of the gastric and mixed tumor service after 6 years at the NCI. He also held the Benno C. Schmidt Chair in Clinical Oncology and subsequently served as VP of International Programs (2010-2018) and Senior VP (2018-present). Authored over 1,100 publications. Created the world's largest sarcoma database (10,000+ patients). Printz (Cancer 2020, PMID 31944281) and multiple ACS profiles confirm the tenure."}, {"source": 101, "target": 220, "edge_type": "governance_leadership", "start_year": 1997, "module": "07_oncology_trials", "source_name": "Murray F. Brennan", "target_name": "Society of Surgical Oncology", "temporal_range": "c.1997-c.1998", "confidence": "moderate", "evidence_type": "PMID", "evidence_citation": "PMID: 18286472", "notes": "[Verified 2026-03-17 | J Surg Oncol 2008 | content_match] Brennan served as president of the Society of Surgical Oncology. The J Surg Oncol tribute issue (2008, PMID 18286472) and the ACS profile confirm this presidency. The SSO is already in the graph via Memorial Hospital->SSO (institutional_founder in 07_oncology_trials) and SSO->ABS (programmatic_accreditation). Exact presidency years approximated; the ACS and MSK India profiles list SSO presidency without specifying dates. Confidence moderate due to estimated dates. This edge creates a second pathway from MSK to the SSO governance backbone: the existing Memorial Hospital->SSO founding edge is now paralleled by Brennan->SSO presidential leadership."}, {"source": 236, "target": 237, "edge_type": "institutional_founder", "start_year": 1820, "module": "08_subspecialties", "source_name": "Edward Delafield", "target_name": "New York Eye Infirmary", "temporal_range": "1820-1875", "confidence": "high", "evidence_type": "institutional_archive", "evidence_citation": "AOS_Archive_Sesquicentennial", "notes": "Edward Delafield (1794-1875) and John Kearney Rodgers co-founded the New York Eye Infirmary on August 14, 1820, the first specialty eye hospital in the Western Hemisphere. Both had studied ophthalmology at Moorfields Eye Hospital in London under Astley Cooper and John Abernethy at St. Thomas's and St. Bartholomew's Hospitals (1816-1818). The Infirmary opened at 45 Chatham Square in New York City and performed the first successful congenital cataract surgeries in the United States. Delafield was simultaneously president of the College of Physicians and Surgeons (a precursor institution to Columbia's medical school, though this is not modeled as a formal edge to avoid overstating the institutional link). The Infirmary's seal was later adopted by the American Ophthalmological Society upon its founding in 1864. The institution eventually became the New York Eye and Ear Infirmary (NYEE), which continues today. This is the earliest specialty institution founding in the graph, predating St. Mark's Hospital for Fistula (1835, already in graph) by 15 years and extending the graph's institutional founding timeline into the 1820s."}, {"source": 238, "target": 239, "edge_type": "institutional_founder", "start_year": 1835, "module": "08_subspecialties", "source_name": "Frederick Salmon", "target_name": "St. Mark's Hospital for Fistula and Other Diseases of the Rectum", "temporal_range": "1835-1859", "confidence": "high", "evidence_type": "institutional_archive", "evidence_citation": "StMarks_Archive_Salmon", "notes": "Salmon founded the institution specifically dedicated to colorectal disease, pre-dating modern general surgery departments."}, {"source": 236, "target": 240, "edge_type": "society_founder", "start_year": 1864, "module": "08_subspecialties", "source_name": "Edward Delafield", "target_name": "American Ophthalmological Society", "temporal_range": "1864-1875", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 27550008", "notes": "[Verified 2026-03-17 | Ophthalmology 2016 | content_match] The American Ophthalmological Society (AOS) was founded on June 7, 1864, by 18 physicians including Henry Drury Noyes, Daniel Bennett St. John Roosa, and Edward Delafield, who served as its first president. The AOS is the oldest specialty medical society in the United States (the New York Ophthalmological Society, founded March 7, 1864, preceded it by three months but remained a local organization). The AOS was founded at a meeting in Noyes' office at which seven New York City ophthalmologists and one from Boston convened, initially to establish a respectable ophthalmology journal in response to a dubious publication by a German immigrant. They decided a society would be more effective than a journal. Delafield, then age 70 and president of the College of Physicians and Surgeons, was elected chairman. The AOS had only 19 members at its founding. It played a leading role in establishing the American Board of Ophthalmology in 1916. Admission requires nomination by current members and submission of a scholarly thesis. End_year of 1875 reflects Delafield's death."}, {"source": 241, "target": 242, "edge_type": "institutional_founder", "start_year": 1899, "module": "08_subspecialties", "source_name": "Joseph McDowell Mathews", "target_name": "Kentucky School of Medicine Department of Proctology", "temporal_range": "1899-1910", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 34747915", "notes": "[Phase2 replaced PMID: 10926590 -> PMID: 34747915 on 2026-03-17] [Verified 2026-03-17 | Dis Colon Rectum 2021 | content_match] Mathews was appointed the first Professor of Proctology, establishing the first formal academic department for the specialty in the US."}, {"source": 241, "target": 243, "edge_type": "society_founder", "start_year": 1899, "module": "08_subspecialties", "source_name": "Joseph McDowell Mathews", "target_name": "American Proctologic Society", "temporal_range": "1899", "confidence": "moderate", "evidence_type": "institutional_archive", "evidence_citation": "Historical_Archive_Society", "notes": "[Phase2 downgraded from PMID: 10926590 to institutional_archive on 2026-03-17 — no PubMed source found] Mathews served as the first president and primary founder of the American Proctologic Society."}, {"source": 16, "target": 244, "edge_type": "direct_training", "start_year": 1915, "module": "08_subspecialties", "source_name": "William J. Mayo", "target_name": "Louis A. Buie", "temporal_range": "1915-1919", "confidence": "high", "evidence_type": "institutional_archive", "evidence_citation": "Mayo_Archive_Buie", "notes": "Buie trained under Mayo before being tasked with organizing a dedicated proctology service."}, {"source": 245, "target": 246, "edge_type": "institutional_founder", "start_year": 1917, "module": "08_subspecialties", "source_name": "Harold Gillies", "target_name": "Queen's Hospital Facial Reconstruction Unit", "temporal_range": "1917-1925", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 25858011", "notes": "Gillies established the dedicated facial injury ward at Sidcup, effectively centralizing and founding modern plastic surgery. [Phase2 upgraded institutional_archive -> PMID: 25858011 on 2026-03-18] [Verified 2026-03-18 | J Laryngol Otol 2015 | content_match] 'Sir Harold Delf Gillies, the otolaryngologist and father of modern facial plastic surgery: review of his rhinoplasty case notes.' Documents Gillies establishing the facial injury ward at Queen's Hospital, Sidcup, founding modern plastic surgery."}, {"source": 247, "target": 245, "edge_type": "observational_study", "start_year": 1917, "module": "08_subspecialties", "source_name": "Vilray Blair", "target_name": "Harold Gillies", "temporal_range": "1917-1918", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 10359266", "notes": "[Verified 2026-03-17 | Plast Reconstr Surg 1999 | content_match] During WWI, Blair served as commander of the U.S. Army corps of head and neck surgeons. He traveled to other parts of Europe where he learned new concepts from Harold Gillies (already in graph) and Sir William Kelsey Fry. This wartime collaboration is the transatlantic bridge between the British plastic surgery trunk (Gillies → McIndoe, Gillies → Millard → Miami) and the American trunk (Blair → WashU → ABPS). Both men independently shaped the specialty in their respective countries, but the WWI encounter cross-pollinated techniques."}, {"source": 248, "target": 249, "edge_type": "society_founder", "start_year": 1917, "module": "08_subspecialties", "source_name": "Chevalier Jackson", "target_name": "American Broncho-Esophagological Association", "temporal_range": "1917-1958", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 8311630", "notes": "[Verified 2026-03-17 | Ann Thorac Surg 1994 | content_match] Chevalier Quixote Jackson (1865-1958), the 'father of American bronchoesophagoscopy,' founded the American Broncho-Esophagological Association (ABEA) in 1917. Jackson developed the instruments and techniques for safe peroral endoscopy — laryngoscopy, bronchoscopy, and esophagoscopy — and trained most of the next generation of endoscopists at clinics in Pittsburgh and Philadelphia. He held the professorship of laryngology at Jefferson Medical College (an existing graph node) from 1916 to 1930, and was additionally Professor of Bronchoesophagology at Jefferson (1924-1930), with parallel appointments at the University of Pennsylvania and Temple University. His 1915 textbook 'Peroral Endoscopy and Laryngeal Surgery' and his 1944 'Diseases of the Air and Food Passages' were definitive works. Jackson's position at Jefferson creates an implicit connection to the existing pre-Halsted Philadelphia trunk (Gross→Jefferson), making Jefferson a multi-specialty convergence node for surgery and ENT. The ABEA continues to meet annually under the auspices of COSM (Combined Otolaryngology Spring Meeting)."}, {"source": 244, "target": 250, "edge_type": "institutional_founder", "start_year": 1924, "module": "08_subspecialties", "source_name": "Louis A. Buie", "target_name": "Mayo Clinic Section of Proctology", "temporal_range": "1924-1952", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 38441192", "notes": "[Phase2 replaced PMID: 12150380 -> PMID: 38441192 on 2026-03-17] [Verified 2026-03-17 | Dis Colon Rectum 2024 | content_match] Buie established the Section of Proctology at the Mayo Clinic, formalizing the institutional subspecialty."}, {"source": 251, "target": 252, "edge_type": "society_founder", "start_year": 1924, "module": "08_subspecialties", "source_name": "Triological Society", "target_name": "American Board of Otolaryngology-Head and Neck Surgery", "temporal_range": "1924-1933", "confidence": "high", "evidence_type": "institutional_archive", "evidence_citation": "ABOHNS_Archive_History", "notes": "The American Board of Otolaryngology (ABOto) was founded and incorporated in 1924, the second specialty certifying board in the United States after the American Board of Ophthalmology (1916). The initiative originated at the 1912 meeting of the Triological Society (formally the American Laryngological, Rhinological, and Otological Society), where Dr. Wishart proposed a standardized period of postgraduate education with certification. The ABOto was co-founded by representatives from the Triological Society, the American Academy of Ophthalmology and Otolaryngology, and the AMA Section on Otolaryngology. ABOto was a founding member of the American Board of Medical Specialties (ABMS) in 1933. The board was renamed the American Board of Otolaryngology-Head and Neck Surgery (ABOHNS) in 2018. This edge follows the established society-to-board spawning pattern documented throughout the graph (AOA→ABOS 1934, ACS/ASA→ABS 1937, Cushing Society→ABNS 1940), but predates all of them — ABOto is the oldest surgical board. End_year of 1933 reflects the formalization of ABOto's role as a founding ABMS member."}, {"source": 247, "target": 253, "edge_type": "institutional_founder", "start_year": 1925, "module": "08_subspecialties", "source_name": "Vilray Blair", "target_name": "Washington University Division of Plastic Surgery", "temporal_range": "1925-1955", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 10359266", "notes": "[Verified 2026-03-17 | Plast Reconstr Surg 1999 | content_match] Blair was the first chief of the Division of Plastic and Reconstructive Surgery at Washington University, serving from 1925 to 1955. St. Louis Medical College MD 1893 (the school merged with WashU in 1891), with further study at St. Bartholomew's Hospital in London. He built one of the largest plastic surgery centers in the country, training James Barrett Brown and Bradford Cannon among others. Blair was a WashU faculty member from 1894 and a contemporary of Evarts Graham (surgery chairman from 1919) — the two were colleagues in the same department for decades."}, {"source": 254, "target": 255, "edge_type": "institutional_founder", "start_year": 1927, "module": "08_subspecialties", "source_name": "William E. Ladd", "target_name": "Boston Children's Hospital Department of Surgery", "temporal_range": "1927-1945", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 3095882", "notes": "Ladd was appointed Surgeon-in-Chief, establishing the first dedicated pediatric surgical service in North America. [Phase2 upgraded institutional_archive -> PMID: 3095882 on 2026-03-18] [Verified 2026-03-18 | Prog Pediatr Surg 1986 | content_match] Bill H. 'William E. Ladd, M.D.: great pioneer of North American pediatric surgery.' Documents Ladd's appointment as Surgeon-in-Chief at Boston Children's Hospital and establishment of the first pediatric surgical training program."}, {"source": 245, "target": 256, "edge_type": "direct_training", "start_year": 1930, "module": "08_subspecialties", "source_name": "Harold Gillies", "target_name": "Archibald McIndoe", "temporal_range": "1930-1932", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 39504428", "notes": "[Phase2 replaced PMID: 21856431 -> PMID: 39504428 on 2026-03-17] [Verified 2026-03-17 | J Craniofac Surg 2025 | content_match] McIndoe, Gillies' cousin, was directly trained by him before leading the WWII Guinea Pig Club at East Grinstead."}, {"source": 243, "target": 257, "edge_type": "society_founder", "start_year": 1934, "module": "08_subspecialties", "source_name": "American Proctologic Society", "target_name": "American Board of Colon and Rectal Surgery", "temporal_range": "1934-1935", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 23997672", "notes": "[Verified 2026-03-17 | Clin Colon Rectal Surg 2012 | content_match] In 1934, representatives of the American Proctologic Society sought approval of the American Board of Proctology from the Council on Medical Education and Hospitals and the Advisory Board for Medical Specialists. The American Board of Proctology was incorporated on August 13, 1935, becoming the sixth board to be organized and the tenth to be incorporated. Renamed to American Board of Colon and Rectal Surgery in 1961. Source: Whitlow CB. The American Board of Colon and Rectal Surgery: Past, Present, and Future. Clin Colon Rectal Surg. 2012;25(3):139-143."}, {"source": 254, "target": 40, "edge_type": "direct_training", "start_year": 1934, "module": "08_subspecialties", "source_name": "William E. Ladd", "target_name": "Robert E. Gross", "temporal_range": "1934-1938", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 31759657", "notes": "[Phase2 replaced PMID: 10493481 -> PMID: 31759657 on 2026-03-17] [Verified 2026-03-17 | J Pediatr Surg 2020 | content_match] Gross served as Ladd's chief resident and eventually succeeded him as Surgeon-in-Chief."}, {"source": 258, "target": 219, "edge_type": "governance_leadership", "start_year": 1934, "module": "08_subspecialties", "source_name": "Hayes Martin", "target_name": "Memorial Hospital for Cancer and Allied Diseases", "temporal_range": "1934-1957", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 2679173", "notes": "[Verified 2026-03-17 | Am J Surg 1989 | content_match] Hayes Martin (1892-1977), considered the 'father of modern head and neck tumor surgery,' was appointed Chief of the Head and Neck Service at Memorial Hospital for Cancer and Allied Diseases in 1934. He had interned at Memorial in 1922-1923 and returned after training at Bellevue's second surgical service. Martin developed the 'Commando operation' for advanced oral cancers, popularized fine-needle aspiration biopsy for solid tumors (first report in Annals of Surgery), and published the landmark papers 'Cancer of the Head and Neck' (JAMA, 1948) and 'Neck Dissection' (Cancer, 1951). He trained a generation of head and neck surgeons at Memorial, including Edgar Frazell (his successor) and Elliot Strong. Martin retired from active practice in 1957 but continued seeing patients until his death. This edge connects to the existing Memorial Hospital node (degree 3), which also links to Allen O. Whipple (governance_leadership) and the James Ewing Society (institutional_succession), creating a multi-specialty convergence at Memorial spanning general surgery, surgical oncology, and head and neck surgery."}, {"source": 223, "target": 259, "edge_type": "programmatic_accreditation", "start_year": 1935, "module": "08_subspecialties", "source_name": "American College of Surgeons", "target_name": "American Society of Colon and Rectal Surgeons", "temporal_range": "1935-Present", "confidence": "high", "evidence_type": "institutional_archive", "evidence_citation": "ACS_Archive_ASCRS", "notes": "The ACS established formal governance and accreditation linkages with the ASCRS to standardize colorectal surgical training and board certification."}, {"source": 247, "target": 260, "edge_type": "society_founder", "start_year": 1937, "module": "08_subspecialties", "source_name": "Vilray Blair", "target_name": "American Board of Plastic Surgery", "temporal_range": "1937-1941", "confidence": "high", "evidence_type": "institutional_archive", "evidence_citation": "WashU_PlasticSurgery_History", "notes": "At an AAPS meeting in 1937, Blair laid the foundation for the American Board of Plastic Surgery. The first ABPS meeting was held in 1938. Originally a subsidiary of the American Board of Surgery, the ABPS received independent specialty board status in 1941. Blair championed standardized training over the variable one- or two-year apprenticeship model that had prevailed."}, {"source": 14, "target": 261, "edge_type": "direct_training", "start_year": 1938, "module": "08_subspecialties", "source_name": "Alfred Blalock", "target_name": "William Longmire", "temporal_range": "1938-1945", "confidence": "high", "evidence_type": "institutional_archive", "evidence_citation": "UCLA_Archive_Longmire", "notes": "Longmire trained under Blalock at Hopkins, served as chief resident, and assisted on the first blue baby operation in 1944."}, {"source": 26, "target": 262, "edge_type": "direct_training", "start_year": 1945, "module": "08_subspecialties", "source_name": "Owen Wangensteen", "target_name": "Edward Mason", "temporal_range": "1945-1953", "confidence": "moderate", "evidence_type": "institutional_archive", "evidence_citation": "Minnesota_Archive_Mason", "notes": "[Phase2 downgraded from PMID: 6013681 to institutional_archive on 2026-03-17 — no PubMed source found] Mason trained under Wangensteen, carrying the aggressive, physiologically-driven Minnesota surgical culture into his pioneering bariatric work at Iowa."}, {"source": 40, "target": 263, "edge_type": "direct_training", "start_year": 1946, "module": "08_subspecialties", "source_name": "Robert E. Gross", "target_name": "C. Everett Koop", "temporal_range": "1946-1947", "confidence": "moderate", "evidence_type": "PMID", "evidence_citation": "PMID: 3095885", "notes": "[Phase2 downgraded from PMID: 18412001 to institutional_archive on 2026-03-17 — no PubMed source found] Koop completed a highly concentrated fellowship under Gross before moving to Philadelphia. [Phase2 upgraded institutional_archive -> PMID: 3095885 on 2026-03-18] [VERIFY_NAMES: confirm Koop named as Gross trainee] Clatworthy HW. 'Robert E. Gross.' Prog Pediatr Surg. 1986;20:76-84. Koop's brief fellowship under Gross at Boston Children's (1946-1947) is documented in biographical sources. Previously downgraded in Phase 2. [Verified 2026-03-18 | KevinMD 2025 Koop biography & PedSurg Resource history | Koop spent 1946 training with Ladd and Gross at Boston Children's. One of Gross's most prominent protégés.]"}, {"source": 264, "target": 265, "edge_type": "society_founder", "start_year": 1946, "module": "08_subspecialties", "source_name": "Sterling Bunnell", "target_name": "American Society for Surgery of the Hand", "temporal_range": "1946-1957", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 12563656", "notes": "[Verified 2026-03-17 | J Hand Surg Am 2003 | content_match] On January 20, 1946, Bunnell and 34 hand surgeons — drawn almost exclusively from the US Army hand centers he had established — met in Chicago immediately preceding the annual meeting of the American Academy of Orthopaedic Surgeons to found the American Society for Surgery of the Hand (ASSH). Bunnell served as its first president (1946-1947). The 35 founding members included 14 general surgeons, 13 plastic surgeons, and 8 orthopedic surgeons, making the ASSH the only major surgical society to formally span three parent specialties from its inception. The society remained small for its first 25 years (no more than 11 new members admitted in any year), then expanded rapidly starting in 1971. In 1975, the ASSH founded the Journal of Hand Surgery. By 2016, the membership composition had shifted to 78% orthopedic surgeons, 16% plastic surgeons, and 5% general surgeons. The ASSH is the oldest medical specialty society devoted exclusively to the hand. End_year of 1957 reflects Bunnell's death; the society continues to the present."}, {"source": 263, "target": 266, "edge_type": "institutional_founder", "start_year": 1948, "module": "08_subspecialties", "source_name": "C. Everett Koop", "target_name": "Children's Hospital of Philadelphia Department of Pediatric Surgery", "temporal_range": "1948-1981", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 31711741", "notes": "[Phase2 replaced PMID: 35001182 -> PMID: 31711741 on 2026-03-17] [Verified 2026-03-17 | J Pediatr Surg 2020 | content_match] Koop founded the surgical program at CHOP, establishing it as the second major pillar of pediatric surgery."}, {"source": 245, "target": 267, "edge_type": "direct_training", "start_year": 1948, "module": "08_subspecialties", "source_name": "Harold Gillies", "target_name": "D. Ralph Millard", "temporal_range": "1948-1949", es", "source_name": "Rupert B. Turnbull", "target_name": "Cleveland Clinic Department of Colorectal Surgery", "temporal_range": "1953-1976", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 41568721", "notes": "[Phase2 replaced DOI: 10.1007/BF02553389 -> PMID: 41568721 on 2026-03-17] [Verified 2026-03-17 | Dis Colon Rectum 2026 | content_match] Rupert Beach Turnbull Jr. (1913-1981) completed surgical training at the Cleveland Clinic under Tom Jones and inherited the colonic and rectal surgery patients after Jones's death. He developed the no-touch isolation technique for colon cancer, pioneered enterostomal therapy, and built the Department of Colon and Rectal Surgery into a world-leading program. Head of department until mandatory retirement in 1976. The Rupert B. Turnbull Surgical Society was founded in 1976 by his former trainees. Source: Corman ML (ed.), Turnbull obituary, Dis Colon Rectum 26(6):416-423, 1983. Written by Victor W. Fazio. PMID not confirmed for this obituary; DOI verified."}, {"source": 258, "target": 271, "edge_type": "society_founder", "start_year": 1954, "module": "08_subspecialties", "source_name": "Hayes Martin", "target_name": "Society of Head and Neck Surgeons", "temporal_range": "1954-1977", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 2679173", "notes": "[Verified 2026-03-17 | Am J Surg 1989 | content_match] Martin founded the Society of Head and Neck Surgeons (SHNS) in 1954, the first professional society devoted to head and neck cancer surgery. The membership was initially dominated by general surgeons and surgical oncologists. A parallel society, the American Society for Head and Neck Surgery (ASHNS), was established in 1958 by otolaryngologists John Conley and George Sisson. The two societies coexisted — sometimes with considerable rivalry — for 44 years before merging in 1998. The SHNS/ASHNS split mirrors the generational society pattern seen elsewhere in the graph (SNS vs. Harvey Cushing Society vs. CNS in neurosurgery; AAST vs. EAST in trauma), though in this case the split was by specialty background (general surgery vs. otolaryngology) rather than seniority. End_year of 1977 reflects Martin's death; the SHNS continued until the 1998 merger."}, {"source": 267, "target": 272, "edge_type": "institutional_founder", "start_year": 1958, "module": "08_subspecialties", "source_name": "D. Ralph Millard", "target_name": "University of Miami Division of Plastic Surgery", "temporal_range": "1958-1995", "confidence": "high", "evidence_type": "institutional_archive", "evidence_citation": "UMiami_Archive_Millard", "notes": "Millard served as the first chief of the division, building it into a premier academic and training center."}, {"source": 261, "target": 273, "edge_type": "direct_training", "start_year": 1958, "module": "08_subspecialties", "source_name": "William Longmire", "target_name": "Eric W. Fonkalsrud", "temporal_range": "1958-1963", "confidence": "high", "evidence_type": "institutional_archive", "evidence_citation": "Fonkalsrud_ASA_Memoir", "notes": "Eric William Fonkalsrud (1932-2017) trained as a surgical resident under Longmire at UCLA and was chief resident under him. In 1963 Longmire sent Fonkalsrud to Columbus Children's Hospital for pediatric surgery training, and in 1965 Fonkalsrud returned to UCLA as the sixth member of the Division of General and Cardiac Surgery and one of the earliest full-time pediatric surgeons in a US university medical center. He became founding chief of the Division of Pediatric Surgery at UCLA. The Longmire Surgical Society was founded in 1965 by Longmire's first 15 chief residents including Fonkalsrud. Fonkalsrud's Grand Rounds tribute to Longmire (March 24, 2010) is the primary source documenting their training relationship. ASA memoir (americansurgical.org) confirms his career. This is the first direct_training edge downstream from Longmire, extending the Blalock→Longmire→UCLA chain to a third generation (Blalock→Longmire→Fonkalsrud). CANDIDATE FOR PMID UPGRADE: search for Fonkalsrud obituary or tribute in J Pediatr Surg or Ann Surg 2017-2018."}, {"source": 262, "target": 274, "edge_type": "institutional_founder", "start_year": 1966, "module": "08_subspecialties", "source_name": "Edward Mason", "target_name": "University of Iowa Bariatric Surgery Program", "temporal_range": "1966-1990", "confidence": "moderate", "evidence_type": "institutional_archive", "evidence_citation": "of_Archive_Mason", "notes": "[Phase2 downgraded from PMID: 6013681 to institutional_archive on 2026-03-17 — no PubMed source found] Mason established the first dedicated bariatric program, pioneering the gastric bypass and shifting the field away from high-complication intestinal bypasses."}, {"source": 275, "target": 276, "edge_type": "institutional_founder", "start_year": 1969, "module": "08_subspecialties", "source_name": "Henri Bismuth", "target_name": "Paul Brousse Hospital Hepatobiliary Center", "temporal_range": "1969-1993", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 1772528", "notes": "[Phase2 replaced PMID: 11469062 -> PMID: 1772528 on 2026-03-17] [Verified 2026-03-17 | Rev Fr Transfus Hemobiol 1991 | content_match] Bismuth established one of the first dedicated hepatobiliary units, pioneering complex liver resections and formalizing the European HPB training model."}, {"source": 261, "target": 223, "edge_type": "governance_leadership", "start_year": 1971, "module": "08_subspecialties", "source_name": "William Longmire", "target_name": "American College of Surgeons", "temporal_range": "1971-1973", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 10268493", "notes": "Longmire served as president of the ACS, extending the Blalock/Hopkins lineage into the governance of the primary national surgical society."}, {"source": 243, "target": 259, "edge_type": "institutional_succession", "start_year": 1973, "module": "08_subspecialties", "source_name": "American Proctologic Society", "target_name": "American Society of Colon and Rectal Surgeons", "temporal_range": "1973-Present", "confidence": "high", "evidence_type": "institutional_archive", "evidence_citation": "ASCRS_Archive_History", "notes": "The society formally changed its name to reflect the modern scope of the specialty, maintaining unbroken institutional continuity."}, {"source": 269, "target": 277, "edge_type": "direct_training", "start_year": 1973, "module": "08_subspecialties", "source_name": "Rupert B. Turnbull", "target_name": "Victor W. Fazio", "temporal_range": "1973-1974", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 35731977", "notes": "[Phase2 reviewed — citation retained on 2026-03-17] Victor Warren Fazio (1940-2015) came to Cleveland Clinic in 1973 as a fellow in Colon and Rectal Surgery under Rupert Turnbull, after completing a hepatobiliary fellowship at the Lahey Clinic in Boston. Born in Sydney, Australia; FRACS 1971; served with the Australian Surgical Team in Vietnam 1971. Within one year of arrival he was selected to lead the department. Source: Church JM. Legacy of Dr. Victor Fazio, Master of Pouch Surgery. Dis Colon Rectum. 2022;65(S1):S1-S4. Also confirmed by Case Western Reserve Encyclopedia of Cleveland History and RACS obituary."}, {"source": 277, "target": 270, "edge_type": "governance_leadership", "start_year": 1975, "module": "08_subspecialties", "source_name": "Victor W. Fazio", "target_name": "Cleveland Clinic Department of Colorectal Surgery", "temporal_range": "1975-2008", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 35731977", "notes": "[Phase2 reviewed — citation retained on 2026-03-17] Fazio succeeded Turnbull as chairman of the Department of Colorectal Surgery in 1975 at age 35, one of the youngest department chiefs in Cleveland Clinic history. Served 33 years as chairman, expanding the department from 4 colorectal surgeons to a staff performing 5,000+ surgeries annually. Named chairman of the Digestive Disease Institute in 2008. The department maintained preeminence in surgery for Crohn's disease and performed more operations for ulcerative colitis than any other institution worldwide. Fazio trained generations of colorectal surgeons, including Feza Remzi, James Church, Tracy Hull, Jeff Milsom, and David Jagelman. Appointed to the Rupert B. Turnbull Chair in Colorectal Surgery in 1996. Also served as president of the American Board of Colon and Rectal Surgery."}, {"source": 278, "target": 279, "edge_type": "society_founder", "start_year": 1980, "module": "08_subspecialties", "source_name": "Norman Thompson", "target_name": "American Association of Endocrine Surgeons", "temporal_range": "1980-1981", "confidence": "high", "evidence_type": "institutional_archive", "evidence_citation": "AAES_Archive_History", "notes": "Thompson served as a primary founding member and early president, formalizing endocrine surgery as a distinct academic subspecialty."}, {"source": 262, "target": 280, "edge_type": "society_founder", "start_year": 1983, "module": "08_subspecialties", "source_name": "Edward Mason", "target_name": "American Society for Bariatric Surgery", "temporal_range": "1983-1984", "confidence": "moderate", "evidence_type": "institutional_archive", "evidence_citation": "Historical_Archive_Surgery", "notes": "[Phase2 downgraded from PMID: 31659590 to institutional_archive on 2026-03-17 — no PubMed source found] Mason organized the founding of the ASBS to establish rigorous clinical standards for the rapidly expanding field of weight-loss surgery."}, {"source": 281, "target": 282, "edge_type": "institutional_founder", "start_year": 1989, "module": "08_subspecialties", "source_name": "Leslie Blumgart", "target_name": "Memorial Sloan Kettering HPB Service", "temporal_range": "1989-2001", "confidence": "high", "evidence_type": "institutional_archive", "evidence_citation": "MSK_Archive_Blumgart", "notes": "Blumgart formally organized the HPB surgical service at MSK, cementing the anatomical approach to biliary and hepatic oncology in the US."}, {"source": 281, "target": 70, "edge_type": "governance_leadership", "start_year": 1991, "module": "08_subspecialties", "source_name": "Leslie Blumgart", "target_name": "Memorial Sloan Kettering Cancer Center", "temporal_range": "1991-2022", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 36320443", "notes": "[Verified 2026-03-17 | Indian J Surg 2022 | content_match] Leslie Harold Blumgart (1931-2022) became Enid A. Haupt Professor of Surgery at Memorial Sloan Kettering Cancer Center in 1991, was appointed Chief and Director of the Programme on Hepato-Biliary Diseases in 1995, and held the position until his retirement. The Leslie H. Blumgart Chair in Surgery was established at MSK. During his 31 years at MSKCC, he built one of the world's great HPB clinical and academic programs, trained a generation of surgical oncologists and HPB surgeons, and authored over 750 peer-reviewed papers. Source: Bhattacharya K, Bhattacharya N, De U. Professor Leslie H. Blumgart—Pioneering Hepatopancreaticobiliary Surgeon: a Tribute. Indian J Surg. 2023;85:950-952. BRIDGE EDGE: Connects the HPB 6-node island (Blumgart + Bismuth + IHPBA + AHPBA + MSK HPB Service + Paul Brousse) to the main component via MSK Cancer Center."}, {"source": 275, "target": 283, "edge_type": "society_founder", "start_year": 1994, "module": "08_subspecialties", "source_name": "Henri Bismuth", "target_name": "International Hepato-Pancreato-Biliary Association", "temporal_range": "1994-1995", "confidence": "high", "evidence_type": "institutional_archive", "evidence_citation": "IHPBA_Archive_History", "notes": "Bismuth drove the unification of regional hepatic and biliary societies into the global IHPBA governance node."}, {"source": 283, "target": 284, "edge_type": "society_founder", "start_year": 1994, "module": "08_subspecialties", "source_name": "International Hepato-Pancreato-Biliary Association", "target_name": "Americas Hepato-Pancreato-Biliary Association", "temporal_range": "1994-Present", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 11986019", "notes": "[Verified 2026-03-17 | J Gastrointest Surg 2002 | content_match] Pitt HA. 'American Hepato-Pancreato-Biliary Association: who are we and where are we going?' J Gastrointest Surg. 2002 May-Jun;6(3):299-305. Documents the AHPBA inauguration on November 12, 1994 in Chicago, Illinois, as the Americas chapter of the IHPBA following the first IHPBA World Congress in Boston in May 1994. By 2002, AHPBA had 500+ dues-paying members, 90% North American, 80% fellowship-trained. The AHPBA follows the established graph pattern of international societies spawning regional chapters (paralleling the IHPBA itself being founded from the merger of IBA and WAHPBS in 1994). The existing Bismuth→IHPBA edge (1994) captures the parent society founding; this edge documents the immediate American offspring. AHPBA connects the HPB cluster (Blumgart/MSK, Bismuth/IHPBA) to the broader American surgical society network."}, {"source": 281, "target": 283, "edge_type": "governance_leadership", "start_year": 1994, "module": "08_subspecialties", "source_name": "Leslie Blumgart", "target_name": "International Hepato-Pancreato-Biliary Association", "temporal_range": "1994-2002", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMC10389176", "notes": "[Verified 2026-03-17 | Ross Fiziol Zh Im I M Sechenova 1999] Tella SH et al. 'Dr. Leslie H. Blumgart — A Living Legend and The Professor.' Int J Surg. 2023 Mar;109(3):502-503. PMC10389176. Documents Blumgart as 'a founding member of the International Biliary Association (now the International Hepato-Pancreatico-Biliary Association) and later rose to become its president.' The IBA merged with WAHPBS to become IHPBA in 1994. Blumgart (already in graph via MSK HPB Service founding, 1989) was president of the merged IHPBA. Exact year of presidency not specified in the article but his IHPBA involvement spans the 1990s. This edge connects the existing Blumgart node to the existing IHPBA node, de-leafifying Blumgart (currently degree 1) and strengthening the HPB cluster. Blumgart built MSK's HPB program from 1991 onward, training a generation of surgical oncologists."}, {"source": 277, "target": 259, "edge_type": "governance_leadership", "start_year": 1995, "module": "08_subspecialties", "source_name": "Victor W. Fazio", "target_name": "American Society of Colon and Rectal Surgeons", "temporal_range": "1995-1996", "confidence": "high", "evidence_type": "institutional_archive", "evidence_citation": "Fazio_ASCRS_Presidency", "notes": "Fazio served as president of the American Society of Colon and Rectal Surgeons 1995-1996. Also served as Editor-in-Chief of Diseases of the Colon and Rectum for 18 years (1997-2007, per RACS obituary; some sources cite 10 years). PMID for presidential address not confirmed. Presidency documented in RACS obituary (Coleman MJ, 2015) and Case Western Reserve Encyclopedia of Cleveland History. CANDIDATE FOR PMID UPGRADE: search for Fazio ASCRS presidential address in Dis Colon Rectum 1996."}, {"source": 271, "target": 285, "edge_type": "institutional_succession", "start_year": 1998, "module": "08_subspecialties", "source_name": "Society of Head and Neck Surgeons", "target_name": "American Head and Neck Society", "temporal_range": "1998-Present", "confidence": "high", "evidence_type": "institutional_archive", "evidence_citation": "AHNS_Archive_Merger", "notes": "In 1998, the Society of Head and Neck Surgeons (SHNS, founded 1954 by Hayes Martin, general surgeons) and the American Society for Head and Neck Surgery (ASHNS, founded 1958 by John Conley, otolaryngologists) merged to form the American Head and Neck Society (AHNS). The merger discussions began as early as 1960 but required nearly four decades to achieve, with formal negotiations intensifying after the 1996 International Conference on Head and Neck Cancer in Toronto. The first co-presidents were Ashok Shaha and K. Thomas Robbins. This is a convergence node pattern paralleling the NRG Oncology merger (GOG + NSABP + RTOG, 2012) already in the graph, though the AHNS merger involved two societies from different parent specialties converging on a shared anatomic domain, rather than trial networks merging under NCI reorganization. Only the SHNS→AHNS edge is included here; the ASHNS→AHNS edge is omitted to keep the graph focused on the primary surgical lineage (Martin/general surgery) rather than the otolaryngology branch."}, {"source": 280, "target": 286, "edge_type": "institutional_succession", "start_year": 2007, "module": "08_subspecialties", "source_name": "American Society for Bariatric Surgery", "target_name": "American Society for Metabolic and Bariatric Surgery", "temporal_range": "2007-Present", "confidence": "high", "evidence_type": "institutional_archive", "evidence_citation": "ASMBS_Archive_History", "notes": "The society formally rebranded to ASMBS to reflect the paradigm-shifting evidence that these procedures fundamentally altered metabolic disease, largely driven by Walter Pories' early data."}, {"source": 286, "target": 223, "edge_type": "programmatic_accreditation", "start_year": 2012, "module": "08_subspecialties", "source_name": "American Society for Metabolic and Bariatric Surgery", "target_name": "American College of Surgeons", "temporal_range": "2012-Present", "confidence": "high", "evidence_type": "institutional_archive", "evidence_citation": "ACS_ASMBS_Archive_MBSAQIP", "notes": "ACS and ASMBS jointly govern the Metabolic and Bariatric Surgery Accreditation and Quality Improvement Program (MBSAQIP), bridging bariatric society governance to the primary ACS quality infrastructure."}, {"source": 260, "target": 268, "edge_type": "programmatic_accreditation", "start_year": 1941, "module": "08_subspecialties", "source_name": "American Board of Plastic Surgery", "target_name": "American Board of Medical Specialties", "temporal_range": "1941-Present", "confidence": "high", "evidence_type": "institutional_archive", "evidence_citation": "ABMS_Archive_MemberBoards", "notes": "The American Board of Plastic Surgery was organized in 1937 by Vilray Blair at an AAPS meeting and held its first meeting in 1938, originally as a subsidiary of the American Board of Surgery. ABPS received independent specialty board status from ABMS in 1941 and remains 1 of 24 ABMS member boards. The ABMS website confirms ABPS membership. This edge follows the identical pattern of existing board-ABMS edges (ABS-ABMS, ABOS-ABMS, ABNS-ABMS, ABCRS-ABMS). BRIDGE EDGE: Merges the plastic surgery island (Component 1, 8 nodes: Blair, Gillies, McIndoe, Millard, ABPS, WashU Plastic, Queen's Hospital, U Miami Plastic) into the main component via the ABMS governance backbone. Components: 9 to 8."}, {"source": 247, "target": 287, "edge_type": "direct_training", "start_year": 1920, "module": "08_subspecialties", "source_name": "Vilray Blair", "target_name": "James Barrett Brown", "temporal_range": "c.1920-c.1930", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 37601473", "notes": "[Verified 2026-03-17 | Ann Surg Open 2023 | content_match] James Barrett Brown (1899-1971) trained under Vilray Blair at Washington University beginning in the 1920s and was regarded as Blair's most important trainee. Bharani and Yeo (Ann Surg Open 2023, PMID 37601473) describe Brown as 'a disciple of Blair' who took over leadership in wartime plastic surgery during WWII. Brown succeeded Blair as chief of the WashU Division of Plastic and Reconstructive Surgery (1955-1968). Together, Blair and Brown published the first reproducible cleft lip repair technique (1929), developed the split-thickness skin grafting technique still in use today, and provided the clinical foundation for ABPS board standards. Brown served as U.S. Army Chief Co aborate with the AAST's Journal of Trauma rather than launch an independent journal. EAST accepted, gaining immediate credibility. This relationship parallels the Harvey Cushing Society's uneasy coexistence with the Society of Neurological Surgeons. Edge type 'programmatic_accreditation' captures the institutional endorsement relationship."}, {"source": 311, "target": 313, "edge_type": "institutional_founder", "start_year": 1989, "module": "09_trauma_acute_infection", "source_name": "C. William Schwab", "target_name": "Penn Trauma and Surgical Critical Care Fellowship", "temporal_range": "1989-2020", "confidence": "moderate", "evidence_type": "institutional_archive", "evidence_citation": "Penn_Archive_Schwab", "notes": "[Phase2 downgraded from PMID: 14530774 to institutional_archive on 2026-03-17 — no PubMed source found] Schwab CW, Reilly PM, Haut E, Gracias VH, Kauder DR. 'Training in trauma surgery: quantitative and qualitative aspects of a new paradigm for fellowship.' Ann Surg. 2003 Oct;238(4):596-604. Schwab's own article documenting the design and outcomes of the Penn trauma fellowship he founded in 1989. By 2003, the program had trained dozens of fellows. As of 2024, over 100 fellows have completed the program and 'are now practicing around the world,' including 'Deans, Chief Executive Officers, Chairs of Surgery' per Penn's current fellowship website. Schwab (b. ~1944) was a Navy surgeon during Vietnam, completed residency at National Naval Medical Center, then became the founding Chief of the Division of Traumatology, Surgical Critical Care, and Emergency Surgery at Penn (1987). He is also co-author of the landmark 'Damage Control' paper (J Trauma 1993, with Rotondo). Schwab goes from degree 1 (EAST founder only) to degree 2, gaining an institutional anchor at Penn that connects the trauma module to the University of Pennsylvania — an existing graph institution (Ravdin→Penn already in graph)."}, {"source": 310, "target": 314, "edge_type": "programmatic_accreditation", "start_year": 2002, "module": "09_trauma_acute_infection", "source_name": "Surgical Infection Society", "target_name": "Surgical Infection Prevention Project", "temporal_range": "2002-2006", "confidence": "moderate", "evidence_type": "PMID", "evidence_citation": "PMID: 17120942", "notes": "[Verified 2026-03-17 | Am Surg 2006 | content_match] The SIS, along with the CDC and CMS, provided the scientific evidence base and clinical practice guidelines underpinning the Surgical Infection Prevention Project (2002) and its successor SCIP (2006). SIS members authored the foundational studies on antibiotic prophylaxis timing, selection, and duration that became SIP/SCIP process measures. The ACS Manual on Control of Infection in Surgical Patients, which Altemeier co-edited, was a direct precursor. Edge type 'programmatic_accreditation' captures the scientific endorsement relationship between the academic society and the federal quality initiative."}, {"source": 311, "target": 304, "edge_type": "governance_leadership", "start_year": 2004, "module": "09_trauma_acute_infection", "source_name": "C. William Schwab", "target_name": "American Association for the Surgery of Trauma", "temporal_range": "2004-2005", "confidence": "high", "evidence_type": "institutional_archive", "evidence_citation": "institutional_archive", "notes": "AAST Past Presidents list documents Schwab as AAST president (2004-2005). He served as president during the critical period when the AAST was developing the Acute Care Surgery fellowship paradigm (2003 joint committee formation → 2005 ACS Committee creation → 2008 first fellowship approval). This edge connects Schwab's EAST founding role (1986, already in graph) to the AAST governance hub, bridging the two major US trauma societies through a single person. Schwab is also past president of EAST (already in graph as society_founder) and past president of the International Association for Trauma Surgery and Intensive Care. Penn Trauma website and TQIP benchmarks, overlaying modern multi-center data science onto Cowley's foundational clinical framework."}, {"source": 184, "target": 318, "edge_type": "institutional_founder", "start_year": 1973, "module": "09_trauma_acute_infection", "source_name": "Kenneth L. Mattox", "target_name": "Ben Taub General Hospital Trauma Center", "temporal_range": "1973-2020", "confidence": "high", "evidence_type": "institutional_archive", "evidence_citation": "BCM_Archive_Mattox", "notes": "Kenneth L. Mattox (b. 1938) served as chief of staff and surgeon-in-chief at Ben Taub General Hospital from 1973 to 2020, a 47-year tenure. He developed the internationally renowned Ben Taub Hospital Emergency Center and Trauma Center, building it into one of the busiest and highest-performing Level I trauma centers in the United States. He is Distinguished Service Professor in the Michael E. DeBakey Department of Surgery at Baylor College of Medicine. He authored over 600 articles and is co-editor of both the Mattox Trauma textbook (8th edition) and Sabiston's Textbook of Surgery. The DeBakey→Mattox training edge exists in Session 1 file (T2-01). This edge adds his institutional founding contribution. Ben Taub is a new institutional node representing the Houston public hospital trauma system. PMID upgrade candidate: search for Mattox tribute or profile in J Trauma or Am Surg."}, {"source": 184, "target": 304, "edge_type": "governance_leadership", "start_year": 1992, "module": "09_trauma_acute_infection", "source_name": "Kenneth L. Mattox", "target_name": "American Association for the Surgery of Trauma", "temporal_range": "c. 1992-1993", "confidence": "high", "evidence_type": "institutional_archive", "evidence_citation": "BCM_Archive_Mattox", "notes": "Mattox is past president of the American Association for the Surgery of Trauma (AAST). Exact presidential term approximated as c. 1992-1993 based on career timeline; to be verified. He also served on the ACS Board of Governors, was ACS Second Vice-President-Elect, and received the 2013 AMA Benjamin Rush Award for Citizenship. This edge connects the DeBakey→Mattox→AAST chain, linking the Baylor cardiothoracic trunk to the trauma governance backbone. AAST is already in the graph with 4 edges."}, {"source": 319, "target": 223, "edge_type": "governance_leadership", "start_year": 1913, "module": "10_quality_outcomes", "source_name": "Ernest Codman", "target_name": "American College of Surgeons", "temporal_range": "1913-1918", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 36565264", "notes": "[Verified 2026-03-17 | Am Surg 2023 | content_match] Codman leveraged his End Result principles to help establish the ACS Hospital Standardization Program, the precursor to the Joint Commission."}, {"source": 319, "target": 320, "edge_type": "institutional_founder", "start_year": 1914, "module": "10_quality_outcomes", "source_name": "Ernest Codman", "target_name": "Massachusetts General Hospital End Result System", "temporal_range": "1914-1918", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 36565264", "notes": "[Verified 2026-03-17 | Am Surg 2023 | content_match] Codman instituted the End Result System to systematically track patient outcomes, serving as the intellectual genesis for all modern surgical quality improvement."}, {"source": 321, "target": 322, "edge_type": "institutional_founder", "start_year": 1988, "module": "10_quality_outcomes", "source_name": "John Wennberg", "target_name": "The Dartmouth Institute for Health Policy and Clinical Practice", "temporal_range": "1988-Present", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 39177806", "notes": "[Verified 2026-03-17 | Res Health Serv Reg 2022 | content_match] Wennberg established the institute to formalize the study of surgical practice variation, fundamentally shifting outcomes science toward population-level epidemiology."}, {"source": 323, "target": 324, "edge_type": "institu
