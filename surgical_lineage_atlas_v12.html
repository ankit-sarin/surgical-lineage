 the Fundamentals of Laparoscopic Surgery (FLS) program in 2004 as a comprehensive educational and assessment tool for basic laparoscopic skills. The FLS committee was originally formed by SAGES in 1990 to develop educational materials. The program incorporated the McGill Inanimate System for Training and Evaluation of Laparoscopic Skills (MISTELS) as its manual skills component. ACS joined SAGES in 2005 as a joint educational partner. FLS is designed to be non-procedure-specific and applicable across all surgical specialties using laparoscopy. Since 2004, over 13,000 surgeons have successfully completed the FLS examination. FLS became the first simulation-based assessment tool mandated for board certification in any surgical specialty — a paradigm shift in surgical education from time-based to competency-based training."}, {"source": 325, "target": 332, "edge_type": "society_founder", "start_year": 2005, "module": "10_quality_outcomes", "source_name": "David Flum", "target_name": "Surgical Outcomes Club", "temporal_range": "2005-2015", "confidence": "high", "evidence_type": "institutional_archive", "evidence_citation": "SOC_Archive_Founders", "notes": "Flum drove the formation of the SOC to establish a dedicated academic society supporting the methodology and dissemination of surgical health services research."}, {"source": 325, "target": 328, "edge_type": "governance_leadership", "start_year": 2005, "module": "10_quality_outcomes", "source_name": "David Flum", "target_name": "ACS National Surgical Quality Improvement Program", "temporal_range": "2005-2015", "confidence": "high", "evidence_type": "institutional_archive", "evidence_citation": "ACS_Archive_Flum", "notes": "Flum integrated his outcomes science expertise into the ongoing development of ACS NSQIP and SCOAP, solidifying the bridge between academic societies and data registries."}, {"source": 328, "target": 1, "edge_type": "programmatic_accreditation", "start_year": 2006, "module": "10_quality_outcomes", "source_name": "ACS National Surgical Quality Improvement Program", "target_name": "Johns Hopkins Hospital Department of Surgery", "temporal_range": "2006-Present", "confidence": "moderate", "evidence_type": "institutional_archive", "evidence_citation": "JHM_Archive_Quality", "notes": "Johns Hopkins integrated ACS NSQIP into its core departmental governance, aligning Halstedian training structures with modern empirical outcomes tracking."}, {"source": 328, "target": 17, "edge_type": "programmatic_accreditation", "start_year": 2006, "module": "10_quality_outcomes", "source_name": "ACS National Surgical Quality Improvement Program", "target_name": "Mayo Clinic Department of Surgery", "temporal_range": "2006-Present", "confidence": "moderate", "evidence_type": "institutional_archive", "evidence_citation": "Mayo_Archive_Quality", "notes": "The Mayo Clinic adopted NSQIP standards to govern programmatic quality improvement across its multi-site surgical network."}, {"source": 223, "target": 315, "edge_type": "governance_leadership", "start_year": 2006, "module": "10_quality_outcomes", "source_name": "American College of Surgeons", "target_name": "Surgical Care Improvement Project", "temporal_range": "2006-2015", "confidence": "moderate", "evidence_type": "institutional_archive", "evidence_citation": "ACS_Archive_SCIP", "notes": "The ACS participated in the multi-stakeholder governance of SCIP alongside CMS and the Joint Commission, connecting federal quality mandates to the surgical society governance structure."}, {"source": 331, "target": 233, "edge_type": "programmatic_accreditation", "start_year": 2009, "module": "10_quality_outcomes", "source_name": "Fundamentals of Laparoscopic Surgery", "target_name": "American Board of Surgery", "temporal_range": "2009-present", "confidence": "high", "evidence_type": "institutional_archive", "evidence_citation": "ACS_SAGES_FLS_Joint_Statement", "notes": "Beginning with the 2009-2010 academic year, the ABS required all general surgery residents to successfully complete the FLS exam to be eligible to take the ABS Qualifying Exam in Surgery. This made FLS the first validated, simulation-based assessment tool mandated for board certification in any surgical discipline. The ABS also subsequently mandated the Fundamentals of Endoscopic Surgery (FES), another SAGES program, for certification. Edge type 'programmatic_accreditation' captures FLS serving as a mandatory credentialing gateway for ABS certification. This edge creates a modern cross-link between the MIS/endoscopic lineage (SAGES, degree 5) and the certification/governance lineage (ABS, degree 4), bridging two previously unconnected clusters."}, {"source": 333, "target": 334, "edge_type": "society_founder", "start_year": 2010, "module": "10_quality_outcomes", "source_name": "Olle Ljungqvist", "target_name": "ERAS Society", "temporal_range": "2010-Present", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 28795858", "notes": "[Verified 2026-03-17 | J Laparoendosc Adv Surg Tech A 2017 | content_match] Ljungqvist co-founded and formalized the ERAS Society, accelerating the global implementation and auditing of enhanced recovery protocols."}, {"source": 327, "target": 334, "edge_type": "institutional_succession", "start_year": 2010, "module": "10_quality_outcomes", "source_name": "ERAS Study Group", "target_name": "ERAS Society", "temporal_range": "2010-Present", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 28795858", "notes": "[Verified 2026-03-17 | J Laparoendosc Adv Surg Tech A 2017 | content_match] The informal academic study group evolved into a formal global governance body with strict auditing and accreditation protocols."}, {"source": 330, "target": 335, "edge_type": "institutional_founder", "start_year": 2014, "module": "10_quality_outcomes", "source_name": "Society of American Gastrointestinal and Endoscopic Surgeons", "target_name": "Fundamentals of Endoscopic Surgery", "temporal_range": "2014-2018", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 24317546", "notes": "[Verified 2026-03-17 | Surg Endosc 2014 | content_match] The Fundamentals of Endoscopic Surgery (FES) program was created by SAGES as the flexible endoscopy equivalent of the Fundamentals of Laparoscopic Surgery (FLS) program. FES is a comprehensive educational and assessment tool designed to teach and evaluate the fundamental knowledge, clinical judgment, and technical skills required in the performance of basic gastrointestinal flexible endoscopy. FES uses a virtual reality simulator (GI Bronch Mentor or GI Express) for the manual skills assessment, unlike FLS which uses a physical box trainer. The FES program was developed in collaboration with the ABS, ASCRS, ASMBS, and SSAT. SAGES launched FES publicly in 2014 and it was subsequently mandated by the ABS as part of the ABS Flexible Endoscopy Curriculum. Source: Marks JM et al. Why fundamentals of endoscopic surgery (FES)? Surg Endosc. 2014;28(3):701-703. This edge parallels the SAGES→FLS (2004) edge already in the graph."}, {"source": 334, "target": 221, "edge_type": "programmatic_accreditation", "start_year": 2015, "module": "10_quality_outcomes", "source_name": "ERAS Society", "target_name": "MD Anderson Cancer Center", "temporal_range": "2015-Present", "confidence": "moderate", "evidence_type": "institutional_archive", "evidence_citation": "MDA_Archive_ERAS", "notes": "MD Anderson achieved formal validation for implementing standardized ERAS protocols, particularly bridging oncologic resection with rapid physiological recovery."}, {"source": 335, "target": 233, "edge_type": "programmatic_accreditation", "start_year": 2018, "module": "10_quality_outcomes", "source_name": "Fundamentals of Endoscopic Surgery", "target_name": "American Board of Surgery", "temporal_range": "2018-Present", "confidence": "high", "evidence_type": "institutional_archive", "evidence_citation": "ABS_FEC_Mandate", "notes": "Beginning with the 2017-2018 academic year, the American Board of Surgery required all general surgery certification candidates to have completed the ABS Flexible Endoscopy Curriculum, which includes successful completion of the FES program as its Level V milestone. The ABS Flexible Endoscopy Curriculum was developed by the ABS in collaboration with SAGES, ASCRS, ASMBS, and SSAT. This is the second simulation-based assessment mandated by the ABS for board certification, following FLS (mandated 2009, already in graph as FLS→ABS edge). Together, the FLS→ABS (2009) and FES→ABS (2018) edges document the ABS's progressive incorporation of simulation-based competency assessment into board certification — a fundamental shift in how surgical competence is evaluated. Source: ABS Flexible Endoscopy Curriculum official page and SAGES press release, March 2014."}, {"source": 223, "target": 336, "edge_type": "institutional_founder", "start_year": 2019, "module": "10_quality_outcomes", "source_name": "American College of Surgeons", "target_name": "Geriatric Surgery Verification Program", "temporal_range": "2019-present", "confidence": "high", "evidence_type": "institutional_archive", "evidence_citation": "ACS_GSV_Standards_2019", "notes": "The ACS Geriatric Surgery Verification (GSV) Program launched in July 2019 with 30 evidence-based standards for optimizing surgical care of older adults. Developed by the ACS Geriatric Surgery Task Force in collaboration with over 50 stakeholder organizations and supported by the John A. Hartford Foundation. The ACS GSV Pilot Project (2014-2019) used ACS NSQIP infrastructure to collect geriatric-specific variables across 23 hospitals. In January 2025, CMS mandated reporting on the Age-Friendly Hospital Measure, and GSV created a new 'Age-Friendly Level' to align with this requirement. The GSV represents the newest evolution of the ACS quality verification model: COT Verification (trauma, 1987) → NSQIP (outcomes, 2004) → TQIP (trauma qualit ge creates the ABMS node as a convergence point for the graph's entire board certification layer. ABMS is modeled as a society node because it functions as a governing federation of specialty boards, analogous to how ACS governs quality verification programs. The edge_type is society_founder because ABO was a founding member that created ABMS, not a subsidiary accredited by it. Future expansion (Priority 8) will connect the existing surgical boards (ABS, ABNS, ABOS, ABU) to ABMS via programmatic_accreditation edges, completing the governance convergence pattern."}, {"source": 212, "target": 268, "edge_type": "programmatic_accreditation", "start_year": 1934, "module": "12_governance_societies", "source_name": "American Board of Orthopaedic Surgery", "target_name": "American Board of Medical Specialties", "temporal_range": "1934-Present", "confidence": "high", "evidence_type": "institutional_archive", "evidence_citation": "ABMS_Archive_MemberBoards", "notes": "The American Board of Orthopaedic Surgery (founded 1934 by the American Orthopaedic Association, already in graph) became a member board of ABMS. ABOS was founded one year after ABMS (1933), making it one of the earliest surgical boards to join the umbrella organization. This edge connects the independent orthopedics trunk (Knight→Hospital for Ruptured and Crippled→Gibney→Campbell→AOA→ABOS) to the central governance hub, bridging the non-Halstedian orthopedic lineage into the same accreditation framework as the Halstedian surgical boards. The complete chain is: AOA→ABOS→ABMS, paralleling ACS/ASA→ABS→ABMS in the general surgery lineage."}, {"source": 356, "target": 233, "edge_type": "society_founder", "start_year": 1935, "module": "12_governance_societies", "source_name": "American Surgical Association", "target_name": "American Board of Surgery", "temporal_range": "1935-1937", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 9742911", "notes": "[Phase2 reviewed — citation retained on 20 oderate", "evidence_type": "PMID", "evidence_citation": "PMID: 4559844", "notes": "[Phase2 downgraded from PMID: 2446522 to institutional_archive on 2026-03-17 — no PubMed source found] The ACS was the primary institutional catalyst in founding the ABS, formally transferring fellowship credentialing to an independent specialty board. [Phase2 upgraded institutional_archive -> PMID: 4559844 on 2026-03-18] [Verified 2026-03-18 | J Hist Med Allied Sci 1972 | content_match] Olch PD. 'Evarts A. Graham, the American College of Surgeons, and the American Board of Surgery.' Documents ACS as primary institutional driver of ABS founding. Shared PMID with Graham->ABS edge."}, {"source": 233, "target": 268, "edge_type": "programmatic_accreditation", "start_year": 1937, "module": "12_governance_societies", "source_name": "American Board of Surgery", "target_name": "American Board of Medical Specialties", "temporal_range": "1937-Present", "confidence": "high", "evidence_type": "institutional_archive", "evidence_citation": "ABMS_Archive_MemberBoards", "notes": "The American Board of Surgery (founded 1937 by the ACS and ASA, both already in graph) became a member board of the American Board of Medical Specialties (ABMS, founded 1933). ABMS sets standards for initial certification and continuing certification (Maintenance of Certification) that all member boards must implement. As of 2026, ABMS oversees 24 member boards. The ABS is the certifying authority for general surgery and its subspecialties. This edge connects the graph's primary surgical certification node (ABS, degree 6) to the umbrella governance body, completing the society→board→umbrella chain: ACS/ASA→ABS→ABMS. The start_year of 1937 reflects ABS's founding and immediate membership in ABMS."}, {"source": 29, "target": 356, "edge_type": "governance_leadership", "start_year": 1938, "module": "12_governance_societies", "source_name": "Dallas Phemister", "target_name": "American Surgical Association", "temporal_range": "1938-1939", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 17857466", "notes": "Dallas Burton Phemister (1882-1951) served as president of the American Surgical Association in 1938. Also served as president of the American College of Surgeons. Rush Medical College MD 1904 with postgraduate study in Europe — NOT Halsted-trained. He was the first full-time professor and chairman of surgery at the University of Chicago (1925-1947), where he recruited Charles Huggins (Nobel 1966) and Lester Dragstedt. He also chaired the Codman Registry of Bone Sarcoma (the oldest tumor registry in the US). Died of appendicitis at age 69 at Billings Hospital, Chicago. BRIDGE EDGE: Connects the UChicago 2-node island (Phemister + UChicago Dept) to the main component via ASA. CANDIDATE FOR PMID UPGRADE: search for Phemister ASA presidential address in Ann Surg 1938-1939."}, {"source": 11, "target": 357, "edge_type": "society_founder", "start_year": 1938, "module": "12_governance_societies", "source_name": "Warfield Firor", "target_name": "Society of University Surgeons", "temporal_range": "1938-1941", "confidence": "high", "evidence_type": "institutional_archive", "evidence_citation": "NLM_SUS_Archive", "notes": "The SUS was organized in 1938 in Baltimore by George G. Finney, I. Ridgeway Trimble, and Warfield M. Firor. Incorporated in 1941. The idea originated with Samuel J. Stabins, chief surgical resident at the University of Rochester. The SUS mission was explicitly Halstedian: members must have completed 'a rigorous training program in the tradition of Dr. William Halsted at Johns Hopkins Medical School' and hold a faculty position at a U.S. medical school. Active membership limited to surgeons under 45. Original trustees included Robert Zollinger and Frank Glenn. Now recognized as the world's premier organization for advancement of surgical sciences. Firor is selected as the source node because he was the most senior Hopkins-affiliated co-founder and connects the SUS directly to the Halstedian training lineage."}, {"source": 23, "target": 356, "edge_type": "governance_leadership", "start_year": 1939, "module": "12_governance_societies", "source_name": "Allen O. Whipple", "target_name": "American Surgical Association", "temporal_range": "1939-1940", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 37941365", "notes": "[Verified 2026-03-17 | J Med Biogr 2025 | content_match] Whipple served as ASA president in 1939, connecting the independent Columbia surgical trunk to the oldest American surgical society. He used this platform to advocate for surgical education reform and standardization of operative techniques."}, {"source": 41, "target": 223, "edge_type": "governance_leadership", "start_year": 1940, "module": "12_governance_societies", "source_name": "Evarts A. Graham", "target_name": "American College of Surgeons", "temporal_range": "1940-1941", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 21820677", "notes": "[Verified 2026-03-17 | J Thorac Cardiovasc Surg 2011 | content_match] Graham served as President of the ACS, tightly coupling the pioneering thoracic surgery nodes in St. Louis with the primary national governance trunk."}, {"source": 219, "target": 358, "edge_type": "society_founder", "start_year": 1940, "module": "12_governance_societies", "source_name": "Memorial Hospital for Cancer and Allied Diseases", "target_name": "James Ewing Society", "temporal_range": "1940-1975", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 32193716", "notes": "[Verified 2026-03-17 | Ann Surg Oncol 2020 | content_match] Five Memorial Hospital surgeons led by William MacComb founded the James Ewing Society as the hospital's surgical alumni organization, establishing the institutional root of organized surgical oncology."}, {"source": 145, "target": 268, "edge_type": "programmatic_accreditation", "start_year": 1940, "module": "12_governance_societies", "source_name": "American Board of Neurological Surgery", "target_name": "American Board of Medical Specialties", "temporal_range": "1940-Present", "confidence": "high", "evidence_type": "institutional_archive", "evidence_citation": "ABMS_Archive_MemberBoards", "notes": "The American Board of Neurological Surgery (founded 1940, catalyzed by the Harvey Cushing Society, already in graph) became a member board of ABMS. This edge connects the neurosurgical certification branch to the umbrella governance body, completing the chain: Cushing Society→ABNS→ABMS. Combined with the existing Cushing→SNS→Harvey Cushing Society→ABNS edges, this creates a five-generation governance lineage from Cushing to ABMS spanning 1920-1940."}, {"source": 34, "target": 356, "edge_type": "governance_leadership", "start_year": 1943, "module": "12_governance_societies", "source_name": "Frederick Coller", "target_name": "American Surgical Association", "temporal_range": "1943-1944", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 9742911", "notes": "[Verified 2026-03-17 | Ann Surg 1998 | content_match] Coller served as ASA president in 1943, joining the graph's existing ASA governance network (Whipple 1939, Wangensteen 1968, Sabiston, Bahnson, Najarian, Cameron). He also served as ACS president in 1949 and as the first Chairman of the RRC for Surgery in 1954, establishing the formal accreditation structure for surgical residency programs. Citation upgraded to PMID in V4."}, {"source": 23, "target": 219, "edge_type": "governance_leadership", "start_year": 1946, "module": "12_governance_societies", "source_name": "Allen O. Whipple", "target_name": "Memorial Hospital for Cancer and Allied Diseases", "temporal_range": "1946-1950", "confidence": "high", "evidence_type": "institutional_archive", "evidence_citation": "MSK_Archive_Whipple", "notes": "Whipple was appointed Clinical Director of Memorial Hospital after retiring as Chair of Surgery at Columbia, tasked with making the hospital more academic and recruiting university-trained surgical residents."}, {"source": 37, "target": 223, "edge_type": "governance_leadership", "start_year": 1953, "module": "12_governance_societies", "source_name": "Alton Ochsner", "target_name": "American College of Surgeons", "temporal_range": "1953-1954", "confidence": "high", "evidence_type": "institutional_archive", "evidence_citation": "ACS_Archive_Ochsner", "notes": "Ochsner served as ACS president, reinforcing the New Orleans/Tulane surgical lineage within the primary national governance structure."}, {"source": 222, "target": 223, "edge_type": "governance_leadership", "start_year": 1958, "module": "12_governance_societies", "source_name": "Bernard Fisher", "target_name": "American College of Surgeons", "temporal_range": "1958-2019", "confidence": "moderate", "evidence_type": "institutional_archive", "evidence_citation": "Historical_Archive_Surgeons", "notes": "[Phase2 downgraded from PMID: 24753609 to institutional_archive on 2026-03-17 — no PubMed source found] Fisher was a Fellow of the ACS and recipient of its Jacobson Innovation Award, embedding the NSABP clinical trials framework within the broader surgical governance structure."}, {"source": 48, "target": 223, "edge_type": "governance_leadership", "start_year": 1960, "module": "12_governance_societies", "source_name": "Denton Cooley", "target_name": "American College of Surgeons", "temporal_range": "1960-2016", "confidence": "high", "evidence_type": "institutional_archive", "evidence_citation": "ACS_Archive_Cooley", "notes": "Cooley was a Fellow and major figure in the ACS throughout his career, linking the Blalock/DeBakey/Texas Heart lineage to national surgical governance."}, {"source": 359, "target": 1, "edge_type": "governance_leadership", "start_year": 1964, "module": "12_governance_societies", "source_name": "George Zuidema", "target_name": "Johns Hopkins Hospital Department of Surgery", "temporal_range": "1964-1984", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 28918957", "notes": "[Phase2 replaced PMID: 29189382 -> PMID: 28918957 on 2026-03-17] [Verified 2026-03-17 | J Surg Res 2017 | content_match] George D. Zuidema (1928-2020) received his MD from Johns Hopkins in 1953, trained at Massachusetts General Hospital (chief resident 1959), then joined the University of Michigan faculty. In 1964, at age 36, he was appointed surgeon-in-chief of Johns Hopkins Hospital and professor/director of surgery, succeeding Alfred Blalock. He held the Warfield M. Firor Professorship. His appointment initially caused controversy among Blalock's proteges, but he transformed the department by establishing separate departments for neurosurgery, orthopaedics, otolaryngology, urology, and general surgery with subspecialty divisions. He recruited Donlin Long (neurosurgery), Patrick Walsh (urology), and Bruce Reitz (cardiac surgery). John L. Cameron succeeded him in 1984. Zuidema then returned to the University of Michigan as vice provost for medical affairs (1984-1994). Citation upgraded to PMID in V4."}, {"source": 359, "target": 360, "edge_type": "society_founder", "start_year": 1966, "module": "12_governance_societies", "source_name": "George Zuidema", "target_name": "Association for Academic Surgery", "temporal_range": "1966-1968", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 28918957", "notes": "[Verified 2026-03-17 | J Surg Res 2017 | content_match] The Association for Academic Surgery was founded in 1966 with 33 members. Zuidema was the founding member and first president (1968). The AAS mission was to offer young academic surgeons an inclusive forum for discussion about surgical research and professional growth, with active membership lasting 12 years after first academic appointment. Now over 4,000 members. The AAS represents the second wave of academic pipeline societies: the SUS (1938) required Halstedian-tradition training and faculty appointment for surgeons under 45; the AAS (1966) broadened access further to all young surgical academics. Together they form the academic pipeline: AAS (junior) → SUS (mid-career) → ASA/ACS (senior). Zuidema founded AAS while simultaneously serving as Hopkins surgeon-in-chief, making this society a product of the Hopkins institutional culture."}, {"source": 26, "target": 356, "edge_type": "governance_leadership", "start_year": 1968, "module": "12_governance_societies", "source_name": "Owen Wangensteen", "target_name": "American Surgical Association", "temporal_range": "1968-1969", "confidence": "high", "evidence_type": "DOI", "evidence_citation": "DOI: 10.1097/00000658-196909010-00001", "notes": "[Verified 2026-03-17 | Annals of Surgery 1969 | content_match] Wangensteen served as ASA president, his presidential address 'We Cannot Escape History' directly catalyzed the SOSSUS study of surgical education."}, {"source": 38, "target": 223, "edge_type": "governance_leadership", "start_year": 1969, "module": "12_governance_societies", "source_name": "Michael DeBakey", "target_name": "American College of Surgeons", "temporal_range": "1969-1970", "confidence": "moderate", "evidence_type": "institutional_archive", "evidence_citation": "Baylor_Archive_Surgeons", "notes": "[Phase2 downgraded from PMID: 18693427 to institutional_archive on 2026-03-17 — no PubMed source found] DeBakey served as ACS president, connecting the Tulane/Baylor cardiovascular lineage to the primary national surgical governance body."}, {"source": 358, "target": 220, "edge_type": "institutional_succession", "start_year": 1975, "module": "12_governance_societies", "source_name": "James Ewing Society", "target_name": "Society of Surgical Oncology", "temporal_range": "1975-Present", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 32193716", "notes": "[Verified 2026-03-17 | Ann Surg Oncol 2020 | content_match] The James Ewing Society was renamed and reorganized as the Society of Surgical Oncology in 1975, expanding from a Memorial Hospital alumni group to represent all surgical oncologists nationally."}, {"source": 69, "target": 223, "edge_type": "governance_leadership", "start_year": 1976, "module": "12_governance_societies", "source_name": "Olga Jonasson", "target_name": "American College of Surgeons", "temporal_range": "1976-1993", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 8503766", "notes": "[Phase2 replaced PMID: 34462877 -> PMID: 8503766 on 2026-03-17] [Verified 2026-03-17 | Arch Surg 1993 | content_match] Jonasson was the first woman to serve on the ACS Board of Regents (1976), the first woman chief of surgery at a major hospital (Cook County, 1977), and the first woman to chair an academic surgery department at a coeducational medical school (Ohio State, 1987, as Robert M. Zollinger Professor). She trained under Warren Cole at University of Illinois College of Medicine with a transplantation fellowship under Paul Russell at MGH. She performed the first kidney transplant in Illinois (1969) and later served on the American Board of Surgery and ACGME. Her 1993 ACS lecture 'Recapturing the Joy of Surgery' presciently identified surgeon burnout as an epidemic."}, {"source": 57, "target": 356, "edge_type": "governance_leadership", "start_year": 1977, "module": "12_governance_societies", "source_name": "David Sabiston", "target_name": "American Surgical Association", "temporal_range": "1977-1978", "confidence": "high", "evidence_type": "DOI", "evidence_citation": "DOI: 10.1097/00000658-197809000-00001", "notes": "[Verified 2026-03-17 | Annals of Surgery 1978 | content_match] Sabiston served as ASA president; his presidential address honored Alfred Blalock, directly linking the Halsted-Blalock lineage to the oldest surgical society in the US."}, {"source": 69, "target": 233, "edge_type": "governance_leadership", "start_year": 1980, "module": "12_governance_societies", "source_name": "Olga Jonasson", "target_name": "American Board of Surgery", "temporal_range": "1980-1990", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 8503766", "notes": "[Phase2 replaced PMID: 17416546 -> PMID: 8503766 on 2026-03-17] [Verified 2026-03-17 | Arch Surg 1993 | content_match] Jonasson served as a director on the American Board of Surgery and as a representative to the American Board of Medical Specialties, among the first women to hold these positions. She also served on the ACGME and the Residency Review Committee for Surgery. She was the 37th woman certified by the ABS (1965)."}, {"source": 361, "target": 362, "edge_type": "institutional_succession", "start_year": 1981, "module": "12_governance_societies", "source_name": "Liaison Committee on Graduate Medical Education", "target_name": "Accreditation Council for Graduate Medical Education", "temporal_range": "1981-Present", "confidence": "high", "evidence_type": "institutional_archive", "evidence_citation": "ACGME_Archive_History", "notes": "The ACGME was established as the independent successor to the LCGME, permanently centralizing and standardizing residency program accreditation."}, {"source": 268, "target": 362, "edge_type": "programmatic_accreditation", "start_year": 1981, "module": "12_governance_societies", "source_name": "American Board of Medical Specialties", "target_name": "Accreditation Council for Graduate Medical Education", "temporal_range": "1981-Present", "confidence": "high", "evidence_type": "institutional_archive", "evidence_citation": "ACGME_Archive_ABMS", "notes": "The ABMS and ACGME operate as structurally coupled governance nodes, separating board certification from residency programmatic accreditation."}, {"source": 363, "target": 364, "edge_type": "society_founder", "start_year": 1981, "module": "12_governance_societies", "source_name": "Patricia Numann", "target_name": "Association of Women Surgeons", "temporal_range": "1981-Present", "confidence": "high", "evidence_type": "institutional_archive", "evidence_citation": "AWS_Archive_History", "notes": "Patricia Joy Numann (b. 1941), endocrine surgeon at SUNY Upstate Medical University, founded the Association of Women Surgeons (AWS) in 1981 by inviting as many female surgeons as she could identify to a breakfast at the October ACS Clinical Congress in San Francisco. At that time, there was no formal organization serving the needs of women surgeons. Numann served as AWS president (1986-1987) and the organization has since grown into a national society supporting women medical students, residents, and surgeons. Numann was also the first woman to chair the American Board of Surgery (1994-2002), the first woman second vice-president of the ACS (1999-2000), and the second woman president of the ACS (2011, 92nd president, after Kathryn Anderson). She received the ACS Lifetime Achievement Award in 2019, only the fourth surgeon so honored. The founding of AWS parallels the generational society pattern in the graph — a new organization emerging because the existing structures (ACS, ASA, SUS) did not adequately serve a constituency — in this case, women surgeons. The Nina Starr Braunwald Award of the AWS (which Numann received in 1998) is named after Nina Starr Braunwald, who is already a node in the graph, creating a cultural connection between these two women in surgery edges."}, {"source": 71, "target": 1, "edge_type": "governance_leadership", "start_year": 1984, "module": "12_governance_societies", "source_name": "John L. Cameron", "target_name": "Johns Hopkins Hospital Department of Surgery", "temporal_range": "1984-2003", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 29189382", "notes": "[Verified 2026-03-17 | Ann Surg 2018 | content_match] Cameron served as Chairman of Surgery at Hopkins for 19 years, performing more Whipple resections than any surgeon in history and serving as president of 14 surgical societies including the ACS."}, {"source": 57, "target": 223, "edge_type": "governance_leadership", "start_year": 1985, "module": "12_governance_societies", "source_name": "David Sabiston", "target_name": "American College of Surgeons", "temporal_range": "1985-1986", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 356789", "notes": "[Phase2 reviewed — citation retained on 2026-03-17] Sabiston served as president of the ACS, reinforcing the governance connection between the Blalock/Hopkins surgical lineage and the primary national credentialing body. Citation upgraded to PMID in V4."}, {"source": 53, "target": 356, "edge_type": "governance_leadership", "start_year": 1987, "module": "12_governance_societies", "source_name": "Henry Bahnson", "target_name": "American Surgical Association", "temporal_range": "1987-1988", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 3421751", "notes": "[Phase2 reviewed — citation retained on 2026-03-17] Bahnson served as ASA president, extending the Blalock/Hopkins/Pittsburgh lineage into ASA governance."}, {"source": 66, "target": 223, "edge_type": "governance_leadership", "start_year": 1990, "module": "12_governance_societies", "source_name": "Joseph E. Murray", "target_name": "American College of Surgeons", "temporal_range": "1990-2012", "confidence": "high", "evidence_type": "institutional_archive", "evidence_citation": "ACS_Bulletin_Starzl_Murray_Tribute", "notes": "Starzl TE. 'Joseph E. Murray, MD, FACS, opened doors for transplant surgeons.' Bull Am Coll Surg. 2013 Feb. Starzl's own tribute explicitly states: 'Dr. Murray, a former Regent and First Vice-President of the American College of Surgeons.' Murray was also awarded the Nobel Prize at the 1990 ACS Clinical Congress, where a press conference was held. This edge connects Murray to the graph's highest-degree node (ACS, degree 25), bridging the kidney transplant lineage into the central governance structure. Murray's ACS Regency parallels the governance edges of other surgical leaders in the graph (Longmire, Cooley, Leffall, Cameron, Sabiston, Ochsner, Fisher — all ACS governance). The Starzl-authored tribute is the most authoritative source for Murray's ACS governance roles."}, {"source": 78, "target": 223, "edge_type": "governance_leadership", "start_year": 1992, "module": "12_governance_societies", "source_name": "W. Gerald Austen", "target_name": "American College of Surgeons", "temporal_range": "1992-1993", "confidence": "high", "evidence_type": "institutional_archive", "evidence_citation": "ACS_Archive_Austen", "notes": "Austen served as President of the American College of Surgeons (1992-1993), three years before Leffall's historic presidency (1995-1996). He also served on the ACS Board of Regents (1982-1991) including as Board Chair (1989-1991). This edge fills the 1990s temporal gap (only 6 edges in that decade currently) and strengthens the governance pipeline from MGH to ACS. Austen's ACS presidency creates a parallel MGH→ACS pathway alongside the existing Franklin H. Martin→ACS founder edge, and the Leffall→ACS edge from Priority 1. Austen was also president of the American Surgical Association (1985), the American Heart Association, and the AATS — but those edges are not included here to maintain the governance standing threshold (one society-wide presidency edge per figure is sufficient to establish the governance connection)."}, {"source": 363, "target": 233, "edge_type": "governance_leadership", "start_year": 1994, "module": "12_governance_societies", "source_name": "Patricia Numann", "target_name": "American Board of Surgery", "temporal_range": "1994-2002", "confidence": "high", "evidence_type": "institutional_archive", "evidence_citation": "ACS_Archive_Numann", "notes": "Numann served as the first woman Chair of the American Board of Surgery from 1994 to 2002. The ABS is the central certification authority for general surgery in the United States and an existing high-degree node in the graph (degree 6, connected to ACS, ASA, ABMS, Whipple, SAGES/FLS). Numann's chairmanship bridges the women-in-surgery cluster to the graph's core governance infrastructure. Her ABS chairmanship (1994-2002) also fills the 1990s temporal gap — only 6 edges currently exist in that decade. Numann's ACS presidency (2011, second woman after Kathryn Anderson) is not included as a separate edge to avoid inflating her node degree beyond what the governance standing threshold warrants — one society-wide leadership edge per major organization is sufficient. The ABS chair edge is chosen over the ACS presidency because it represents the more historically distinctive achievement (first woman, versus second woman at ACS)."}, {"source": 51, "target": 223, "edge_type": "governance_leadership", "start_year": 1995, "module": "12_governance_societies", "source_name": "LaSalle D. Leffall Jr.", "target_name": "American College of Surgeons", "temporal_range": "1995-1996", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 10154053", "notes": "Leffall served as President of the American College of Surgeons (1995-1996), the first African American to hold the position. He had previously served as ACS Secretary (1983-1992) and on multiple ACS committees. Leffall was also the first African American president of the American Cancer Society (1978), the Society of Surgical Oncology, and the Society of Surgical Chairmen. His ACS presidency connects the independent Howard/Drew lineage to the highest-degree governance node in the entire graph (ACS, degree 23). Leffall was one of only five surgeons in history to serve as president of both the ACS and the American Cancer Society. This edge represents the culmination of a chain spanning five nodes: Whipple (Columbia) → Drew (Howard) → Leffall (Howard/MSK) → ACS — linking an independent Black surgical training lineage to the central governance hub of American surgery."}, {"source": 71, "target": 356, "edge_type": "governance_leadership", "start_year": 2000, "module": "12_governance_societies", "source_name": "John L. Cameron", "target_name": "American Surgical Association", "temporal_range": "2000-2001", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 29189382", "notes": "[Verified 2026-03-17 | Ann Surg 2018 | content_match] Cameron served as ASA president, directly extending the Halsted-Blalock-Hopkins lineage into 21st-century ASA governance. Citation upgraded to PMID in V4."}, {"source": 83, "target": 356, "edge_type": "governance_leadership", "start_year": 2001, "module": "12_governance_societies", "source_name": "Haile T. Debas", "target_name": "American Surgical Association", "temporal_range": "2001-2002", "confidence": "moderate", "evidence_type": "PMID", "evidence_citation": "PMID: 12192312", "notes": "[Phase2 downgraded from PMID: 12192325 to institutional_archive on 2026-03-17 — no PubMed source found] Debas HT. 'Surgery: A Noble Profession in a Changing World.' Ann Surg. 2002 Sep;236(3):263-269. PMC1422579. Published ASA presidential address for the 2001-2002 term. Debas discusses surgery as a profession, declining interest among medical students, and the growing importance of global health. This edge connects Debas to the ASA governance hub — the same high-degree node where Wangensteen, Sabiston, Bahnson, Najarian, and Cameron already have governance edges. Debas was also ACS president (Northern California chapter) and ASA president, creating a West Coast→ASA governance bridge paralleling the existing East Coast dominance. [Citation upgraded from institutional_archive to PMID: 12192312 on 2026-03-18 — Debas, Ann Surg 2002;236:263-269. Content-match confirmed: ASA presidential address, first minority president.]"}, {"source": 85, "target": 356, "edge_type": "governance_leadership", "start_year": 2005, "module": "12_governance_societies", "source_name": "Carlos A. Pellegrini", "target_name": "American Surgical Association", "temporal_range": "2005-2006", "confidence": "high", "evidence_type": "institutional_archive", "evidence_citation": "ASA_Past_Presidents_Registry", "notes": "Pellegrini served as president of the American Surgical Association in 2005. Confirmed by the ASA Past Presidents registry (americansurgical.org). He was also the 94th president of the American College of Surgeons (installed October 2013). Additionally served as president of the Society of Surgical Chairs and was a director of the American Board of Surgery. Awarded the French Legion of Honor. CANDIDATE FOR PMID UPGRADE: search for Pellegrini ASA presidential address in Ann Surg 2005 or 2006."}, {"source": 71, "target": 223, "edge_type": "governance_leadership", "start_year": 2005, "module": "12_governance_societies", "source_name": "John L. Cameron", "target_name": "American College of Surgeons", "temporal_range": "2005-2006", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 29189382", "notes": "[Verified 2026-03-17 | Ann Surg 2018 | content_match] Cameron served as ACS president, directly extending the Halsted → Blalock → Hopkins surgical lineage into 21st-century governance. Citation upgraded to PMID in V4."}, {"source": 365, "target": 233, "edge_type": "governance_leadership", "start_year": 2005, "module": "12_governance_societies", "source_name": "Jeffrey Ponsky", "target_name": "American Board of Surgery", "temporal_range": "2005-2010", "confidence": "moderate", "evidence_type": "PMID", "evidence_citation": "PMID: 31061933", "notes": "[Phase2 downgraded from PMID: 31003229 to institutional_archive on 2026-03-17 — no PubMed source found] Ponsky JL. 'Jeffrey L. Ponsky, MD, FACS.' VideoGIE. 2019 May;4(5):189-191. PMC6494182. Documents Ponsky as 'Director and Chairman of the American Board of Surgery.' He also served as SAGES president (already in graph as society_founder) and Vice President of the American Surgical Association. Ponsky trained at Case Western Reserve (medical school 1971, residency at University Hospitals Cleveland 1971-1976) and invented PEG (percutaneous endoscopic gastrostomy) in 1979 with Michael Gauderer. This edge is the single most important structural bridge between the MIS module and the graph backbone. ABS connects to ABMS (programmatic_accreditation, already in graph) and through it to the entire accreditation apparatus. Ponsky's ABS chairmanship means the co-inventor of PEG and co-founder of SAGES reached the top of the certification hierarchy for all general surgery. Ponsky goes from degree 1 to degree 2. [Citation upgraded from institutional_archive to PMID: 31061933 on 2026-03-18 — VideoGIE 2019;4:187-189. Content-match confirmed: Ponsky served as Director and Chairman of the American Board of Surgery.]"}, {"source": 365, "target": 330, "edge_type": "governance_leadership", "start_year": 1990, "module": "12_governance_societies", "source_name": "Jeffrey Ponsky", "target_name": "Society of American Gastrointestinal and Endoscopic Surgeons", "temporal_range": "1990-1991", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID 29362909", "notes": "Ponsky served as SAGES president 1990-91. Reclassified from society_founder to governance_leadership per PMID 29362909, which identifies Gerald Marks as SAGES founder. Corrected 2026-03-18."}, {"source": 86, "target": 223, "edge_type": "governance_leadership", "start_year": 2018, "module": "12_governance_societies", "source_name": "Julie Ann Freischlag", "target_name": "American College of Surgeons", "temporal_range": "2018-2019", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 25842604", "notes": "Freischlag served as President of the American College of Surgeons 2018-2019. She had previously served as Governor (2000-2006), Regent (2006-2012), and first woman Chair of the Board of Regents (2012-2013). Her ACS presidency connects the women-in-surgery cluster to the governance backbone through a second presidential pathway alongside Leffall (1995-1996) and Numann (ABS chair). Also served as president of the Society for 4 current ABMS member boards on the ABMS website. This edge follows the identical pattern of existing board-ABMS edges (ABS, ABOS, ABNS, ABCRS, ABPS). BRIDGE EDGE: Merges the ABO-HNS/Triological island (Component 7, 2 nodes) into the main component via the ABMS governance backbone."}, {"source": 98, "target": 356, "edge_type": "governance_leadership", "start_year": 1972, "module": "12_governance_societies", "source_name": "Jonathan E. Rhoads", "target_name": "American Surgical Association", "temporal_range": "1972-1973", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 4729748", "notes": "Rhoads served as president of the American Surgical Association (1972-1973), in addition to the American College of Surgeons (1971-1972), and the American Cancer Society. Barker (Ann Surg 2002) and the UPenn Archives biography confirm simultaneous presidencies of ACS and ASA. This edge connects the Rhoads node to the ASA governance hub already well-established in module 12 (founded by Gross in 1880). The Ravdin-Rhoads-ASA pathway is a second Philadelphia route to the ASA, independent of the Gross-ASA founding edge in 13_pre_halsted."}, {"source": 100, "target": 356, "edge_type": "governance_leadership", "start_year": 1965, "module": "12_governance_societies", "source_name": "Robert M. Zollinger", "target_name": "American Surgical Association", "temporal_range": "1965-1966", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 12946817", "notes": "[Verified 2026-03-17 | Am J Surg 2003 | content_match] Zollinger was president of the American Surgical Association in 1965, one of three major surgical governance roles he held (also ACS president 1961-62 and ABS chairman 1963). He is one of the rare triple-crown holders in American surgery. ACS presidency edge is a candidate for future addition. Citation is Lewis L, Van Brimmer B, 'A biography of Robert Milton Zollinger, M.D.,' Am J Surg 2003;186(3):205-7."}, {"source": 101, "target": 356, "edge_type": "governance_leadership", "start_year": 2000, "module": "12_governance_societies", "source_name": "Murray F. Brennan", "target_name": "American Surgical Association", "temporal_range": "c.2000-c.2001", "confidence": "moderate", "evidence_type": "institutional_archive", "evidence_citation": "MSK_Archive_Brennan", "notes": "Brennan served as president of the American Surgical Association. The ACS profile and MSK India page list ASA presidency among his leadership positions. Exact years approximated. The ASA presidency connects Brennan to the ASA governance hub alongside Gross (founder), Sabiston, Rhoads, and other major figures. Brennan's ASA presidency makes him the highest-profile surgical oncologist to lead the ASA, reinforcing the growing integration of oncologic surgery into mainstream academic surgery governance by the turn of the millennium."}, {"source": 102, "target": 356, "edge_type": "governance_leadership", "start_year": 1983, "module": "12_governance_societies", "source_name": "Mark M. Ravitch", "target_name": "American Surgical Association", "temporal_range": "1983-1984", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 32106907", "notes": "[Verified 2026-03-17 | Am Surg 2020 | content_match] Ravitch served as president of the American Surgical Association in 1983-1984. He was also the official historian of the ASA and authored its definitive two-volume history, 'A Century of Surgery 1880-1980' (Lippincott, 1981). This makes him both a governance leader and the scholarly chronicler of the organization. Citation same as training edge."}, {"source": 110, "target": 223, "edge_type": "governance_leadership", "start_year": 2003, "module": "12_governance_societies", "source_name": "Claude H. Organ Jr.", "target_name": "American College of Surgeons", "temporal_range": "2003-2004", "confidence": "high", "evidence_type": "institutional_archive", "evidence_citation": "ACS_Archive_Organ_Presidency", "notes": "Claude H. Organ Jr. (1926-2005) served as the 84th president of the American College of Surgeons (2003-2004), the second African American to hold this position after LaSalle D. Leffall Jr. (1995, already in graph). Organ earned his MD from Creighton University (1952), completed residency at Creighton, and became the first African American to chair a surgery department at a predominantly white medical school (Creighton, 1971-1982). He later established the UCSF East Bay Surgery Residency Program (1989-2003) and served as editor-in-chief of Archives of Surgery (1989-2004). He co-founded the Society of Black Academic Surgeons (1989) and authored 'A Century of Black Surgeons: The U.S.A. Experience.' He also served as chairman of the American Board of Surgery. This edge extends the URM governance chain: Leffall→ACS (1995) is already in the graph; Organ→ACS (2003) adds the second data point. Organ is a new node connecting to the ACS governance hub. PMID upgrade candidate: search for PMID of JAMA Surgery Nov 2005 tribute articles."}, {"source": 56, "target": 165, "edge_type": "governance_leadership", "start_year": 1978, "module": "12_governance_societies", "source_name": "John Kirklin", "target_name": "American Association for Thoracic Surgery", "temporal_range": "1978-1979", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 16405204", "notes": "Kirklin served as 59th president of the AATS. Weisse (Clin Cardiol 2005) documents this. He also edited JTCVS from 1987-1994."}, {"source": 76, "target": 79, "edge_type": "governance_leadership", "start_year": 1977, "module": "12_governance_societies", "source_name": "John Najarian", "target_name": "American Society of Transplant Surgeons", "temporal_range": "1977-1978", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 36528870", "notes": "Najarian was a founding member and 4th president of ASTS. He also chaired the ASTS education committee (1979-1988), establishing requirements for transplant fellowship training. Knatterud et al. (Clin Transplant 2023) documents this."}, {"source": 114, "target": 356, "edge_type": "governance_leadership", "start_year": 1989, "module": "12_governance_societies", "source_name": "John Mannick", "target_name": "American Surgical Association", "temporal_range": "1989-1990", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 2396879", "notes": "Mannick delivered the ASA presidential address 'Who killed general surgery?' (Ann Surg 1990;212(3):235-241). This address became one of the most cited commentaries on surgical subspecialization. [V6 verification: original PMID 2396583 was incorrect (Japanese ophthalmology) — replaced with correct PMID 2396879]"}, {"source": 190, "target": 165, "edge_type": "governance_leadership", "start_year": 2016, "module": "12_governance_societies", "source_name": "Joseph S. Coselli", "target_name": "American Association for Thoracic Surgery", "temporal_range": "2016-2017", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 27751576", "notes": "TARGET MODULE: 12_governance_societies. Coselli was the 96th president of the AATS. His presidential address ('Competition: Perspiration to Inspiration') discussed DeBakey, Cooley, and Crawford. Also served as president of Texas Surgical Society (2008), DeBakey International Surgical Society (2010), and Southern Thoracic Surgical Association (2011). This connects the Crawford aortic surgery lineage to the AATS governance node, paralleling the existing Kirklin→AATS and Sabiston→AATS edges."}, {"source": 107, "target": 356, "edge_type": "governance_leadership", "start_year": 2019, "module": "12_governance_societies", "source_name": "Keith D. Lillemoe", "target_name": "American Surgical Association", "temporal_range": "2019-2020", "confidence": "high", "evidence_type": "institutional_archive", "evidence_citation": "ASA_Archive_Lillemoe", "notes": "TARGET MODULE: 12_governance_societies. CANDIDATE FOR PMID UPGRADE: search for Lillemoe ASA presidential address in Ann Surg 2019-2020. Lillemoe served as recorder and then president of the ASA. Multiple biographical sources confirm: ACS Academy profile, AHPBA bio, SUS Lifetime Achievement profile all list ASA presidency. He also served as president of the Society of University Surgeons, Halsted Society, Society of Clinical Surgery, and SSAT. This connects the Cameron→Lillemoe training lineage to the ASA governance node, paralleling the existing Cameron→ASA edge and creating a master-apprentice governance succession."}, {"source": 295, "target": 223, "edge_type": "governance_leadership", "start_year": 2006, "module": "12_governance_societies", "source_name": "Kathryn D. Anderson", "target_name": "American College of Surgeons", "temporal_range": "2006-2007", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 30236607", "notes": "TARGET MODULE: 12_governance_societies. Anderson was the first woman president of the ACS and the first woman president of the American Pediatric Surgical Association (1999-2000). She was also the first woman officer of ACS (secretary, 1992). PMID 30236607 states: 'Anderson became Surgeon-in-Chief in Los Angeles, and later the first woman leader of both professional societies in pediatric surgery as well as first woman President of the American College of Surgeons.' The ACS is the graph's highest-degree society node. This creates the chain Gross→Hendren→Anderson→ACS, extending the pediatric surgery lineage into the governance layer and adding the 6th woman person node to the graph."}, {"source": 191, "target": 223, "edge_type": "society_founder", "start_year": 1913, "module": "12_governance_societies", "source_name": "Rudolph Matas", "target_name": "American College of Surgeons", "temporal_range": "1913", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 35412399", "notes": "TARGET MODULE: 12_governance_societies. Matas was among the 12 founders who met in May 1913 e University of Minnesota, and there he excelled until his retirement from surgical practice in 1967.' Department established 1906. CREATES NODE: University of Minnesota Department of Surgery (institution)."}, {"source": 76, "target": 366, "edge_type": "governance_leadership", "start_year": 1967, "module": "12_governance_societies", "source_name": "John Najarian", "target_name": "University of Minnesota Department of Surgery", "temporal_range": "1967-1993", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 36528870", "notes": "[V10 Minnesota | route: 12_governance_societies] John S. Najarian chaired the University of Minnesota Department of Surgery July 1967-February 1993, succeeding Wangensteen. Knatterud et al., Clin Transplant 2022;37(3):e14877 (PMID 36528870; DOI 10.1111/ctr.14877; content-match verified): 'Dr John S Najarian (1927-2020), chairman of the Department of Surgery at the University of Minnesota from 1967 to 1993.' Same source as existing Najarian->Sutherland/Callender edges; canonical year confirmed 2022 (citation-mcp)."}, {"source": 38, "target": 367, "edge_type": "governance_leadership", "start_year": 1948, "module": "12_governance_societies", "source_name": "Michael DeBakey", "target_name": "Baylor College of Medicine Department of Surgery", "temporal_range": "1948-1993", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 28285665", "notes": "[V10 Baylor | route: 12_governance_societies] Michael E. DeBakey was recruited as chair of the Baylor College of Medicine Department of Surgery in 1948 and led it until 1993. Coselli JS, Semin Thorac Cardiovasc Surg 2016;28(3):611-620 (PMID 28285665, content-match verified): 'The history of cardiothoracic surgery at Baylor College of Medicine begins in 1948, when Michael E. DeBakey was recruited as chair of the Department of Surgery.' Later eponymously renamed the Michael E. DeBakey Department of Surgery (name evolution noted, not in node ID). CREATES NODE: Baylor College of Medicine Department of Surgery (institution)."}, {"source": 193, "target": 368, "edge_type": "governance_leadership", "start_year": 1978, "module": "12_governance_societies", "source_name": "F. William Blaisdell", "target_name": "UC Davis Department of Surgery", "temporal_range": "1978-1995", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 32649610", "notes": "[V10 UC Davis | route: 12_governance_societies] F. William Blaisdell (1927-2020), father of modern trauma care, was professor and chair of the UC Davis Department of Surgery 1978-1995. Knudson et al., J Trauma Acute Care Surg 2020;89(4):603-606 (PMID 32649610, full-text content-match verified): 'In 1978, Dr. Blaisdell took the position of professor and chair of the Department of Surgery at the University of California, Davis (Sacramento), where he served for 17 years.' CREATES NODES: F. William Blaisdell (person); UC Davis Department of Surgery (institution)."}, {"source": 68, "target": 109, "edge_type": "governance_leadership", "start_year": 1936, "module": "12_governance_societies", "source_name": "Warren Cole", "target_name": "University of Illinois College of Medicine Department of Surgery", "temporal_range": "1936-1966", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 11685200", "notes": "[V10 Illinois | route: 12_governance_societies] Warren H. Cole was recruited in 1936 as the University of Illinois's first full-time professor of surgery and headed the Department of Surgery for 30 years (to 1966). Cance WG, 'Warren H. Cole, MD: Visionary surgeon-scientist and mentor,' Surgery 2001;130(5):891-892 (PMID 11685200, content-match verified): held the chair of surgery at the University of Illinois for 30 years. FIXES the previously bare department node and raises the existing Warren Cole node from degree 1 to degree 2. Optional Evarts Graham->Cole training edge DEFERRED (sources document cholecystography collaboration, not a content-matched training relationship)."}, {"source": 121, "target": 79, "edge_type": "governance_leadership", "start_year": 2005, "module": "12_governance_societies", "source_name": "Goran Klintmalm", "target_name": "American Society of Transplant Surgeons", "temporal_range": "2005", "confidence": "moderate", "evidence_type": "institutional_archive", "evidence_citation": "ASTS_Archive_Klintmalm_President", "notes": "[V11 Pittsburgh | route: 12_governance_societies] Klintmalm served as President of the American Society of Transplant Surgeons (established the Business Practice Committee, expanded the Board from six to eight councilors). ASTS node already exists (Starzl founded it in 1974). EXACT TERM YEAR APPROXIMATE (~2005, from '20th Baylor reunion' anchor) — FLAG for exact-year confirmation."}, {"source": 346, "target": 369, "edge_type": "governance_leadership", "start_year": 2007, "module": "12_governance_societies", "source_name": "Nathaniel J. Soper", "target_name": "Northwestern University Department of Surgery", "temporal_range": "2007-2019", "confidence": "high", "evidence_type": "institutional_archive", "evidence_citation": "Northwestern Feinberg News: Soper named chair of surgery 2007; stepped down 2019 (Loyal & Edith Davis Professor of Surgery)", "notes": "route: 12_governance_societies.json | Anchors floater Soper. MIS-GI founding-generation figure (SAGES president 2000); joined Feinberg 2003 as director of MIS, James R. Hines Professor 2004, chief GI/endocrine 2005, chair 2007-2019."}, {"source": 370, "target": 369, "edge_type": "governance_leadership", "start_year": 2020, "module": "12_governance_societies", "source_name": "Hasan B. Alam", "target_name": "Northwestern University Department of Surgery", "temporal_range": "2020-ongoing", "confidence": "high", "evidence_type": "institutional_archive", "evidence_citation": "Northwestern Feinberg News: Alam named Loyal & Edith Davis Professor and chair of surgery, effective Sept 1 2020 (Soper's successor)", "notes": "route: er). Lillehei already in graph (Wangensteen->Lillehei). End year ~1974 when Lillehei left Cornell (verify exact)."}, {"source": 349, "target": 372, "edge_type": "governance_leadership", "start_year": 1999, "module": "12_governance_societies", "source_name": "Philip R. Schauer", "target_name": "University of Pittsburgh Mark Ravitch/Leon Hirsch Center for Minimally Invasive Surgery", "temporal_range": "1999-2004", "confidence": "moderate", "evidence_type": "institutional_archive", "evidence_citation": "Cleveland Clinic / UPMC bios: prior to 2004 Schauer was director of the Mark Ravitch/Leon Hirsch Center for Minimally Invasive Surgery at UPMC (also director of endoscopic and bariatric surgery)", "notes": "route: 12_governance_societies.json | Second anchor (career bridge to existing Pittsburgh cluster, per request). Directorship start year ~1999 approximate -- VERIFY. Canonical node ID uses root prefix; real-world name 'Mark Ravitch/Leon Hirsch Center for Minimally Invasive Surgery'."}, {"source": 373, "target": 50, "edge_type": "institutional_founder", "start_year": 1805, "module": "13_pre_halsted", "source_name": "Philip Syng Physick", "target_name": "University of Pennsylvania Department of Surgery", "temporal_range": "1805-1831", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 22770963", "notes": "[Verified 2026-03-17 | J Am Coll Surg 2012 | content_match] Philip Syng Physick (1768-1837), called the 'Father of American Surgery,' was elected the first professor of surgery at the University of Pennsylvania in 1805 — the first such chair in the United States. He held it until 1819 when he transferred to the anatomy chair (retiring 1831). Trained in London under John Hunter at St. George's Hospital (1788-1790), he was Hunter's first American house surgeon. He pioneered catgut sutures, the stomach pump, and tonsillectomy instruments. He was surgeon to Pennsylvania Hospital from 1794 to 1816 and treated Chief Justice John Marshall and First Lady Dolley Madison. His lectures prepared an entire generation of American surgeons. This edge extends the UPenn surgery lineage 140 years before Ravdin (1945), establishing an independent pre-Halsted Philadelphia surgical trunk. Physick and Halsted represent two distinct origin points for American academic surgery: Philadelphia (1805) and Baltimore (1889)."}, {"source": 288, "target": 374, "edge_type": "direct_training", "start_year": 1826, "module": "13_pre_halsted", "source_name": "Jefferson Medical College Department of Surgery", "target_name": "Samuel D. Gross", "temporal_range": "1826-1828", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 16809223", "notes": "[Verified 2026-03-17 | J Invest Surg 2006 | content_match] Samuel D. Gross (1805-1884) entered Jefferson Medical College in 1826 and graduated in 1828 in a class of 27 students. Jefferson was founded in 1824 by George McClellan, whom Gross greatly admired. Gross was the first alumnus to be appointed to a professorship there. After stints in Easton, Cincinnati (Medical College of Ohio, 1833-1840), and Louisville (1840-1856), he returned to Jefferson as professor of surgery in 1856 — completing a 30-year circuit. Thomas Eakins immortalized him in 'The Gross Clinic' (1875), one of the greatest American paintings. Jefferson Medical College is among the oldest medical schools in the United States and an independent institutional trunk parallel to the UPenn/Hopkins lineages."}, {"source": 374, "target": 288, "edge_type": "governance_leadership", "start_year": 1856, "module": "13_pre_halsted", "source_name": "Samuel D. Gross", "target_name": "Jefferson Medical College Department of Surgery", "temporal_range": "1856-1882", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 6996621", "notes": "[Verified 2026-03-17 | Ann Surg 1980 | content_match] Gross served as professor of surgery at Jefferson from 1856 to 1882, succeeding Thomas Dent Mutter. He was called the 'Emperor of American Surgery' and published 14 books and over 1,200 articles. During this tenure he founded the Philadelphia Academy of Surgery (1879, the oldest continuously meeting surgical society in the US) and the American Surgical Association (1880, already in graph via graph_update_draft.json). He also served as AMA president (1868). His successor was William W. Keen, who became one of the first surgeons to operate on the brain (1889). The dual edges (Jefferson trained Gross; Gross led Jefferson) create a bidirectional circuit rare in the graph and mirror the pattern seen in Cincinnati (where Altemeier returned to lead the department that trained him)."}, {"source": 374, "target": 356, "edge_type": "society_founder", "start_year": 1880, "module": "13_pre_halsted", "source_name": "Samuel D. Gross", "target_name": "American Surgical Association", "temporal_range": "1880-1884", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 28471761", "notes": "[Verified 2026-03-17 | Ann Surg 2018 | content_match] Gross founded the ASA in 1880 as the first national surgical society in the United States, serving as its first president. Chair of Surgery at Jefferson Medical College, he was the dominant pre-Halstedian figure in American surgery. The ASA subsequently catalyzed the founding of both the ACS (1913) and the ABS (1937)."}, {"source": 375, "target": 373, "edge_type": "direct_training", "start_year": 1788, "module": "13_pre_halsted", "source_name": "John Hunter", "target_name": "Philip Syng Physick", "temporal_range": "1788-1791", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 22770963", "notes": "[Verified 2026-03-17 | J Am Coll Surg 2012 | content_match] Philip Syng Physick (1768-1837) traveled to London in 1788 to study under John Hunter at St. George's Hospital, where he learned anatomy from cadaver dissection. On January 1, 1790, Hunter appointed Physick house surgeon — the first American to hold that position at S bal_military", "source_name": "Edward Churchill", "target_name": "Mediterranean Theater Surgical Service", "temporal_range": "1943-1945", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 20134311", "notes": "Churchill served as Surgical Consultant for the Mediterranean Theater, standardizing whole blood transfusions and delayed primary closure of war wounds, concepts that fundamentally altered civilian trauma care. [Phase2 upgraded institutional_archive -> PMID: 20134311 on 2026-03-18] [Verified 2026-03-18 | Ann Surg 2010 | content_match] Cannon JW, Fischer JE. 'Edward D. Churchill as a combat consultant: lessons for the senior visiting surgeons and today's military medical corps.' Ann Surg. 2010 Mar;251(3):566-72. Documents Churchill's role as Surgical Consultant for the Mediterranean Theater, standardizing whole blood transfusions and delayed primary closure."}, {"source": 38, "target": 382, "edge_type": "institutional_founder", "start_year": 1943, "module": "14_global_military", "source_name": "Michael DeBakey", "target_name": "Mobile Army Surgical Hospital (MASH) System", "temporal_range": "1943-1945", "confidence": "high", "evidence_type": "DOI", "evidence_citation": "DOI: 10.2106/00004623-195941020-00027", "notes": "[Phase2 replaced PMID: 18693427 -> DOI: 10.2106/00004623-195941020-00027 on 2026-03-17] [Verified 2026-03-17 | The Journal of Bone &amp; Joint Surgery 1959 | content_match] Working in the Surgeon General's Office during WWII, DeBakey helped conceptualize the MASH units and the VA medical center system to manage the flow of combat casualties."}, {"source": 264, "target": 383, "edge_type": "institutional_founder", "start_year": 1944, "module": "14_global_military", "source_name": "Sterling Bunnell", "target_name": "United States Army Hand Surgery Centers", "temporal_range": "1944-1947", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 12563656", "notes": "[Verified 2026-03-17 | J Hand Surg Am 2003 | content_match] Sterling Bunnell (1882-1957), a San Francisco general surgeon, was designated a special civilian consultant to the US Secretary of War at the request of Surgeon General Norman T. Kirk, an orthopedic surgeon. Between November 1944 and February 1947, Bunnell established and visited nine regional hand surgery centers at US Army general hospitals across the United States, organizing surgical treatment protocols and teaching standardized hand injury care. He shut down his private practice for two years to accomplish this. Simultaneously, he completed his seminal textbook 'Surgery of the Hand' (JB Lippincott, 1944), which became the authoritative reference for nearly 30 years. Bunnell's key insight was that hand surgery required a multidisciplinary approach — correlating orthopedics, plastic surgery, and neurosurgery — rather than fragmented care by separate specialists. The army hand centers institutionalized this principle. This military-to-civilian specialty creation pattern parallels the trauma lineage (Scudder→ACS COT, already in graph) and the MASH system (already in graph). The surgeons who directed these centers became the founding nucleus of the ASSH."}, {"source": 384, "target": 385, "edge_type": "institutional_founder", "start_year": 1966, "module": "14_global_military", "source_name": "Norman Rich", "target_name": "Vietnam Vascular Registry", "temporal_range": "1966-Present", "confidence": "high", "evidence_type": "PMID", "evidence_citation": "PMID: 5762414", "notes": "Rich established the registry to meticulously track combat vascular injuries, driving the definitive transition from arterial ligation to immediate primary repair in modern vascular trauma. [Phase2 upgraded institutional_archive -> PMID: 5762414 on 2026-03-18] [Verified 2026-03-18 | Surgery 1969 | content_match] Rich NM, Hughes CW. 'Vietnam vascular registry: a preliminary report.' Surgery. 1969 Jan;65(1):218-226. The original registry publication by Rich himself. Follow-up PMID     "15_institutional_hierarchy": "Institutional Hierarchy"
  };

  var modSel = document.getElementById("moduleFilter");
  Object.keys(MODULE_LABELS).sort().forEach(function(k) {
    var o = document.createElement("option");
    o.value = k; o.textContent = MODULE_LABELS[k];
    modSel.appendChild(o);
  });

  var NODE_COLORS = { person: "#0A5E56", institution: "#B85D3A", society: "#2C2C2C" };

  // institutional_parent edges are structural scaffolding, rendered recessed:
  // thin, light-grey, fine-dotted, low-opacity, with a subtle arrowhead.
  var PARENT_COLOR = "#C5CDD6";

  function edgeColor(t) {
    if (t === "direct_training" || t === "observational_study") return "#0A5E56";
    if (t === "institutional_founder" || t === "society_founder") return "#B85D3A";
    if (t === "governance_leadership") return "#6B6B6B";
    if (t === "institutional_parent") return PARENT_COLOR;
    return "#3D8B82";
  }
  function edgeDash(t) {
    if (t === "direct_training" || t === "observational_study") return "";
    if (t === "institutional_founder" || t === "society_founder") return "6,3";
    if (t === "governance_leadership") return "2,3";
    if (t === "institutional_parent") return "1,4";
    return "8,3,2,3";
  }
  function edgeWidth(t) { return t === "institutional_parent" ? 0.8 : 1.5; }
  function edgeBaseOpacity(t) { return t === "institutional_parent" ? 0.22 : 0.5; }

  // ── Degree + radius ──
  var degree = [];
  graphData.nodes.forEach(function(n, i) { degree[i] = n.degree || 0; });

  function nodeRadius(i) { return Math.max(4, Math.sqrt(degree[i] || 1) * 3.2); }

  // ── Label font size: logarithmic with degree ──
  function labelFontSize(i) {
    var d = degree[i] || 1;
    return Math.min(12, Math.max(8, 6 + Math.log2(d + 1) * 1.4));
  }

  // ── STATE ──
  var activeTypes = { person: true, institution: true, society: true };
  var selectedNode = null;
  var evidenceMode = false;
  var showHierarchy = true;
  var currentScale = 1;

  // ── Two-tier label thresholds ──
  function labelConfig() {
    if (currentScale < 0.3) return { minDeg: 8, useShort: true };
    if (currentScale < 0.6) return { minDeg: 5, useShort: true };
    if (currentScale < 1.0) return { minDeg: 3, useShort: true };
    if (currentScale < 1.8) return { minDeg: 2, useShort: true };
    return { minDeg: 1, useShort: currentScale < 3.0 ? false : false };
  }

  // ── Visibility helpers ──
  function getVal(id) { return document.getElementById(id).value; }

  function isNodeVisible(d) { return activeTypes[d.type]; }

  function isLinkVisible(l) {
    var sn = graphData.nodes[getIdx(l.source)];
    var tn = graphData.nodes[getIdx(l.target)];
    if (!isNodeVisible(sn) || !isNodeVisible(tn)) return false;
    if (l.edge_type === "institutional_parent" && !showHierarchy) return false;
    var ef = getVal("edgeFilter");
    if (ef !== "all" && l.edge_type !== ef) return false;
    var era = getVal("eraFilter");
    if (era !== "all") {
      var sy = l.start_year;
      if (era === "pre1900" && sy >= 1900) return false;
      if (era === "1900-1950" && (sy < 1900 || sy >= 1950)) return false;
      if (era === "1950-2000" && (sy < 1950 || sy >= 2000)) return false;
      if (era === "2000+" && sy < 2000) return false;

    var mf = getVal("moduleFilter");
    if (mf !== "all" && l.module !== mf) return false;
